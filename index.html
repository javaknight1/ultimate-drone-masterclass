lass='dot y'></span><span class='dot g'></span><span class='term-title'>EdgeTX — Channel Monitor</span></div><div class='term-body'><span class='dim'>CH1 Ail</span>  <span class='ok'>+0.0%</span>\n<span class='dim'>CH2 Ele</span>  <span class='ok'>+0.0%</span>\n<span class='dim'>CH3 Thr</span>  <span class='bad'>-100%</span>  <span class='dim'>(throttle low = safe)</span>\n<span class='dim'>CH4 Rud</span>  <span class='ok'>+0.0%</span>\n<span class='dim'>CH5 SA</span>   <span class='am'>-100%</span>  <span class='dim'>(disarmed)</span></div></div><div class='box tip'><div class='bt'>Naming saves grief.</div> Name each model after the quad (frame + size), not Model01. When you own five quads you will thank yourself, and you avoid arming the wrong model with the wrong failsafe.</div><div class='box danger'><div class='bt'>Props off for all bench work.</div> Any time you bind, test channels, or arm at a desk, remove the propellers. A quad that spins up unexpectedly with props on causes lacerations.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Create a new model and confirm every input moves.</p><ol><li>From the main screen open <code>Model Select</code> and create a new model named after your build.</li><li>Set the model to Multirotor; verify the throttle source is the correct stick.</li><li>Open the <code>Channel Monitor</code> (long-press the page button or use the telemetry/monitor screen).</li><li>Move each gimbal axis and confirm CH1-CH4 respond and return to center (except throttle).</li><li>Flick each switch and watch its channel jump between -100%, 0%, and +100%.</li></ol></div></div>"},{"id":"p4-2","part":"04 · Radio & Control","nav":"Control Link Protocols","num":"4.2","kicker":"Part 04 · Lesson 2","title":"Control Link Protocols: ELRS vs Crossfire/TBS","html":"<h3>What the control link does</h3><p>The control link is the radio path carrying your stick commands to the flight controller and (optionally) telemetry back. It is separate from the video link. Two systems dominate: <strong>ExpressLRS (ELRS)</strong> — open source — and <strong>TBS Crossfire / Tracer</strong> from Team BlackSheep. Both are long-range systems that left the old 2.4GHz toy protocols far behind.</p><h4>ExpressLRS</h4><p>ELRS is open source, cheap, and extremely capable. It runs on <strong>2.4GHz</strong> or <strong>900MHz</strong> hardware. Its headline feature is selectable <strong>packet rates</strong>: from <code>50Hz</code> (maximum range, higher latency) up to <code>500Hz</code> and even <code>1000Hz</code> on 2.4GHz (lowest latency, shortest range). Higher packet rate means lower latency but less link budget. A typical freestyle pilot runs <code>250Hz</code> or <code>500Hz</code>; a long-range pilot drops to <code>50Hz</code> or <code>100Hz</code>.</p><h4>TBS Crossfire / Tracer</h4><p>Crossfire runs on <strong>900MHz</strong> and is legendary for raw long range and reliability; Tracer is the 2.4GHz, lower-latency sibling. Crossfire is a polished, closed commercial product with excellent build quality and strong support, at higher cost. Crossfire's fixed packet-rate options are coarser than ELRS, and latency on 900MHz Crossfire is higher than 2.4GHz ELRS at high rates.</p><h4>Frequency tradeoffs</h4><p><strong>900MHz</strong> penetrates obstacles and trees better and reaches farther for a given power; antennas are larger. <strong>2.4GHz</strong> allows higher packet rates (lower latency) and smaller antennas but is more line-of-sight dependent and shares spectrum with WiFi and some video.</p><table><thead><tr><th>Attribute</th><th>ELRS 2.4GHz</th><th>ELRS 900MHz</th><th>Crossfire 900MHz</th></tr></thead><tbody><tr><td>Min latency</td><td>~2-5ms (500-1000Hz)</td><td>~10-20ms</td><td>~13-30ms</td></tr><tr><td>Packet rates</td><td>50/150/250/500/1000Hz</td><td>25/50/100/200Hz</td><td>50/150Hz</td></tr><tr><td>Range</td><td>Very long</td><td>Extreme</td><td>Extreme</td></tr><tr><td>RX cost</td><td>~$8-20</td><td>~$15-25</td><td>~$30-50</td></tr><tr><td>Ecosystem</td><td>Open source</td><td>Open source</td><td>Closed / TBS</td></tr></tbody></table><div class='box tip'><div class='bt'>Match TX power to need.</div> ELRS lets you set TX output (25mW, 100mW, 250mW, 1W and up). More power means more range but more battery drain and heat, and power limits are regulated. Most line-of-sight flying needs only 25-100mW.</div><div class='box law'><div class='bt'>Power and frequency are regulated.</div> Legal RF power and which bands you may use vary by country. 900MHz allocations differ between the US (902-928MHz ISM) and the EU (868MHz). Verify your current local limits before raising TX power.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Build a comparison sheet and choose a link.</p><ol><li>Make a table with columns: frequency, packet/RF rates, typical latency, claimed range, RX price.</li><li>Fill rows for ELRS 2.4GHz, ELRS 900MHz, and Crossfire.</li><li>Note your flying style (freestyle line-of-sight, racing, or long range).</li><li>Pick one link and write two sentences justifying it on latency, range, and cost.</li></ol></div></div>"},{"id":"p4-3","part":"04 · Radio & Control","nav":"Binding the Link","num":"4.3","kicker":"Part 04 · Lesson 3","title":"Binding Your Radio to the Receiver","html":"<h3>What binding actually does</h3><p>Binding pairs one transmitter module to one receiver so they share a unique identity and will not respond to anyone else's radio. With ELRS, the pairing is established by a shared <strong>binding phrase</strong> rather than a button dance: set the same phrase on TX and RX and they bind automatically on power-up. Crossfire uses a traditional bind button / bind menu.</p><h4>ELRS binding by phrase (recommended)</h4><p>ELRS firmware lets you flash both the TX module and the RX with the same <strong>binding phrase</strong> (a short text string). When both carry the same phrase, they auto-bind every time. This eliminates the timing-sensitive button procedure and means a replacement RX just needs the same phrase flashed.</p><ol><li>Flash your TX module and RX to the same ELRS major version (for example both <code>3.x</code>). Mismatched major versions will <strong>not</strong> bind.</li><li>Set an identical binding phrase on both during the flash, or via the ExpressLRS Lua / Web UI.</li><li>Power the quad; the RX LED goes from fast blink (searching) to solid (linked).</li></ol><h4>Manual ELRS bind (no phrase)</h4><ol><li>Power the RX. Power-cycle it 3 times quickly; on the 3rd boot it enters <strong>bind mode</strong> (slow double-blink).</li><li>On the radio open the <strong>ExpressLRS Lua script</strong> (Model Setup then Tools, or the SYS/Tools menu) and select <code>Bind</code>.</li><li>The RX LED goes solid when bound.</li></ol><h4>Confirming a stable link</h4><p>Open the ELRS Lua script and check the live stats, then verify telemetry on the radio. Two key numbers:</p><ul><li><strong>LQ (Link Quality)</strong> — percent of packets received. Should sit at <code>100</code> at rest. LQ dropping is the real warning sign in flight, more than RSSI.</li><li><strong>RSSI (dBm)</strong> — signal strength. Closer to 0 is stronger (for example <code>-40dBm</code> next to the bench). The link fades out near the receiver's sensitivity floor (often around <code>-105 to -112dBm</code> depending on packet rate).</li></ul><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>ExpressLRS Lua — link stats at rest</span></div><div class='term-body'><span class='dim'>Pkt Rate </span><span class='ok'>250Hz</span>\n<span class='dim'>TLM Ratio</span><span class='ok'> 1:64</span>\n<span class='dim'>Power    </span><span class='ok'>100mW</span>\n<span class='dim'>LQ       </span><span class='ok'>100</span>\n<span class='dim'>RSSI     </span><span class='ok'>-42dBm</span>  <span class='dim'>(bench, very strong)</span>\n<span class='dim'>Link     </span><span class='ok'>CONNECTED</span></div></div><div class='box danger'><div class='bt'>Props off, throttle low.</div> Always bind and test with propellers removed and the throttle stick all the way down. Set up failsafe (next lesson) before you ever fly.</div><div class='box tip'><div class='bt'>Version mismatch is the #1 bind failure.</div> If a bind will not take, check that TX and RX run the same ELRS major version. Re-flash one to match the other.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Bind the link and record link health.</p><ol><li>Confirm props are off and throttle is down.</li><li>Bind via matching phrase (or manual 3x power-cycle plus Lua Bind).</li><li>Confirm the RX LED is solid and CH1-CH4 move in the Channel Monitor.</li><li>Open the ELRS Lua stats and record LQ and RSSI at rest.</li></ol></div></div>"},{"id":"p4-4","part":"04 · Radio & Control","nav":"Channels, Mixes & Switches","num":"4.4","kicker":"Part 04 · Lesson 4","title":"Channels, Mixes & Switch Assignments","html":"<h3>From sticks to channels</h3><p>The radio sends a numbered list of channel values to the flight controller. CH1-CH4 are almost always the four flight axes (in Betaflight's default AETR mapping: Aileron/Roll, Elevator/Pitch, Throttle, Rudder/Yaw). CH5 and up are <strong>aux channels</strong> driven by switches, used for arming and mode selection.</p><h4>The EdgeTX signal chain</h4><p>Three stages process each control: <strong>Inputs</strong> (raw stick/switch with optional expo and weight) then <strong>Mixes</strong> (combine sources into a channel) then <strong>Outputs</strong> (final scaling, limits, and reverse). For a quad you mostly assign switches directly to channels in the Mixes page.</p><h4>Standard aux assignments</h4><table><thead><tr><th>Channel</th><th>Switch</th><th>Function</th></tr></thead><tbody><tr><td>CH5 / AUX1</td><td>SA (2-pos)</td><td>Arm</td></tr><tr><td>CH6 / AUX2</td><td>SB (3-pos)</td><td>Flight mode (Angle/Horizon/Acro)</td></tr><tr><td>CH7 / AUX3</td><td>SC (momentary)</td><td>Beeper / find-quad</td></tr><tr><td>CH8 / AUX4</td><td>SD (2-pos)</td><td>Turtle (flip-over-after-crash)</td></tr></tbody></table><h4>Why a 3-position switch for modes</h4><p>A 3-position switch gives three values (-100% / 0% / +100%), so a single switch covers three flight modes. In Betaflight's <code>Modes</code> tab you set ranges: for example ANGLE active 1000-1300us, HORIZON 1300-1700us, and the top position (1700-2000us) leaving Acro (no self-leveling mode active = rate/acro).</p><h4>Microseconds, not percent</h4><p>Betaflight reads aux channels in <strong>microseconds (us)</strong>, roughly 1000-2000us. EdgeTX shows -100% to +100%. The mapping is: <code>-100% = ~1000us</code>, <code>0% = ~1500us</code>, <code>+100% = ~2000us</code>. When you set mode ranges in Betaflight, flick the switch and watch the yellow marker to place ranges exactly under each position.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>EdgeTX Mixes — aux switch map</span></div><div class='term-body'><span class='dim'>CH05</span> <span class='ok'>SA</span>  <span class='dim'>Weight 100  (Arm)</span>\n<span class='dim'>CH06</span> <span class='ok'>SB</span>  <span class='dim'>Weight 100  (Modes 3-pos)</span>\n<span class='dim'>CH07</span> <span class='ok'>SC</span>  <span class='dim'>Weight 100  (Beeper)</span>\n<span class='dim'>CH08</span> <span class='ok'>SD</span>  <span class='dim'>Weight 100  (Turtle)</span></div></div><div class='box tip'><div class='bt'>Keep mixes simple.</div> You can build a logical-switch mix so one slider plays a voice alert or triggers the beeper on a momentary press. Start simple: one switch, one channel, one function. Complexity is where mistakes hide.</div><div class='box danger'><div class='bt'>Arm switch placement matters.</div> Put arm on a switch you cannot bump accidentally, and never assign arm to a momentary or a switch shared with another function. Confirm the quad disarms the instant you flip arm off.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Assign four switches and document the map.</p><ol><li>In EdgeTX Mixes, map SA to CH5 (arm), SB to CH6 (modes), SC to CH7 (beeper), SD to CH8 (turtle).</li><li>Open the Channel Monitor and confirm each channel jumps as you flick its switch.</li><li>In Betaflight's Modes tab, set the ranges by flicking each switch and watching the marker.</li><li>Write down your channel map (channel, switch, function, us values) and keep it with the model.</li></ol></div></div>"},{"id":"p4-5","part":"04 · Radio & Control","nav":"Failsafe","num":"4.5","kicker":"Part 04 · Lesson 5","title":"Failsafe: The Most Important Safety Setting","html":"<h3>Why failsafe is non-negotiable</h3><p>Radio links fail. You will fly behind a building, out of range, or hit interference, and the quad will lose signal. <strong>Failsafe</strong> defines what the quad does when that happens. A quad with no verified failsafe is a flying weapon: if it holds the last throttle command it can fly away at full speed into people or property. Configuring and <strong>testing</strong> failsafe is the single most important safety task before flight.</p><h4>The two-layer system</h4><p>Failsafe has two cooperating layers and both must be correct:</p><ol><li><strong>Receiver failsafe</strong> — what the RX outputs when it loses the TX. On ELRS, set the RX to <code>No Pulses</code> (the RX stops sending channel data) rather than holding last values. When the FC sees no valid signal, its own failsafe takes over cleanly.</li><li><strong>Flight controller failsafe</strong> (Betaflight Failsafe tab) — what the FC does when it loses valid RX data. The default and correct stage-2 procedure for line-of-sight is <code>Drop</code> (cut motors immediately). This makes the quad fall straight down instead of flying away.</li></ol><h4>Drop vs Land vs GPS Rescue</h4><p>For freestyle/racing line-of-sight, <strong>Drop</strong> is safest: the quad stops where contact is lost. <code>Land</code> (auto-descend) and <strong>GPS Rescue</strong> (fly home and land) are for long-range quads with a GPS module and a tuned rescue procedure. Never enable GPS Rescue without configuring and field-testing it; a bad rescue config can fly the quad away.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>Betaflight CLI — verify failsafe</span></div><div class='term-body'><span class='dim'>get failsafe_procedure</span>\n<span class='ok'>failsafe_procedure = DROP</span>\n<span class='dim'>get failsafe_delay</span>\n<span class='ok'>failsafe_delay = 4</span>   <span class='dim'>(0.4s guard time)</span>\n<span class='dim'>RX set: ELRS failsafe = No Pulses</span>\n<span class='ok'>save</span></div></div><h4>How to test it (the part people skip)</h4><p>Configuring failsafe is not enough; you must verify it. With <strong>props removed</strong>, arm the quad on the bench, then turn off the radio. The motors must stop within a fraction of a second and the FC OSD should show <code>FAILSAFE</code>. If the motors keep spinning or the quad disarms slowly, your settings are wrong. Re-check RX failsafe = No Pulses and FC procedure = Drop.</p><div class='box danger'><div class='bt'>SAFETY: never fly without verified failsafe.</div> Test on every quad, and re-test after any firmware update or receiver change. Always test with propellers OFF. Treat an untested quad as unflyable.</div><div class='box tip'><div class='bt'>Set the warning beeper.</div> Configure a low-RSSI / low-LQ OSD warning and a lost-model audible alarm so you get a cue before the link fully drops, giving you time to turn back.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Set failsafe to drop and prove it works.</p><ol><li>Set ELRS RX failsafe to No Pulses.</li><li>In Betaflight Failsafe tab set procedure to Drop; save.</li><li>Remove all propellers. Arm the quad on a stable surface at low throttle.</li><li>Power off the radio and confirm motors cut instantly and OSD shows FAILSAFE.</li><li>Log the result (pass/fail) and the disarm time in your build notes.</li></ol></div></div>"},{"id":"p4-6","part":"04 · Radio & Control","nav":"Flight Modes","num":"4.6","kicker":"Part 04 · Lesson 6","title":"Flight Modes: Acro vs Angle vs Horizon","html":"<h3>Self-leveling vs rate control</h3><p>The flight controller can interpret your stick inputs two fundamentally different ways. Understanding the difference shapes your entire learning path.</p><h4>Angle mode (self-leveling)</h4><p>Stick position commands an <strong>angle</strong>. Push the right stick halfway forward and the quad tilts to a fixed angle; release it and the quad <strong>returns to level</strong> by itself. There is a maximum lean angle, so you cannot flip or roll. This is the most forgiving mode and how most camera drones (DJI) behave by default. Great for first hovers and orientation practice.</p><h4>Horizon mode (hybrid)</h4><p>Like Angle near center (self-levels when you release the sticks), but if you push the stick fully to the stop it allows <strong>full rotations</strong> (flips and rolls). It is a bridge, but it has quirks: the transition between leveling and rate can feel unpredictable, and it teaches habits you must unlearn. Many instructors skip it.</p><h4>Acro / Rate mode (no self-leveling)</h4><p>Stick position commands a <strong>rotation rate</strong>, not an angle. Center stick means hold current attitude; the quad does <strong>not</strong> self-level. If you tilt forward and center the stick, it stays tilted and accelerates. This is what every freestyle and racing pilot flies, because it gives full 3D control: flips, rolls, dives, inverted flight. It is harder to learn but is the real skill ceiling.</p><table><thead><tr><th>Mode</th><th>Self-levels?</th><th>Can flip/roll?</th><th>Best for</th></tr></thead><tbody><tr><td>Angle</td><td>Yes</td><td>No</td><td>First hovers, orientation</td></tr><tr><td>Horizon</td><td>Center only</td><td>At full stick</td><td>Optional bridge</td></tr><tr><td>Acro</td><td>No</td><td>Yes</td><td>Freestyle, racing, all real FPV</td></tr></tbody></table><div class='box tip'><div class='bt'>Acro is the destination.</div> Angle is training wheels. Spend most of your early time in a simulator in Acro so you build the muscle memory you actually need; use Angle on a real quad only for your very first line-of-sight hovers if at all.</div><div class='box danger'><div class='bt'>Mode switching in flight.</div> Set your 3-position switch deliberately and know which position is which before you arm. Accidentally dropping into Acro at low altitude with no rate skills will crash the quad. Practice mode awareness on the bench (props off) first.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Write a one-page learning-mode plan.</p><ol><li>State which mode you will fly first and on what platform (sim vs real).</li><li>Define your sim goal in Acro: stable hover, then figure-8s, then dives.</li><li>List concrete graduation criteria (for example: 5 hours sim in Acro, consistent hover within 1m, recover from inverted).</li><li>Note when (if ever) you will use Angle on the real quad and why.</li></ol></div></div>"},{"id":"p4-7","part":"04 · Radio & Control","nav":"Video Link & Goggles","num":"4.7","kicker":"Part 04 · Lesson 7","title":"The FPV Video Link: Analog vs Digital, Goggles & Antennas","html":"<h3>Seeing through the drone</h3><p>The video link is entirely separate from the control link. A camera on the quad feeds a <strong>video transmitter (VTX)</strong> that broadcasts on (typically) <strong>5.8GHz</strong> to your goggles. Two worlds exist: <strong>analog</strong> and <strong>digital</strong>.</p><h4>Analog (5.8GHz)</h4><p>The classic FPV standard. Lowest latency (often under 30ms), cheapest, and it <strong>degrades gracefully</strong> — as signal weakens you get static and noise but usually still a usable picture, so you can fly out and feel the edge of range. Resolution is low and the image is noisy, but for racing and learning it is rock solid. VTX power is selectable (25/200/600mW and up) on bands like Raceband; channel coordination matters when flying with others.</p><h4>Digital (HD)</h4><p>Systems like <strong>DJI O3/O4</strong>, <strong>Walksnail Avatar</strong>, and open-source <strong>HDZero</strong> deliver a sharp, high-resolution image. DJI and Walksnail are higher latency but stunning clarity; HDZero is lower latency and degrades more gracefully (more analog-like). The tradeoff: digital tends to hold a perfect image then <strong>break up abruptly</strong> (\"cliff edge\") at the range limit rather than fading, and gear is pricier and heavier.</p><h4>Goggles vs box/screen</h4><p><strong>Goggles</strong> (two small screens with lenses) give true immersion and are what most pilots use. <strong>Box goggles</strong> (single screen) and standalone <strong>monitors/screens</strong> are cheaper and great for a spotter or for getting started, but lack the immersion and head-tracking feel.</p><h4>Antennas: omni vs directional</h4><ul><li><strong>Omnidirectional</strong> (for example a circular-polarized \"pagoda\" or lollipop) radiates roughly equally in all horizontal directions. Best for close-in freestyle and proximity flying where the quad is all around you.</li><li><strong>Directional</strong> (patch, helical, Crosshair) focuses gain in one direction for much greater range, but you must keep the quad roughly in front of you. Best for long range and racing down a straight.</li><li><strong>Diversity</strong> receivers use <strong>both</strong> at once and automatically select the stronger feed per moment. The standard pro setup: one omni for all-around coverage plus one patch for distance.</li></ul><div class='box danger'><div class='bt'>SAFETY: spotter and visual-line-of-sight.</div> Wearing goggles blinds you to the real world. Fly with a <strong>spotter</strong> who keeps eyes on the aircraft and airspace, can warn you of people or hazards, and helps you maintain visual line of sight. Many jurisdictions legally require a visual observer for FPV.</div><div class='box law'><div class='bt'>Verify VTX power and FPV rules.</div> Legal 5.8GHz VTX output power and goggle/FPV operating rules vary by country and may require a license (for example an amateur-radio license for higher power). Confirm current FAA / local regulations before transmitting.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Spec a complete video system.</p><ol><li>Choose a system type (analog, DJI/Walksnail digital, or HDZero) and justify it for your flying style.</li><li>Pick goggles or a screen and note resolution/latency.</li><li>Select two antenna types for a diversity setup (one omni, one directional).</li><li>Explain in two sentences why that antenna pairing fits how you intend to fly.</li></ol></div></div>"},{"id":"p4-8","part":"04 · Radio & Control","nav":"Simulators","num":"4.8","kicker":"Part 04 · Lesson 8","title":"Learning Safely in a Simulator","html":"<h3>The cheapest, safest way to learn</h3><p>Every crash on a real quad costs money, time, and possibly a body part. A simulator costs nothing per crash and lets you fly hundreds of times in an afternoon. The single biggest predictor of how fast a new pilot becomes competent is <strong>sim hours logged in Acro</strong>. Treat the sim as your primary training tool for the first many hours.</p><h4>Why your real radio, not a gamepad</h4><p>Plug your <strong>actual transmitter</strong> into the sim so the muscle memory you build transfers directly to the field. Most EdgeTX radios connect over <strong>USB</strong> and present as a <strong>USB joystick / game controller</strong> (HID mode). Some sims also support connecting via the radio's trainer port or via a dedicated dongle. Use the same stick mode (Mode 2) and similar rates to your real quad.</p><h4>Popular simulators</h4><ul><li><strong>Liftoff</strong> — polished, large community, good for freestyle and racing.</li><li><strong>Velocidrone</strong> — the racer's choice; precise physics, great for gates and tracks.</li><li><strong>Uncrashed</strong> and <strong>DRL Simulator</strong> — accessible and fun; DRL is free and excellent for beginners.</li><li><strong>FPV.SkyDive / Tryp</strong> — additional options worth trying.</li></ul><h4>Connecting the radio</h4><ol><li>On the radio, set the USB mode to <strong>USB Joystick (HID)</strong> when you plug in (EdgeTX prompts you, or set it under SYS / Hardware).</li><li>In the sim's controller settings, calibrate: move every stick to its extremes so the sim maps the axes.</li><li>Map throttle, yaw, pitch, roll and confirm none are reversed; set arm to a switch as on the real quad.</li></ol><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>EdgeTX — USB connect prompt</span></div><div class='term-body'><span class='dim'>USB connected. Select mode:</span>\n  <span class='dim'>USB Storage (SD card)</span>\n<span class='ok'>&gt; USB Joystick (HID)</span>   <span class='dim'>&lt;-- choose this for sims</span>\n  <span class='dim'>USB Serial (VCP)</span></div></div><h4>What to practice first</h4><p>In Acro mode: a stable <strong>hover</strong>, then small forward flights, then <strong>yaw spins</strong> while keeping position (orientation training), then figure-8s, then gentle dives. Orientation — knowing which way is forward when the quad faces you — is the hardest early skill. Drill it deliberately.</p><div class='box tip'><div class='bt'>Short, frequent, deliberate.</div> Three 20-minute focused sessions beat one exhausted 3-hour grind. Pick one skill per session and repeat it until it is boring, then move on.</div><div class='box danger'><div class='bt'>Bench-test the real quad too.</div> The sim cannot replace verifying failsafe and arming behavior on the physical quad. Before your first real flight, confirm failsafe (Lesson 4.5) with props off.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Connect your radio and log your first 30 minutes.</p><ol><li>Plug the radio in via USB and select USB Joystick (HID).</li><li>Calibrate all four axes in the sim and confirm none are reversed.</li><li>Fly 30 minutes of hover and yaw-orientation practice in Acro.</li><li>Write notes: what felt hardest (likely orientation), and one skill to drill next session.</li></ol></div></div>"},{"id":"p5-1","part":"05 · Piloting","nav":"Pre-Flight & Arming","num":"5.1","kicker":"Part 05 · Lesson 1","title":"The Pre-Flight Ritual & Arming Safety","html":"<h3>Why a ritual beats a vibe</h3><p>The single biggest predictor of who keeps all ten fingers is not skill — it is whether they run the <strong>same check, the same way, every single flight</strong>. Spinning 5-inch props on a 6S quad reach roughly 30,000+ RPM and will open a finger to the bone faster than you can react. A ritual converts safety from a decision you make under excitement into a reflex you don't have to think about.</p><h3>The pre-flight check (memorize the order)</h3><ol><li><strong>Battery (pre).</strong> Confirm the pack is charged to full (4.20V/cell, or your storage-charged pack topped up). No puffing, no nicks in the wrapper, balance leads intact.</li><li><strong>Visual airframe.</strong> Arms tight, motors free of grass/hair wrapped on the bell, antennas (VTX + RX) not chopped or pinched, no cracked props. Spin each prop by hand — listen for bearing grind.</li><li><strong>Prop check.</strong> Correct rotation direction, no nicks, screws torqued. A chipped prop at 30k RPM becomes an unbalanced bomb.</li><li><strong>Strap the battery</strong> firmly with a fresh, grippy strap. A pack that ejects mid-flight = instant fall.</li><li><strong>Goggles/RC on FIRST, quad LAST.</strong> Always power the transmitter and goggles before plugging the quad in, so the model binds to a live link, never the reverse.</li><li><strong>Link + failsafe.</strong> Confirm RX is bound (solid LED), VTX channel matches goggles, and you get clean video.</li><li><strong>Mode switches.</strong> Verify <code>ARM</code> switch is OFF, flight mode is correct (Acro/Angle), and any <code>BEEPER</code>/<code>TURTLE</code> switches are where you expect.</li><li><strong>Area + people.</strong> Eyes up: bystanders, pets, cars, the spotter acknowledged. Announce \"props hot!\" before arming.</li></ol><h3>Verifying failsafe (do this for real, not on faith)</h3><p>With <strong>props removed</strong>, arm the quad on the bench, then power off your radio. The motors must <strong>stop within ~1 second</strong> (Betaflight default failsafe stage 2 = <code>DROP</code>). If they keep spinning, your failsafe is misconfigured — fix it before you ever fly. Check it in <code>Failsafe</code> tab: <code>Stage 2</code> set to <code>Drop</code> for freestyle, or <code>GPS Rescue</code> only if a reliable GPS lock is present.</p><div class='box danger'><div class='bt'>Props off for all bench testing.</div> Any time you arm indoors, on a bench, or to test config — props come OFF. \"Just this once\" with props on is how people end up in the ER. The motor can spool to full throttle from a config glitch.</div><h3>The arm/disarm sequence</h3><p>Standard habit: throttle all the way down, <strong>then</strong> flip arm. To disarm, throttle down first, then flip arm off. Train yourself to <strong>disarm the instant the quad is on the ground</strong> — do not let props idle while you walk over. Enable <code>Runaway Takeoff Prevention</code> and a <code>MOTOR_STOP</code>-off configuration with prop-wash idle so the quad doesn't tip-over-spin.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>betaflight arming flags</span></div><div class='term-body'><span class='dim'># type 'status' in CLI to see why it won't arm</span>\nstatus\nArming disable flags: <span class='bad'>RXLOSS THROTTLE ANGLE</span>\n<span class='dim'># RXLOSS = no radio link  THROTTLE = stick not at zero  ANGLE = too tilted</span>\n<span class='ok'>Arming disable flags:</span>  <span class='dim'>(clear = ready to arm)</span></div></div><div class='box tip'><div class='bt'>Read the flags.</div> If your quad refuses to arm, it is almost always telling you why. The OSD shows the arming-prevention reason on screen; <code>status</code> in CLI lists every flag. Don't \"jiggle and retry\" — read the reason.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Build your personal pre-flight checklist and burn the arm sequence into muscle memory.</p><ol><li>Write your own 8-item checklist on a card or phone note, in the order above.</li><li>With props OFF (or in a sim), rehearse: radio on, goggles on, quad on, arm, disarm — 5 times.</li><li>Test failsafe for real: arm props-off, kill radio, confirm motors stop in ~1s.</li><li>Practice saying \"props hot\" out loud each arm so it becomes automatic outdoors.</li></ol></div></div>"},{"id":"p5-2","part":"05 · Piloting","nav":"Hover & Orientation","num":"5.2","kicker":"Part 05 · Lesson 2","title":"Line-of-Sight Basics: Hover, Orientation & Nose-In","html":"<h3>Why line-of-sight first</h3><p>Before goggles, before acro, you build the foundational reflex every pilot relies on: <strong>keeping track of which way the quad is facing</strong>. In a stable/angle mode hover you learn that roll and pitch sticks command lean, throttle commands climb/descend, and yaw rotates the nose. LOS practice forces you to mentally rotate the controls based on the quad's heading — a skill that pays off when you lose video or fly behind an object.</p><h3>Stick discipline for a clean hover</h3><p>On <strong>Mode 2</strong> (the global standard): left stick = throttle (up/down) + yaw (left/right); right stick = pitch (forward/back) + roll (left/right). A good hover is mostly throttle management with tiny corrective pulses on roll/pitch. Beginners over-correct — they shove the stick, the quad lurches, they shove the opposite way, and it oscillates. The fix: <strong>small inputs, then wait</strong>. The quad responds with a slight lag; give it time before adding more.</p><h4>Orientation: the four headings</h4><table><thead><tr><th>Heading</th><th>Roll right stick →</th><th>What happens</th></tr></thead><tbody><tr><td>Tail toward you (nose away)</td><td>Goes right</td><td>Controls feel \"normal\"</td></tr><tr><td>Nose toward you (nose-in)</td><td>Goes left (your view)</td><td>Roll/pitch reversed</td></tr><tr><td>Left side toward you</td><td>Moves away/toward</td><td>Pitch and roll swap roles</td></tr><tr><td>Right side toward you</td><td>Moves toward/away</td><td>Pitch and roll swap, opposite</td></tr></tbody></table><h3>The nose-in problem</h3><p>Nose-in is where new pilots crash. When the quad faces you, pushing roll right sends it <strong>to your left</strong>, and pitch forward brings it <strong>toward you</strong>. The trick that works: <strong>steer the bottom of the quad / steer toward the high side.</strong> If the quad drifts left from your view, give the stick input that pushes it back — practice slowly until your brain stops translating and just reacts. Many pilots whisper \"reversed\" as a cue when the nose comes around.</p><div class='box tip'><div class='bt'>Lock altitude first.</div> Pick one job at a time. Nail a rock-steady throttle hover at one height before you add any yaw. Trying to manage altitude AND orientation at once is what makes hovers wander into the dirt.</div><h3>Self-leveling vs the goal</h3><p>Angle (self-level) mode is a great training wheel for LOS hover — release the sticks and the quad levels itself. But it has a tilt limit and won't flip. You'll graduate to Acro later, but mastering orientation in Angle first means you're not fighting two new skills simultaneously.</p><div class='box danger'><div class='bt'>Real LOS hover safety.</div> If you take this to a real quad, fly in a large open field, props checked, spotter present, and keep the quad at least 5-10m away and above head height — a quad drifting at face level is dangerous. Disarm immediately if it gets behind you or you lose orientation.</div><h3>Drills that build the reflex</h3><ul><li><strong>Box hover:</strong> hold position over a single spot for 60s, correcting drift with tiny pulses.</li><li><strong>Slow yaw circle:</strong> rotate the nose 360° slowly while staying over one spot — this forces you through all four orientations.</li><li><strong>Nose-in hold:</strong> rotate to nose-in and hold for as long as you can without drifting more than a meter.</li></ul><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Build orientation reflex in the sim (Liftoff, Velocidrone, or DRL).</p><ol><li>Hold a stationary hover over one spot for a full 60 seconds in Angle mode.</li><li>Slowly yaw the nose 360° while staying over the spot.</li><li>Rotate to nose-in (nose pointing at camera) and hold; log how many seconds before you drift more than a meter.</li><li>Repeat the nose-in hold daily and watch the number climb.</li></ol></div></div>"},{"id":"p5-3","part":"05 · Piloting","nav":"Acro Progression I","num":"5.3","kicker":"Part 05 · Lesson 3","title":"The FPV Acro Progression: Hover to Forward Flight","html":"<h3>What Acro mode actually is</h3><p>In <strong>Acro (rate) mode</strong> there is no self-leveling. The sticks command <em>rotational rate</em>, not angle: if you tilt the quad 20° forward and center the stick, it <strong>stays at 20°</strong>. This is the only mode for real FPV flying because it lets you point the thrust vector anywhere — but it means <strong>you</strong> are now the leveling system. Every input you make, you must also undo.</p><h3>The acro hover</h3><p>An acro hover is harder than an angle hover and is the gateway drill. The quad constantly wants to tip; you make tiny correcting taps to keep it level. Goal: hover in place in acro for 30s without drifting more than a couple meters. If you can acro-hover, forward flight is just leaning that hover.</p><h3>Forward flight = lean + power</h3><p>To move forward you do two things together:</p><ol><li><strong>Pitch forward</strong> a small amount (5-15°). This tilts the thrust vector so part of it pushes you horizontally.</li><li><strong>Add throttle</strong> to compensate — when tilted, less thrust opposes gravity, so the quad sinks unless you give more power. This throttle-pitch coordination is the heart of FPV flight.</li></ol><p>The classic beginner error: pitch forward, forget throttle, watch the quad mush into the ground. Or: pitch forward and never level back out, accelerating into a wall. <strong>Forward flight is a controlled, held lean — not a shove.</strong></p><h3>Stopping on a mark</h3><p>To stop, you <strong>pitch back</strong> (the opposite of how you accelerated) to brake, while easing throttle, then return to a level hover. A clean stop on a target requires you to <em>anticipate</em> — start braking before the mark, because momentum carries you. Pilots judge this by how the ground/target grows in the FPV view.</p><table><thead><tr><th>Phase</th><th>Pitch stick</th><th>Throttle</th></tr></thead><tbody><tr><td>Hover</td><td>Centered</td><td>~Hover point</td></tr><tr><td>Accelerate forward</td><td>Forward (held)</td><td>Add to hold altitude</td></tr><tr><td>Cruise</td><td>Slight forward</td><td>Steady</td></tr><tr><td>Brake to stop</td><td>Back (held briefly)</td><td>Ease off, then back to hover</td></tr></tbody></table><div class='box tip'><div class='bt'>Set sane rates first.</div> For learning, dial in moderate rates — roughly <code>670 deg/s</code> max with low-to-mid <code>RC Expo</code> (~0.20) and <code>Super Rate</code> around 0.70 in Betaflight. Twitchy max rates make a beginner's corrections turn into oscillation. Smooth out before you speed up.</div><div class='box lab'><div class='bt'>Throttle is your altitude, always.</div> In acro, the moment you tilt the quad in ANY direction, you need more throttle to hold height. Train your left thumb to pump throttle slightly with every lean. This becomes subconscious — but only with reps.</div><h3>Common faults and fixes</h3><ul><li><strong>Quad sinks when moving:</strong> not adding throttle on the lean. Add power proportional to tilt.</li><li><strong>Overshooting the mark:</strong> braking too late. Begin the pitch-back earlier.</li><li><strong>Wobble at the stop:</strong> slamming pitch back then centering hard. Smooth the brake and feather back to neutral.</li></ul><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Drill precise forward flight and stops in the sim.</p><ol><li>Hold an acro hover for 30s without drifting more than ~2m.</li><li>Set a target ~50m away. Take off, fly forward, and stop precisely on the target.</li><li>Do it three times; log how close you stopped each run (e.g. +3m, +1m, on target).</li><li>Note whether you sank during acceleration — if so, focus the next session on throttle-with-lean.</li></ol></div></div>"},{"id":"p5-4","part":"05 · Piloting","nav":"Acro Progression II","num":"5.4","kicker":"Part 05 · Lesson 4","title":"Turns, Banking & Controlled Dives","html":"<h3>Coordinated turns: roll + yaw + throttle</h3><p>A flat (rudder-only) turn looks robotic and bleeds speed. A <strong>coordinated banked turn</strong> — the FPV staple — combines three inputs at once:</p><ul><li><strong>Roll</strong> to bank the quad into the turn (this points the thrust vector toward the turn center).</li><li><strong>Yaw</strong> to rotate the nose around so it tracks the new direction.</li><li><strong>Throttle</strong> increased, because banking tilts thrust away from vertical and the quad would otherwise descend.</li></ul><p>The mental model: you're not steering like a car, you're <strong>leaning a motorcycle</strong>. Bank in, add a touch of yaw to pull the nose around, hold throttle to keep the arc level. The more you bank, the more yaw and throttle you feed in.</p><h3>The figure-eight: the universal coordination drill</h3><p>A figure-eight forces you to roll left then right, transition through level, and coordinate yaw both directions. The center crossing is the hard part — you must smoothly reverse the bank without ballooning up or dropping. Fly it big and slow first, then tighten the loops as you smooth out.</p><div class='box tip'><div class='bt'>Look where you're going.</div> In the goggles, point your attention at the <em>exit</em> of the turn, not the quad's nose. Your hands follow your eyes. Pilots who stare at the obstacle they're trying to avoid tend to fly straight into it (target fixation).</div><h3>Controlled dives</h3><p>A dive is how you trade altitude for speed and set up shots and tricks. The key insight: <strong>throttle is NOT your descent control in a dive</strong> — pitch is. You pitch forward/down to point the quad at the ground, and you <em>reduce</em> throttle so you don't accelerate into the dirt. The dangerous part is the <strong>pull-out</strong>.</p><h4>The dive-to-level pullout</h4><ol><li><strong>Commit:</strong> pitch nose down to your dive angle, throttle low.</li><li><strong>Manage speed:</strong> the steeper and longer the dive, the faster you arrive — judge by how fast the ground fills your view.</li><li><strong>Pull out EARLY:</strong> begin pitching back to level while adding throttle. The throttle punch arrests your descent. Beginners pull out late and \"pancake\" into the ground.</li></ol><div class='box danger'><div class='bt'>Altitude is your friend.</div> Practice dives with lots of vertical buffer. A misjudged pullout at 5m ends in a crash; the same error at 50m gives you room to recover. In a sim this is free reps — abuse that.</div><table><thead><tr><th>Maneuver</th><th>Primary input</th><th>Don't forget</th></tr></thead><tbody><tr><td>Banked turn</td><td>Roll</td><td>Add throttle + a touch of yaw</td></tr><tr><td>Figure-eight</td><td>Roll reversal</td><td>Stay level through the center</td></tr><tr><td>Dive</td><td>Pitch down</td><td>Cut throttle going in, punch it pulling out</td></tr></tbody></table><div class='box lab'><div class='bt'>Throttle-blip on the pullout.</div> The signature of a clean dive recovery is a sharp throttle punch exactly as you level the nose. Time it too early and you balloon; too late and you hit ground. Practice the timing isolated: dive, then \"level-and-punch\" as one combined motion.</div><h3>Smoothness over speed</h3><p>Every input in this lesson must be <strong>fed in and out gradually</strong> at first. Smooth roll into a turn, smooth roll out. Jerky inputs cause prop-wash wobble and ugly footage. Speed is earned only after the motions are clean.</p><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Coordinate turns and dives in the sim.</p><ol><li>Fly five smooth figure-eights, keeping altitude constant through the center crossing.</li><li>Set up a high hover, then dive to the ground and pull out to level flight without touching down.</li><li>Repeat the dive 5 times; rate (1-5) how smoothly you held altitude after each pullout.</li><li>Log which side of your figure-eight is weaker and drill that direction extra.</li></ol></div></div>"},{"id":"p5-5","part":"05 · Piloting","nav":"First Real Flights","num":"5.5","kicker":"Part 05 · Lesson 5","title":"Your First Real Flights & In-Air Troubleshooting","html":"<h3>The sim-to-air gap</h3><p>If you've put in sim hours, your <strong>reflexes will transfer</strong> — but the real world adds wind, real consequences, and the adrenaline of seeing your actual quad in the air. Expect to fly more conservatively your first session. That's correct. The goal of a maiden is not freestyle; it's <strong>confirming the quad flies straight and you can land it.</strong></p><h3>Site and conditions</h3><ul><li><strong>Large open field</strong>, no people, no roads, no power lines, soft ground (grass).</li><li><strong>Wind under ~10 mph</strong> for a first flight. Wind makes a hover wander and punishes weak throttle control.</li><li><strong>Spotter present</strong> — someone watching LOS who can warn you of people approaching or the quad heading somewhere bad.</li><li>Know your local rules: in the US, recreational flyers should pass <strong>TRUST</strong>, register the aircraft if over 250g, and follow the FAA's recreational guidelines (B4UFLY for airspace). <em>Verify current FAA and local regulations before flying — rules change.</em></li></ul><div class='box law'><div class='bt'>Airspace is real.</div> Don't fly in controlled airspace without authorization (LAANC), stay clear of airports, and keep visual line of sight. Check B4UFLY or your country's equivalent the day you fly. This lesson is general guidance, not legal advice — confirm the current rules yourself.</div><h3>The maiden sequence</h3><ol><li>Run your full pre-flight ritual from Lesson 5.1. Verify failsafe.</li><li>Set the quad ~3m in front of you, nose away.</li><li>Arm. <strong>Spool up gently</strong> and lift just off the ground (a few cm) to check it doesn't pull hard in any direction — a hop test reveals reversed motors, bad tune, or a flipped prop before you commit to altitude.</li><li>Climb to ~3-5m and hold a hover. Make small corrections. Get comfortable.</li><li>Fly gentle forward passes and easy turns. Keep it in front of you.</li><li>Land with throttle low and steady; <strong>disarm the instant the skids touch.</strong></li></ol><h3>In-air troubleshooting</h3><table><thead><tr><th>Symptom</th><th>Likely cause</th><th>Response</th></tr></thead><tbody><tr><td>Quad drifts one direction at hover</td><td>Wind, or trim/accelerometer offset</td><td>Correct with stick; re-level accel on the ground later</td></tr><tr><td>Fast oscillation / hot motors</td><td>PID tune too high (P/D)</td><td>Land, lower gains; don't keep flying hot motors</td></tr><tr><td>Slow wallowing wobble</td><td>P too low or prop wash</td><td>Land, retune; avoid descending through your own wash</td></tr><tr><td>Video static/breakup</td><td>Range, antenna, or interference</td><td>Turn back toward yourself, gain altitude, land if it worsens</td></tr><tr><td>Quad won't respond / flies off</td><td>RX link loss</td><td>Don't chase — failsafe should drop it; note where it lands</td></tr></tbody></table><div class='box danger'><div class='bt'>Disarm on doubt.</div> If the quad does something you don't understand — flies the wrong way, oscillates, or you lose orientation — and it's safe to drop it (over grass, away from people), <strong>disarm</strong>. A dropped quad over an empty field is a $0 problem. A confused quad heading toward a person is a hospital problem. When unsure, kill it.</div><div class='box tip'><div class='bt'>Hot motor check.</div> After your first pack, touch each motor (carefully). Warm is fine; too-hot-to-hold means a tune or prop issue — fix it before the next flight. Heat is your quad telling you something's wrong.</div><h3>Log the flight</h3><p>Start a flight log from day one: date, location, pack used, mAh consumed, landing voltage, any issues, and one thing to improve. This log turns scattered sessions into a measurable progression and helps you spot battery/quad problems early.</p><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Fly a safe maiden session and start your flight log.</p><ol><li>Pick a legal, open site with light wind and a spotter; run your pre-flight ritual.</li><li>Hop-test, then hover, then fly gentle passes. Land and disarm on touchdown.</li><li>Log: date, site, pack, mAh used, landing voltage, and any issue you hit.</li><li>Write one sentence on how you responded to any in-air problem (drift, wobble, video) and what you'll do differently next time.</li></ol></div></div>"},{"id":"p5-6","part":"05 · Piloting","nav":"Freestyle Tricks","num":"5.6","kicker":"Part 05 · Lesson 6","title":"Freestyle Tricks: Rolls, Flips & Power Loops","html":"<h3>The mindset: commit fully</h3><p>The number-one cause of a botched roll or flip is <strong>not committing</strong> — pilots tap the stick, panic when the world goes upside down, and let go. In acro, a roll is just a held rotation; if you give a full deflection and <em>keep it there</em>, the quad completes the rotation and you simply stop the stick when level returns. Hesitation is what kills it.</p><h3>The roll (easiest first trick)</h3><ol><li>Build a little forward speed and get some altitude (10m+).</li><li><strong>Full roll-stick</strong> left or right and hold.</li><li>The quad rotates 360° on its roll axis. As the horizon comes back level, <strong>center the stick</strong> sharply.</li><li><strong>Punch throttle</strong> as you exit — you lose altitude during the rotation because thrust isn't pointing down while inverted.</li></ol><h3>The flip</h3><p>Same as a roll but on the <strong>pitch axis</strong> — full back (backflip) or full forward (frontflip). Backflips are more natural for beginners because you can see the ground come back over the top. Same rules: commit, hold, center on level, punch throttle on exit.</p><h3>The power loop</h3><p>The power loop is the signature freestyle move — a vertical loop, usually over or through an obstacle. It's a <strong>throttle-and-pitch</strong> trick, not just a flip:</p><ol><li>Approach with speed at low-to-mid altitude.</li><li><strong>Pull full back pitch AND add throttle</strong> to climb up and over the top of the loop.</li><li>At the top you're inverted, looking back — <strong>ease throttle</strong> as you come over so you don't shoot off.</li><li>Coming down the back side, the ground rushes up — <strong>throttle back in and level out</strong> at the bottom (this is a dive pullout, Lesson 5.4).</li></ol><p>The power loop combines everything: commitment (the flip), throttle management (top and bottom), and a dive pullout. That's why it's the rite-of-passage trick.</p><table><thead><tr><th>Trick</th><th>Axis / inputs</th><th>The gotcha</th></tr></thead><tbody><tr><td>Roll</td><td>Full roll, hold, center on level</td><td>Letting go halfway = inverted crash</td></tr><tr><td>Flip</td><td>Full pitch (back/fwd), hold</td><td>Forgetting the exit throttle punch</td></tr><tr><td>Power loop</td><td>Pitch + throttle through a vertical circle</td><td>Too much throttle over the top; late pullout at bottom</td></tr></tbody></table><div class='box tip'><div class='bt'>Practice high, fail safe.</div> Do every new trick with 20-30m of altitude. Height is recovery room. Once you can land the trick consistently up high, then bring it down toward obstacles. In a sim, altitude is free — bank hundreds of reps before you risk a real quad.</div><div class='box lab'><div class='bt'>Isolate the exit.</div> Most failed tricks die on the exit, not the rotation. Drill just the recovery: roll/flip, then immediately get level + punch throttle + hover. When the exit is automatic, the trick is reliable.</div><div class='box danger'><div class='bt'>Real-quad tricks.</div> Never attempt rolls, flips, or power loops near people or yourself. A trick gone wrong sends a spinning quad in an unpredictable direction. Open field, spotter, altitude, and only after you've got it solid in the sim.</div><h3>Building a combo</h3><p>Once individual tricks land cleanly, chain them: roll out of a dive, flip over a tree, power loop a gap. Freestyle flow is just clean tricks connected by smooth transitions — and clean tricks come from committed, well-practiced singles.</p><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Drill the three core tricks to a reliable success rate in the sim.</p><ol><li>Practice rolls until you can complete and land level 5 times in a row.</li><li>Same for flips (try backflips first).</li><li>Power loop: pick a tree or gate and loop it; commit to the throttle over the top.</li><li>Log your success rate (e.g. \"rolls 9/10, loops 4/10\") and re-test next session.</li></ol></div></div>"},{"id":"p5-7","part":"05 · Piloting","nav":"Cinematic & Racing Lines","num":"5.7","kicker":"Part 05 · Lesson 7","title":"Smooth Cinematic Movements & Racing Lines","html":"<h3>Two opposite disciplines, same sticks</h3><p>Cinematic flying is about <strong>silky, deliberate, minimal-input</strong> movement that looks like a camera on a crane. Racing is about <strong>maximum efficiency</strong> — the shortest, fastest line through gates. They train opposite instincts (smooth vs aggressive) but both demand precision. Practicing both makes you a complete pilot.</p><h3>Cinematic fundamentals</h3><ul><li><strong>Reduce your rates.</strong> Cinematic pilots often fly a dedicated low-rate profile (e.g. max ~200-300 deg/s) so big stick moves become gentle. Many add <strong>RC Smoothing</strong> and fly with a slightly heavier/cinewhoop setup for inertia.</li><li><strong>Move on one axis at a time</strong> where possible — a clean orbit, a clean push-in, a clean reveal. Mixing axes is fine once smooth, but jerky multi-axis moves read as amateur.</li><li><strong>Constant velocity, not constant stick.</strong> Ease into a move and ease out — no abrupt starts or stops. Think of accelerating a heavy dolly.</li></ul><h4>The cinematic orbit</h4><p>To circle a subject: hold a <strong>steady roll</strong> toward the subject, a matching <strong>steady yaw</strong> to keep the nose pointed at it, and constant throttle for level altitude. The art is balancing roll and yaw so the radius stays constant and the subject stays centered in frame. Practice big and slow.</p><div class='box tip'><div class='bt'>Smooth is a setting AND a skill.</div> You can buy smoothness with low rates and RC smoothing, but the real polish comes from your thumbs learning to feather inputs. Record your sim flights and watch them back — jitter you can't feel while flying is obvious on playback.</div><h3>Racing lines</h3><p>Racing is geometry. The fastest path is rarely the one that hits the visual center of each gate — it's the <strong>line that minimizes direction changes and keeps your energy up</strong>.</p><ul><li><strong>Late apex the gate</strong> like a racing car corners: enter wide, clip the inside of the gate, exit aimed at the next gate. This straightens the path between gates.</li><li><strong>Look ahead two gates.</strong> Your line through the current gate should set up the next. Pilots who only look at the gate in front of them scrub speed on every exit.</li><li><strong>Carry energy.</strong> Don't fully stop and re-accelerate. Use dives to build speed on straights and bank turns to maintain momentum around pylons.</li><li><strong>Throttle management:</strong> punch out of corners, feather before tight gates. Smooth throttle = faster laps than on/off flying.</li></ul><table><thead><tr><th>Goal</th><th>Cinematic</th><th>Racing</th></tr></thead><tbody><tr><td>Rates</td><td>Low, smoothed</td><td>High, responsive</td></tr><tr><td>Inputs</td><td>Feathered, one axis</td><td>Decisive, combined</td></tr><tr><td>Throttle</td><td>Constant, gentle</td><td>Punch + feather</td></tr><tr><td>Eyes</td><td>On framing</td><td>Two gates ahead</td></tr></tbody></table><div class='box lab'><div class='bt'>Run the same course repeatedly.</div> Racing improvement comes from repetition on a fixed track. Fly the same gate course 10 laps, note where you lose time (usually a specific corner), and drill that section in isolation. Time every lap — what gets measured gets faster.</div><div class='box danger'><div class='bt'>Speed near obstacles.</div> Racing lines hug gates and pylons. On a real course, fly within your proven skill margin — clipping a gate at speed sends shards and a heavy quad in unpredictable directions. Build speed in the sim before any real race.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Practice both disciplines in the sim and measure results.</p><ol><li>Fly a slow cinematic orbit around a subject; keep it centered and the radius constant. Rate your smoothness 1-5.</li><li>Load a gate course and fly 5 timed laps, late-apexing each gate.</li><li>Log your best lap time and identify the one corner costing you the most.</li><li>Drill that corner 10 times, then re-run the course and compare your time.</li></ol></div></div>"},{"id":"p5-8","part":"05 · Piloting","nav":"OSD & Crash Avoidance","num":"5.8","kicker":"Part 05 · Lesson 8","title":"Reading Your OSD & Crash Avoidance in the Air","html":"<h3>Your OSD is your instrument panel</h3><p>The On-Screen Display overlays telemetry on your FPV feed. The skill is <strong>glance-reading</strong> — flicking your eyes to a number for a fraction of a second without losing flight focus, the way a driver checks a speedometer. The two numbers that keep you out of trouble: <strong>battery voltage</strong> and <strong>flight timer</strong>.</p><h3>The vital OSD elements</h3><table><thead><tr><th>Element</th><th>What it tells you</th><th>Why it matters</th></tr></thead><tbody><tr><td>Battery voltage</td><td>Pack charge state</td><td>Land before it sags too low — #1 crash-prevention number</td></tr><tr><td>Flight timer</td><td>Time armed</td><td>Backup for voltage; learn your pack's typical flight time</td></tr><tr><td>RSSI / Link quality</td><td>Radio signal strength</td><td>Falling RSSI = you're approaching failsafe range</td></tr><tr><td>mAh consumed</td><td>Capacity used</td><td>Most reliable \"fuel gauge\" if you have a current sensor</td></tr><tr><td>Warnings</td><td>Arming flags, low-batt, RX loss</td><td>Flash on screen — never ignore them</td></tr></tbody></table><h3>Reading voltage under load</h3><p>Voltage <strong>sags under throttle</strong> and recovers when you ease off, so read it at a steady cruise, not mid-punch. The meaningful number is the <strong>resting/cruise voltage</strong>. Rule of thumb per cell:</p><ul><li><strong>4.20V</strong> = full</li><li><strong>3.80V</strong> = storage / comfortable</li><li><strong>3.50V (loaded) / ~3.7V resting</strong> = start heading home</li><li><strong>3.30V loaded</strong> = LAND NOW; below this you risk damaging the pack and a brownout</li></ul><div class='box danger'><div class='bt'>Land on warnings — every time.</div> When the OSD flashes <code>LOW BATTERY</code> or your set per-cell threshold trips, <strong>land</strong>. Don't squeeze in one more trick. A pack pushed below ~3.3V/cell loaded can sag into a <strong>brownout</strong> — the FC loses power mid-air and the quad falls out of the sky. Chronically over-discharging also puffs and kills LiPos.</div><h3>Set your warnings before you fly</h3><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>betaflight OSD / battery warnings</span></div><div class='term-body'><span class='dim'># Configurator > Power & Battery</span>\nminimum cell voltage      <span class='ok'>3.30 V</span>  <span class='dim'># triggers warning</span>\nwarning cell voltage      <span class='am'>3.50 V</span>  <span class='dim'># early heads-up</span>\nmaximum cell voltage      4.35 V\n<span class='dim'># OSD tab: enable Battery Voltage, mAh drawn, Timer, RSSI, Warnings</span></div></div><h3>Crash avoidance: signal cues</h3><p>Video and link degrade <em>before</em> total loss, giving you warning:</p><ul><li><strong>Video gets sparkly/staticky:</strong> you're at the edge of analog VTX range or behind an obstruction. Turn back toward yourself and gain altitude — line of sight to the receiver matters.</li><li><strong>RSSI / link quality dropping fast:</strong> on digital (DJI/HDZero) you'll see warnings or a frozen frame. Stop pushing range; fly home immediately.</li><li><strong>Don't fly into a void:</strong> behind metal buildings, into deep \"signal shadows,\" or straight away at max range. Lose the link and failsafe drops the quad wherever it is.</li></ul><div class='box tip'><div class='bt'>Call it out loud.</div> Saying your voltage and timer aloud while flying (\"3.7, two minutes\") forces the glance-read habit and keeps the numbers in your awareness. Many top pilots narrate their packs. It feels silly and it works.</div><div class='box lab'><div class='bt'>Learn YOUR pack.</div> Every quad/pack combo has a personality. After a few flights you'll know \"this pack gives me 3:30 to 3.5V.\" That internalized feel — backed by the OSD — is what lets you fly confidently right up to a safe landing.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Build the glance-read habit and a hard voltage discipline.</p><ol><li>In the sim or on a real quad, set a per-cell land threshold (e.g. 3.5V resting).</li><li>Fly a session calling your voltage and timer aloud every 30 seconds.</li><li>The moment you hit your threshold or see a low-batt warning, land immediately — no exceptions.</li><li>Log the landing voltage and flight time so you learn your pack's real endurance.</li></ol></div></div>"},{"id":"p6-1","part":"06 · Cinematography","nav":"Camera Fundamentals","num":"6.1","kicker":"Part 06 · Lesson 1","title":"Camera Fundamentals: Resolution, Framerate & the Exposure Triangle","html":"<h3>Resolution: capture big, deliver smart</h3><p>Resolution is the pixel count of each frame. The common drone ladder is <code>1080p</code> (1920x1080), <code>2.7K</code> (2720x1530), <code>4K</code> (3840x2160), and on higher-end birds <code>5.1K</code>/<code>6K</code>. More pixels buys you two real things: delivery sharpness for 4K screens, and <strong>reframing headroom</strong> — shoot 4K, deliver 1080p, and you can punch in or stabilize a crop without softening the image. The cost is file size, heat, and storage. A practical rule: shoot 4K as your default; only drop to 2.7K/1080p when you specifically need a higher framerate the sensor can't sustain at 4K.</p><h3>Framerate and the feel of motion</h3><p>Framerate (fps) is how many frames are recorded per second. It controls <em>motion feel</em>, not slowness by itself.</p><ul><li><code>24 fps</code> (23.976) — the cinematic standard. Slight motion blur, filmic cadence.</li><li><code>25 fps</code> — PAL regions; broadcast deliverable in Europe.</li><li><code>30 fps</code> (29.97) — clean, slightly more 'video' look; common for online content.</li><li><code>60 fps</code> — captured to be slowed to 40% in a 24p timeline for smooth slow-motion, or played at 60p for hyper-real motion.</li><li><code>120 fps</code> — dramatic 5x slow motion at 24p; needs a lot of light.</li></ul><p>The key concept: <strong>capture framerate and timeline framerate are separate</strong>. To get slow motion, shoot at a high framerate (e.g. 60fps) and interpret/conform it onto a 24fps timeline. 60 into 24 = 40% speed; 120 into 24 = 20% speed.</p><h3>The exposure triangle on a drone</h3><p>Three controls set brightness, but on most camera drones one is fixed:</p><table><thead><tr><th>Control</th><th>Range on drones</th><th>Trade-off</th></tr></thead><tbody><tr><td>Aperture</td><td>Often FIXED (e.g. f/2.8), or f/2.8-f/11 on Mavic 3 / Air 3 style</td><td>If fixed, you cannot use it to dim light — use ND filters</td></tr><tr><td>ISO</td><td>100 base, up to 6400+</td><td>Higher ISO = more noise/grain; keep near base</td></tr><tr><td>Shutter</td><td>1/8000 to several seconds</td><td>Controls motion blur — locked by the 180° rule for video</td></tr></tbody></table><p>Because shutter is locked for cinematic motion (next lesson) and aperture is often fixed, your only clean brightness lever in bright daylight becomes the <strong>ND filter</strong> — that's why pros carry a filter set. Keep ISO at base 100 whenever light allows; only raise it in low light, accepting noise.</p><div class='box tip'><div class='bt'>Insight.</div> Think of exposure in this order for video: lock framerate, set shutter via the 180° rule, set ISO to 100, then add ND filters until the image is correctly exposed. Aperture comes in only if your drone has a variable iris.</div><h3>Bit depth, codec and color</h3><p>Beyond resolution, two numbers decide grading flexibility. <strong>Bit depth</strong> (8-bit vs 10-bit) sets how many tones per channel: 8-bit = 16.7M colors and bands easily in skies; 10-bit = ~1.07B colors and grades cleanly. <strong>Codec/bitrate</strong> (H.264 vs H.265, e.g. 100Mbps vs 150Mbps) sets compression quality. For any serious grade, choose 10-bit H.265 at the highest bitrate your card sustains (use a V30/U3 card or better).</p><div class='box danger'><div class='bt'>Flight safety.</div> Changing camera settings mid-air pulls your eyes off the aircraft. Set resolution/framerate on the ground, hover in a stable position to tweak exposure, and keep a visual observer if you're heads-down in the app.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Feel how framerate changes motion.</p><ol><li>Capture or find three clips of the same moving subject at 24, 30, and 60 fps.</li><li>Drop all three onto a 24fps timeline; conform the 60fps one to 40% speed.</li><li>Write one sentence each: how the 24fps feels cinematic, how 30fps feels, and how the slowed 60fps reads for slow motion.</li><li>Note which you'd pick for a moody reveal vs a sports flyby and why.</li></ol></div></div>"},{"id":"p6-2","part":"06 · Cinematography","nav":"Shutter, ND & 180° Rule","num":"6.2","kicker":"Part 06 · Lesson 2","title":"Shutter Speed, ND Filters & the 180° Rule","html":"<h3>Why motion blur matters</h3><p>Each video frame is a short exposure. If the shutter is very fast (e.g. 1/2000s), every frame is a crisp frozen snapshot and motion looks stuttery and 'gamey' — this is the classic mistake that screams amateur drone footage. If the shutter is slower, each frame contains a little smear of movement, and when 24 of those play per second your eye reads it as smooth, natural motion. The goal is the <em>right</em> amount of blur.</p><h3>The 180° shutter rule</h3><p>The film-world standard is the 180-degree shutter, which produces a shutter speed of <strong>1 / (2 x framerate)</strong>. Cameras don't show degrees, they show a fraction, so memorize the math:</p><table><thead><tr><th>Framerate</th><th>2 x fps</th><th>Target shutter (nearest setting)</th></tr></thead><tbody><tr><td>24 fps</td><td>48</td><td>1/50s</td></tr><tr><td>25 fps</td><td>50</td><td>1/50s</td></tr><tr><td>30 fps</td><td>60</td><td>1/60s</td></tr><tr><td>60 fps</td><td>120</td><td>1/120s (or 1/125)</td></tr><tr><td>120 fps</td><td>240</td><td>1/240s (or 1/250)</td></tr></tbody></table><p>Cameras rarely have exactly 1/48, so use the nearest available step (1/50). Going one stop faster (a '90-degree' look, e.g. 1/100 at 24fps) is a deliberate choice for crunchy action shots; just know you're breaking the rule on purpose.</p><h3>The bright-daylight problem</h3><p>Here's the conflict: at 24fps you must hold shutter at ~1/50s. But 1/50s at ISO 100 on a sunny day is wildly overexposed — the image blows out to white. You can't speed up the shutter (that breaks the 180° rule), you can't lower ISO below 100, and aperture is often fixed. The solution is to put sunglasses on the lens: a <strong>neutral density (ND) filter</strong>.</p><h3>Choosing ND strength</h3><p>ND filters are rated by how many stops of light they cut. Each stop halves the light. Naming varies — ND4/ND8/ND16/ND32/ND64 (the number = light reduction factor) where ND4 = 2 stops, ND8 = 3, ND16 = 4, ND32 = 5, ND64 = 6.</p><table><thead><tr><th>Condition</th><th>Typical ND</th><th>Stops</th></tr></thead><tbody><tr><td>Overcast / heavy clouds</td><td>ND4</td><td>2</td></tr><tr><td>Hazy sun, golden hour</td><td>ND8</td><td>3</td></tr><tr><td>Bright partly cloudy</td><td>ND16</td><td>4</td></tr><tr><td>Full bright sun</td><td>ND32</td><td>5</td></tr><tr><td>Intense sun on snow/water/sand</td><td>ND64</td><td>6</td></tr></tbody></table><p>Workflow in the air: lock framerate and the matching shutter, set ISO 100, then screw on the ND that brings the exposure meter to 0 (no blinkies/clipping on highlights). If still overexposed, go darker (higher ND); if dim, go lighter. Many kits sell as ND8/16/32/64 packs precisely because that span covers most daylight.</p><div class='box tip'><div class='bt'>Insight.</div> Adjustable/variable ND filters exist but can introduce an 'X' cross-pattern at extreme settings and color cast. For critical work, fixed-strength NDs are more reliable; carry the set and swap on the ground.</div><div class='box danger'><div class='bt'>Prop safety.</div> Many drone NDs clip over the gimbal. Always confirm the filter is fully seated before takeoff — a filter shed in flight can hit the props or jam the gimbal. Power off and verify the gimbal moves freely after fitting.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Calculate shutter and pick ND for three scenarios.</p><ol><li>Scenario A: 24fps, full bright sun. Target shutter? Likely ND?</li><li>Scenario B: 60fps, golden hour. Target shutter? Likely ND?</li><li>Scenario C: 30fps, overcast. Target shutter? Likely ND?</li><li>Write the 180° math you used for each, then the ND you'd mount first and how you'd adjust if highlights still clip.</li></ol></div></div>"},{"id":"p6-3","part":"06 · Cinematography","nav":"Color Profiles & Log","num":"6.3","kicker":"Part 06 · Lesson 3","title":"Flat & Log Color Profiles and Why They Matter","html":"<h3>What a color profile actually does</h3><p>A color profile is the curve the camera applies when it converts the sensor's raw light readings into a recorded file. A <strong>standard</strong> profile (often called Normal, Vivid, or just the default) bakes in contrast, saturation, and a pleasing 'look' so the footage looks good straight out of the drone. A <strong>flat</strong> or <strong>Log</strong> profile does the opposite: it deliberately records a low-contrast, desaturated, washed-out image to <em>preserve dynamic range</em> — the detail in both shadows and highlights — so you can shape the look later in grading.</p><h3>Flat vs Log vs standard</h3><table><thead><tr><th>Profile</th><th>Out-of-camera look</th><th>Dynamic range</th><th>Best for</th></tr></thead><tbody><tr><td>Standard / Normal</td><td>Contrasty, saturated, ready</td><td>Limited</td><td>Quick delivery, social, no grading time</td></tr><tr><td>Flat (e.g. D-Cinelike)</td><td>Low contrast, mild desat</td><td>Moderate</td><td>Light grading, 8-bit footage</td></tr><tr><td>Log (e.g. D-Log, D-Log M, HLG)</td><td>Very washed out, grey</td><td>Maximum</td><td>Serious grading, 10-bit, matching cameras</td></tr></tbody></table><p>On DJI drones you'll see names like <strong>D-Cinelike</strong> (a flat-ish profile) and <strong>D-Log</strong> / <strong>D-Log M</strong> (true Log). HLG (Hybrid Log Gamma) is a hybrid that looks decent un-graded on HDR displays.</p><h3>Why grey footage is good</h3><p>A sensor captures more dynamic range than a standard profile can store. Log redistributes that range so highlights (bright clouds) don't clip to pure white and shadows (tree lines) don't crush to pure black. The footage looks ugly and milky on the monitor — that's expected. In post you apply contrast and color and recover detail that a standard profile would have thrown away. This is how you keep a bright sky AND a properly lit foreground in the same shot.</p><h3>The catch: bit depth and noise</h3><p>Log needs room to be stretched back out. On <strong>8-bit</strong> footage, aggressive Log grading exposes banding (visible steps in skies) because there simply aren't enough tonal values. <strong>10-bit Log</strong> grades cleanly. This is the single most important pairing: if your drone only shoots 8-bit, a flat profile like D-Cinelike is often the smarter choice than full D-Log. If you have 10-bit, D-Log unlocks the most flexibility. Log also amplifies shadow noise, so you must expose Log a touch brighter (ETTR — expose to the right) and protect the shadows.</p><div class='box tip'><div class='bt'>Insight.</div> Rule of thumb: shoot Log/flat when you (a) have time to grade, (b) shoot 10-bit, and (c) face high-contrast scenes or need to match another camera. Shoot standard when you need footage usable immediately with no post.</div><h3>LUTs: the translator</h3><p>Because Log looks wrong, manufacturers provide a <strong>LUT</strong> (Look-Up Table) — a conversion file that maps Log back to a normal Rec.709 look. A 'conversion LUT' (e.g. DJI's D-Log to Rec.709) is your neutral starting point in the edit; a 'creative LUT' adds a stylized look on top. Apply the conversion LUT first, then grade.</p><div class='box danger'><div class='bt'>Field check.</div> Log monitoring is deceptive — the washed-out preview makes it hard to judge exposure by eye. Use the histogram or zebras, not the picture, and never adjust framing so much that you fly unsafely while squinting at a grey screen.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Decide when each profile wins.</p><ol><li>Find or shoot the same high-contrast scene in a standard profile and a Log/flat profile.</li><li>Apply the conversion LUT to the Log clip and compare recovered sky/shadow detail vs the standard clip.</li><li>Write two scenarios: one where standard is the better capture choice, one where Log is — and tie each to bit depth and grading time.</li></ol></div></div>"},{"id":"p6-4","part":"06 · Cinematography","nav":"Gimbals","num":"6.4","kicker":"Part 06 · Lesson 4","title":"The Gimbal: Mechanical Stabilization vs FPV Smoothing","html":"<h3>Two completely different ways to get smooth footage</h3><p>Camera drones (DJI Mavic/Air) and FPV drones (cinewhoops, freestyle quads) both produce buttery footage, but through opposite philosophies. Understanding the difference tells you which tool to grab for a given shot.</p><h3>Mechanical gimbals: isolate the camera</h3><p>A camera drone carries the lens on a <strong>3-axis mechanical gimbal</strong> — three brushless motors that actively counter-rotate on the <em>pitch</em>, <em>roll</em>, and <em>yaw</em> axes. An IMU senses the drone's every twitch and the motors instantly move the camera the opposite amount, physically holding the lens steady in space while the airframe jitters around it. The result is a locked-off, tripod-smooth horizon no matter what the wind does. You control framing by tilting the gimbal (pitch) independently of where the drone flies.</p><ul><li><strong>Pitch</strong> — tilt up/down, your main framing control (e.g. -90° straight down for top-down).</li><li><strong>Roll</strong> — keeps the horizon level automatically.</li><li><strong>Yaw</strong> — assists with smooth pans; coordinated with the drone's own rotation.</li></ul><p>Mechanical gimbals give a <em>detached, floating, observational</em> feel. The camera glides; the world is presented calmly. This is the look of real estate, landscape, and most commercial aerial work.</p><h3>FPV: no gimbal, fix it differently</h3><p>An FPV cinewhoop usually has the camera <strong>hard-mounted</strong> (or on a single soft mount/TPU damping) — there is no motorized gimbal isolating it. So how is FPV footage smooth? Three layers:</p><ol><li><strong>Pilot skill</strong> — smooth stick inputs and acro flying that the camera follows directly. The camera <em>is</em> the aircraft's attitude.</li><li><strong>Soft mounting</strong> — TPU/foam dampers absorb high-frequency motor vibration ('jello').</li><li><strong>Electronic stabilization in post</strong> — Gyroflow or DJI/GoPro embedded gyro data warps each frame to cancel rotation, using recorded gyroscope logs. This removes jitter while keeping the dynamic motion.</li></ol><p>The FPV look is <em>immersive, kinetic, connected</em> — the camera dives, banks, and rolls because the whole aircraft does. It feels like a bird, not a tripod.</p><table><thead><tr><th>Aspect</th><th>Mechanical gimbal drone</th><th>FPV cinewhoop</th></tr></thead><tbody><tr><td>Stabilization</td><td>Active motors isolate camera</td><td>Pilot + soft mount + post (Gyroflow)</td></tr><tr><td>Horizon</td><td>Always level automatically</td><td>Banks/rolls with the aircraft</td></tr><tr><td>Motion feel</td><td>Floating, detached, calm</td><td>Immersive, fast, connected</td></tr><tr><td>Tight spaces</td><td>Limited, cautious</td><td>Excellent — fly-throughs, dives</td></tr><tr><td>Latency/control</td><td>Position-based, forgiving</td><td>Direct, demands skill</td></tr></tbody></table><div class='box tip'><div class='bt'>Insight.</div> A useful mental model: a gimbal drone <em>shows</em> you a place from outside; an FPV drone <em>takes</em> you through it. Many edits intercut both — a calm gimbal establisher then an FPV fly-through for energy.</div><div class='box danger'><div class='bt'>Gimbal care.</div> Always remove the gimbal clamp before powering on, and never force the gimbal by hand while it's powered — you can strip a motor or corrupt calibration. If footage shows a tilted horizon on a gimbal drone, recalibrate the gimbal and IMU on a level surface before blaming the camera.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Compare the two looks directly.</p><ol><li>Find one gimbal-drone clip and one FPV cinewhoop clip of similar environments.</li><li>Note how the horizon behaves in each, and whether the camera tilts with banking.</li><li>Write 3 sentences contrasting the motion feel and name one shot each is better at.</li></ol></div></div>"},{"id":"p6-5","part":"06 · Cinematography","nav":"Core Shot Types","num":"6.5","kicker":"Part 06 · Lesson 5","title":"Core Shot Types: Orbit, Reveal, Fly-Through, Dolly, Top-Down & Parallax","html":"<h3>The staple six</h3><p>Almost every aerial edit is built from a small vocabulary of repeatable moves. Master these six and you can cover any location. Stick references assume Mode 2 (left stick = throttle/yaw, right stick = pitch/roll).</p><h4>1. Orbit (POI / circle)</h4><p>The drone circles a subject while the camera stays pointed at it. Creates rotation and reveals all sides — great for hero objects, towers, people. <strong>Sticks:</strong> gentle constant roll (right stick left/right) to arc sideways + opposite yaw (left stick) to keep the nose/camera on the subject. Most camera drones automate this as 'Point of Interest' mode — set radius, speed, and altitude. Manual orbits look more organic but take practice to keep the radius constant.</p><h4>2. Reveal</h4><p>Hide the subject behind a foreground object (ridge, tree, building) then move to expose it. <strong>Tilt r
