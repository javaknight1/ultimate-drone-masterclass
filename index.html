eveal:</strong> camera pitched down at terrain, then ascend while tilting up to reveal a distant vista. <strong>Pull-back reveal:</strong> start tight on subject, fly backward and up so the surroundings 'grow' around it. <strong>Sticks:</strong> combine slow backward pitch (right stick down) with throttle up (left stick up) and a gentle gimbal tilt.</p><h4>3. Fly-through</h4><p>Pass through a gap — a doorway, arch, tree line, under a bridge. The signature FPV/cinewhoop shot; risky on big camera drones. <strong>Sticks:</strong> steady forward pitch, precise altitude and lateral trim. Scout the gap, check for prop clearance, and never fly through anything you haven't confirmed is clear of wires.</p><h4>4. Dolly</h4><p>A straight, smooth translation — forward, backward, or sideways (a 'truck') — like a camera on rails. The most cinematic establisher. <strong>Sticks:</strong> single-axis input only; resist mixing channels. Forward dolly = constant gentle forward pitch at fixed altitude. Sideways dolly past a subject creates strong parallax.</p><h4>5. Top-down (bird's eye)</h4><p>Gimbal pitched to -90°, looking straight down. Turns the world into graphic, abstract patterns — roads, fields, coastlines, crowds. <strong>Variants:</strong> static hover, slow descent ('God's eye drop'), or a slow rotating top-down (yaw spin) for a hypnotic spiral. <strong>Sticks:</strong> set gimbal to -90, then translate slowly or add slow yaw.</p><h4>6. Parallax</h4><p>Not a path so much as an effect: fly laterally past a foreground object while a background sits far behind. The near object slides quickly, the far one barely moves, creating powerful 3D depth. Achieved with a sideways dolly or an orbit with a strong foreground element. The closer the foreground, the stronger the parallax.</p><table><thead><tr><th>Shot</th><th>Primary input</th><th>Feels like</th></tr></thead><tbody><tr><td>Orbit</td><td>Roll + counter-yaw</td><td>Showcase / rotation</td></tr><tr><td>Reveal</td><td>Pitch + throttle + tilt</td><td>Surprise / scale</td></tr><tr><td>Fly-through</td><td>Forward pitch, precise</td><td>Immersion</td></tr><tr><td>Dolly</td><td>Single-axis translate</td><td>Cinematic glide</td></tr><tr><td>Top-down</td><td>Gimbal -90 + slow move</td><td>Abstract / map</td></tr><tr><td>Parallax</td><td>Lateral pass w/ foreground</td><td>Depth / 3D</td></tr></tbody></table><div class='box tip'><div class='bt'>Insight.</div> Slower is almost always more cinematic. Fly at 30-50% of the speed that feels right in the moment, and start recording 3 seconds before the move and stop 3 seconds after — you need handles for editing.</div><div class='box danger'><div class='bt'>Fly-through safety.</div> Fly-throughs and low reveals are where crashes happen. Always do a slow dry-run pass first, watch for thin wires (often invisible on screen), keep a spotter, and never thread a gap you couldn't safely walk through.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Storyboard the six shots for one location.</p><ol><li>Pick a real or imagined location (park, building, coastline).</li><li>For each of the six shots, sketch the drone path (top-view arrow) and the camera framing.</li><li>Note the stick movement and gimbal angle for each.</li><li>Order them into a 30-second sequence: which opens, which is the climax.</li></ol></div></div>"},{"id":"p6-6","part":"06 · Cinematography","nav":"Planning a Shoot","num":"6.6","kicker":"Part 06 · Lesson 6","title":"Planning a Shoot & Storyboarding","html":"<h3>The shoot is won before you fly</h3><p>Great aerial work is 80% planning. Showing up and 'seeing what happens' wastes battery, light, and often your one legal window. A professional plan covers four pillars: <strong>location, light, shots, and safety/airspace</strong>.</p><h3>1. Scout the location</h3><p>Use satellite maps and apps before you arrive. Identify the best subject angles, obstacles (towers, wires, trees), launch/recovery spots, and where the sun will be. Tools: Google Earth for 3D terrain, an app like PhotoPills or Sun Surveyor to see exactly where the sun rises/sets and how shadows fall at your shoot time. Visit in person if possible — wires and 'no drone' signage rarely show on satellite.</p><h3>2. Time the light</h3><p>The two best windows are the <strong>golden hour</strong> (the ~hour after sunrise and before sunset — warm, low, long shadows, soft) and the <strong>blue hour</strong> (the ~20-30 min before sunrise/after sunset — cool, even, city lights glow). Midday sun is flat and harsh; avoid it for hero shots. Build your shot list around the light: shoot east-facing subjects at sunrise, west-facing at sunset. Arrive 30+ minutes early to set up, calibrate, and do a test flight before the light peaks.</p><h3>3. Build a shot list and storyboard</h3><p>Translate the story into specific named shots (from the previous lesson). For each line specify: shot type, subject, altitude, gimbal angle, move direction, and duration. Sketch the path. A simple shot list might read:</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>shotlist.txt</span></div><div class='term-body'><span class='dim'># SHOT  TYPE        SUBJECT       ALT    GIMBAL  MOVE        DUR</span>\n01     Dolly fwd   coast road    40m    -15     forward     12s\n02     Reveal      lighthouse    20-80m  -30/0  ascend+tilt 15s\n03     Orbit       lighthouse    50m    -20     CW 360      30s\n04     Top-down    tide pools    60m    -90     slow truck  10s\n05     Parallax    rock+sea      25m    -10     lateral L   12s\n<span class='ok'># golden hour starts 19:42, sunset 20:31 -- shoot 01-03 first</span></div></div><h3>4. Safety and airspace check</h3><p>Before any flight, confirm you are legal and safe for this exact place and day. This is not optional.</p><ul><li><strong>Airspace:</strong> check controlled airspace and request authorization if needed. In the US use the FAA B4UFLY app or a LAANC provider (Aloft, Avision) for instant authorization near airports. Verify TFRs (temporary flight restrictions).</li><li><strong>Registration & rules:</strong> ensure your drone is registered and you fly within current rules (altitude limit, line of sight, no flying over people/moving vehicles unless authorized, Remote ID compliance).</li><li><strong>Weather:</strong> check wind (gusts especially), precipitation, temperature (cold kills LiPo performance), and KP index for GPS. Use UAV Forecast or similar.</li><li><strong>Site:</strong> note people, wildlife, private property, and emergency landing zones.</li></ul><div class='box law'><div class='bt'>Verify current rules.</div> Drone regulations change frequently and vary by country and locality. Always confirm the latest FAA (or your national authority) and local rules, registration, Remote ID, and any site-specific permits before flying. This lesson is general guidance, not legal advice.</div><div class='box tip'><div class='bt'>Insight.</div> Always plan a <strong>backup</strong>: a second location or a 'plan B for clouds/wind', plus spare batteries (golden hour is short — carry at least 3 charged packs) and ND filters for the expected light.</div><div class='box danger'><div class='bt'>Pre-flight.</div> Run a checklist every time: props secure, battery seated and charged, gimbal clamp off, IMU/compass calibrated if location changed, home point set, RTH altitude above obstacles, SD card present and formatted.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Produce a complete shoot plan for a real location.</p><ol><li>Pick a real, legal-to-fly location near you and scout it on satellite + sun app.</li><li>Write a shot list of 5+ named shots with altitude, gimbal, move, duration.</li><li>Record golden-hour times and which shots you'll shoot first for the light.</li><li>Do an airspace check (B4UFLY/LAANC), note weather/wind, and write a backup plan and battery count.</li></ol></div></div>"},{"id":"p6-7","part":"06 · Cinematography","nav":"Drone Photography","num":"6.7","kicker":"Part 06 · Lesson 7","title":"Drone Photography: HDR, Panoramas & Art vs Mapping","html":"<h3>Stills are a different discipline</h3><p>Aerial photography rewards patience over motion. You hover, you compose carefully, and you capture more data than one frame can hold — then blend in post. Two techniques do the heavy lifting: HDR bracketing and panorama stitching.</p><h3>Shoot RAW</h3><p>For any serious photo, set the camera to <strong>RAW</strong> (DNG) not JPEG. RAW keeps the full sensor data so you can recover blown skies and crushed shadows in Lightroom/Camera Raw. JPEG bakes in choices and discards latitude. Use the lowest ISO (100), a single AF lock, and the histogram to avoid clipping.</p><h3>HDR via exposure bracketing</h3><p>A bright sky and a dark foreground exceed the sensor's dynamic range in one shot. <strong>Bracketing</strong> takes several frames at different exposures — for example 3 or 5 shots at <code>-2, -1, 0, +1, +2</code> EV (AEB mode) — which you later merge so the dark frame keeps highlight detail and the bright frame keeps shadow detail. The result is a single image with detail everywhere.</p><ul><li>Enable AEB (Auto Exposure Bracketing): 3 or 5 frames.</li><li>Keep the drone <strong>perfectly still</strong> — hover in low wind so frames align. Movement causes ghosting.</li><li>Merge in Lightroom (Photo > Photo Merge > HDR) or similar; it outputs a 32-bit DNG you then tone-map gently. Avoid the over-cooked 'HDR halo' look.</li></ul><h3>Panoramas</h3><p>A panorama stitches many overlapping frames into one ultra-wide, high-resolution image. Drones automate the capture and sometimes the stitch:</p><table><thead><tr><th>Pano type</th><th>What it captures</th><th>Use</th></tr></thead><tbody><tr><td>Wide / horizontal</td><td>Row of frames left-to-right</td><td>Landscapes, coastlines</td></tr><tr><td>Vertical</td><td>Top-to-bottom column</td><td>Tall subjects, foreground-to-sky</td></tr><tr><td>180° / Sphere</td><td>Grid covering the whole view</td><td>Immersive, 'tiny planet' edits</td></tr></tbody></table><ul><li>Aim for <strong>~30% overlap</strong> between frames so the stitcher has matching features.</li><li>Lock exposure (manual mode) across all frames — auto-exposure causes visible seams.</li><li>Shoot the in-app pano (auto), or capture RAW frames manually and stitch in Lightroom/PTGui/Photoshop Photomerge for maximum quality.</li><li>Keep the drone position fixed; only the gimbal/yaw rotates between frames.</li></ul><h3>Art vs mapping — two opposite goals</h3><p>People confuse aerial photography with drone mapping; they share hardware but nothing else.</p><table><thead><tr><th></th><th>Artistic photography</th><th>Mapping / survey</th></tr></thead><tbody><tr><td>Goal</td><td>A beautiful image</td><td>Accurate measurable data</td></tr><tr><td>Composition</td><td>Subjective, light/angle driven</td><td>Irrelevant — uniform coverage</td></tr><tr><td>Capture</td><td>Few hero frames, golden hour</td><td>Automated grid, nadir (-90°), even light</td></tr><tr><td>Overlap</td><td>~30% for panos</td><td>70-80% front/side for photogrammetry</td></tr><tr><td>Output</td><td>Print / social image</td><td>Orthomosaic, 3D model, point cloud, DEM</td></tr><tr><td>Software</td><td>Lightroom, Photoshop</td><td>DroneDeploy, Pix4D, WebODM</td></tr></tbody></table><p>Mapping flies a programmed lawnmower pattern at fixed altitude, straight down, with heavy overlap and consistent flat lighting (midday is fine — you don't want shadows). Photogrammetry software then reconstructs geometry. Art is the opposite: dramatic low light, careful angles, few frames.</p><div class='box tip'><div class='bt'>Insight.</div> For panoramas, shoot at base ISO and lock white balance too — a drifting WB tints frames differently and the seams glow. For HDR, 3 brackets at +/-2 EV usually beats 5 unless contrast is extreme.</div><div class='box danger'><div class='bt'>Hover safety.</div> HDR and panos mean long hovers, often heads-down stitching shots. Watch battery (these eat time), keep clear of obstacles since you're stationary, and abort if wind picks up — drift ruins the merge and risks the aircraft.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Capture and merge an HDR set and a panorama.</p><ol><li>Set RAW, ISO 100, manual exposure. Shoot a 3- or 5-frame AEB bracket of a high-contrast scene.</li><li>Shoot a horizontal panorama with ~30% overlap, locking exposure and WB.</li><li>Merge the HDR in Lightroom and stitch the pano (in-app or Photomerge).</li><li>Note the settings used and one fix for any ghosting or seam you saw.</li></ol></div></div>"},{"id":"p6-8","part":"06 · Cinematography","nav":"Editing & Grading","num":"6.8","kicker":"Part 06 · Lesson 8","title":"Editing Workflow, Color Grading & Exporting","html":"<h3>A repeatable post workflow</h3><p>A clean pipeline matters more than any single trick. The standard order is: <strong>ingest &gt; organize &gt; assemble &gt; grade &gt; finish &gt; export</strong>. Editors like DaVinci Resolve (free, industry color tool), Premiere Pro, or Final Cut all follow this.</p><ol><li><strong>Ingest &amp; back up:</strong> copy SD card to a working drive AND a backup before touching anything. Never edit off the card.</li><li><strong>Organize:</strong> import, set the project framerate to match your footage (e.g. 24fps), label clips, and pick selects (the good takes).</li><li><strong>Assemble:</strong> cut the sequence to the music/story first, in flat/Log, focusing on pacing and order before color.</li><li><strong>Grade:</strong> after the edit is locked, do color.</li></ol><h3>Color grading Log/flat footage</h3><p>Grading has two stages: <strong>correction</strong> (make it accurate/neutral) then <strong>grade</strong> (make it stylish). In Resolve this lives in the Color page using <strong>nodes</strong>; in Premiere it's Lumetri layers. A clean node tree:</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>node tree (Resolve)</span></div><div class='term-body'>Node 1  <span class='cm'>Conversion LUT</span>   D-Log -&gt; Rec.709  (un-flatten)\nNode 2  <span class='cm'>Balance</span>        white balance + exposure to neutral\nNode 3  <span class='cm'>Contrast</span>       lift/gamma/gain, set black & white point\nNode 4  <span class='cm'>Saturation</span>     pull back over-saturated greens/blues\nNode 5  <span class='cm'>Creative</span>       teal-orange / warm look, creative LUT\nNode 6  <span class='cm'>Secondary</span>      qualify sky, boost it selectively\n<span class='ok'># judge on scopes, not just your eyes</span></div></div><p>Key tools: use the <strong>waveform</strong> scope to set blacks near 0 and whites near 100 IRE without clipping; the <strong>parade</strong> (RGB) scope to remove color casts (align the three channels in the shadows for neutral). Don't grade by eye alone — monitors lie.</p><h3>Common grading moves</h3><ul><li>Apply the manufacturer conversion LUT first so you're grading a normal image, not grey Log.</li><li>Fix white balance before contrast.</li><li>Add contrast gently — Log footage needs it, but watch for crushed shadows.</li><li>Slight teal in shadows + warmth in highlights is the popular cinematic 'orange-teal' look; use sparingly.</li><li>Match exposure across clips of the same scene so cuts don't flash.</li></ul><h3>Exporting for delivery</h3><p>Export settings must match where the video will live.</p><table><thead><tr><th>Delivery</th><th>Codec</th><th>Resolution / fps</th><th>Bitrate</th></tr></thead><tbody><tr><td>YouTube / web</td><td>H.264/H.265</td><td>3840x2160 @ 24/30</td><td>~40-50 Mbps (4K)</td></tr><tr><td>Instagram/social</td><td>H.264</td><td>1080x1080 / 1080x1920</td><td>~15-25 Mbps</td></tr><tr><td>Master / archive</td><td>ProRes 422 HQ</td><td>Source res &amp; fps</td><td>Very high (intra)</td></tr></tbody></table><p>Keep the timeline framerate through to export (don't change 24 to 30). Export a high-quality master in ProRes for archive, then derive compressed versions for each platform from that master.</p><div class='box tip'><div class='bt'>Insight.</div> Render a short test of your most graded clip and watch it on the actual target device (phone, TV) before exporting the whole project — banding and saturation often look different there. 10-bit timelines grade with far less banding than 8-bit.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Grade one Log/flat clip and export it.</p><ol><li>Import a flat/Log clip into Resolve (or your editor) onto a matching-fps timeline.</li><li>Build the node/layer chain: conversion LUT, balance, contrast, saturation, creative look.</li><li>Check the waveform and parade scopes; fix any clipping or color cast.</li><li>Export at a specified target (e.g. 4K H.265 @ 24fps, 45 Mbps) and write down each node/layer step you used.</li></ol></div></div>"},{"id":"p6-9","part":"06 · Cinematography","nav":"Matching Ground Footage","num":"6.9","kicker":"Part 06 · Lesson 9","title":"Matching Aerial to Ground Footage in a Sequence","html":"<h3>The seam you don't want the viewer to notice</h3><p>A polished film intercuts aerial and ground shots so they feel like one camera in one world. When the cut jumps in color temperature, exposure, or rhythm, the audience subconsciously notices and the spell breaks. Matching happens on two axes: <strong>color</strong> and <strong>pacing</strong>.</p><h3>Why aerial and ground footage differ</h3><p>They're shot on different sensors with different profiles. A DJI drone in D-Log and a mirrorless camera or phone in its own Log/standard profile will have different color science, contrast, white balance, and noise. Aerial footage often has more haze and a cooler, hazier sky; ground footage is closer and richer. Your job in post is to reconcile them to a shared look.</p><h3>Color matching workflow</h3><ol><li><strong>Neutralize both first.</strong> Apply each camera's conversion LUT (or correct each manually) so both clips are normal Rec.709 — not stylized. You can't match two stylized looks reliably.</li><li><strong>Pick a hero clip.</strong> Choose one clip whose look you like (often the ground shot of your subject) as the reference everyone matches to.</li><li><strong>Match on scopes.</strong> Put both clips side by side. Use the <strong>parade scope</strong> to align black points, white points, and the balance of R/G/B in shadows and highlights. Resolve's 'Shot Match' can do a first pass; refine by hand.</li><li><strong>Match white balance and skin/key tones.</strong> Drag the aerial's temperature/tint to match the ground clip's. If people are in frame, match skin tones above all.</li><li><strong>Apply the creative grade last, to the whole timeline</strong> (an adjustment/timeline-level node), so the same look sits on both — this glues them together.</li></ol><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>match checklist</span></div><div class='term-body'><span class='cm'>1.</span> both clips conversion-LUT'd to Rec.709\n<span class='cm'>2.</span> black point aligned on parade (both ~0)\n<span class='cm'>3.</span> white point aligned (both &lt;100, no clip)\n<span class='cm'>4.</span> WB matched -- compare a known neutral / sky\n<span class='cm'>5.</span> creative look on a TIMELINE node over both\n<span class='ok'>result: cut should be invisible color-wise</span></div></div><h3>Pacing and motion matching</h3><p>Color isn't enough — the <em>movement</em> must flow too.</p><ul><li><strong>Match motion direction:</strong> if the aerial pushes left-to-right, cut to a ground shot that continues that direction, or deliberately contrasts it.</li><li><strong>Match speed/energy:</strong> a slow floating aerial cuts awkwardly into a frantic handheld ground shot. Either slow the ground clip or pick a calmer take. Conform framerates so slow-mo intent is consistent.</li><li><strong>Cut on the beat:</strong> if scored, place aerial-to-ground cuts on musical hits so the rhythm carries the transition.</li><li><strong>Use motivated cuts:</strong> a top-down aerial of a road can cut to a ground shot of a car on that road — the audience follows the logic.</li><li><strong>Match grain/sharpness:</strong> aerial 4K can look cleaner than a noisy ground clip; add a touch of grain or soften slightly so textures match.</li></ul><div class='box tip'><div class='bt'>Insight.</div> Shoot with matching in mind: set both cameras to the same framerate, similar shutter (180° rule on both), and the same white balance in the field. Five minutes of discipline on set saves an hour of fighting in post.</div><div class='box danger'><div class='bt'>On location.</div> If a ground operator and a drone shoot the same scene, agree on flight paths and 'cut' signals so the drone isn't overhead of the ground crew. Never fly directly over people unless authorized and safe.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Cut a matched 20-30s aerial+ground sequence.</p><ol><li>Pick one aerial clip and one ground clip of the same subject/location.</li><li>Neutralize both with conversion LUTs, then color-match the aerial to the ground using the parade scope.</li><li>Intercut them on a single-framerate timeline; cut on motion/beat so pacing flows.</li><li>Add one creative look at the timeline level, then export a 20-30 second edit. Note your match steps.</li></ol></div></div>"},{"id":"p7-1","part":"07 · Autonomy & Code","nav":"GPS Modes & RTH","num":"7.1","kicker":"Part 07 · Lesson 1","title":"GPS Position Modes, Loiter & Return-to-Home","html":"<h3>What GPS buys you</h3><p>The flight controller fuses the GPS receiver, barometer, magnetometer (compass) and the IMU in an Extended Kalman Filter (EKF) to estimate an absolute position. Once that estimate is trustworthy, the autopilot can <em>hold a spot in 3D space</em> instead of just leveling the craft. This is the foundation of every autonomous behavior in this part.</p><h4>The position-aware flight modes</h4><table><thead><tr><th>Mode (ArduPilot / PX4)</th><th>What it does</th><th>Needs GPS?</th></tr></thead><tbody><tr><td>Stabilize / Manual</td><td>Self-levels (ArduPilot) or rate (PX4); no position hold</td><td>No</td></tr><tr><td>AltHold / Altitude</td><td>Holds altitude on baro; you fly position</td><td>No</td></tr><tr><td>Loiter / Position</td><td>Holds 3D position; stick input nudges it</td><td>Yes</td></tr><tr><td>PosHold</td><td>Like Loiter but more direct stick feel</td><td>Yes</td></tr><tr><td>Auto / Mission</td><td>Flies a stored waypoint mission</td><td>Yes</td></tr><tr><td>RTL / Return</td><td>Climbs to set altitude, flies home, lands</td><td>Yes</td></tr></tbody></table><h4>How the home point is set</h4><p>ArduPilot sets <strong>home</strong> automatically when the vehicle first arms with a good 3D GPS fix. That single moment matters: home is latched at the launch point, and RTL/Return-to-Home (RTH) flies back to <em>those exact coordinates</em>. PX4 behaves similarly. If you arm before the GPS has settled, home can be latched tens of metres off — and RTH will fly the craft to the wrong place, possibly into a tree or over a road.</p><h4>What 'good lock' actually means</h4><ul><li><strong>Satellites:</strong> 6 is a bare minimum; aim for 10+ before arming for any autonomous flight.</li><li><strong>HDOP</strong> (horizontal dilution of precision): below 1.5 is good; 2.0+ means a sloppy fix.</li><li><strong>EKF / position variance:</strong> Mission Planner shows an EKF status bar; PX4/QGC shows a position estimate health flag. Both must be green.</li><li><strong>Compass health:</strong> a bad compass calibration makes Loiter 'toilet-bowl' (orbit in a widening circle). Calibrate away from metal, rebar and cars.</li></ul><h4>RTH altitude — the number that saves the aircraft</h4><p>ArduPilot's <code>RTL_ALT</code> (in cm, e.g. 3000 = 30 m) is the altitude the craft climbs to before flying home. PX4 uses <code>RTL_RETURN_ALT</code>. Set it <em>above the tallest obstacle between you and home</em>. The autopilot does not see obstacles in basic RTH — it flies a straight line at the set altitude, so a 30 m tree line with a 20 m RTH altitude is a crash.</p><div class='box danger'><div class='bt'>SAFETY.</div> Never trust RTH you have not verified. Confirm home is set at your feet (check the GCS map marker), confirm RTH altitude clears all obstacles, and know that RTH at poor GPS lock can fly to a phantom home dozens of metres away.</div><div class='box tip'><div class='bt'>Toilet-bowling.</div> If Loiter spirals outward, it is almost always a compass problem (declination, calibration, or interference from current-carrying wires near the compass). Land immediately in a non-GPS mode.</div><h4>Failsafe RTH</h4><p>RTH is also the usual <strong>failsafe action</strong> on RC loss or low battery. Configure the battery failsafe voltage with margin to actually make it home — a craft at the field edge needs reserve to climb to RTH altitude and traverse back.</p><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Write a pre-flight RTH safety checklist and reason about a bad-lock home.</p><ol><li>List preconditions: 10+ sats, HDOP &lt; 1.5, EKF/position green, compass calibrated, home marker visible on GCS at launch point.</li><li>Set RTH altitude above the tallest obstacle on your field; write the number down.</li><li>Describe what happens if home latches with HDOP 4.0: home is offset, RTH flies to the wrong coordinate, and the descent may occur over an obstacle or hazard. Write the recovery action (switch to Loiter/PosHold or Stabilize and fly manually).</li></ol></div></div>"},{"id":"p7-2","part":"07 · Autonomy & Code","nav":"Mission Planner & QGC","num":"7.2","kicker":"Part 07 · Lesson 2","title":"Ground Stations: Mission Planner & QGroundControl","html":"<h3>Two ground stations, one job</h3><p>A Ground Control Station (GCS) is the laptop/tablet app that talks to your autopilot over MAVLink: it shows telemetry, lets you plan missions, tune parameters and arm/command the vehicle. The two dominant open-source GCS apps map roughly to the two firmware families.</p><table><thead><tr><th></th><th>Mission Planner</th><th>QGroundControl</th></tr></thead><tbody><tr><td>Primary firmware</td><td>ArduPilot (also PX4)</td><td>PX4 (also ArduPilot)</td></tr><tr><td>Platform</td><td>Windows (Mono on Mac/Linux)</td><td>Win / Mac / Linux / Android / iOS</td></tr><tr><td>Strengths</td><td>Deep parameter access, log analysis, scripting</td><td>Clean UI, survey planning, cross-platform</td></tr></tbody></table><h4>Installing</h4><ul><li><strong>Mission Planner:</strong> download the installer from ardupilot.org; it bundles the .NET runtime and drivers. First launch installs the SiK radio / USB drivers.</li><li><strong>QGroundControl:</strong> download from qgroundcontrol.com. On Linux, <code>chmod +x QGroundControl.AppImage</code> and add your user to the <code>dialout</code> group so USB serial works.</li></ul><h4>Connecting to a vehicle</h4><p>Connection is by transport + baud:</p><ul><li><strong>USB:</strong> pick the COM/tty port; ArduPilot USB is typically <code>115200</code> baud.</li><li><strong>Telemetry radio (SiK 433/915 MHz):</strong> usually <code>57600</code> baud.</li><li><strong>UDP/TCP:</strong> used for SITL and companion-computer links.</li></ul><p>In Mission Planner, the connect dropdown is top-right; choose the port, set baud, click <strong>Connect</strong>. In QGC, connections are auto-detected or added under <strong>Application Settings &gt; Comm Links</strong>.</p><h4>Connecting to SITL (no hardware)</h4><p>SITL (Software In The Loop) runs the real firmware on your PC and outputs MAVLink over UDP. ArduPilot SITL defaults to broadcasting on <code>udp:127.0.0.1:14550</code>.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>connect QGC/MP to SITL</span></div><div class='term-body'><span class='dim'># ArduPilot SITL spits MAVLink to UDP 14550 by default</span>\n<span class='cm'>Mission Planner:</span> top-right dropdown &gt; <span class='ok'>UDP</span> &gt; port <span class='ok'>14550</span> &gt; Connect\n<span class='cm'>QGroundControl:</span> Application Settings &gt; Comm Links &gt; Add\n  Type: <span class='ok'>UDP</span>  Port: <span class='ok'>14550</span>  &gt; Connect\n<span class='dim'># once connected you'll see the HUD horizon move and the map center on the home location</span></div></div><h4>Reading the HUD</h4><p>The Heads-Up Display shows artificial horizon, airspeed/groundspeed, altitude, heading, battery and GPS/EKF status. The map shows the vehicle icon, home (the 'H' marker), and any loaded mission. Get fluent here before you ever fly autonomously — the HUD is how you catch a bad attitude estimate or a wandering position.</p><div class='box tip'><div class='bt'>Two GCS, same protocol.</div> Because both speak MAVLink, you can connect QGC to ArduPilot or Mission Planner to PX4. Use whichever you prefer for a given task — many pros plan surveys in QGC but analyze logs in Mission Planner.</div><div class='box danger'><div class='bt'>SAFETY.</div> When connected to a real vehicle, props can spin the instant you arm. Practice all arming/commands in SITL first, and keep props off the bench until you are deliberately doing a motor test.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Get a live GCS-to-SITL connection up.</p><ol><li>Install Mission Planner or QGroundControl.</li><li>Start ArduPilot SITL (next lessons cover the command) so it outputs to UDP 14550.</li><li>Add a UDP comm link on port 14550 and connect.</li><li>Confirm the HUD horizon responds and the map centers on home; screenshot the live connection showing map + HUD.</li></ol></div></div>"},{"id":"p7-3","part":"07 · Autonomy & Code","nav":"Waypoints & Geofences","num":"7.3","kicker":"Part 07 · Lesson 3","title":"Waypoint Missions, Surveys & Geofences","html":"<h3>Anatomy of a waypoint mission</h3><p>A mission is an ordered list of <strong>commands</strong> stored on the autopilot. Most are waypoints (<code>MAV_CMD_NAV_WAYPOINT</code>) carrying latitude, longitude and altitude, but the list can also include takeoff, loiter, change-speed, do-set-servo (trigger a camera) and land/RTL commands. In <strong>Auto/Mission</strong> mode the autopilot executes them in sequence.</p><h4>Building a mission in a GCS</h4><ul><li><strong>Mission Planner:</strong> the <em>Plan</em> tab. Click on the map to drop waypoints; each row gets a command type, altitude and acceptance radius. The first item is often <code>TAKEOFF</code>; end with <code>RTL</code> or <code>LAND</code>.</li><li><strong>QGroundControl:</strong> the <em>Plan</em> view. Add waypoints, then upload with the <strong>Upload</strong> button. QGC has dedicated <strong>Survey</strong> and <strong>Corridor Scan</strong> patterns.</li></ul><h4>Altitude reference — the classic gotcha</h4><p>Waypoint altitude is usually <strong>relative to home</strong> (the launch point), not above sea level and not above the terrain under the waypoint. If your field slopes up 20 m toward a waypoint, a 30 m relative altitude leaves only 10 m of clearance there. ArduPilot and QGC both support <strong>terrain following</strong> (using SRTM terrain data) to hold altitude above ground instead — enable it deliberately when flying over varying terrain.</p><h4>Surveys (the lawnmower pattern)</h4><p>A survey tool takes a polygon you draw over an area and auto-generates parallel sweep lines (\"lawnmower\") plus camera trigger points. You specify the camera, desired Ground Sampling Distance (GSD) or altitude, and front/side overlap (typically <strong>75% front / 65% side</strong> for photogrammetry). The tool computes line spacing and shot interval. We design grids in detail in Lesson 7.9.</p><h4>Geofences: containment, not a suggestion</h4><p>A geofence is a boundary the autopilot enforces itself. ArduPilot supports:</p><table><thead><tr><th>Fence type</th><th>Parameter / shape</th><th>Purpose</th></tr></thead><tbody><tr><td>Altitude (max)</td><td><code>FENCE_ALT_MAX</code></td><td>Ceiling</td></tr><tr><td>Circle</td><td><code>FENCE_RADIUS</code> around home</td><td>Keep within radius</td></tr><tr><td>Polygon (inclusion)</td><td>drawn in GCS</td><td>Stay inside the shape</td></tr><tr><td>Polygon (exclusion)</td><td>drawn in GCS</td><td>Keep out of a zone</td></tr></tbody></table><p>Enable with <code>FENCE_ENABLE = 1</code> and pick the breach action via <code>FENCE_ACTION</code> (e.g. RTL or Land). On a breach the autopilot takes over regardless of pilot intent. QGC has a similar GeoFence editor in the Plan view.</p><div class='box danger'><div class='bt'>SAFETY.</div> Treat altitude and geofence limits as your hard containment, especially when testing autonomous code. Set a modest <code>FENCE_RADIUS</code> and <code>FENCE_ALT_MAX</code> at a clear field so a buggy script cannot fly the craft into a road, crowd or airspace boundary. Verify the breach action does something safe at your specific site.</p></div><div class='box law'><div class='bt'>Airspace.</div> A geofence does not authorize flight. You are still responsible for staying within legal altitude limits (e.g. 400 ft AGL in many jurisdictions under standard rules) and out of restricted airspace. Verify current FAA/local rules and any authorizations before flying.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Plan and fly a contained waypoint mission in SITL.</p><ol><li>In your GCS Plan view, drop a TAKEOFF to 15 m, four waypoints in a box at 30 m, then RTL.</li><li>Add a circular geofence (e.g. 200 m radius) and a max altitude (e.g. 50 m); set the breach action to RTL.</li><li>Upload the mission to SITL, switch to Auto, and arm.</li><li>Watch it fly and log the flight path; confirm it stayed inside the fence.</li></ol></div></div>"},{"id":"p7-4","part":"07 · Autonomy & Code","nav":"MAVLink Protocol","num":"7.4","kicker":"Part 07 · Lesson 4","title":"The MAVLink Protocol Explained","html":"<h3>What MAVLink is</h3><p>MAVLink (Micro Air Vehicle Link) is the lightweight binary messaging protocol that nearly every modern autopilot, GCS and companion computer uses to talk. It is designed for low-bandwidth, lossy links (a 57600-baud radio) and serializes structured messages into compact byte frames. Everything in this part — GCS telemetry, Python scripts, computer-vision guidance — rides on MAVLink.</p><h4>The frame</h4><p>A MAVLink v2 frame is a start byte (<code>0xFD</code>), payload length, sequence number, <strong>system ID</strong>, <strong>component ID</strong>, message ID, the payload, and a CRC. System ID identifies the vehicle (autopilot is usually ID 1); component ID distinguishes parts (autopilot, gimbal, companion computer). Your script picks its own sysid/compid so the vehicle knows who is talking.</p><h4>Messages vs commands</h4><ul><li><strong>Messages</strong> stream state, e.g. <code>HEARTBEAT</code>, <code>GLOBAL_POSITION_INT</code>, <code>ATTITUDE</code>. The autopilot pushes these continuously.</li><li><strong>Commands</strong> are requests you send, often via <code>COMMAND_LONG</code>/<code>COMMAND_INT</code> with a <code>MAV_CMD_*</code> id (e.g. <code>MAV_CMD_NAV_TAKEOFF</code>, <code>MAV_CMD_COMPONENT_ARM_DISARM</code>). The vehicle replies with <code>COMMAND_ACK</code> telling you accepted/denied.</li></ul><h4>The heartbeat — the protocol's pulse</h4><p>Every node sends a <code>HEARTBEAT</code> at ~1 Hz. It carries the vehicle type, autopilot type, <strong>base/custom mode</strong>, and a system status. A GCS uses heartbeats to detect link loss; if no heartbeat arrives for a timeout, it declares the vehicle lost. Your own script should also emit a heartbeat so the vehicle does not treat it as a dead GCS and trigger a failsafe.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>three common MAVLink messages</span></div><div class='term-body'><span class='cm'>HEARTBEAT</span>            <span class='dim'>~1 Hz: vehicle type, autopilot, armed flag, flight mode</span>\n<span class='cm'>GLOBAL_POSITION_INT</span>  <span class='dim'>lat/lon (1e7 deg), alt &amp; relative_alt (mm), velocity vx/vy/vz</span>\n<span class='cm'>ATTITUDE</span>             <span class='dim'>roll/pitch/yaw (rad) + angular rates, from the EKF</span>\n<span class='cm'>SYS_STATUS</span>           <span class='dim'>battery voltage/current, sensor health bitmask</span>\n<span class='cm'>STATUSTEXT</span>           <span class='dim'>human-readable warnings/errors from the autopilot</span></div></div><h4>Telemetry rates &amp; the message interval</h4><p>You do not get every message at full rate by default. You request streams: legacy <code>REQUEST_DATA_STREAM</code> or the modern <code>MAV_CMD_SET_MESSAGE_INTERVAL</code> (specify message id + interval in microseconds). Asking for high rates on a slow radio saturates the link and drops packets — request only what you need.</p><h4>How tools speak it</h4><p>You rarely hand-assemble frames. <strong>pymavlink</strong> generates Python bindings from the message XML definitions. <strong>MAVSDK</strong> and <strong>DroneKit</strong> wrap MAVLink in higher-level APIs. Mission Planner and QGC both have a live <strong>MAVLink Inspector</strong> showing every message and field at its current rate.</p><div class='box tip'><div class='bt'>Units gotcha.</div> MAVLink packs to integers to save bytes: lat/lon are degrees x 1e7, altitudes in mm, angles in radians. Convert in your code or you will fly to the wrong continent.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Inspect live MAVLink from SITL and document three messages.</p><ol><li>Connect Mission Planner (Ctrl+F &gt; MAVLink Inspector) or QGC's MAVLink Inspector to SITL.</li><li>Find <code>HEARTBEAT</code>, <code>GLOBAL_POSITION_INT</code> and <code>ATTITUDE</code>.</li><li>For each, write down its rate and what its key fields carry (e.g. GLOBAL_POSITION_INT: lat/lon x1e7, relative_alt in mm).</li></ol></div></div>"},{"id":"p7-5","part":"07 · Autonomy & Code","nav":"SITL & Python Setup","num":"7.5","kicker":"Part 07 · Lesson 5","title":"Setting Up SITL & a Python Control Environment","html":"<h3>Why SITL first, always</h3><p>SITL runs the genuine ArduPilot or PX4 firmware as a desktop process with a simulated physics model. Your scripts, missions and bugs behave exactly as they would on hardware — except a crash costs nothing. Every line of autonomy code in this part is developed and proven in SITL before it ever touches a real aircraft.</p><h4>Installing ArduPilot SITL</h4><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>ArduPilot SITL via sim_vehicle.py</span></div><div class='term-body'><span class='dim'># one-time: clone and set up the toolchain</span>\ngit clone --recurse-submodules https://github.com/ArduPilot/ardupilot\ncd ardupilot\nTools/environment_install/install-prereqs-ubuntu.sh -y   <span class='dim'># or the mac script</span>\n. ~/.profile\n<span class='dim'># launch a simulated copter; --map shows a map, --console a status window</span>\nsim_vehicle.py -v ArduCopter --map --console\n<span class='ok'># SITL now serves MAVLink on udp:127.0.0.1:14550 (and 14551)</span></div></div><p>PX4 alternative: <code>make px4_sitl gazebo</code> (or jMAVSim) from the PX4-Autopilot tree; it outputs MAVLink on UDP 14540 (offboard) / 14550 (GCS).</p><h4>Three Python libraries — pick by job</h4><table><thead><tr><th>Library</th><th>Level</th><th>Best for</th></tr></thead><tbody><tr><td><code>pymavlink</code></td><td>Low (raw messages)</td><td>Full control, custom messages, learning the protocol</td></tr><tr><td><code>DroneKit</code></td><td>High (object model)</td><td>Quick ArduPilot scripts (note: less maintained)</td></tr><tr><td><code>MAVSDK</code></td><td>High (async, PX4-first)</td><td>Modern PX4 apps, async/await Python</td></tr></tbody></table><h4>Setting up the Python environment</h4><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>venv + libraries</span></div><div class='term-body'>python3 -m venv droneenv\nsource droneenv/bin/activate\npip install pymavlink mavsdk dronekit\n<span class='dim'># pymavlink needs the future package on some systems; pip handles it</span></div></div><h4>First connection — print heartbeat &amp; mode</h4><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>connect.py (pymavlink)</span></div><div class='term-body'>from pymavlink import mavutil\n<span class='dim'># match the SITL output endpoint</span>\nm = mavutil.mavlink_connection('udp:127.0.0.1:14550')\nm.wait_heartbeat()   <span class='dim'># blocks until first HEARTBEAT</span>\nprint('heartbeat from sys %d comp %d' % (m.target_system, m.target_component))\n<span class='dim'># decode the flight mode from the heartbeat</span>\nprint('mode:', m.flightmode)</div></div><div class='box tip'><div class='bt'>Sharing one stream.</div> SITL only fans out so many UDP endpoints. Run <strong>MAVProxy</strong> (it ships with sim_vehicle.py) as a hub and use <code>output add 127.0.0.1:14551</code> to feed your script while a GCS stays on 14550. Otherwise you fight over the port.</div><div class='box danger'><div class='bt'>SAFETY.</div> Keep the exact connection string different for sim vs hardware, and put a loud comment at the top of every script stating whether it targets SITL or a real vehicle. The number-one cause of unintended real-world flights is running a sim script against a live, propped drone.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Stand up SITL and confirm a Python link.</p><ol><li>Launch ArduCopter SITL with <code>sim_vehicle.py -v ArduCopter --map --console</code>.</li><li>Create a venv and <code>pip install pymavlink</code>.</li><li>Run the connect.py script above; confirm it prints the heartbeat sys/comp IDs and the current flight mode (e.g. STABILIZE).</li></ol></div></div>"},{"id":"p7-6","part":"07 · Autonomy & Code","nav":"Scripting Flight","num":"7.6","kicker":"Part 07 · Lesson 6","title":"Scripting Flight: Arm, Takeoff & Goto in Python","html":"<h3>The autonomous flight sequence</h3><p>Every mission script follows the same skeleton: connect, wait for the vehicle to be armable, set a mode that accepts commands (<strong>GUIDED</strong>), arm, take off, navigate, then land or RTL. We will use pymavlink because it shows exactly what is on the wire; DroneKit/MAVSDK wrap these same steps.</p><h4>Why GUIDED mode</h4><p>In ArduPilot, <strong>GUIDED</strong> mode lets an external program send position/velocity setpoints in real time — it is the mode for scripted and companion-computer control. (PX4's equivalent is <strong>Offboard</strong> mode, which additionally requires a continuous setpoint stream or it drops out.) You cannot just send a goto in Loiter; the vehicle must be in GUIDED/Offboard.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>fly.py (pymavlink, ArduCopter SITL)</span></div><div class='term-body'>from pymavlink import mavutil\nimport time\n\nm = mavutil.mavlink_connection('udp:127.0.0.1:14550')\nm.wait_heartbeat()\n\n<span class='dim'># 1) set GUIDED mode</span>\nmode_id = m.mode_mapping()['GUIDED']\nm.set_mode(mode_id)\n\n<span class='dim'># 2) arm (param1=1 to arm)</span>\nm.mav.command_long_send(m.target_system, m.target_component,\n  mavutil.mavlink.MAV_CMD_COMPONENT_ARM_DISARM, 0, 1,0,0,0,0,0,0)\nm.motors_armed_wait()\nprint('armed')\n\n<span class='dim'># 3) takeoff to 10 m (last param = altitude)</span>\nm.mav.command_long_send(m.target_system, m.target_component,\n  mavutil.mavlink.MAV_CMD_NAV_TAKEOFF, 0, 0,0,0,0,0,0, 10)\ntime.sleep(10)   <span class='dim'># wait for climb (better: poll relative_alt)</span>\n\n<span class='dim'># 4) goto a lat/lon at 10 m using SET_POSITION_TARGET_GLOBAL_INT</span>\nm.mav.set_position_target_global_int_send(\n  0, m.target_system, m.target_component,\n  mavutil.mavlink.MAV_FRAME_GLOBAL_RELATIVE_ALT_INT,\n  0b110111111000,                 <span class='dim'># type_mask: use position only</span>\n  int(-35.3621 * 1e7), int(149.1655 * 1e7), 10,  <span class='dim'># lat,lon (x1e7), alt(m)</span>\n  0,0,0, 0,0,0, 0,0)\ntime.sleep(20)\n\n<span class='dim'># 5) land where it is</span>\nm.set_mode(m.mode_mapping()['LAND'])\nprint('landing')</div></div><h4>Key details that bite beginners</h4><ul><li><strong>Arm checks:</strong> SITL enforces pre-arm checks (GPS, EKF). If arming is rejected, read the <code>STATUSTEXT</code> message — it tells you why.</li><li><strong>Takeoff only works in GUIDED</strong> and only after arming. Set mode, then arm, then takeoff, in that order.</li><li><strong>Don't sleep blindly.</strong> Replace fixed <code>time.sleep</code> with polling: read <code>GLOBAL_POSITION_INT.relative_alt</code> until it reaches the target. Sleeps are fine for a first demo only.</li><li><strong>type_mask</strong> in the position target selects which fields are active (position vs velocity vs acceleration). Get it wrong and the vehicle ignores your command.</li></ul><div class='box danger'><div class='bt'>SAFETY — sim only.</div> Run this against SITL exclusively until you fully trust it. On real hardware this code arms motors and flies the aircraft autonomously; props will spin the moment arming succeeds. Test outdoors only after bench-validating logic with props removed, at a clear field, with a geofence and a manual-override mode on your transmitter.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Fly a full arm-takeoff-goto-land script in SITL.</p><ol><li>With SITL running, run the fly.py script above (edit the lat/lon to a point near your SITL home).</li><li>Watch the map: confirm it arms, climbs to 10 m, flies to the waypoint, and lands.</li><li>Improve it: replace the takeoff sleep with a loop that reads relative_alt until ≥ 9.5 m.</li><li>Pull the SITL log (.bin/.tlog) and confirm the recorded path matches your commands.</li></ol></div></div>"},{"id":"p7-7","part":"07 · Autonomy & Code","nav":"Companion Computers","num":"7.7","kicker":"Part 07 · Lesson 7","title":"Adding a Companion Computer: Raspberry Pi & Jetson","html":"<h3>Why add a second brain</h3><p>The flight controller (FC) is a real-time microcontroller dedicated to stabilization and navigation — it has no spare cycles for computer vision, machine learning or a cellular link. A <strong>companion computer</strong> is a small Linux board mounted on the drone that runs your heavy code and talks to the FC over MAVLink. The FC keeps flying the aircraft; the companion tells it <em>where</em> to go.</p><h4>Choosing the board</h4><table><thead><tr><th>Board</th><th>Strength</th><th>Use it for</th></tr></thead><tbody><tr><td>Raspberry Pi 4 / 5</td><td>Cheap, huge community</td><td>Telemetry relay, basic OpenCV, MAVLink scripting</td></tr><tr><td>NVIDIA Jetson Nano</td><td>CUDA GPU on a budget</td><td>Entry deep-learning inference</td></tr><tr><td>Jetson Orin Nano / NX</td><td>Strong GPU, modern</td><td>Real-time object detection, depth, SLAM</td></tr></tbody></table><h4>The physical link: companion to FC</h4><p>The standard link is a <strong>serial UART</strong> from a spare FC telemetry port (e.g. TELEM2) to the companion's UART pins. Wire only <strong>TX, RX and GND</strong> — and cross them (FC TX to Pi RX, FC RX to Pi TX). Common baud is <strong>921600</strong> for an onboard link (far faster than a radio). Set the FC's serial protocol on that port to MAVLink2 (ArduPilot: <code>SERIAL2_PROTOCOL = 2</code>, <code>SERIAL2_BAUD = 921</code>). USB also works but a dedicated UART is more robust.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>companion <-> FC link (diagram)</span></div><div class='term-body'> [GPS]  [Camera CSI/USB]\n   |          |\n   |     +----------------+\n   |     | Companion (Pi/ |\n   |     |  Jetson) Linux |\n   |     |  OpenCV/MAVSDK |\n   |     +----------------+\n   |        |  UART (TX/RX/GND, 921600)\n   |        |  <span class='dim'>FC TX -> Pi RX, FC RX -> Pi TX</span>\n+------------------+\n| Flight Controller|  TELEM2 = MAVLink2\n|  (ArduPilot/PX4) |\n+------------------+\n   |        |\n [Motors] [RC/Telem radio]\n\n<span class='am'>Power:</span> 5V BEC -> Pi/Jetson (DO NOT back-power FC from companion)</div></div><h4>Power — get this right</h4><p>Companion boards are hungry: a Pi 5 wants up to 5 A at 5 V; a Jetson Orin can pull more. Feed it from a dedicated, properly rated <strong>5 V BEC/UBEC</strong> off the main battery, not from the FC's 5 V rail. Brownouts cause silent reboots mid-flight. Use thick enough wire and a common ground with the FC.</p><h4>Software stack to install</h4><ul><li><strong>OS:</strong> Raspberry Pi OS Lite (headless) or NVIDIA JetPack (Ubuntu + CUDA).</li><li><strong>MAVLink:</strong> <code>pymavlink</code>, <code>MAVSDK</code>, or <code>mavlink-router</code> to fan the FC stream to several consumers.</li><li><strong>Vision:</strong> OpenCV; on Jetson, TensorRT / DeepStream for accelerated inference.</li><li><strong>Comms:</strong> a 4G/5G modem or WiFi for live telemetry/video off-board.</li><li><strong>Autostart:</strong> a <code>systemd</code> service so your code runs on boot.</li></ul><div class='box tip'><div class='bt'>Test on the bench first.</div> Bring up the companion-to-FC link with SITL or a propless FC and confirm you receive heartbeats over the UART before you ever bolt it to a flying airframe.</div><div class='box danger'><div class='bt'>SAFETY.</div> A companion in GUIDED/Offboard can command full autonomous flight. Always keep a transmitter mode switch that drops the FC into a manual/Loiter mode the companion cannot override, and validate the link-loss behaviour (the companion should command a safe action if it crashes).</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Design a complete companion-computer setup.</p><ol><li>Pick a board (Pi vs Jetson) for your intended workload and justify it.</li><li>Draw the wiring: FC TELEM port to companion UART (TX/RX/GND crossed), the camera, and a separate 5 V BEC for power.</li><li>List the FC params to set (serial protocol = MAVLink2, baud 921600).</li><li>List the software you would install (OS, pymavlink/MAVSDK, OpenCV, systemd autostart, comms).</li></ol></div></div>"},{"id":"p7-8","part":"07 · Autonomy & Code","nav":"Computer Vision","num":"7.8","kicker":"Part 07 · Lesson 8","title":"Computer Vision with OpenCV: Tracking & Avoidance","html":"<h3>From pixels to flight commands</h3><p>Computer vision turns a camera frame into a decision the drone can act on. The pipeline is always: <strong>capture frame &rarr; detect target &rarr; compute an error &rarr; convert error to a MAVLink command &rarr; loop</strong>. OpenCV (Python <code>cv2</code>) handles capture and detection; pymavlink/MAVSDK handle the command. This runs on the companion computer, not the FC.</p><h4>A simple color tracker</h4><p>The classic starting point: track a colored object by converting to HSV (more lighting-robust than RGB), threshold for the color, find the largest contour, and take its centroid.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>track.py (OpenCV color centroid)</span></div><div class='term-body'>import cv2, numpy as np\ncap = cv2.VideoCapture('clip.mp4')   <span class='dim'># or 0 for a live camera</span>\nwhile True:\n    ok, frame = cap.read()\n    if not ok: break\n    hsv = cv2.cvtColor(frame, cv2.COLOR_BGR2HSV)\n    mask = cv2.inRange(hsv, (40,70,70), (80,255,255))   <span class='dim'># green</span>\n    cnts,_ = cv2.findContours(mask, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE)\n    if cnts:\n        c = max(cnts, key=cv2.contourArea)\n        M = cv2.moments(c)\n        cx, cy = int(M['m10']/M['m00']), int(M['m01']/M['m00'])\n        h, w = frame.shape[:2]\n        err_x = (cx - w/2) / (w/2)   <span class='dim'># -1..+1, target left/right of center</span>\n        err_y = (cy - h/2) / (h/2)\n        print('err', round(err_x,2), round(err_y,2))\n<span class='dim'># err_x &gt; 0 means target is right of center -&gt; command a right/yaw correction</span></div></div><h4>Turning error into guidance</h4><p>The normalized error feeds a controller (often a simple <strong>P controller</strong>: command = gain x error). For a <em>tracking/follow</em> behaviour you typically map:</p><ul><li><strong>Horizontal error (err_x)</strong> &rarr; yaw rate or lateral velocity to center the target.</li><li><strong>Target size / vertical error</strong> &rarr; forward velocity (move closer if the target is small/far).</li></ul><p>You send these as a velocity setpoint with <code>SET_POSITION_TARGET_LOCAL_NED</code> (body frame), with the type_mask set to use velocities, not positions. The autopilot must be in GUIDED/Offboard.</p><h4>Detection beyond color</h4><ul><li><strong>ArUco / AprilTag markers</strong> (built into OpenCV) for precise relative pose — great for precision landing.</li><li><strong>Optical flow</strong> for motion/velocity estimation and basic avoidance cues.</li><li><strong>Deep models</strong> (YOLO via TensorRT on Jetson) for robust object detection in clutter.</li></ul><h4>Obstacle avoidance</h4><p>Avoidance needs <em>depth</em>, not just a 2D detection: a stereo camera (e.g. Intel RealSense), a depth-from-LiDAR sensor, or a learned mono-depth model. The depth map feeds either ArduPilot's built-in <strong>OA_*</strong> (object avoidance) via <code>OBSTACLE_DISTANCE</code>/<code>DISTANCE_SENSOR</code> MAVLink messages, or your own controller that slows and steers around the nearest return.</p><div class='box tip'><div class='bt'>Latency is the enemy.</div> The control loop must keep up. A 30 ms detection that arrives 200 ms late commands the drone toward where the target <em>was</em>. Profile your loop, cap resolution, and offload to the GPU before chasing accuracy.</div><div class='box danger'><div class='bt'>SAFETY.</div> Vision can fail silently — a lost target, a false positive, a frozen camera. Build a watchdog: if detection is stale for N frames, command zero velocity / hold position and fall back to a safe mode rather than flying on a stale command. Test all of this in SITL with a video feed before flying.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Run a color tracker and map its output to MAVLink velocity.</p><ol><li>Run track.py on a video clip containing a colored object; tune the HSV range until the centroid locks on.</li><li>Print normalized err_x/err_y each frame.</li><li>On paper, define a P controller: vy = Kp*err_x, vz = Kp*err_y, and which type_mask fields of SET_POSITION_TARGET_LOCAL_NED you would enable.</li><li>Add a stale-detection watchdog that would command zero velocity if the target is lost.</li></ol></div></div>"},{"id":"p7-9","part":"07 · Autonomy & Code","nav":"Autonomous Patterns","num":"7.9","kicker":"Part 07 · Lesson 9","title":"Autonomous Patterns: Mapping Grids & Follow-Me","html":"<h3>The lawnmower mapping grid</h3><p>To map an area for photogrammetry you fly parallel sweeps (\"lawnmower\") and trigger the camera at intervals so every point on the ground appears in multiple overlapping photos. The grid geometry is driven by your camera, your altitude, and your overlap targets.</p><h4>Ground Sampling Distance (GSD)</h4><p>GSD is the real-world size of one pixel on the ground — your effective resolution. It scales with altitude:</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>grid math</span></div><div class='term-body'>GSD (cm/px) = (sensor_width_mm * altitude_m * 100) / (focal_mm * image_width_px)\n\n<span class='dim'>example: 13.2mm sensor, 8.8mm focal, 5472px wide, 80m altitude</span>\nGSD = (13.2 * 80 * 100) / (8.8 * 5472) = 2.19 cm/px\n\nfootprint_width_m  = GSD/100 * image_width_px   = 0.0219 * 5472 = ~120 m\nfootprint_height_m = GSD/100 * image_height_px\n\nline_spacing_m = footprint_width_m  * (1 - side_overlap)   <span class='dim'>side overlap ~65%</span>\n               = 120 * 0.35 = 42 m\nshot_spacing_m = footprint_height_m * (1 - front_overlap)  <span class='dim'>front overlap ~75%</span></div></div><h4>Overlap targets</h4><table><thead><tr><th>Use case</th><th>Front overlap</th><th>Side overlap</th></tr></thead><tbody><tr><td>Standard orthomosaic</td><td>75%</td><td>65%</td></tr><tr><td>3D models / dense vegetation</td><td>80-85%</td><td>70-80%</td></tr></tbody></table><p>Higher overlap = more photos = more flight time and processing, but better reconstruction and fewer holes. Most GCS survey tools (QGC Survey, Mission Planner Survey Grid) take the camera, altitude/GSD and overlaps, then compute line spacing, shot interval and total shot count for you.</p><h4>Flight efficiency tips</h4><ul><li>Orient sweep lines along the <strong>longest dimension</strong> of the polygon to minimize turns.</li><li>Fly into the wind on alternate legs only if speed control compensates; constant ground speed keeps shot spacing even.</li><li>Account for battery: total distance = (num_lines x line_length) + turns; check it fits one pack with reserve.</li><li>Use <strong>terrain following</strong> over hilly ground so GSD stays constant.</li></ul><h4>Follow-Me</h4><p>Follow-me keeps the drone tracking a moving target. Two common approaches:</p><ul><li><strong>GPS follow:</strong> a phone/GPS beacon streams its position to the drone (ArduPilot <strong>Follow</strong> mode / GCS follow), and the drone holds an offset (distance + altitude + bearing) from that position. Simple and robust outdoors.</li><li><strong>Vision follow:</strong> the companion computer detects the subject in the camera (Lesson 7.8) and sends velocity setpoints to keep it framed. Works without a beacon but fails if the subject leaves frame or is occluded.</li></ul><p>In both, you set a follow distance and altitude, and the autopilot continuously re-issues guided setpoints. Define behaviour for target loss (hold, climb, or RTL).</p><div class='box law'><div class='bt'>Rules.</div> Automated patterns do not exempt you from the rules of flight. Surveys often run near or beyond visual line of sight and at altitude — verify current FAA/local requirements (BVLOS authorization, altitude caps, overflight of people) before flying any autonomous grid or follow mission.</div><div class='box danger'><div class='bt'>SAFETY.</div> Prove every grid and follow mission in SITL first, set a geofence and a sane RTH altitude, and keep a manual-override mode ready. Follow-me near people demands extra caution: a tracking error sends the aircraft toward the very subject you are filming.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Plan and fly an autonomous survey grid in SITL.</p><ol><li>In QGC or Mission Planner, draw a polygon over a defined area.</li><li>Enter your camera spec, set altitude for a target GSD (e.g. ~2 cm/px), and 75%/65% overlap.</li><li>Let the tool compute line spacing and shot count; sanity-check against the grid math above.</li><li>Upload to SITL, fly it in Auto, and export the planned path (.waypoints / .plan) plus the flown log.</li></ol></div></div>"},{"id":"p8-1","part":"08 · Long-Range & HD","nav":"Long-Range Theory","num":"8.1","kicker":"Part 08 · Lesson 1","title":"Long-Range Theory: Link Budget, Frequency & Power","html":"<h3>Range is a budget, not a number</h3><p>Every radio link, control or video, lives or dies on a single accounting equation called the <strong>link budget</strong>. You add up everything that helps (transmit power, antenna gains) and subtract everything that hurts (path loss, cable loss), and compare the result against your receiver's <strong>sensitivity</strong>. If you finish above sensitivity with margin to spare, the link works; if you finish below it, you lose the link. Memorize this and long range stops being magic.</p><h4>The equation</h4><p>Working in decibels turns multiplication into addition. The received signal power is:</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>link budget (dB)</span></div><div class='term-body'><span class='dim'>Prx =</span> Ptx <span class='ok'>+ Gtx</span> <span class='bad'>- Lcable_tx</span> <span class='bad'>- FSPL</span> <span class='ok'>+ Grx</span> <span class='bad'>- Lcable_rx</span>\n\n<span class='dim'>Margin =</span> Prx <span class='bad'>- Sensitivity(rx)</span>\n<span class='dim'>FSPL(dB) =</span> 20*log10(d_km) + 20*log10(f_MHz) + 32.45</div></div><ul><li><strong>Ptx</strong> — transmit power in dBm. <code>25mW = 14dBm</code>, <code>100mW = 20dBm</code>, <code>250mW = 24dBm</code>, <code>1W = 30dBm</code>. Note the pattern: every 3dB doubles power, every 10dB is 10x.</li><li><strong>Gtx / Grx</strong> — antenna gain in dBi. An omni dipole is ~2dBi; a patch ~8-14dBi; a helical ~10-16dBi.</li><li><strong>FSPL</strong> — free-space path loss, the big one. It grows with distance and frequency. Doubling distance costs 6dB; doubling frequency also costs 6dB.</li><li><strong>Sensitivity</strong> — the weakest signal the receiver can decode, a negative dBm number. ELRS at <code>50Hz</code> is roughly <code>-117dBm</code>; at <code>500Hz</code> only about <code>-105dBm</code>. Lower (more negative) is better.</li></ul><h4>Why frequency matters</h4><p>Lower frequency = less path loss for the same distance, and better diffraction around trees and terrain. That is why <strong>900MHz</strong> (US 902-928, EU 868) out-ranges <strong>2.4GHz</strong> at equal power, and why 5.8GHz video is the first link to die in the trees. The flip side: higher frequency allows smaller antennas and higher data rates (more packets/sec, lower latency).</p><h4>Worked feel for the numbers</h4><p>At 915MHz over 10km, FSPL is about <code>20*log10(10) + 20*log10(915) + 32.45 ≈ 20 + 59.2 + 32.45 = 111.7dB</code>. With 100mW (20dBm), a 2dBi air antenna and a 3dBi ground antenna: <code>20 + 2 - 111.7 + 3 = -86.7dBm</code> received. Against a 50Hz sensitivity of -117dBm that is <strong>~30dB of margin</strong> — comfortable. Swap to 2.4GHz and FSPL jumps ~8dB, eating most of a doubling of power.</p><div class='box tip'><div class='bt'>Gain is free range, power is not.</div> +6dB of antenna gain doubles your effective distance for zero extra battery drain or heat. +6dB of TX power needs 4x the watts and is often illegal. Always solve the antenna first.</div><div class='box law'><div class='bt'>Verify legal power.</div> EIRP and conducted-power limits differ by country and band. The US ISM 902-928MHz, EU 868MHz, and 2.4GHz all have caps, and high-gain antennas can push you over EIRP limits even at modest TX power. Confirm current local rules before turning up power.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>List every link-budget factor for a sample setup and find the biggest lever.</p><ol><li>Pick a setup: ELRS 915MHz, 250mW, dipole on the air side, 3dBi omni on the ground, RX sensitivity -112dBm at 100Hz.</li><li>Write each term: Ptx, Gtx, Grx, an assumed FSPL at 5km, and sensitivity.</li><li>Compute the margin in dB.</li><li>Now test three single changes: (a) +6dB ground antenna gain, (b) double TX power (+3dB), (c) drop packet rate for +5dB sensitivity. Note which adds the most margin and why.</li></ol></div></div>"},{"id":"p8-2","part":"08 · Long-Range & HD","nav":"Radio Horizon","num":"8.2","kicker":"Part 08 · Lesson 2","title":"The Radio Horizon & Why Altitude Beats Power","html":"<h3>You cannot transmit through the planet</h3><p>Beyond all the link-budget math sits a hard physical wall: the <strong>radio horizon</strong>. Radio at these frequencies travels essentially in straight lines (with a small atmospheric bend), so once your aircraft drops below the horizon line as seen from your antenna, no amount of power gets the signal there. The Earth's curvature, and any hill or building in between, is the real range limit for most flights, not your transmitter.</p><h4>Computing the radio horizon</h4><p>The line-of-sight horizon for a single antenna of height <code>h</code> metres is approximately <code>3.57 * sqrt(h)</code> kilometres for the geometric horizon, and about <code>4.12 * sqrt(h)</code> km for radio because the atmosphere refracts signals slightly past the visual horizon. For a two-antenna link you add the two horizons:</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>radio horizon</span></div><div class='term-body'><span class='dim'>d_km ≈</span> 4.12 * ( sqrt(h_air) + sqrt(h_ground) )   <span class='dim'>(h in metres)</span>\n\n<span class='dim'>aircraft @ 100m, antenna @ 2m:</span>\n  4.12 * ( sqrt(100) + sqrt(2) )\n  4.12 * ( 10 + 1.41 ) = <span class='ok'>~47 km</span>\n\n<span class='dim'>aircraft @ 30m, antenna @ 2m:</span>\n  4.12 * ( sqrt(30) + sqrt(2) )\n  4.12 * ( 5.48 + 1.41 ) = <span class='am'>~28 km</span></div></div><p>Notice the lever: climbing the aircraft from 30m to 100m added almost 20km of theoretical horizon. <strong>Altitude beats power</strong> because horizon scales with the square root of height and is unaffected by watts. This is also why ground-station antenna height matters: raising your ground antenna on a mast or a hilltop is the cheapest range upgrade you can make.</p><h4>Real terrain ruins the math</h4><p>The formulas assume flat, unobstructed ground. In reality a single ridge, treeline, or building between you and the aircraft creates an obstruction long before the geometric horizon. The <strong>Fresnel zone</strong> (the football-shaped volume around the direct path) must be roughly 60% clear, so even objects near but not on the line-of-sight attenuate the signal. Practical range over hilly or wooded terrain is often a small fraction of the horizon number.</p><div class='box danger'><div class='bt'>Horizon is not permission.</div> A link that reaches 40km does not mean you may fly 40km away. Losing video or control at distance over people, roads, or out of sight is dangerous. Long links exist to give margin and reliability at legal distances, not to enable beyond-line-of-sight stunts.</div><div class='box law'><div class='bt'>Legal VLOS still applies.</div> In most jurisdictions (FAA Part 107 / recreational rules in the US, EASA Open category in the EU, and similar elsewhere) you must keep the aircraft within <strong>visual line of sight</strong> of yourself or a visual observer, regardless of how far the radio reaches. BVLOS requires a specific waiver/authorization. Verify current rules for your country; do not treat radio range as a legal allowance.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Compute the horizon for two altitudes and write down the real constraints.</p><ol><li>Assume a ground antenna at 2m. Compute the radio horizon for the aircraft at 50m and at 120m using <code>4.12*(sqrt(h_air)+sqrt(h_gnd))</code>.</li><li>Compare the two distances; note how much the climb added.</li><li>Describe a real site near you and identify the first terrain feature (ridge, treeline, building) that would block line of sight before the horizon.</li><li>Write one sentence on how the legal VLOS rule, not the horizon, sets your actual maximum range.</li></ol></div></div>"},{"id":"p8-3","part":"08 · Long-Range & HD","nav":"ELRS Low Rates","num":"8.3","kicker":"Part 08 · Lesson 3","title":"Long-Range Control: ELRS at Low Packet Rates","html":"<h3>Trading speed for distance</h3><p>ExpressLRS lets you pick a <strong>packet rate</strong>, the number of control packets sent per second. High rates (500Hz, 1000Hz) give razor-sharp, low-latency control for racing and freestyle. Low rates (50Hz, 100Hz) send fewer but longer, more robust packets so the receiver can dig a weaker signal out of the noise. For long range you deliberately choose a low rate to buy <strong>link budget</strong>, accepting a few extra milliseconds of latency you will never feel cruising in a straight line.</p><h4>Why low rate = more range</h4><p>At a lower packet rate each packet occupies more time on air and the receiver integrates more energy per bit, lowering the required signal-to-noise ratio. The sensitivity difference is large:</p><table><thead><tr><th>Packet rate</th><th>Approx RX sensitivity</th><th>Latency</th><th>Use case</th></tr></thead><tbody><tr><td>1000Hz</td><td>~ -100dBm</td><td>~1-2ms</td><td>Racing, low-latency freestyle</td></tr><tr><td>500Hz</td><td>~ -105dBm</td><td>~2-4ms</td><td>Freestyle LOS</td></tr><tr><td>250Hz</td><td>~ -108dBm</td><td>~4-6ms</td><td>General flying</td></tr><tr><td>150Hz</td><td>~ -112dBm</td><td>~7ms</td><td>Mid range</td></tr><tr><td>100Hz / 50Hz</td><td>~ -115 to -118dBm</td><td>~10-20ms</td><td>Long range cruising</td></tr></tbody></table><p>Dropping from 500Hz to 50Hz buys roughly <strong>12-13dB</strong> of sensitivity, equivalent to more than quadrupling distance or to a huge antenna upgrade, for free. The cost is latency: 50Hz feels slightly mushy and is unsuitable for tight maneuvers, but for a long, smooth cruise it is invisible.</p><h4>Frequency choice</h4><p>For serious long range, <strong>900MHz</strong> ELRS (US 902-928, EU 868) is the better band: lower path loss, better tree and terrain penetration, and 900MHz hardware tops out around 200Hz which is plenty for cruising. <strong>2.4GHz</strong> ELRS offers higher rates and smaller antennas but loses range and dies faster behind obstacles. Pick 900MHz when range is the priority, 2.4GHz when latency or antenna size dominates.</p><h4>Power and the Dynamic option</h4><p>Set TX power to what you need, not the maximum. ELRS supports <code>25mW</code> up to <code>1W+</code> on capable hardware. <strong>Dynamic Power</strong> raises power automatically only when link quality (LQ) and RSSI drop, saving battery and heat the rest of the time. Always enable telemetry so you can watch LQ and RSSI in your OSD.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>ELRS Lua — long-range cruise profile</span></div><div class='term-body'><span class='dim'>Packet Rate</span> .... <span class='ok'>50Hz (900MHz) / 100Hz</span>\n<span class='dim'>Telem Ratio</span> .... <span class='ok'>1:64</span>  <span class='dim'>(more uplink, RSSI/LQ still reported)</span>\n<span class='dim'>Switch Mode</span> .... Hybrid / Wide\n<span class='dim'>TX Power</span> ....... <span class='am'>250mW</span>  <span class='dim'>(Dynamic: ON, max 1W)</span>\n<span class='dim'>Model Match</span> .... <span class='ok'>ON</span>  <span class='dim'>(prevents wrong-model arming)</span></div></div><div class='box tip'><div class='bt'>Higher telem ratio for low rates.</div> At 50Hz, downlink telemetry steals from your control packets. Set a sparse telemetry ratio like 1:64 or 1:128 so most airtime carries your sticks; you still get RSSI/LQ a few times per second, which is all you need to monitor the link.</div><div class='box danger'><div class='bt'>Set and test failsafe first.</div> Before any range push, configure ELRS failsafe to a known state and verify in Betaflight that loss of link triggers your intended failsafe (GPS Rescue / RTH or motors-off). Bench-test with props off by powering down the radio and watching the FC react.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Document and justify an ELRS long-range control config.</p><ol><li>Choose band: 900MHz vs 2.4GHz, and state why for your range goal.</li><li>Pick a packet rate and write the sensitivity/latency tradeoff it represents.</li><li>Set a telemetry ratio appropriate to that rate.</li><li>Choose TX power and decide whether Dynamic Power is on.</li><li>Write one line per setting justifying it against link budget and latency.</li></ol></div></div>"},{"id":"p8-4","part":"08 · Long-Range & HD","nav":"Antennas & Diversity","num":"8.4","kicker":"Part 08 · Lesson 4","title":"Antennas for Range: Omni, Patch, Helical & Diversity","html":"<h3>The antenna is your cheapest range upgrade</h3><p>Antennas convert watts into reach. Because gain costs no battery and no legality headache (within EIRP limits), choosing and aiming antennas well is the single highest-leverage thing a long-range pilot does. The trick is understanding that <strong>gain is not free range in all directions</strong> — gain is achieved by focusing energy into a narrower pattern. A high-gain antenna sees far but only within a cone; a low-gain omni sees everywhere but not as far.</p><h4>The three families</h4><ul><li><strong>Omnidirectional (dipole / monopole)</strong> — radiates roughly equally in all horizontal directions, with nulls straight up and straight down. ~2dBi. This is the stock 'whip'. Pros: no aiming, forgiving of aircraft orientation. Cons: limited range. Use one on the <strong>aircraft</strong> always, and on the ground for short range or when the aircraft moves all around you.</li><li><strong>Patch / panel (directional)</strong> — a flat directional antenna with a beam roughly 60-90 degrees wide and ~8-14dBi gain. Great for pointing down a flight corridor. Pros: big range gain in the beam. Cons: must be aimed; the aircraft is invisible if it flies behind the patch.</li><li><strong>Helical (directional, circularly polarized)</strong> — a corkscrew element with a narrow ~30-50 degree beam and ~10-16dBi gain, with clean circular polarization that resists multipath. The longest reaching ground antenna, but the narrowest beam, demanding accurate aim (often a tracker).</li></ul><h4>Polarization matters</h4><p>Most FPV antennas are <strong>circularly polarized</strong> (RHCP or LHCP). Both ends of a link must match handedness, mismatched RHCP/LHCP costs ~20dB and kills the link. Circular polarization also rejects multipath reflections, important near the ground. Control-link omnis are often linearly polarized; keep the aircraft and ground antenna roughly co-aligned to avoid cross-polarization loss.</p><h4>Diversity receivers: the best of both</h4><p>A <strong>diversity receiver</strong> has two RF inputs and continuously picks the stronger one (or combines them). The standard long-range ground setup is <strong>one omni + one directional</strong> on a diversity RX: the directional reaches far down-range while the omni covers everything around and behind you, so you never get a blind spot when you turn around or fly overhead. On the aircraft, <strong>true diversity</strong> (two antennas at right angles) prevents nulls as the quad rolls and pitches.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>ground antenna coverage (top view)</span></div><div class='term-body'>          <span class='ok'>directional (patch/helical)</span>\n               /‾‾‾‾‾‾‾\\\n              /  narrow  \\   <span class='dim'>--&gt; far down-range</span>\n     <span class='am'>(((((</span>  YOU  <span class='am'>)))))</span>  <span class='am'>omni: 360 deg, near</span>\n              \\         /\n               \\_______/\n  <span class='dim'>diversity RX auto-selects stronger of the two</span></div></div><div class='box tip'><div class='bt'>Point the patch where the action is, not at the launch point.</div> Aim the directional antenna toward the far end of your planned corridor and let the omni handle takeoff, landing, and overhead passes. A common mistake is aiming the patch at your feet and wondering why distant signal is weak.</div><div class='box law'><div class='bt'>High gain can exceed EIRP limits.</div> EIRP = TX power + antenna gain. A legal TX power with a 14dBi patch may exceed your country's EIRP cap. Check the combined figure, especially in the EU 868MHz and 2.4GHz bands, before flying.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Design a diversity ground setup and sketch its coverage.</p><ol><li>Choose one omni (state dBi) and one directional (patch or helical, state dBi and beamwidth).</li><li>Draw a top-down view: the omni's 360-degree near coverage and the directional's beam pointed down your corridor.</li><li>Mark where each antenna 'wins' for the diversity RX (near/overhead vs far down-range).</li><li>Confirm both antennas share the same circular polarization as the aircraft VTX, and check that TX power + max gain stays within legal EIRP.</li></ol></div></div>"},{"id":"p8-5","part":"08 · Long-Range & HD","nav":"HD Digital Systems","num":"8.5","kicker":"Part 08 · Lesson 5","title":"HD Digital FPV Compared: DJI O3/O4, Walksnail, HDZero vs Analog","html":"<h3>Four ways to see what your drone sees</h3><p>The video link is independent of the control link and arguably matters more for range: you can fly blind on a good control link far longer than you can fly with a snowed-out video feed. There are now four serious options, three digital and the old analog standard, and each makes a different tradeoff between image quality, latency, and graceful failure.</p><h4>The contenders</h4><ul><li><strong>DJI O3 / O4 Air Unit</strong> — the image-quality and range champion. Crisp 1080p+ to the goggles, onboard 4K recording, and the longest reliable range of the group (often 10km+ with good antennas). Higher latency than HDZero/analog (~30-45ms), proprietary and locked to DJI goggles, heavier, and pricier. O4 improves latency, weight, and low-light over O3.</li><li><strong>Walksnail Avatar</strong> — DJI-like image quality and onboard recording at lower cost, with a more open accessory ecosystem and small/light VTX options. Range and latency sit between HDZero and DJI. Firmware has matured significantly.</li><li><strong>HDZero</strong> — digital b
