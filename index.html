ng>Choreography to music</strong> — the timeline is synced to an audio track.</li><li><strong>Path planning & collision checks</strong> — software verifies no two drones intersect and that each stays within geofence and battery limits.</li><li><strong>Show drones</strong> — small, GPS/RTK-guided quads with bright RGB LEDs, launched from a grid and flown fully autonomously from a single ground control station.</li><li><strong>Operations crew</strong> — show designer, flight operations lead, safety officer, ground crew for launch/recovery and battery swaps.</li></ol><div class='box danger'><div class='bt'>Swarm safety.</div> Hundreds of aircraft over a crowd demand redundancy: precise RTK positioning, automated geofencing, and a one-button abort that lands the fleet safely. Operating over people requires specific FAA authorization. Reliable LiPo handling and pre-flight checks across the whole fleet are non-negotiable.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Research one public-safety program and one light-show op.</p><ol><li>Find a real public-safety/SAR drone program; list its aircraft, sensors (thermal?), and crew roles.</li><li>Find a real light-show operator; list the drone type, software, and crew roles.</li><li>Note the regulatory authority each operates under (COA/Part 107, operations-over-people waiver).</li><li>Summarize in a short table comparing equipment and roles.</li></ol></div></div>"},{"id":"p10-8","part":"10 · Uses & Money","nav":"Delivery & Emerging","num":"10.8","kicker":"Part 10 · Lesson 8","title":"Delivery & Emerging Markets","html":"<h3>The state of drone delivery</h3><p>Drone delivery has moved from demo to limited commercial reality. The leaders carry small payloads short distances — food, medicine, retail items — and win where speed beats road traffic. Notable operations:</p><table><thead><tr><th>Operator</th><th>Model</th><th>Notes</th></tr></thead><tbody><tr><td>Zipline</td><td>Fixed-wing + droid that lowers package on a tether</td><td>Started with medical/blood delivery in Rwanda; now US retail/health</td></tr><tr><td>Wing (Alphabet)</td><td>Hover-and-winch from a small VTOL</td><td>Suburban food/retail, e.g. parts of the US and Australia</td></tr><tr><td>Amazon Prime Air</td><td>Multirotor, drops in backyard</td><td>Limited markets; slow regulatory ramp</td></tr><tr><td>DroneUp / Flytrex</td><td>Multirotor partnered with retailers</td><td>Suburban grocery/restaurant</td></tr></tbody></table><h3>Why it's hard — the BVLOS wall</h3><p>Economic delivery requires flying <strong>beyond visual line of sight (BVLOS)</strong> — one operator can't deliver at scale while keeping eyes on the aircraft. Standard Part 107 requires visual line of sight, so every meaningful delivery operation needs a <strong>BVLOS waiver or exemption</strong>, which is slow and demanding to obtain.</p><h3>The regulatory hurdles</h3><ul><li><strong>BVLOS authorization</strong> — historically granted case-by-case via Part 107 waivers or Part 135 air-carrier certification (Zipline and Wing hold Part 135 certificates to operate as actual airlines).</li><li><strong>Detect-and-avoid (DAA)</strong> — the aircraft must sense and avoid other traffic without a human watching; regulators require proof.</li><li><strong>UTM / airspace integration</strong> — Unmanned Traffic Management to deconflict many drones in low airspace.</li><li><strong>Remote ID</strong> — broadcast identification is now required and underpins accountability.</li><li><strong>Community acceptance</strong> — noise and privacy concerns shape where operations are allowed.</li></ul><div class='box law'><div class='bt'>Rules are actively changing.</div> The FAA's long-awaited <strong>Part 108</strong> BVLOS rulemaking aims to create a standardized path so operators don't need bespoke waivers. Status and details evolve — always check the current FAA rulemaking and your local aviation authority before assuming what's permitted.</div><h3>Other emerging markets</h3><ul><li><strong>Medical/logistics</strong> — moving lab samples, organs, and pharmacy items between facilities.</li><li><strong>Drone-in-a-box / docking</strong> — autonomous aircraft living in a weatherproof dock for security patrol, DFR, and recurring site monitoring with no pilot on site.</li><li><strong>Counter-UAS and detection</strong> — a growing security market.</li><li><strong>Heavy-lift cargo and agricultural application</strong> — larger payload aircraft.</li></ul><div class='box tip'><div class='bt'>Insight.</div> The opportunity for most small operators isn't running a delivery airline — it's the support ecosystem: docking-site setup, BVLOS waiver consulting, fleet maintenance, and being a certified pilot/ops staff for the companies that hold the certificates.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Summarize the delivery landscape and its barriers.</p><ol><li>Pick two current delivery operations (e.g. Zipline and Wing).</li><li>For each, note payload, delivery mechanism, and where they operate.</li><li>List the regulatory barriers each had to clear (BVLOS authorization, Part 135 vs Part 107 waiver, detect-and-avoid, Remote ID).</li><li>Write one sentence on a realistic way a small operator could participate in this market.</li></ol></div></div>"},{"id":"p10-9","part":"10 · Uses & Money","nav":"How to Make Money","num":"10.9","kicker":"Part 10 · Lesson 9","title":"Making Money: Services, Pricing, Content, Racing & Teaching","html":"<h3>The revenue paths, honestly ranked</h3><table><thead><tr><th>Path</th><th>Money reality</th><th>Best for</th></tr></thead><tbody><tr><td>Services (media, mapping, inspection)</td><td>Most reliable income; B2B pays well</td><td>People who want a real business</td></tr><tr><td>Content / YouTube</td><td>Slow to build; long tail via ads, affiliate, brand deals</td><td>Strong editors with patience</td></tr><tr><td>Racing</td><td>Rarely profitable; prizes + sponsorship are thin</td><td>Passion-driven, builds your brand</td></tr><tr><td>Selling built drones</td><td>Margins thin solo; better as repair/custom builds</td><td>Skilled builders/solderers</td></tr><tr><td>Teaching / Part 107 prep</td><td>High margin; scalable as courses</td><td>People who can explain clearly</td></tr></tbody></table><h3>The biggest pricing mistake</h3><p>Beginners price by \"how long the flight took\" and undercharge to near minimum wage. <strong>You sell a result and assume the business risk</strong> — insurance, gear depreciation, editing time, travel, no-show risk, and the years of skill that let you deliver reliably. Price the whole job.</p><h3>What goes into a real quote</h3><ul><li><strong>On-site time</strong> — drive, setup, flight, teardown (often 3-4× the actual flight time).</li><li><strong>Post-production</strong> — editing/processing is usually the largest time block.</li><li><strong>Gear amortization</strong> — a slice of your aircraft, batteries, cameras, software subscriptions, and computer.</li><li><strong>Travel</strong> — mileage and time.</li><li><strong>Licensing & insurance</strong> — Part 107, liability insurance per job/year, software licenses (Pix4D/DroneDeploy).</li><li><strong>Overhead + profit</strong> — your business doesn't run for free; add margin.</li></ul><h3>Worked example: a real-estate shoot</h3><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>quote — real estate aerials</span></div><div class='term-body'><span class='dim'>Deliverable: 12 edited stills + 45s clip, 48h turnaround</span>\nOn-site (drive+setup+fly+teardown) 2.0 h\nEditing (stills + clip)             2.5 h\nTravel                              25 mi\n<span class='dim'>--- itemized ---</span>\nLabor 4.5 h @ $90/h ............... $405\nTravel 25 mi @ $0.67 .............. $17\nGear/software amortization ........ $30\nLAANC/airspace admin .............. $0 (uncontrolled)\n<span class='ok'>Subtotal ......................... $452</span>\n<span class='dim'>Round to package price</span>\n<span class='ok'>Flat package: $450</span></div></div><p>Note you don't <em>show</em> the client the hourly breakdown — you quote a clean <strong>$450 package</strong>. The breakdown is for <em>you</em>, to be sure the package covers cost plus profit. For mapping or inspection, the same method applies but add processing hours, GCP time, and software seat cost — those jobs price into the four-figure range.</p><div class='box tip'><div class='bt'>Insight.</div> Productize. \"Aerial Listing Package - $450\" closes faster than a custom quote every time, and it stops you negotiating against yourself. Have a Basic / Standard / Premium tier so clients choose how much, not whether.</div><h3>Stacking income streams</h3><p>The pros rarely live on one stream. A media shooter teaches a weekend Part 107 prep course; a racer runs an affiliate-linked YouTube channel; an inspection pilot sells a notion template of their checklists. One skill set, several monetizations.</p><div class='box law'><div class='bt'>Stay legal.</div> All paid flying needs Part 107 and a registered aircraft; carry liability insurance; check airspace (LAANC) for every job. Verify current FAA rules before quoting work you're not yet certified or insured to perform.</div><div class='box danger'><div class='bt'>Pre-flight every paid job.</div> A crash on a client site is a liability event. Run a checklist: props/battery condition, GPS lock, RTH altitude set above obstacles, failsafe configured, airspace clear. Never let the pressure of a paid shoot push you past safe limits or weather.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Price one real job end-to-end and plan a second stream.</p><ol><li>Pick a job (real-estate shoot or a roof/solar inspection).</li><li>Itemize: on-site time, post-production, travel, gear amortization, licensing/insurance.</li><li>Add margin and round to a clean package price you'd quote the client.</li><li>Write one line describing a second income stream you'd add (e.g. teach a Part 107 prep workshop) using the same skills.</li></ol></div></div>"},{"id":"p11-1","part":"11 · Maintenance","nav":"Post-Crash Diagnosis","num":"11.1","kicker":"Part 11 · Lesson 1","title":"Post-Crash Diagnosis: What Broke & Why","html":"<h3>First rule: power down, then think</h3><p>A crash dumps kinetic energy into the cheapest thing that will yield: props first, then arms, then shafts, then wires. Before you touch anything, <strong>disconnect the LiPo</strong>. A crash can short ESC pads, pinch a motor wire against carbon, or crack a capacitor lead. Re-powering a shorted quad turns a $4 motor repair into a fried flight controller and, occasionally, a fire. Sniff the quad: hot electronics and vented LiPo both have a distinct sweet, sharp smell.</p><div class='box danger'><div class='bt'>SAFETY.</div> Disconnect the battery and remove props before any inspection. Inspect the LiPo separately for impact damage or puffing before you ever charge it again (see 11.6).</div><h3>The systematic walk-around</h3><p>Diagnose in the same order every time so nothing gets missed. Energy travels from the point of impact inward, so follow it.</p><ol><li><strong>Props.</strong> Run a fingernail around each blade. Chips, nicks, and hairline cracks cause vibration that the gyro reads as noise. A blade that looks fine can be cracked at the hub. When in doubt, bin it.</li><li><strong>Motors.</strong> Spin each bell by hand. A grinding or gritty feel means dirt or a damaged bearing; a notchy catch means a bent shaft. Wiggle the bell axially and radially. Bent shafts show as a visible wobble when you spin the bell against a fixed point.</li><li><strong>Arms.</strong> Flex each arm gently. Carbon fails by delamination, not bending. Look for white stress lines, a fuzzy frayed edge, or a soft spongy feel. A cracked arm flies once more and then snaps mid-throttle.</li><li><strong>Wiring.</strong> Tug each motor wire near the solder joint. Crashes pull wires; the copper can fracture inside intact insulation. Check the XT60/XT30 leads and the capacitor.</li><li><strong>Stack and FC.</strong> Look for cracked solder joints, lifted pads, a snapped barometer, or a camera/VTX antenna torn loose.</li></ol><h3>Reading the gyro: what likely broke and why</h3><table><thead><tr><th>Symptom on next arm</th><th>Likely cause</th><th>Why</th></tr></thead><tbody><tr><td>One motor stutters / hot</td><td>Bent shaft or dragging bell</td><td>Increased mechanical load; ESC fights it</td></tr><tr><td>Tilts hard on takeoff</td><td>Reversed or dead motor, swapped after repair</td><td>Wrong rotation or no thrust on one corner</td></tr><tr><td>Violent oscillation</td><td>Cracked prop or loose motor screw</td><td>Vibration the filters can't reject</td></tr><tr><td>No video</td><td>Torn VTX antenna / cracked u.FL</td><td>Antenna takes the impact on flips</td></tr><tr><td>Won't arm at all</td><td>Shorted ESC, snapped gyro, lost RX</td><td>Direct impact to the stack</td></tr></tbody></table><div class='box tip'><div class='bt'>Insight.</div> A bent shaft is the single most common hidden crash injury on 5-inch quads. Always spin every bell by hand before you celebrate that \"it survived.\"</div><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>crash-triage checklist</span></div><div class='term-body'><span class='dim'># power OFF, props OFF, then:</span>\n1. smell test ............ <span class='ok'>no hot/sweet odor</span>\n2. 4x props .............. nick/crack -> replace\n3. 4x bells by hand ...... <span class='bad'>grind/wobble = shaft</span>\n4. 4x arms flex .......... white lines = delam\n5. tug motor wires ....... broken strands\n6. stack visual .......... lifted pads, caps\n7. antennas .............. VTX + RX intact</div></div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Produce a prioritized damage report for a crashed quad (or photos of one).</p><ol><li>Power off, remove props, and run the 7-step triage above.</li><li>List every issue you find with a likely cause for each.</li><li>Rank them: <strong>flight-blocking</strong> (cracked arm, bent shaft) vs <strong>cosmetic</strong> (scuffed canopy).</li><li>Decide go / no-go and the order of repairs before next power-up.</li></ol></div></div>"},{"id":"p11-2","part":"11 · Maintenance","nav":"Soldering Repairs","num":"11.2","kicker":"Part 11 · Lesson 2","title":"Soldering Repairs: Motors, Props, Arms & Antennas","html":"<h3>The right iron and the right heat</h3><p>Most failed FPV repairs are cold joints from an underpowered iron. Use a temperature-controlled iron of at least 60W (a TS100/TS101 or Pinecil at 80W is the hobby standard) with a chisel/bevel tip, not a pencil tip. Set <strong>~350-370 C</strong> for general work and bump to <strong>380-400 C</strong> for thick battery pads and ground planes that sink heat. Use leaded <code>63/37</code> rosin-core solder if legal where you are; it flows easier and is far more forgiving than lead-free for beginners. A tub of <strong>no-clean flux</strong> is the secret to clean joints.</p><div class='box tip'><div class='bt'>Insight.</div> A good joint is shiny and concave, wetting both surfaces. A dull, blobby, or ball-shaped joint is cold. Re-flow it with flux, don't pile on more solder.</div><h3>Technique that always works</h3><ol><li><strong>Tin both sides first.</strong> Pre-tin the pad and the wire end separately. Then bring them together and heat until the two pools merge.</li><li><strong>Heat the joint, feed solder to the joint</strong> - never melt solder on the iron and wipe it on.</li><li><strong>3-second rule.</strong> If a joint isn't flowing in ~3 seconds, your iron is too cold or too small. Stop before you cook the pad off the board (a lifted pad is a real repair, not a cosmetic one).</li><li>Keep the tip tinned and wipe it on brass wool between joints.</li></ol><h3>Replacing a motor</h3><p>Note the wire order before you desolder (photograph it). Motor wire order does not set direction on bidirectional DShot/BLHeli_S/AM32 ESCs - you fix rotation in software - but keeping it tidy avoids confusion. Desolder the three pads, route the new motor's wires the same way, trim to length, tin, and solder. Then set rotation in Betaflight's Motors tab or via your ESC's motor-direction option. Spin-test at low throttle <strong>props off</strong> and confirm direction with a slip of paper or by watching the bell.</p><div class='box danger'><div class='bt'>SAFETY.</div> Props OFF for every bench spin-up. Before power-up after any solder work, inspect for solder bridges between adjacent pads and beep out battery + and - with a multimeter in continuity mode. A bridge across the battery pads is an instant dead short.</div><h3>Arms, props, and antennas</h3><ul><li><strong>Arms:</strong> on a unibody frame, replace the whole bottom plate; on a replaceable-arm frame, swap just the arm. Torque arm bolts to snug, then add a dab of medium (blue) threadlocker on the nut, not the carbon.</li><li><strong>Props:</strong> match size, pitch, and rotation exactly; balance isn't worth chasing on modern quads, but matched sets are. Torque prop nuts firmly - a thrown prop in flight is a missile.</li><li><strong>Antennas:</strong> VTX antennas die most. If the u.FL/IPEX connector survived, just clip on a new antenna. If the pigtail tore off the board, resolder the u.FL or fit an MMCX-pigtail VTX next time - far more crash-durable. Never power a VTX without an antenna: you can cook the PA.</li></ul><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>motor swap - direction set (CLI)</span></div><div class='term-body'><span class='dim'># after resolder, props OFF, on bench:</span>\nset motor_pwm_protocol = DSHOT600\nsave\n<span class='dim'># Betaflight Motors tab: enable, spin one</span>\n<span class='dim'># wrong way? toggle direction:</span>\n<span class='am'>Configure ESC -> Motor Direction Reversed</span>\n<span class='ok'># confirm all 4 spin inward-top per layout</span></div></div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Replace one motor (or practice a full desolder/resolder on a bench motor).</p><ol><li>Photograph wire routing, then desolder the three motor pads.</li><li>Tin pads and new wires separately; reflow to join. Aim for shiny concave joints.</li><li>Multimeter-check for bridges; beep out battery +/-.</li><li>Bench-spin props OFF, set correct rotation in software, confirm a clean joint.</li></ol></div></div>"},{"id":"p11-3","part":"11 · Maintenance","nav":"Diagnosing Faults I","num":"11.3","kicker":"Part 11 · Lesson 3","title":"Diagnosing Common Faults: No Video & Won't Arm","html":"<h3>Diagnose like a binary search</h3><p>Every fault has a chain from input to output. Don't guess - test the midpoint, decide which half is broken, and split again. This finds root cause in minutes instead of replacing parts at random.</p><h3>No video</h3><p>The chain is: <strong>camera -> VTX -> antenna -> air -> goggle antenna -> goggle RX</strong>. Work it end to end.</p><ol><li><strong>Confirm the VTX is powered and not in pit mode.</strong> Many VTXs boot in 0 mW pit mode. Check the LED and the OSD. A VTX with no antenna may have damaged its PA - this is why \"no video\" sometimes follows a crash that tore the antenna.</li><li><strong>Channel/band match.</strong> Goggles and VTX must share band and channel (e.g. Raceband R1 = 5658 MHz). One digit off = static.</li><li><strong>Analog vs digital.</strong> On digital (DJI/HDZero/Walksnail) a no-video is usually a loose camera coax, an unbound/unpaired air unit, or overheating shutdown - feel if the air unit is scalding.</li><li><strong>Camera vs VTX.</strong> Blue/black screen with a clean OSD = camera dead or unplugged; OSD also gone = VTX or its feed. Swap the camera or VTX to isolate.</li><li><strong>Antenna.</strong> Cracked u.FL or a snapped element drops range to a few feet. Wiggle-test while watching for breakup.</li></ol><div class='box danger'><div class='bt'>SAFETY.</div> Never bench-test a VTX without its antenna fitted. Running a VTX antenna-less reflects RF power back into the amplifier and can permanently kill it.</div><h3>Won't arm</h3><p>Betaflight refuses to arm and tells you why. Read the <strong>arming flags</strong> in the OSD (\"arming disabled\" with a reason) or type <code>status</code> in the CLI. Decode the flag instead of guessing.</p><table><thead><tr><th>Arming flag</th><th>Meaning</th><th>Fix</th></tr></thead><tbody><tr><td>NOGYRO</td><td>Gyro not detected</td><td>Cracked gyro / loose stack solder; reflash, reseat, replace FC</td></tr><tr><td>RXLOSS</td><td>No valid RC link</td><td>Bind RX, check UART/protocol, power the TX</td></tr><tr><td>THROTTLE</td><td>Throttle not at min</td><td>Lower stick; recalibrate endpoints</td></tr><tr><td>ANGLE / CRASH</td><td>Quad not level / crash-recovery latch</td><td>Place flat; re-level the quad</td></tr><tr><td>BOXFAILSAFE</td><td>Failsafe switch active</td><td>Clear the assigned switch</td></tr><tr><td>CALIB</td><td>Sensors calibrating</td><td>Hold still on power-up</td></tr><tr><td>ARMSWITCH</td><td>Arm switch was on at boot</td><td>Toggle arm off then on</td></tr></tbody></table><div class='box tip'><div class='bt'>Insight.</div> 90% of \"won't arm\" reports are RXLOSS (link/protocol mismatch), throttle not at minimum, or the arm switch being on at boot. Check those three before suspecting hardware.</div><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>betaflight CLI - status</span></div><div class='term-body'># status\nMCU ... GYRO detected\nArming disable flags: <span class='bad'>RXLOSS THROTTLE</span>\n<span class='dim'># two reasons - fix both:</span>\n<span class='am'>RXLOSS</span> -> rx link down, rebind / check serialrx_provider\n<span class='am'>THROTTLE</span> -> throttle channel above min, recalibrate</div></div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Work a no-video and a won't-arm fault tree to resolution.</p><ol><li>Induce or imagine each fault on your build (or a written scenario).</li><li>For no-video, walk camera->VTX->antenna->goggle and note where signal is lost.</li><li>For won't-arm, read the arming flags via OSD or <code>status</code> and decode each.</li><li>Document every step and the confirmed root cause and fix.</li></ol></div></div>"},{"id":"p11-4","part":"11 · Maintenance","nav":"Diagnosing Faults II","num":"11.4","kicker":"Part 11 · Lesson 4","title":"Diagnosing Motor Desync & Oscillations","html":"<h3>Three failures that feel similar in the air</h3><p>Desync, oscillation, and mechanical noise all show as the quad misbehaving, but they have different fingerprints. Learn to tell them apart from the symptom and you skip hours of random tuning.</p><h3>Motor desync</h3><p>Desync is the ESC losing track of where the rotor is, so it stops commutating - the motor cuts out, sometimes with a distinct <em>brrrap</em> grind, then catches again or the quad flips. It typically happens on <strong>fast throttle changes</strong>: hard punch-outs or sudden chops, especially low-RPM-to-high transitions.</p><ul><li><strong>Causes:</strong> ESC firmware/timing mismatch, motor too low-Kv-for-protocol edge cases, demag/timing set wrong, a damaged ESC FET, or motor bell rubbing.</li><li><strong>Fixes:</strong> on BLHeli_S/AM32/Bluejay set <strong>timing to medium-high or high</strong> and try a higher PWM frequency (e.g. 48 kHz on Bluejay), enable/keep <strong>bidirectional DShot</strong> and RPM filtering, update ESC firmware, and lower <strong>motor_output_limit</strong> while you test. Confirm the bell spins freely first.</li></ul><h3>Oscillations</h3><p>Oscillation is the control loop fighting itself: a buzz, a hot motor, or visible shaking. Two flavors:</p><ul><li><strong>High-frequency hot motors / coil whine:</strong> too much <strong>D-gain</strong> or insufficient filtering. Motors get hot on a hover with no aggressive flying. Lower D, check gyro/D-term filtering, ensure RPM filter is working.</li><li><strong>Low-frequency wobble (slow bounce):</strong> too much <strong>P</strong> relative to D, or a propwash-handling problem. Tune the PD ratio; modern Betaflight presets help.</li></ul><div class='box tip'><div class='bt'>Insight.</div> Hot motors after a gentle flight = oscillation/filtering, not a weak motor. Touch each motor right after landing: anything too hot to hold comfortably (well above ~50 C) is being driven by oscillation.</div><h3>Mechanical noise vs the rest</h3><p>The gyro can't tell vibration from real movement. A cracked prop, a loose motor screw, a bent shaft, or a soft mount feeds garbage into the loop, which the PID then amplifies. Before touching the tune, eliminate mechanical sources. Use the Betaflight <strong>Blackbox + spectrum/PSD viewer</strong>: a sharp peak that tracks motor RPM is mechanical; broadband noise points at filtering/tune.</p><table><thead><tr><th>Symptom</th><th>Most likely</th><th>First fix</th></tr></thead><tbody><tr><td>Cutout / flip on punch-out</td><td>Desync</td><td>ESC timing high, update FW, bidir DShot</td></tr><tr><td>Hot motors on a calm hover</td><td>HF oscillation</td><td>Lower D, verify filters/RPM filter</td></tr><tr><td>Slow bounce in turns</td><td>LF oscillation</td><td>Adjust P:D ratio</td></tr><tr><td>One corner vibrates / RPM-tracking peak</td><td>Mechanical</td><td>Replace prop, tighten/replace motor, check shaft</td></tr></tbody></table><div class='box danger'><div class='bt'>SAFETY.</div> Always diagnose with props removed unless you are deliberately doing a tethered/secured throttle test. A desync that flips a quad on the bench with props on can lacerate you.</div><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>anti-desync ESC settings (Bluejay)</span></div><div class='term-body'>Motor Timing ......... <span class='ok'>22-24 (med-high)</span>\nPWM Frequency ........ 48 kHz\nDemag Compensation ... High\nBidirectional DShot .. <span class='ok'>ON</span>  <span class='dim'>(RPM filter)</span>\n<span class='dim'>Betaflight: motor_output_limit = 80 while testing</span></div></div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Match described symptoms to desync vs oscillation vs mechanical and propose a fix.</p><ol><li>Take 3-4 symptoms (recorded clips, Blackbox logs, or written descriptions).</li><li>Classify each using the table above.</li><li>For mechanical, name the part to replace; for tune/ESC, name the exact setting to change.</li><li>If you have a quad, verify one fix props-off and re-test.</li></ol></div></div>"},{"id":"p11-5","part":"11 · Maintenance","nav":"LiPo Care","num":"11.5","kicker":"Part 11 · Lesson 5","title":"LiPo Care: Charging, Storage Voltage & Balancing","html":"<h3>The voltage map of a cell</h3><p>Every LiPo decision comes back to <strong>per-cell voltage</strong>. Memorize these and you'll double pack lifespan.</p><table><thead><tr><th>State</th><th>Volts/cell</th><th>6S pack</th></tr></thead><tbody><tr><td>Full charge</td><td>4.20 V</td><td>25.2 V</td></tr><tr><td>Storage</td><td>3.80-3.85 V</td><td>~22.9 V</td></tr><tr><td>Land by</td><td>3.5 V resting</td><td>21.0 V</td></tr><tr><td>Damage zone</td><td>below 3.0 V</td><td>below 18.0 V</td></tr></tbody></table><h3>Charging correctly</h3><p>Charge in <strong>balance mode</strong> through the balance lead, not just the main lead. The charger then equalizes all cells to within a few millivolts. Default charge rate is <strong>1C</strong> (a 1300mAh pack = 1.3A); modern high-C race packs tolerate 2-3C but every charge above 1C costs cycle life and adds heat. Set the charger's cell count manually and confirm it matches the pack before starting - a wrong cell count is a classic fire cause.</p><div class='box danger'><div class='bt'>SAFETY.</div> Never charge unattended. Charge inside a fire-safe LiPo bag or ammo can, on a non-flammable surface, away from anything that burns. Never charge a pack that is warm from flight, puffed, or physically damaged. Let packs cool to room temperature first.</div><h3>Storage voltage - the single biggest longevity lever</h3><p>A LiPo left at 4.2V degrades fast; left flat below 3.0V it may be permanently damaged. <strong>Store at 3.80-3.85V/cell.</strong> If a pack won't fly within ~2-3 days, storage-charge (or storage-discharge) it. Most chargers have a one-button STORAGE mode that charges or bleeds the pack to ~3.8V/cell automatically. A pack stored properly at room temperature loses very little capacity over months.</p><h3>Reading pack health from the balance numbers</h3><p>After a flight, check the per-cell voltages on the charger or a cell checker. A healthy pack lands with cells within <strong>~0.03V</strong> of each other. Watch for:</p><ul><li><strong>Drift:</strong> one cell consistently 0.05-0.1V lower than the rest = that cell is aging or damaged. The pack will sag and trip your low-voltage cutoff early.</li><li><strong>Hard sag:</strong> voltage that recovers a lot after landing (e.g. lands at 3.4V, rests at 3.8V) means high internal resistance - an old or tired pack.</li><li><strong>IR readings:</strong> chargers like the ISDT/iCharger show per-cell internal resistance. A cell reading much higher mOhm than its siblings is failing; retire the pack.</li></ul><div class='box tip'><div class='bt'>Insight.</div> Treat storage voltage like flossing: boring, easy to skip, and the thing that actually determines whether your $30 pack lasts 50 cycles or 300. Storage-charge the moment a flying session ends if you won't fly again soon.</div><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>charger - storage charge a 6S pack</span></div><div class='term-body'>Program: LiPo STORAGE\nCells: 6S  (confirm = pack label)\nCurrent: 1.0C\nTarget: 3.80 V/cell\n<span class='dim'>start -></span> charges/bleeds to ~22.9V\n<span class='ok'>cells: 3.81 3.80 3.81 3.80 3.82 3.80</span>  balanced\n<span class='bad'>cells: 3.81 3.80 3.72 3.80 3.81 3.80</span>  <span class='am'>cell 3 drifting</span></div></div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Storage-charge a LiPo and log its balance.</p><ol><li>Confirm cell count, set charger to STORAGE at 1C, balance lead connected, in a fire-safe bag.</li><li>Run to ~3.80V/cell.</li><li>Record each cell's voltage (and IR if available).</li><li>Flag any cell drifting more than ~0.05V and note it for retirement watch.</li></ol></div></div>"},{"id":"p11-6","part":"11 · Maintenance","nav":"LiPo Safety & Disposal","num":"11.6","kicker":"Part 11 · Lesson 6","title":"LiPo Safety: Swelling, Fire & Safe Disposal","html":"<h3>What swelling means</h3><p>A puffed or swollen LiPo has generated internal gas from electrolyte breakdown - the chemistry has begun to fail and the cell is unstable. A pack that has even slight rounding of its flat faces is on a one-way trip. <strong>A swollen pack is retired immediately.</strong> It will not get better, it will get worse, and a stressed cell can go into thermal runaway and ignite without warning.</p><div class='box danger'><div class='bt'>SAFETY.</div> Causes of a fire: over-charge, over-discharge below 3.0V/cell, physical/puncture damage, charging a warm pack, wrong cell-count on the charger, and internal shorts from crash impact. A LiPo fire is self-sustaining (the pack carries its own oxidizer) - you cannot smother it like a normal fire.</div><h3>Inspecting your fleet</h3><ul><li><strong>Puffing:</strong> lay each pack on a flat surface; it should sit flat and rock-free. Any bulge = retire.</li><li><strong>Casing:</strong> torn shrink wrap, dented cells, or exposed foil = retire.</li><li><strong>Leads/connectors:</strong> frayed wire, scorched XT60, wobbly balance plug = repair or retire.</li><li><strong>Behavior:</strong> abnormal heat after charge/flight, fast self-discharge, or a cell that won't balance = retire.</li></ul><h3>Fire-safe storage and handling</h3><p>Store packs at 3.8V/cell, at room temperature, in a non-flammable container kept away from living space and exits. Good options, in rough order of protection: a metal <strong>ammo can</strong> (lid cracked, not sealed, so pressure can vent), a steel cabinet, or a dedicated fireproof LiPo safe. Avoid stacking heavy items on packs. Keep a Class D-rated extinguisher or a large bucket of dry sand nearby; in practice, the realistic plan for a small pack fire is to move it (with tongs, if safe) onto a non-flammable surface outdoors and let it burn out, while protecting yourself from the toxic smoke.</p><h3>Discharge and disposal</h3><p>Before disposal a pack must be fully discharged. Two accepted methods:</p><ol><li><strong>Charger discharge:</strong> use the charger's discharge function to bring cells down to ~0V where supported.</li><li><strong>Salt-water bath:</strong> submerge the pack in a bucket of heavily salted water for several days (this is the classic hobby method to drain residual charge through the leads). Do this outdoors in a non-metallic bucket, expect gassing, then check the leads read ~0V before handling.</li></ol><p>Once discharged, <strong>do not put LiPos in household trash or regular recycling.</strong> Take them to a battery-recycling drop-off: Call2Recycle locations, many hobby shops, big-box electronics retailers, and household hazardous-waste facilities accept them. Tape over the terminals before transport.</p><div class='box law'><div class='bt'>Rule.</div> Disposal and transport rules vary by location, and air-travel rules (carry-on only, terminal protection, watt-hour limits) are set by your airline and aviation authority. Verify current local hazardous-waste and your carrier's battery rules before transporting or shipping packs.</div><div class='box tip'><div class='bt'>Insight.</div> Label retired packs the moment you condemn them (\"DEAD - DISCARD\") and physically separate them from your flight bag. Most LiPo fires come from a packed-with-good-ones reject that someone charged by mistake.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Audit your fleet and build a fire-safe storage solution.</p><ol><li>Lay every pack flat; flag any puffing, casing, or lead damage; retire and label the rejects.</li><li>Set up a non-flammable storage container (ammo can / LiPo safe) for the keepers at 3.8V/cell.</li><li>Salt-water or charger-discharge one retired pack to ~0V.</li><li>Find and write down a local battery recycling/drop-off option.</li></ol></div></div>"},{"id":"p11-7","part":"11 · Maintenance","nav":"Firmware Maintenance","num":"11.7","kicker":"Part 11 · Lesson 7","title":"Firmware Updates, Upkeep & Sensible Upgrades","html":"<h3>Update on purpose, not on impulse</h3><p>A firmware update can fix a real bug or wipe a tune you spent a season dialing in. Update when there's a reason: a security/safety fix, a feature you need, or new hardware support - not just because a new version exists. The week before a big event is the worst time to flash.</p><h3>The safe update routine</h3><ol><li><strong>Back up everything first.</strong> In the Betaflight CLI type <code>diff all</code> (or <code>dump all</code>) and save the output to a text file. This is your full config and your insurance policy.</li><li><strong>Read the changelog and migration notes.</strong> Major versions (e.g. 4.4 -> 4.5) can rename or drop settings, so a blind paste of an old <code>diff</code> won't fully restore.</li><li><strong>Flash with \"Full chip erase\" on a major upgrade</strong> to avoid leftover corrupt settings; keep target and build options matched to your board.</li><li><strong>Restore selectively.</strong> Re-apply your rates, filters, and tune by hand or via a reviewed <code>diff</code>, watching for warnings about unknown commands.</li><li><strong>Re-verify the safety-critical items every time</strong> (next section).</li></ol><div class='box danger'><div class='bt'>SAFETY.</div> After any firmware update, re-verify failsafe and flight modes before flying. Stick endpoints, arm switch, motor directions, and especially failsafe stage 2 (drop/land) can reset to defaults. Do a props-off bench test, then a confirmed failsafe test (power off the TX and watch the motors stop), then a low hover.</div><h3>Routine upkeep beyond firmware</h3><ul><li>Keep your <strong>radio/ELRS TX and RX on matching firmware</strong> - a version mismatch can break binding.</li><li>Re-calibrate the <strong>accelerometer</strong> after a hard crash or board reflash.</li><li>Periodically re-flash <strong>ESC firmware</strong> (Bluejay/AM32) when desync or efficiency fixes land.</li><li>Keep a per-quad <strong>config folder</strong> with the latest <code>diff all</code> so any board swap is a 2-minute restore.</li></ul><h3>Sensible upgrades</h3><p>Spend where it changes outcomes, not where it looks cool. Good value upgrades:</p><table><thead><tr><th>Upgrade</th><th>Benefit</th><th>Worth it when</th></tr></thead><tbody><tr><td>ELRS RX (from older protocol)</td><td>Range, latency, link reliability</td><td>Range failsafes or twitchy link</td></tr><tr><td>Digital FPV / better VTX antenna</td><td>Clearer feed, fewer crashes from breakup</td><td>Analog static is causing crashes</td></tr><tr><td>Higher-quality props</td><td>Less vibration, cleaner tune</td><td>Hot motors / noisy gyro traces</td></tr><tr><td>GPS module + rescue</td><td>Return-to-home safety net</td><td>Flying long range / over LOS edge</td></tr><tr><td>Better LiPos / more packs</td><td>More flight time per session</td><td>Old packs sag early</td></tr></tbody></table><div class='box tip'><div class='bt'>Insight.</div> The highest-ROI \"upgrade\" is usually fresh props and a healthy battery, not a new flight controller. Fix the thing that's actually limiting you.</div><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>betaflight CLI - backup before flashing</span></div><div class='term-body'># diff all\n<span class='dim'># ...copy ALL output to quadname_4.5_backup.txt...</span>\n<span class='ok'># now flash; after reboot, re-verify:</span>\n# get failsafe\n# status   <span class='dim'>(check arming flags, modes)</span>\n<span class='am'># TX off -> motors must stop (failsafe test)</span></div></div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Back up your config and document a safe update routine.</p><ol><li>Run <code>diff all</code> and save the output to a dated, named file.</li><li>Write your step-by-step update routine, including the post-update failsafe and modes re-check.</li><li>Pick one justified upgrade for your setup and write the expected benefit and the trigger that makes it worth it.</li></ol></div></div>"},{"id":"p11-8","part":"11 · Maintenance","nav":"Maintenance Checklist","num":"11.8","kicker":"Part 11 · Lesson 8","title":"The Pre/Post-Flight Maintenance Checklist","html":"<h3>Why a checklist beats experience</h3><p>Even experienced pilots crash from things a 60-second check would have caught: a loose prop nut, a cracked arm from yesterday, a battery strap fraying. A written, repeatable checklist removes \"I think I checked that\" from the equation. Pilots and aviation use checklists for exactly this reason - the goal is to make the right check happen <strong>every single time</strong>, not just when you remember.</p><h3>Pre-flight (every flight)</h3><ol><li><strong>Props:</strong> correct rotation per corner, no nicks/cracks, nuts tight. A thrown prop is the #1 injury cause - check this first.</li><li><strong>Frame & arms:</strong> flex each arm, check for white stress lines; verify standoffs and stack screws are snug.</li><li><strong>Motors:</strong> spin each by hand - smooth, no grind; motor screws not backed out (they hit the windings if too long/loose).</li><li><strong>Battery:</strong> not puffed, fully charged, strap good and tight; lead and connector intact.</li><li><strong>Antennas:</strong> VTX and RX antennas present and undamaged. Never power a VTX antenna-less.</li><li><strong>Link & modes:</strong> RX bound, arm switch off, modes correct, failsafe configured.</li><li><strong>Surroundings:</strong> people, airspace, and a clear arm/launch area.</li></ol><div class='box danger'><div class='bt'>SAFETY.</div> Prop, frame, and battery checks happen on every flight without exception. Arm only when the quad is pointed away from people and you have called it clear. Disarm before anyone approaches the quad.</div><h3>Post-flight (every flight)</h3><ol><li><strong>Battery voltage:</strong> read resting per-cell. Landed below 3.5V/cell? You're flying too long - shorten the timer.</li><li><strong>Motor temps:</strong> touch each motor. Too hot to hold = oscillation/filtering issue to fix before next session (see 11.4).</li><li><strong>Damage scan:</strong> any contact/crash this session? Re-run the post-crash triage from 11.1.</li><li><strong>Storage charge:</strong> if done flying for a while, storage-charge packs to 3.8V/cell.</li><li><strong>Log it:</strong> note anything off so it gets fixed at the bench, not rediscovered in the air.</li></ol><div class='box tip'><div class='bt'>Insight.</div> The post-flight battery and motor-temp check is your early-warning system. A pack that lands hot or a motor that runs hot is telling you about a failure before it becomes a crash.</div><table><thead><tr><th>When</th><th>Catches</th></tr></thead><tbody><tr><td>Pre-flight props/nuts</td><td>Thrown prop, desync from loose screw</td></tr><tr><td>Pre-flight arm flex</td><td>Cracked carbon snapping mid-flight</td></tr><tr><td>Pre-flight failsafe/modes</td><td>Flyaway, arming surprises</td></tr><tr><td>Post-flight cell voltage</td><td>Over-discharge damage, tired packs</td></tr><tr><td>Post-flight motor temp</td><td>Oscillation / filtering problems early</td></tr></tbody></table><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>pocket checklist (laminate this)</span></div><div class='term-body'><span class='ok'>PRE:</span> props ok+tight | arms ok | motors spin | batt ok+strapped | antennas on | bound/modes/failsafe | area clear\n<span class='am'>ARM</span> only pointed away, called clear\n<span class='ok'>POST:</span> cell V >=3.5 | motors cool | damage scan | storage-charge | log issues</div></div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Build, laminate, and run your own pre/post-flight checklist.</p><ol><li>Write your pre-flight and post-flight items, tailored to your quad and field.</li><li>Print and laminate it (or put it in your phone) so it travels in the flight bag.</li><li>Run it through one full flight cycle.</li><li>Log anything it caught and refine the list.</li></ol></div></div>"}];
/* ===== RENDER ENGINE ===== */
const nav=document.getElementById('nav');
const content=document.getElementById('content');
const crumbPath=document.getElementById('crumbPath');
const pfill=document.getElementById('pfill');
const pctTxt=document.getElementById('pctTxt');
const completed=new Set();
let current=0;
let lastPart=null;
L.forEach((les,i)=>{
  if(les.part!==lastPart){
    const lab=document.createElement('span');lab.className='part-label';lab.textContent=les.part;nav.appendChild(lab);lastPart=les.part;
  }
  const b=document.createElement('button');
  b.className='nav-item';b.dataset.i=i;
  b.innerHTML=`<span class="num">${les.num||'»'}</span><span class="ntxt">${les.nav}</span><span class="done">✓</span>`;
  b.addEventListener('click',()=>{go(i);closeSidebar();});
  nav.appendChild(b);
});
function updateNav(){
  document.querySelectorAll('.nav-item').forEach(el=>{
    const i=+el.dataset.i;
    el.classList.toggle('active',i===current);
    el.classList.toggle('completed',completed.has(i));
  });
}
function updateProgress(){
  const total=L.filter(x=>!x.cover).length;
  const doneCount=[...completed].filter(i=>!L[i].cover).length;
  const pct=Math.round(doneCount/total*100);
  pfill.style.width=pct+'%';pctTxt.textContent=pct+'%';
}
function go(i){
  current=i;const les=L[i];
  crumbPath.textContent=les.num?`./module-${les.num}`:'./start';
  let foot=`<div class="lesson-foot">`;
  foot+=i>0?`<button class="btn ghost" onclick="go(${i-1})">← prev</button>`:`<span></span>`;
  if(!les.cover){
    const mark=completed.has(i);
    foot+=`<button class="btn" id="markBtn" onclick="toggleDone(${i})">${mark?'✓ completed — click to undo':'mark lesson complete'}</button>`;
  } else {foot+=`<span></span>`;}
  foot+=i<L.length-1?`<button class="btn primary" onclick="go(${i+1})">next →</button>`:`<span></span>`;
  foot+=`</div>`;
  const head=les.cover?'':`<span class="lesson-kicker">${les.kicker}</span><h2 class="lesson-title">${les.title}</h2>`;
  content.innerHTML=head+les.html+foot;
  window.scrollTo({top:0,behavior:'smooth'});
  updateNav();
}
function toggleDone(i){
  if(completed.has(i))completed.delete(i);else completed.add(i);
  updateProgress();updateNav();
  const btn=document.getElementById('markBtn');
  if(btn)btn.textContent=completed.has(i)?'✓ completed — click to undo':'mark lesson complete';
}
window.go=go;window.toggleDone=toggleDone;
const sidebar=document.getElementById('sidebar');
const scrim=document.getElementById('scrim');
document.getElementById('menuBtn').addEventListener('click',()=>{sidebar.classList.toggle('open');scrim.classList.toggle('show');});
scrim.addEventListener('click',closeSidebar);
function closeSidebar(){sidebar.classList.remove('open');scrim.classList.remove('show');}
go(0);updateProgress();
</script>
