<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ultimate Drone Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:ital,wght@0,400;0,700;0,800;1,400&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05090f;--bg-2:#080e17;--panel:#0a121e;--panel-2:#0e1a2b;--grid:#15263c;
    --ink:#cfe0ee;--ink-dim:#7d96ac;--ink-faint:#485d72;
    --green:#22d3ee;--green-bright:#67e8ff;--amber:#ffb000;--red:#ff5d5d;--cyan:#22d3ee;--violet:#7aa0ff;
    --border:#1b2e44;--border-soft:#142233;
    --shadow:0 0 0 1px rgba(34,211,238,.07), 0 24px 60px -28px rgba(0,0,0,.92);
    --mono:'JetBrains Mono',monospace;--body:'IBM Plex Mono',monospace;--crt:'VT323',monospace;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.72;-webkit-font-smoothing:antialiased;}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:9998;background:repeating-linear-gradient(0deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.18) 3px, rgba(0,0,0,0) 4px);mix-blend-mode:overlay;opacity:.5;}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;background:radial-gradient(ellipse at 50% 0%, rgba(94,243,140,.05), transparent 60%),radial-gradient(ellipse at 100% 100%, rgba(0,0,0,.6), transparent 55%);}
  ::selection{background:var(--green);color:#04130a;}
  .shell{display:grid;grid-template-columns:320px 1fr;min-height:100vh;}
  aside{position:sticky;top:0;height:100vh;overflow-y:auto;background:linear-gradient(180deg,var(--bg-2),var(--bg));border-right:1px solid var(--border);padding:0 0 60px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
  aside::-webkit-scrollbar{width:8px;}
  aside::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
  .brand{padding:26px 24px 18px;border-bottom:1px solid var(--border-soft);position:sticky;top:0;background:linear-gradient(180deg,var(--bg-2),rgba(10,17,12,.96));backdrop-filter:blur(6px);z-index:5;}
  .brand .tag{font-family:var(--mono);font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--green);opacity:.8;}
  .brand h1{font-family:var(--crt);font-weight:400;font-size:38px;line-height:.92;margin:6px 0 2px;color:var(--green-bright);text-shadow:0 0 18px rgba(94,243,140,.35);letter-spacing:.02em;}
  .brand .sub{font-size:11px;color:var(--ink-dim);letter-spacing:.04em;}
  .progress-wrap{margin-top:14px;}
  .progress-meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--ink-dim);letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px;}
  .progress-bar{height:5px;background:var(--grid);border-radius:99px;overflow:hidden;border:1px solid var(--border-soft);}
  .progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--cyan));transition:width .4s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px rgba(94,243,140,.6);}
  nav{padding:14px 12px 0;}
  .part-label{font-family:var(--mono);font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-faint);padding:18px 12px 7px;display:block;}
  .nav-item{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:none;cursor:pointer;color:var(--ink-dim);font-family:var(--body);font-size:13.5px;padding:8px 12px;border-radius:7px;line-height:1.4;transition:.16s;border:1px solid transparent;}
  .nav-item:hover{background:var(--panel);color:var(--ink);}
  .nav-item.active{background:var(--panel-2);color:var(--green-bright);border-color:var(--border);box-shadow:inset 2px 0 0 var(--green);}
  .nav-item .num{font-family:var(--mono);font-size:11px;color:var(--green);opacity:.7;min-width:30px;}
  .nav-item.active .num{opacity:1;}
  .nav-item .done{margin-left:auto;color:var(--green);font-size:12px;opacity:0;transition:.2s;}
  .nav-item.completed .done{opacity:1;}
  .nav-item.completed{color:var(--ink-faint);}
  main{padding:0;max-width:980px;}
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:14px 40px;background:rgba(7,11,8,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--border-soft);}
  .crumbs{font-family:var(--mono);font-size:11px;color:var(--ink-dim);letter-spacing:.05em;}
  .crumbs b{color:var(--green);font-weight:700;}
  .blink{animation:blink 1.1s steps(1) infinite;color:var(--green);}
  @keyframes blink{50%{opacity:0;}}
  .content{padding:46px 56px 120px;animation:fade .45s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .lesson-kicker{font-family:var(--mono);font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--amber);}
  h2.lesson-title{font-family:var(--mono);font-weight:800;font-size:30px;line-height:1.12;margin:8px 0 6px;color:#eaf6ee;letter-spacing:-.01em;}
  .lede{font-size:16px;color:#cfe6d8;border-left:2px solid var(--green);padding-left:16px;margin:18px 0 30px;}
  h3{font-family:var(--mono);font-weight:700;font-size:18px;color:var(--green-bright);margin:34px 0 10px;letter-spacing:.01em;}
  h3::before{content:"▸ ";color:var(--green);opacity:.7;}
  h4{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--cyan);margin:22px 0 6px;letter-spacing:.04em;text-transform:uppercase;}
  p{margin:12px 0;}
  a{color:var(--cyan);text-decoration:none;border-bottom:1px dotted var(--cyan);}
  a:hover{color:var(--green-bright);border-color:var(--green-bright);}
  strong{color:#e6f4ec;font-weight:600;}
  em{color:var(--amber);font-style:normal;}
  ul,ol{margin:12px 0;padding-left:22px;}
  li{margin:7px 0;}
  li::marker{color:var(--green);}
  code{font-family:var(--mono);background:var(--panel-2);color:var(--green-bright);padding:1.5px 6px;border-radius:5px;font-size:13px;border:1px solid var(--border-soft);}
  .term{margin:20px 0;border:1px solid var(--border);border-radius:11px;overflow:hidden;background:#040806;box-shadow:var(--shadow);}
  .term-head{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--panel-2);border-bottom:1px solid var(--border-soft);}
  .dot{width:11px;height:11px;border-radius:50%;}
  .dot.r{background:#ff5f56;}.dot.y{background:#ffbd2e;}.dot.g{background:#27c93f;}
  .term-title{margin-left:8px;font-family:var(--mono);font-size:11px;color:var(--ink-dim);letter-spacing:.06em;}
  .term-body{padding:16px 18px;font-family:var(--mono);font-size:12.5px;line-height:1.62;overflow-x:auto;white-space:pre;color:#b9e8c8;}
  .term-body .pr{color:var(--green);}.term-body .cm{color:#7fd0ff;}.term-body .ok{color:var(--green-bright);}.term-body .bad{color:var(--red);}.term-body .dim{color:var(--ink-faint);}.term-body .am{color:var(--amber);}
  .box{border-radius:11px;padding:16px 18px 16px 46px;margin:20px 0;position:relative;border:1px solid var(--border);background:var(--panel);}
  .box::before{position:absolute;left:16px;top:15px;font-family:var(--mono);font-size:16px;}
  .box .bt{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin-bottom:4px;}
  .box.lab{border-color:#1f4d35;background:linear-gradient(180deg,rgba(94,243,140,.05),transparent);}
  .box.lab::before{content:"⌘";color:var(--green);}
  .box.lab .bt{color:var(--green-bright);}
  .box.law{border-color:#5a4410;background:linear-gradient(180deg,rgba(255,176,0,.06),transparent);}
  .box.law::before{content:"§";color:var(--amber);}
  .box.law .bt{color:var(--amber);}
  .box.danger{border-color:#5e1f1f;background:linear-gradient(180deg,rgba(255,93,93,.06),transparent);}
  .box.danger::before{content:"!";color:var(--red);font-weight:800;}
  .box.danger .bt{color:var(--red);}
  .box.tip{border-color:#1d4453;background:linear-gradient(180deg,rgba(90,215,255,.05),transparent);}
  .box.tip::before{content:"✦";color:var(--cyan);}
  .box.tip .bt{color:var(--cyan);}
  .hw{margin:34px 0 10px;border:1px dashed var(--green);border-radius:12px;background:linear-gradient(180deg,rgba(94,243,140,.04),transparent);padding:0;overflow:hidden;}
  .hw-head{display:flex;align-items:center;gap:10px;padding:13px 18px;background:rgba(94,243,140,.06);border-bottom:1px dashed var(--border);}
  .hw-head .hwicon{font-family:var(--crt);font-size:22px;color:var(--green-bright);line-height:1;}
  .hw-head .hwt{font-family:var(--mono);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--green-bright);}
  .hw-body{padding:8px 20px 18px;}
  .hw-body ol{counter-reset:hw;list-style:none;padding-left:0;}
  .hw-body ol li{counter-increment:hw;padding-left:34px;position:relative;margin:11px 0;}
  .hw-body ol li::before{content:counter(hw);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:6px;background:var(--panel-2);border:1px solid var(--green);color:var(--green-bright);font-family:var(--mono);font-size:11px;display:flex;align-items:center;justify-content:center;}
  .stretch{font-family:var(--mono);font-size:11px;color:var(--amber);letter-spacing:.1em;text-transform:uppercase;margin-top:14px;display:inline-block;}
  table{width:100%;border-collapse:collapse;margin:18px 0;font-size:13px;}
  th,td{border:1px solid var(--border);padding:9px 12px;text-align:left;vertical-align:top;}
  th{background:var(--panel-2);color:var(--green-bright);font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;}
  td code{font-size:12px;}
  .lesson-foot{display:flex;justify-content:space-between;align-items:center;margin-top:54px;padding-top:24px;border-top:1px solid var(--border-soft);gap:14px;flex-wrap:wrap;}
  .btn{font-family:var(--mono);font-size:12px;letter-spacing:.06em;border:1px solid var(--border);background:var(--panel);color:var(--ink);padding:11px 18px;border-radius:8px;cursor:pointer;transition:.18s;}
  .btn:hover{border-color:var(--green);color:var(--green-bright);background:var(--panel-2);}
  .btn.primary{border-color:var(--green);color:#04130a;background:var(--green);font-weight:700;}
  .btn.primary:hover{background:var(--green-bright);box-shadow:0 0 22px rgba(94,243,140,.4);}
  .btn.ghost{opacity:.55;}
  .pill{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:99px;border:1px solid var(--border);color:var(--ink-dim);margin:0 6px 6px 0;}
  .pill.t{border-color:var(--cyan);color:var(--cyan);}
  .cover h2.lesson-title{font-family:var(--crt);font-size:64px;color:var(--green-bright);text-shadow:0 0 30px rgba(94,243,140,.3);font-weight:400;line-height:.95;}
  .cover .lede{font-size:17px;border:none;padding:0;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0;}
  .card{border:1px solid var(--border);border-radius:11px;padding:16px 18px;background:var(--panel);}
  .card .ct{font-family:var(--mono);color:var(--green-bright);font-weight:700;font-size:13px;letter-spacing:.05em;margin-bottom:5px;}
  .card p{margin:4px 0 0;font-size:13px;color:var(--ink-dim);}
  .mobile-bar{display:none;}
  .scrim{display:none;}
  @media(max-width:880px){
    .shell{grid-template-columns:1fr;}
    aside{position:fixed;left:0;top:0;width:300px;z-index:50;transform:translateX(-100%);transition:.3s;box-shadow:30px 0 60px rgba(0,0,0,.6);}
    aside.open{transform:none;}
    .mobile-bar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:40;padding:12px 18px;background:rgba(7,11,8,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);}
    .menu-btn{font-family:var(--mono);background:var(--panel-2);border:1px solid var(--border);color:var(--green);padding:8px 12px;border-radius:8px;cursor:pointer;}
    .content{padding:28px 22px 100px;}
    .topbar{padding:12px 22px;}
    .grid2{grid-template-columns:1fr;}
    .cover h2.lesson-title{font-size:44px;}
    .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:45;}
    .scrim.show{display:block;}
  }
</style>

<script>
const L = [{"id":"cover","part":"START","nav":"Welcome","cover":true,"html":"\n<div class=\"cover\">\n<span class=\"lesson-kicker\">link established · zero → pilot &amp; builder</span>\n<h2 class=\"lesson-title\">fly<br>everything.</h2>\n<p class=\"lede\">The complete path from \"I've never touched a drone\" to building, flying, filming, automating, and earning with them. Twelve parts: foundations, every component, building from parts, firmware &amp; software, radio &amp; control, piloting, aerial cinematography, autonomy &amp; code, long-range &amp; HD, the law, the markets, and maintenance. Every lesson ends with a hands-on task you actually do.</p>\n<div class=\"grid2\">\n  <div class=\"card\"><div class=\"ct\">▸ Hands-on every step</div><p>Each lesson ends with a \"Hands-On\" — solder a joint, flash Betaflight, fly the sim, plan a mission, check airspace. You learn drones by doing, not just reading.</p></div>\n  <div class=\"card\"><div class=\"ct\">🔧 Build it yourself</div><p>Know every part — motors, ESCs, flight controller, VTX, LiPo — then assemble and tune a real FPV quad from scratch.</p></div>\n  <div class=\"card\"><div class=\"ct\">§ Legal &amp; safe by default</div><p>Registration, Part 107, TRUST, Remote ID, airspace/LAANC, and LiPo &amp; flight safety — taught accurately, with a reminder to verify current rules.</p></div>\n  <div class=\"card\"><div class=\"ct\">💸 Fly for fun or for money</div><p>Racing, freestyle, cinematography, mapping, inspection, light shows — plus how to actually make money with a drone.</p></div>\n</div>\n<h3>How this course is structured</h3>\n<p>Twelve parts that build on each other — start with Foundations, then follow the path from parts to building to flying to filming to automating to shipping a service. Mark lessons complete as you go; your progress bar lives in the sidebar.</p>\n<div class=\"box danger\"><div class=\"bt\">Safety first, always.</div> LiPo batteries can catch fire and spinning props cut — every build and flight lesson includes the safety step. Never skip it, and never fly outside the law.</div>\n</div>\n"},{"id":"p0-1","part":"00 · Foundations","nav":"What Is a Drone?","num":"0.1","kicker":"Part 00 · Lesson 1","title":"What a Drone Really Is: UAVs, Multirotors & the Big Picture","html":"<h3>The word \"drone\" hides a whole industry</h3><p>In everyday speech, <strong>drone</strong> means any aircraft that flies without a human pilot on board. The formal term is <strong>UAV</strong> (Unmanned Aerial Vehicle), and when you include the controller, the radio link, and the operator it becomes a <strong>UAS</strong> (Unmanned Aircraft System). That single word covers everything from a 25-gram toy to a military fixed-wing with a 15-metre wingspan. For this course we focus on the hobby and prosumer slice: aircraft you can legally buy, build, and fly yourself.</p><h3>Two big families: how they make lift</h3><p>Almost every drone you'll meet belongs to one of two families, separated by <em>how they stay in the air</em>:</p><ul><li><strong>Multirotors</strong> — lift comes from several spinning propellers pointing up. A <em>quadcopter</em> (4 props) is the default. They can hover perfectly still, take off vertically (VTOL), and fly in any direction. The trade-off: they're inefficient (props fight gravity constantly) so flight times are short, typically 4-25 minutes.</li><li><strong>Fixed-wing</strong> — lift comes from air flowing over a wing, exactly like a passenger jet. They must keep moving forward to stay up and cannot hover, but they're far more efficient, covering tens of kilometres on one battery. Great for mapping and long-range cruising, awkward in tight spaces.</li></ul><p>There are hybrids (VTOL fixed-wings, helicopters, single-rotor) but multirotor and fixed-wing are the two mental buckets every beginner needs.</p><h3>RTF vs. DIY: how you get one</h3><p>The other axis that defines your experience is <em>where the drone comes from</em>:</p><ul><li><strong>RTF (Ready-To-Fly)</strong> — a finished consumer product. You charge it, bind the controller, update firmware in an app, and fly. DJI's Mini and Air series are the classic examples. GPS holds position, the camera is on a gimbal, and it largely flies itself.</li><li><strong>DIY / hobby-grade</strong> — you select a frame, motors, flight controller, ESC, camera, and radio gear, then assemble and tune them. This is the world of <strong>FPV</strong> (First-Person View), where you fly through goggles seeing a live video feed as if you were sitting in the cockpit. More skill, more freedom, more crashes.</li></ul><div class='box tip'><div class='bt'>Insight.</div> The biggest beginner confusion is treating \"drone\" as one thing. A DJI camera drone and a DIY FPV quad share almost no flying skills — one hovers itself, the other will flip and tumble the instant you let go of the sticks. Knowing which world you're entering decides everything that follows.</div><h3>The core building blocks (preview)</h3><p>Regardless of type, every powered drone contains the same conceptual parts, which we'll dissect in Part 01:</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>anatomy</span></div><div class='term-body'><span class='cm'>frame</span>     structure that holds everything\n<span class='cm'>motors</span>    spin the props (4 on a quad)\n<span class='cm'>props</span>     convert spin into thrust\n<span class='cm'>ESC</span>       electronic speed controllers feed the motors\n<span class='cm'>FC</span>        flight controller = the brain + gyro\n<span class='cm'>battery</span>   a LiPo pack supplies the power\n<span class='cm'>radio</span>     RC link from your transmitter\n<span class='cm'>camera+VTX</span> (FPV only) live video to your goggles</div></div><div class='box law'><div class='bt'>Rule of thumb.</div> In most countries any drone above ~250 g (and in many places <em>all</em> drones, regardless of weight) must be registered and flown under specific rules. We cover this in detail later — for now, know that buying a drone and the right to fly it freely are two different things. Always verify current FAA (US) or your national aviation authority rules before flying.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Goal: feel the difference between the three worlds before you spend a cent.</p><ol><li>On YouTube, watch one clip each of: (a) a DJI Mini/Air camera drone, (b) an FPV freestyle quad, (c) a fixed-wing flying-wing.</li><li>For each, write ONE paragraph describing how it <em>looks and behaves</em>: Does it hover? Does it flip? How fast does it move? Is the footage smooth or wild?</li><li>Underline the one that makes you think \"that's what I want to do.\" Keep this note — it seeds your path choice in Lesson 0.7.</li></ol></div></div>"},{"id":"p0-2","part":"00 · Foundations","nav":"Types of Drones","num":"0.2","kicker":"Part 00 · Lesson 2","title":"The Main Drone Types and When to Use Each","html":"<h3>Six categories you actually need to know</h3><p>The market is enormous, but as a hobbyist you'll choose between six practical categories. Each exists because it solves a specific problem better than the others. Matching the <em>job</em> to the <em>tool</em> is the single most important purchasing decision you'll make.</p><h4>1. RTF camera drones (DJI Mini/Air/Mavic, Autel)</h4><p>GPS-stabilised, gimbal-mounted camera, flies itself. Hovers when you release the sticks, returns home on low battery. Best for travel video, real-estate, family memories. Skill demand is low; you can fly safely on day one. The catch: geofencing, sub-250 g weight games, and limited \"creative\" motion — they look like every other drone shot.</p><h4>2. Tiny Whoops (65-75 mm, ducted)</h4><p>Tiny FPV quads with prop guards, flown indoors. 1S or 2S battery, ~2-4 min flight. The cheapest, safest way to learn real FPV stick skills. Best for: learning, indoor fun, garage cinematic micro shots. Cheap to crash.</p><h4>3. 5-inch FPV freestyle</h4><p>The hobby's centre of gravity. ~250-650 g, 4S/6S LiPo, GoPro on top, flown in <em>acro</em> mode (no self-levelling). Best for tricks, dives, bando flying, and dramatic action footage. High skill demand and you WILL crash while learning — build skills matter.</p><h4>4. FPV racing</h4><p>Stripped-down 5-inch (or smaller 'spec' class) tuned for raw speed and low latency, flown around gates on a course. No camera weight, analog or low-latency digital video, aggressive PID tuning. Best if you're competitive and like wrenching. Skill demand very high.</p><h4>5. Cinematic FPV (cinewhoops & cinelifters)</h4><p>Ducted, GoPro/Naked-GoPro or even mirrorless-carrying rigs for smooth, dramatic \"flying camera\" shots through tight spaces. Cinewhoops (3-3.5\") are prop-guarded and safe near people; cinelifters (7-10\") carry full cinema cameras. Best for filmmakers. Cost ranges widely.</p><h4>6. Long-range & fixed-wing</h4><p>7-10\" long-range quads or fixed-wing/flying-wings built for distance and endurance — exploration, mountains, mapping. Efficiency over agility; flights of 20-40+ minutes and many kilometres. Demands solid RF, GPS rescue, and airmanship.</p><table><thead><tr><th>Type</th><th>Best use</th><th>Skill</th><th>Rough cost (full setup)</th></tr></thead><tbody><tr><td>RTF camera (DJI Mini 4)</td><td>Travel / real-estate video</td><td>Low</td><td>$400-$1,100</td></tr><tr><td>Tiny Whoop</td><td>Learning / indoor FPV</td><td>Low-Med</td><td>$150-$300</td></tr><tr><td>5\" freestyle</td><td>Tricks / action footage</td><td>High</td><td>$500-$900</td></tr><tr><td>Racing</td><td>Competitive speed</td><td>Very High</td><td>$600-$1,200</td></tr><tr><td>Cinematic FPV</td><td>Pro film / smooth moves</td><td>Med-High</td><td>$700-$5,000+</td></tr><tr><td>Long-range / fixed-wing</td><td>Distance / mapping</td><td>High</td><td>$700-$2,000</td></tr></tbody></table><div class='box tip'><div class='bt'>Insight.</div> Notice that the radio and goggles are shared across every FPV category. Once you buy a good transmitter and goggles, the airframe itself is the cheap part. That's why many people start with a cheap whoop on gear they'll keep for years.</div><div class='box danger'><div class='bt'>Safety.</div> 5-inch and larger quads spin carbon/plastic props at tens of thousands of RPM — they cut deep. Never arm a quad with props on near your face or hands, and never fly DIY FPV directly over people.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Goal: turn this lesson into a personal decision tool.</p><ol><li>In a spreadsheet, recreate the six-row table above.</li><li>Add a column \"My interest (1-5)\" and rate each honestly.</li><li>Add a column \"Can I crash this without crying?\" (cost vs. your budget).</li><li>Circle the top two. You'll narrow to one in Lesson 0.7.</li></ol></div></div>"},{"id":"p0-3","part":"00 · Foundations","nav":"How Multirotors Fly","num":"0.3","kicker":"Part 00 · Lesson 3","title":"How Multirotor Flight Works: Thrust, Lift & Hover","html":"<h3>A prop is a spinning wing</h3><p>Forget magic. A multirotor flies because each propeller is a small rotating wing. As a prop spins, its angled blades shove air <em>downward</em>. By Newton's third law, the air pushes the prop (and the whole aircraft) <em>upward</em> with an equal force. That upward force is <strong>thrust</strong>. Spin faster, move more air, get more thrust.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>force-balance</span></div><div class='term-body'><span class='ok'>THRUST  ↑↑↑↑</span>   four props pushing air down\n        ████\n      [  QUAD  ]   mass = weight\n        ████\n<span class='bad'>GRAVITY ↓↓↓↓</span>   constant, pulls the mass down</div></div><h3>The three states: climb, hover, descend</h3><p>Everything a quad does vertically comes from comparing total thrust to weight:</p><ul><li><strong>Thrust &gt; weight</strong> → the quad accelerates upward (climb).</li><li><strong>Thrust = weight</strong> → forces balance, the quad <strong>hovers</strong> in place.</li><li><strong>Thrust &lt; weight</strong> → gravity wins, the quad descends.</li></ul><p>A stable hover is therefore not \"zero throttle\" — it's the precise throttle that produces thrust exactly equal to the quad's weight. On a typical 5-inch freestyle quad that <em>hover point</em> sits around 30-45% throttle, because these quads are built with a huge thrust surplus for acro flying.</p><h3>Thrust-to-weight ratio (TWR)</h3><p>The single most important performance number is <strong>thrust-to-weight ratio</strong>: total max thrust divided by all-up weight (AUW). A quad with TWR of 1.0 can only just hold itself up. Hobby quads target very different numbers:</p><table><thead><tr><th>TWR</th><th>Feel</th><th>Typical platform</th></tr></thead><tbody><tr><td>1.5-2.0</td><td>Gentle, efficient, smooth</td><td>Cinematic / long-range</td></tr><tr><td>3-5</td><td>Snappy, powerful</td><td>5\" freestyle</td></tr><tr><td>6-13+</td><td>Insane acceleration</td><td>Racing / light builds</td></tr></tbody></table><p>If TWR drops below about 2:1 the quad feels sluggish and struggles to recover from dives. Below ~1.3:1 it can't climb meaningfully — a common symptom of an overweight build or a tired LiPo.</p><h3>Why hovering is the hardest \"easy\" thing</h3><p>A real propeller's thrust isn't perfectly steady, the air isn't still, and the battery sags as it drains, lowering thrust over the flight. So your hover point drifts <em>upward</em> as the pack empties. A GPS camera drone hides all this with sensors; a DIY acro quad does not — you constantly trim throttle by hand. This is why your first sim sessions feel like wrestling a balloon: you're learning to feel the thrust/weight balance in real time.</p><div class='box tip'><div class='bt'>Insight.</div> Hover throttle is a great battery health check. If a quad that normally hovers at 35% suddenly needs 50% for the same lift, your pack is sagging hard, your motors are worn, or you've added weight. Watch that number.</div><div class='box danger'><div class='bt'>Safety.</div> Density altitude matters: hot days and high elevations give thinner air and less thrust. A quad that hovers fine at sea level on a cool morning can be dangerously underpowered at a mountain site in summer. Plan for less performance, not more.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Goal: internalise the hover force balance.</p><ol><li>Sketch a quadcopter viewed from <em>above</em>; label the four motors M1-M4.</li><li>Draw an arrow at each motor pointing up, labelled \"thrust.\"</li><li>Draw one big arrow through the centre pointing down, labelled \"gravity / weight.\"</li><li>Write a one-sentence caption: \"For a stable hover, total thrust = ____.\"</li><li>Estimate: if your future quad weighs 600 g and your motors make 1500 g thrust total, what's the TWR?</li></ol></div></div>"},{"id":"p0-4","part":"00 · Foundations","nav":"The 4 Controls","num":"0.4","kicker":"Part 00 · Lesson 4","title":"Throttle, Yaw, Pitch & Roll — The Four Flight Controls","html":"<h3>Four axes, two sticks</h3><p>Every multirotor — toy or pro — is flown with exactly four control inputs. On the standard <strong>Mode 2</strong> radio (the global default), they map to the two sticks like this:</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>mode-2-layout</span></div><div class='term-body'>  LEFT STICK            RIGHT STICK\n   up = THROTTLE +       up = PITCH fwd\n   dn = THROTTLE -       dn = PITCH back\n   L  = YAW left         L  = ROLL left\n   R  = YAW right        R  = ROLL right</div></div><h3>The four controls, one by one</h3><ul><li><strong>Throttle</strong> — overall power to all motors at once. Up = more thrust = climb; down = descend. This is your altitude/vertical-speed control.</li><li><strong>Yaw</strong> — rotates the quad about its vertical axis (spins it to face a new direction) <em>without</em> tilting. Think of a figure skater spinning in place.</li><li><strong>Pitch</strong> — tilts the nose down (forward) or up (back). Tilting the nose down points some of the thrust backward, so the quad accelerates <em>forward</em>.</li><li><strong>Roll</strong> — tilts the quad left or right about its forward axis, sending it sliding sideways in that direction.</li></ul><h3>How a tilt becomes movement</h3><p>This is the key beginner insight: a quad has no \"sideways thruster.\" To move <em>any</em> direction, it tilts so the total thrust vector points partly that way. Tilting also reduces the <em>vertical</em> component of thrust, so aggressive forward flight makes the quad sink unless you add throttle. Coordinating pitch + throttle is the heart of smooth flying.</p><h3>Pitch and roll behave differently in two flight modes</h3><ul><li><strong>Angle / self-level mode</strong> (camera drones, beginner FPV): stick deflection sets a <em>tilt angle</em>. Release the stick and the quad springs back to level by itself. Forgiving.</li><li><strong>Acro / rate mode</strong> (real FPV freestyle): stick deflection sets a <em>rotation rate</em>. Release the stick and the quad <em>keeps whatever attitude it had</em> — it does NOT self-level. This lets you flip and roll freely, but you must actively level it. This is why a freestyle quad tumbles if a beginner lets go.</li></ul><div class='box tip'><div class='bt'>Insight.</div> Yaw and roll feel similar to beginners but are physically different. Yaw <em>rotates</em> you to face elsewhere; roll <em>translates</em> you sideways while still facing forward. Mixing them up is the #1 cause of early disorientation. Drill them separately in the sim.</div><h3>What the motors actually do</h3><p>You move sticks; the flight controller translates that into per-motor speed changes (we cover the why in 0.5). Here's the mixing logic on an X-quad:</p><table><thead><tr><th>Input</th><th>Motor response</th></tr></thead><tbody><tr><td>Throttle up</td><td>ALL four motors speed up equally</td></tr><tr><td>Yaw right</td><td>The two CCW motors speed up, the two CW slow down (torque imbalance spins the frame)</td></tr><tr><td>Pitch forward</td><td>The two REAR motors speed up, the two FRONT slow down (nose tips down)</td></tr><tr><td>Roll left</td><td>The two RIGHT motors speed up, the two LEFT slow down (tilts left)</td></tr></tbody></table><div class='box danger'><div class='bt'>Safety.</div> Before your first powered test, ALWAYS bench-check stick direction with props OFF. A reversed channel (very common after setup) means the quad fights you and flips on takeoff. Props go on last, after every stick checks correct in Betaflight's Receiver tab.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Goal: predict motor behaviour from stick inputs (props OFF / sim).</p><ol><li>Draw a Mode-2 stick diagram with the four labels.</li><li>For each of: throttle up, yaw right, pitch forward, roll left — write which motors speed up and which slow down (use the table to self-check).</li><li>In a sim (Liftoff, Velocidrone, or DRL), isolate ONE control at a time and confirm the quad moves as predicted.</li></ol></div></div>"},{"id":"p0-5","part":"00 · Foundations","nav":"Motor Direction & the FC","num":"0.5","kicker":"Part 00 · Lesson 5","title":"Why Motors Spin Opposite Ways & How the Flight Controller Stabilizes","html":"<h3>The torque problem</h3><p>A spinning motor doesn't just make thrust — it also tries to twist the whole airframe in the <em>opposite</em> direction of its rotation. This reaction is called <strong>torque</strong> (Newton's third law again). If all four motors on a quad spun the same way, the entire aircraft would spin uncontrollably like a top. That's unflyable.</p><h3>The fix: counter-rotating props</h3><p>Quads solve this by spinning two motors clockwise (CW) and two counter-clockwise (CCW), arranged diagonally so opposing torques cancel out. With all four at equal speed, the net twist is zero and the quad sits still in yaw.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>rotation-pattern (props-out / front of quad up)</span></div><div class='term-body'>   M4 (CW) ◵        ◶ M2 (CCW)\n          \\        /\n           [  FC  ]\n          /        \\\n   M3 (CCW)◶        ◵ M1 (CW)\n\n<span class='dim'>Betaflight default \"props out\": fronts spin outward</span></div></div><p>This is also <em>how yaw works</em>: to yaw, the FC deliberately unbalances the torques — speeding up the CCW pair and slowing the CW pair makes the frame rotate one way without tilting. No tail rotor needed.</p><div class='box danger'><div class='bt'>Safety.</div> CW and CCW props are NOT interchangeable. Each motor needs the matching prop or it produces downforce instead of lift and the quad won't take off (or flips violently). Props are marked; in Betaflight, motor direction must match your prop direction (props-in vs props-out) or the quad is uncontrollable. Always confirm direction in the Motors tab with props OFF.</div><h3>Why you can't fly a quad without a computer</h3><p>Here's the truth that surprises beginners: a multirotor is <em>inherently unstable</em>. Unlike a fixed-wing that naturally glides level, a bare quad with no electronics would tip over instantly — any tiny imbalance grows. It physically cannot be flown by a human directly. The thing that makes it flyable is the <strong>flight controller (FC)</strong>.</p><h3>What the flight controller does, ~3,000 times a second</h3><p>The FC contains a <strong>gyroscope</strong> (measures rotation rate) and usually an <strong>accelerometer</strong> (senses gravity/tilt). Its control loop runs continuously:</p><ol><li><strong>Read</strong> the gyro: how fast is the quad rotating on each axis right now?</li><li><strong>Compare</strong> to what the pilot is asking for (your stick = desired rate).</li><li><strong>Correct</strong>: the <strong>PID controller</strong> calculates per-motor speed tweaks to kill the error, and sends them to the ESCs.</li></ol><p>This loop typically runs at 4-8 kHz on a modern Betaflight FC. The result: when a gust tips the quad, the FC catches it and re-levels (or holds your commanded attitude) before you even notice. <strong>PID tuning</strong> is the art of setting how aggressively it corrects — too little and it wobbles/drifts; too much and it oscillates and gets hot.</p><div class='box tip'><div class='bt'>Insight.</div> A camera drone like a DJI adds GPS, barometer, and optical-flow sensors on top of the gyro, so it also holds <em>position</em> and altitude, not just attitude. A bare FPV quad only stabilises attitude — it will happily drift across the field if there's wind. That difference is exactly why one hovers itself and the other doesn't.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Goal: cement counter-rotation and the FC's job.</p><ol><li>Draw a quad from above and label each motor CW or CCW in the diagonal-pair pattern (props-out).</li><li>Add arrows showing how the torques cancel for zero yaw.</li><li>Write 3 sentences answering: \"What would happen to this quad in flight if the flight controller stopped reading the gyro and correcting?\" (Hint: think instability + no torque balancing.)</li><li>Bonus: open Betaflight Configurator's Motors tab (read-only, props off) and identify which slider is which motor.</li></ol></div></div>"},{"id":"p0-6","part":"00 · Foundations","nav":"Drone Glossary","num":"0.6","kicker":"Part 00 · Lesson 6","title":"Core Terminology: Speaking the Drone Language","html":"<h3>Why this lesson matters</h3><p>Every forum post, build list, and tutorial assumes you know the jargon. Master these 30+ terms now and the rest of the course (and the whole hobby) becomes readable. Grouped by topic for easier memorising.</p><h4>The electronics stack</h4><table><thead><tr><th>Term</th><th>Means</th></tr></thead><tbody><tr><td><code>FC</code></td><td>Flight Controller — the brain; runs Betaflight, holds the gyro</td></tr><tr><td><code>ESC</code></td><td>Electronic Speed Controller — drives the motors; often a 4-in-1</td></tr><tr><td><code>PDB</code></td><td>Power Distribution Board — splits battery power to components</td></tr><tr><td><code>VTX</code></td><td>Video Transmitter — sends the camera feed to your goggles</td></tr><tr><td><code>RX</code> / <code>TX</code></td><td>Receiver (on the drone) / Transmitter (your radio in hand)</td></tr><tr><td><code>UART</code></td><td>Serial port on the FC for connecting GPS, RX, etc.</td></tr><tr><td><code>KV</code></td><td>Motor RPM per volt with no load — higher KV = faster spin</td></tr></tbody></table><h4>Power &amp; batteries</h4><table><thead><tr><th>Term</th><th>Means</th></tr></thead><tbody><tr><td><code>LiPo</code></td><td>Lithium-Polymer battery — the standard pack</td></tr><tr><td><code>S</code> (e.g. 4S/6S)</td><td>Cells in series; sets voltage (1S ≈ 3.7V nominal)</td></tr><tr><td><code>mAh</code></td><td>Capacity — how much energy (bigger = longer flight, heavier)</td></tr><tr><td><code>C-rating</code></td><td>Safe continuous discharge rate of the pack</td></tr><tr><td><code>AUW</code></td><td>All-Up Weight — total flying weight incl. battery</td></tr></tbody></table><h4>Flight &amp; control</h4><table><thead><tr><th>Term</th><th>Means</th></tr></thead><tbody><tr><td><code>acro / rate</code></td><td>No self-levelling; sticks set rotation rate (real FPV)</td></tr><tr><td><code>angle / horizon</code></td><td>Self-levelling modes; quad returns to level</td></tr><tr><td><code>throttle/yaw/pitch/roll</code></td><td>The four control axes</td></tr><tr><td><code>arm / disarm</code></td><td>Enable/disable the motors (safety switch)</td></tr><tr><td><code>PID</code></td><td>Tuning that controls how the FC corrects errors</td></tr><tr><td><code>rates</code></td><td>How fast the quad rotates per unit of stick</td></tr><tr><td><code>RTH</code></td><td>Return-To-Home — GPS auto-return (camera drones)</td></tr><tr><td><code>failsafe</code></td><td>Programmed action if the radio link is lost</td></tr></tbody></table><h4>Video, radio &amp; rules</h4><table><thead><tr><th>Term</th><th>Means</th></tr></thead><tbody><tr><td><code>FPV</code></td><td>First-Person View — flying via live goggle feed</td></tr><tr><td><code>LOS</code></td><td>Line Of Sight — flying by looking at the aircraft</td></tr><tr><td><code>VLOS</code></td><td>Visual Line Of Sight — legal requirement to see your drone</td></tr><tr><td><code>OSD</code></td><td>On-Screen Display — telemetry overlaid on video</td></tr><tr><td><code>analog / digital</code></td><td>Video systems (analog = low-latency/cheap; digital = HD, e.g. DJI/HDZero/Walksnail)</td></tr><tr><td><code>bind</code></td><td>Pairing your TX to the RX</td></tr><tr><td><code>ELRS</code></td><td>ExpressLRS — popular open-source long-range radio protocol</td></tr><tr><td><code>spotter</code></td><td>A helper who keeps eyes on your drone while you're in goggles</td></tr><tr><td><code>bando</code></td><td>An abandoned building used as an FPV flying spot</td></tr><tr><td><code>props</code></td><td>Propellers; CW/CCW and sized in inches (e.g. 5\")</td></tr><tr><td><code>gimbal</code></td><td>Motorised mount that stabilises a camera</td></tr></tbody></table><div class='box tip'><div class='bt'>Insight.</div> Two terms beginners constantly confuse: <strong>VTX</strong> (video out from the drone) vs <strong>TX</strong> (your radio that sends control in). Different links, different frequencies, different jobs. Lose VTX = you fly blind; lose TX = failsafe triggers.</div><div class='box law'><div class='bt'>Rule.</div> <strong>VLOS</strong> isn't just slang — keeping the aircraft in unaided visual line of sight is a legal requirement in most jurisdictions, which is why FPV pilots fly with a <strong>spotter</strong>. Verify current FAA/local rules before relying on this.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Goal: build a glossary you actually remember.</p><ol><li>Pick at least 30 terms from this lesson.</li><li>On physical or digital flash cards (Anki works great), put the term on one side and YOUR OWN one-line definition on the other.</li><li>Quiz yourself in both directions until you score 90%+.</li><li>Tag the 3-5 you still find fuzzy and re-read their section.</li></ol></div></div>"},{"id":"p0-7","part":"00 · Foundations","nav":"Choosing Your Path","num":"0.7","kicker":"Part 00 · Lesson 7","title":"The Hobby Landscape: Choosing YOUR Drone Path","html":"<h3>There is no \"best\" drone — only the best fit for you</h3><p>People stall for months because they treat this as one decision with one right answer. It isn't. The right path depends on five honest variables: your <strong>goal</strong>, your <strong>budget</strong>, your <strong>build-vs-buy</strong> appetite, your available <strong>time</strong>, and your <strong>risk tolerance</strong> (crashes, regulation, frustration). Let's map the main paths against those.</p><h3>The paths and who they suit</h3><table><thead><tr><th>Path</th><th>You want...</th><th>Build?</th><th>Frustration curve</th></tr></thead><tbody><tr><td>RTF camera (DJI)</td><td>Polished footage, fly today, travel</td><td>None</td><td>Gentle — flies on day 1</td></tr><tr><td>Tiny Whoop FPV</td><td>To learn FPV cheaply, fly indoors</td><td>Optional</td><td>Moderate — sim + practice</td></tr><tr><td>5\" Freestyle FPV</td><td>Tricks, dives, the \"flow\" of FPV</td><td>Yes (recommended)</td><td>Steep — months to competence</td></tr><tr><td>Racing FPV</td><td>Competition, raw speed, tuning</td><td>Yes</td><td>Steep + technical</td></tr><tr><td>Cinematic FPV</td><td>Pro-level flying-camera shots</td><td>Yes</td><td>Steep — fly + film + edit</td></tr><tr><td>Long-range / wing</td><td>Exploration, distance, scenery</td><td>Yes</td><td>Steep + RF/airmanship</td></tr></tbody></table><h3>The honest trade-offs</h3><ul><li><strong>Camera drones</strong> reward you instantly but cap your growth — there's a ceiling to how \"into it\" you can get, and software locks limit you.</li><li><strong>FPV</strong> has a brutal early curve. Expect weeks in a simulator before your first real hover, and a graveyard of broken props. But the ceiling is effectively infinite and the community is huge.</li><li><strong>Building your own</strong> means you can repair anything (vital — you WILL crash) and understand every system. Buying a Bind-N-Fly (BNF) quad gets you flying sooner but leaves you helpless when it breaks.</li></ul><div class='box tip'><div class='bt'>Insight.</div> The most common winning beginner path: buy a quality <strong>radio</strong> (e.g. RadioMaster) + <strong>goggles</strong> once, start in a <strong>simulator</strong> for 10+ hours, then fly a cheap <strong>tiny whoop</strong>, and only THEN graduate to a 5-inch. This protects your wallet and your confidence. Camera-drone-first is fine too if your real goal is footage, not flying skill.</div><h3>A 10-question self-assessment</h3><ol><li>What's my #1 goal: smooth footage, the thrill of flying, competition, or exploration?</li><li>Do I want to fly <em>today</em>, or am I happy investing weeks of practice first?</li><li>What's my realistic total budget for year one?</li><li>Am I excited or annoyed by the idea of soldering and tuning?</li><li>How much weekly time can I give to a sim and practice?</li><li>How do I feel about crashing and repairing gear repeatedly?</li><li>Will I fly mostly indoors, in open fields, or near scenery/structures?</li><li>Do I need it to be quiet/legal near people, or will I use proper FPV fields?</li><li>Do I want to film for an audience, or fly purely for myself?</li><li>Am I more motivated by mastering a craft or by an end product?</li></ol><div class='box law'><div class='bt'>Rule.</div> Your local laws may quietly decide your path: some areas restrict FPV/goggle flight, require a spotter, mandate registration, or ban flight in your nearest park. Check current FAA (US) / your national authority rules <em>before</em> committing money to a discipline you can't legally practise nearby.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Goal: commit to ONE path so the rest of the course is focused.</p><ol><li>Write down your answers to all 10 questions above.</li><li>Cross-reference your answers with the path table — which row matches best?</li><li>Write a single sentence: \"In this course I will pursue ____ because ____.\"</li><li>Pin it somewhere visible. You'll spec its hardware in Lesson 0.8.</li></ol></div></div>"},{"id":"p0-8","part":"00 · Foundations","nav":"Budgets & First Setup","num":"0.8","kicker":"Part 00 · Lesson 8","title":"Budget Tiers & What a First Setup Actually Costs","html":"<h3>The hidden truth: the drone is the cheap part</h3><p>Beginners price the quad and forget the ecosystem. A complete FPV setup needs SIX things, and four of them you buy ONCE and keep for years across many quads:</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>the-six-essentials</span></div><div class='term-body'><span class='ok'>keep-for-years:</span>\n  1. Radio / transmitter\n  2. Goggles (FPV) or phone (camera drone)\n  3. LiPo charger\n  4. Tools + spare props\n<span class='am'>consumable / per-build:</span>\n  5. The drone itself\n  6. LiPo batteries (buy several)</div></div><h3>Three FPV starter tiers (rough USD, 2026)</h3><table><thead><tr><th>Item</th><th>Entry</th><th>Mid</th><th>Premium</th></tr></thead><tbody><tr><td>Radio (TX)</td><td>RadioMaster Pocket ~$65</td><td>RadioMaster Boxer ~$160</td><td>RM TX16S / Boxer ~$200</td></tr><tr><td>Goggles</td><td>Analog box goggles ~$120</td><td>HDZero Goggles / DJI Goggles N3 ~$350-500</td><td>DJI Goggles 3 ~$500</td></tr><tr><td>Drone</td><td>Tiny whoop BNF ~$110</td><td>5\" BNF (e.g. analog/HDZero) ~$250</td><td>5\" digital BNF / DJI O4 ~$350</td></tr><tr><td>Batteries</td><td>4x 1S whoop ~$30</td><td>4x 6S 1300mAh ~$90</td><td>6x 6S 1300mAh ~$140</td></tr><tr><td>Charger</td><td>USB 1S charger ~$25</td><td>ISDT/Toolkit ~$60</td><td>Hota / dual charger ~$120</td></tr><tr><td>Tools + props + bag</td><td>~$30</td><td>~$60</td><td>~$90</td></tr><tr><td><strong>TOTAL</strong></td><td><strong>~$380</strong></td><td><strong>~$1,000-1,100</strong></td><td><strong>~$1,400</strong></td></tr></tbody></table><h3>RTF camera-drone path (simpler math)</h3><p>If you chose the camera-drone path, your kit collapses to basically one purchase plus batteries:</p><ul><li><strong>Entry:</strong> DJI Mini SE/4K + extra battery ≈ $350-450.</li><li><strong>Mid:</strong> DJI Mini 4 Pro / Air 3 \"Fly More\" combo (3 batteries, charger, bag) ≈ $900-1,100.</li><li><strong>Premium:</strong> DJI Mavic 4 Pro combo ≈ $2,000+.</li></ul><p>The Fly More combos are almost always worth it — buying extra batteries and the multi-charger separately costs more than the bundle, and one battery means ~20 minutes of flying per trip.</p><div class='box tip'><div class='bt'>Insight.</div> Spend your money in the right order: <strong>radio &gt; goggles &gt; charger &gt; drone</strong>. A great radio and goggles outlive a dozen quads. A common rookie mistake is a $90 \"toy\" radio you'll resell in a month — buy a RadioMaster with ExpressLRS once and never think about it again.</div><div class='box danger'><div class='bt'>LiPo safety.</div> Budget for a <strong>fireproof LiPo bag/case</strong> ($15) and never skip it. Charge LiPos on a non-flammable surface, never unattended, never overnight. Store packs at storage voltage (~3.8V/cell) — your charger has a storage mode. A puffed, hot, or damaged pack is retired immediately, not flown.</div><div class='box law'><div class='bt'>Rule.</div> Add registration/Remote ID to your budget where required (often a small fee, e.g. FAA TRUST/registration in the US). Some digital VTX gear must meet local RF power limits — verify current FAA / national authority rules before buying and flying.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Goal: produce a real, costed shopping list for YOUR path.</p><ol><li>Set a hard total budget for your year-one setup.</li><li>In a spreadsheet, list every one of the six essentials (or camera-drone equivalents).</li><li>Look up a current real product + price for each line; link it.</li><li>Add a row for registration fees and a LiPo safety bag.</li><li>Sum it. If you're over budget, drop a tier on goggles/drone — never on the charger or safety gear.</li><li>Save it; this becomes your buy list when you finish Part 01.</li></ol></div></div>"},{"id":"p1-1","part":"01 · Components","nav":"Component Overview","num":"1.1","kicker":"Part 01 · Lesson 1","title":"The Anatomy of a Quad: Every Part & the Block Diagram","html":"<h3>The ten subsystems</h3><p>An FPV quad looks like a tangle of wires, but it is really ten well-defined subsystems. Once you can name each one and trace where its power and signal come from, every build, repair, and bug becomes tractable. Here is the full cast:</p><table><thead><tr><th>Subsystem</th><th>Job</th><th>Talks to</th></tr></thead><tbody><tr><td>Battery (LiPo/Li-ion)</td><td>Stores energy, supplies main power bus</td><td>ESC / PDB via XT60/XT30</td></tr><tr><td>ESC (4-in-1 or 4× single)</td><td>Switches battery DC into 3-phase to spin motors</td><td>FC (signal), motors (3 wires each)</td></tr><tr><td>Brushless motors ×4</td><td>Convert electrical power to thrust</td><td>ESC only</td></tr><tr><td>Flight controller (FC)</td><td>The brain: reads gyro, runs PID loop, commands ESC</td><td>Everything</td></tr><tr><td>Radio receiver (RX)</td><td>Receives stick commands from your transmitter</td><td>FC UART</td></tr><tr><td>FPV camera</td><td>Captures the live image</td><td>VTX (analog) or FC/air-unit (digital)</td></tr><tr><td>Video transmitter (VTX)</td><td>Beams video to your goggles</td><td>Camera + FC + antenna</td></tr><tr><td>GPS/compass (optional)</td><td>Position, rescue, return-to-home</td><td>FC UART + I2C</td></tr><tr><td>PDB / power filtering</td><td>Distributes and cleans power</td><td>Battery → everything</td></tr><tr><td>Antennas</td><td>Radiate RF for control link and video</td><td>RX / VTX</td></tr></tbody></table><h3>Two networks: power and signal</h3><p>Keep these mentally separate. <strong>Power</strong> flows from the battery to the ESC, which feeds motors directly and steps voltage down (via a BEC/regulator on the FC or ESC) to 5V/9V/10V rails for the FC, RX, camera, and VTX. <strong>Signal</strong> is the low-current wiring: the FC sends throttle commands to each ESC over a single wire (DShot), the RX feeds stick data to a FC UART, and the GPS streams NMEA-style data over another UART plus magnetometer data over I2C.</p><h3>The block diagram</h3><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>quad-block-diagram</span></div><div class='term-body'><span class='dim'>[ LiPo ]--XT60--+</span>\n               |  VBAT (raw 14.8-25.2V)\n        +------+------+\n        |   4-in-1 ESC |---3ph---> Motor M1\n        |  (BLHeli_32) |---3ph---> Motor M2\n        |              |---3ph---> Motor M3\n        |              |---3ph---> Motor M4\n        +--+--------+--+\n  DShot |  | VBAT+5V (BEC)\n        v  v\n   +-----------+   UART1   +--------+\n   |    FC     |<--------->|   RX   |~)) control link\n   | (gyro+MCU)|   UART2   +--------+\n   |           |<--------->|  VTX   |~)) <span class='ok'>5.8GHz video</span>\n   |           |   UART3      ^\n   |           |<----------+  | video in\n   |           |  GPS+I2C  |  |\n   +-----------+        [ FPV CAM ]--+\n        ^\n        | UART4\n   [ GPS / compass ]</div></div><div class='box tip'><div class='bt'>Mental model.</div> The FC is a hub. Almost every smart peripheral connects to it on a dedicated UART (a TX/RX wire pair) plus a power and ground wire. Master \"which UART does what\" and configuration stops being mysterious.</div><div class='box danger'><div class='bt'>Props off.</div> Any time you power a quad on the bench to configure it, remove the propellers first. A quad that arms unexpectedly with props on can cause serious lacerations.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Draw a complete quad block diagram from memory.</p><ol><li>On paper, place the battery at the top and motors at the bottom.</li><li>Draw the ESC and FC between them; route VBAT power lines as thick arrows.</li><li>Add RX, camera, VTX, and GPS, connecting each to an FC UART with a thin signal line.</li><li>Label every line as either POWER (with voltage) or SIGNAL (with protocol: DShot, UART, I2C).</li><li>Verify every peripheral has power, ground, and a data path back to the FC.</li></ol></div></div>"},{"id":"p1-2","part":"01 · Components","nav":"The Frame","num":"1.2","kicker":"Part 01 · Lesson 2","title":"The Frame: Sizes, Materials & Geometry","html":"<h3>Why the frame defines the build</h3><p>The frame is the skeleton that dictates which propellers fit, which motors bolt on, and how much abuse the quad survives. Frame size is named by the largest prop it can swing, measured diagonally between motor centers for the wheelbase. Pick the frame first; nearly every other component flows from that choice.</p><h3>Common sizes</h3><table><thead><tr><th>Class</th><th>Prop</th><th>Wheelbase</th><th>Typical motor</th><th>AUW</th><th>Use</th></tr></thead><tbody><tr><td>Tiny whoop</td><td>31-40mm</td><td>65-75mm</td><td>0802-1102</td><td>20-35g</td><td>Indoor, beginner</td></tr><tr><td>Toothpick / 3\"</td><td>3\"</td><td>120-140mm</td><td>1404-1507</td><td>120-250g</td><td>Light freestyle, sub-250</td></tr><tr><td>5\" standard</td><td>5\"</td><td>210-230mm</td><td>2207/2306</td><td>400-700g</td><td>Freestyle, racing, the do-everything class</td></tr><tr><td>7\" long range</td><td>7\"</td><td>290-320mm</td><td>2806.5-2807</td><td>500-900g</td><td>Cruising, distance, cinematic</td></tr></tbody></table><h3>Materials</h3><p><strong>Carbon fiber (3K weave)</strong> is the standard for arms and the main plate: extremely stiff, light, and strong. Arm thickness matters most — a 5\" freestyle frame uses <code>4mm</code> arms for durability; racers drop to <code>3mm</code> to save weight. Watch two carbon hazards: it is electrically conductive (a frayed strand can short a pad) and the dust is a respiratory and eye irritant when cutting or sanding.</p><p><strong>Injection-molded plastic / TPU</strong> dominates whoops and ducts because it flexes instead of snapping, and the prop ducts protect both the props and bystanders. TPU is also the go-to 3D-printing material for antenna mounts, camera cages, and bumpers because it absorbs impact.</p><h3>Geometry that matters</h3><ul><li><strong>True-X vs stretched-X:</strong> True-X spaces all four motors equally (balanced freestyle); stretched-X moves rear motors back for high-speed stability (racing).</li><li><strong>Arm replaceability:</strong> bolt-on individual arms let you swap one cracked arm instead of the whole frame — a huge maintenance win.</li><li><strong>Standoff height:</strong> the gap between the bottom and top plate must clear your stacked FC/ESC plus capacitor.</li><li><strong>Camera cage width:</strong> 19mm (micro), 21mm (nano), or 14mm — must match your camera.</li></ul><div class='box tip'><div class='bt'>Mounting standard.</div> Most 5\" stacks use the <code>30.5×30.5mm</code> bolt pattern with M3 hardware; micro stacks use <code>20×20mm</code> with M2. Confirm your frame's mounting holes match your electronics before buying.</div><div class='box danger'><div class='bt'>Inspect after crashes.</div> A hairline crack in a carbon arm can let go mid-flight and throw a prop. Flex each arm and check around motor screw holes after any hard impact; retire cracked arms.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Build a three-frame comparison sheet.</p><ol><li>Pick one whoop, one 3\", and one 5\" frame from a vendor site.</li><li>Record prop size, wheelbase (mm), arm thickness (mm), weight (g), and mounting pattern.</li><li>Note geometry: true-X or stretched-X, and whether arms are replaceable.</li><li>Write one sentence per frame on the mission it suits best.</li></ol></div></div>"},{"id":"p1-3","part":"01 · Components","nav":"Motors","num":"1.3","kicker":"Part 01 · Lesson 3","title":"Brushless Motors: Stator Size, KV & Thrust","html":"<h3>Reading the number</h3><p>A motor labeled <code>2207 1900KV</code> packs two key specs. The four digits are the <strong>stator</strong> dimensions in millimeters: <code>22</code> = stator diameter, <code>07</code> = stator height. A bigger stator (more iron and copper) makes more torque and handles more heat, at the cost of weight. <strong>KV</strong> is rpm per volt with no load — it sets the speed/torque trade-off.</p><table><thead><tr><th>Stator</th><th>Class</th><th>Typical KV</th><th>Battery</th></tr></thead><tbody><tr><td>0802-1103</td><td>Whoop</td><td>11000-19000</td><td>1S</td></tr><tr><td>1404-1507</td><td>3\" / toothpick</td><td>2800-4500</td><td>3S-4S</td></tr><tr><td>2207 / 2306</td><td>5\"</td><td>1700-2000 (6S), 2400-2750 (4S)</td><td>4S-6S</td></tr><tr><td>2806.5-2807</td><td>7\" long range</td><td>1200-1500</td><td>6S</td></tr></tbody></table><h3>KV and voltage are a pair</h3><p>Higher KV spins faster per volt but produces less torque and draws more current, demanding a smaller/lighter prop. The industry shifted from 4S to 6S precisely to lower KV: at 6S you use a ~1900KV motor instead of a ~2750KV 4S motor, achieving the same prop speed at <em>half the current</em>. Lower current means thinner wires, less heat, and less voltage sag. Rule of thumb: roughly match KV to voltage so <code>KV × cells × 3.7 ≈ 40,000-50,000</code> for a 5\".</p><h3>Reading a thrust table</h3><p>Manufacturers publish bench data per prop and voltage. The columns that matter:</p><ul><li><strong>Thrust (g):</strong> at full throttle. You want a total (4 motors) thrust-to-weight ratio of at least 4:1 for freestyle, 8:1+ for racing.</li><li><strong>Current (A):</strong> peak draw per motor — sizes your ESC and battery C-rating.</li><li><strong>Efficiency (g/W):</strong> grams of thrust per watt. Higher is better. This is where long-range builds optimize.</li><li><strong>Temperature:</strong> if the table notes the motor ran hot, that combo is over-propped.</li></ul><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>thrust-table 2207 1700KV @ 6S (sample)</span></div><div class='term-body'>Prop        Thr   Amps   g/W\nHQ 5.1x3.1  1850g 38.0A  <span class='bad'>5.1</span>   <span class='dim'>(hot, over-propped)</span>\nGF 5x4.3x3  1620g 30.5A  <span class='ok'>6.4</span>   <span class='dim'>(efficient sweet spot)</span>\nHQ 5x3.5x3  1430g 24.0A  6.2</div></div><div class='box tip'><div class='bt'>Efficiency hunting.</div> The best thrust-to-current combo is rarely the highest-thrust row. Scan the g/W column for the peak, then confirm the current stays within your ESC and battery limits. That is your hover-friendly, long-flight setup.</div><div class='box danger'><div class='bt'>Heat kills.</div> A motor too hot to hold for 2 seconds after a flight is being overworked — usually too much prop or KV. Sustained over-temp demagnetizes the magnets and burns windings. Drop pitch or prop size.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Find the efficiency sweet spot for one motor.</p><ol><li>Open a manufacturer thrust table for a 5\" motor at your target voltage.</li><li>Add or read a g/W (efficiency) column for each prop row.</li><li>Identify the prop with the highest g/W where current stays under your ESC rating.</li><li>Compute total thrust ×4 and divide by a 600g AUW to get thrust-to-weight.</li></ol></div></div>"},{"id":"p1-4","part":"01 · Components","nav":"ESCs","num":"1.4","kicker":"Part 01 · Lesson 4","title":"ESCs: Single vs 4-in-1, Amp Ratings & BLHeli","html":"<h3>What an ESC does</h3><p>The Electronic Speed Controller takes the FC's throttle command and the battery's DC voltage and switches it into the precisely-timed three-phase AC that spins a brushless motor. It also reads back rotor position (sensorless, via back-EMF) thousands of times per second. Modern ESCs run digital protocols — <strong>DShot600</strong> is the standard for 5\" builds — which are noise-immune and let the FC and ESC exchange telemetry and bidirectional rpm for RPM-filtering.</p><h3>Single vs 4-in-1</h3><table><thead><tr><th></th><th>4× single ESC</th><th>4-in-1 ESC</th></tr></thead><tbody><tr><td>Layout</td><td>One ESC per arm</td><td>One board under the FC</td></tr><tr><td>Wiring</td><td>Solder battery + signal ×4</td><td>One battery pad, ribbon to FC</td></tr><tr><td>Repair</td><td>Swap one bad ESC</td><td>Replace whole board</td></tr><tr><td>Weight/clean build</td><td>Heavier, messier</td><td>Lighter, tidy stack</td></tr><tr><td>Use</td><td>7\"+ where high amps need spread heat</td><td>Dominant on 3\"-5\"</td></tr></tbody></table><p>4-in-1 boards dominate because they fold the entire power section into one stack layer with a single battery solder joint and a clean ribbon cable to the FC. They also integrate the capacitor pad and current sensor.</p><h3>Sizing the amp rating</h3><p>The headline number (e.g. <code>45A</code>, <code>60A</code>) is the <strong>continuous</strong> rating per motor. The rule: ESC continuous rating should comfortably exceed your motor's <em>peak</em> current from the thrust table, with margin. If a motor peaks at 38A on your chosen prop, a 45A ESC leaves only 18% headroom — fine for freestyle, tight for racing. A 60A ESC gives ~58% headroom and runs cooler.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>esc-sizing</span></div><div class='term-body'>motor peak (1 motor)     = 38A\nchoose ESC continuous    = 45A  <span class='am'>(headroom 18%, ok freestyle)</span>\n                         = 60A  <span class='ok'>(headroom 58%, racing/punch)</span>\n4-in-1 \"4x60A\" means 60A PER motor, not total.</div></div><div class='box tip'><div class='bt'>Burst vs continuous.</div> Ignore the big \"burst\" amp number on the box; it is only valid for a few seconds. Size to the continuous rating. Also check the voltage rating: a <code>3-6S</code> ESC is safe to 25.2V; never feed a 6S pack into a 4S-only ESC.</div><h3>BLHeli firmware</h3><p>ESC firmware is configured in <strong>BLHeli_S</strong>, <strong>Bluejay</strong> (open-source upgrade for BLHeli_S 8-bit hardware, adds DShot300/600 and bidirectional rpm), or <strong>BLHeli_32 / AM32</strong> (32-bit, full telemetry). Key settings: motor timing, motor direction (reverse a spinning-wrong motor in software, not by re-soldering), and enabling bidirectional DShot for RPM filtering.</p><div class='box danger'><div class='bt'>Bench safely.</div> Always set motor direction and run motor tests with props removed. In Betaflight's Motors tab, the spin-test checkbox is a real liability with blades attached.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Size a 4-in-1 ESC for a given motor.</p><ol><li>Read your motor's peak current from its thrust table at your voltage and prop.</li><li>Multiply by ~1.3-1.5 to set a minimum continuous ESC rating.</li><li>Pick a 4-in-1 ESC whose per-motor rating and voltage class (e.g. 3-6S) cover it.</li><li>Write one sentence justifying the headroom for your flying style.</li></ol></div></div>"},{"id":"p1-5","part":"01 · Components","nav":"Flight Controller","num":"1.5","kicker":"Part 01 · Lesson 5","title":"The Flight Controller: MCU, Gyro/IMU & UARTs","html":"<h3>The brain</h3><p>The flight controller runs the firmware (Betaflight, on most FPV quads) that reads the gyro 8,000 times a second, runs the PID loop, mixes the result, and sends a throttle value to each ESC. Three spec lines decide whether an FC is good enough: the <strong>MCU</strong>, the <strong>gyro/IMU</strong>, and the <strong>UART count</strong>.</p><h3>MCU generation</h3><table><thead><tr><th>MCU</th><th>Class</th><th>Notes</th></tr></thead><tbody><tr><td>F4 (STM32F405)</td><td>Budget</td><td>Capable, but limited UARTs and can't run highest gyro loop rates</td></tr><tr><td>F7</td><td>Mid</td><td>More UARTs, better peripheral handling</td></tr><tr><td>H7 (STM32H743)</td><td>Modern standard</td><td>480MHz, 8kHz loop easily, plenty of UARTs, headroom for filtering</td></tr></tbody></table><p>For a new 5\" build, an H7 (or a clean F7) is the safe choice. F4 is fine for budget and micro builds.</p><h3>Gyro / IMU</h3><p>The gyro measures rotation rate; the accelerometer (together they form the IMU) measures gravity for self-leveling modes. Quality matters because gyro noise forces heavier filtering, which adds latency. Common parts: the older <code>MPU6000</code> (SPI, very clean, beloved), and newer <code>ICM-42688-P</code> and <code>BMI270</code> (the BMI270 is the modern default after MPU6000 went scarce). Confirm the gyro is on the <strong>SPI</strong> bus, not I2C — SPI supports the fast sample rates FPV needs.</p><h3>UARTs: count them before you buy</h3><p>A UART is a hardware serial port (a TX and RX pad pair). Every smart peripheral wants one. Tally your peripherals against available UARTs before buying:</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>uart-plan (H7 FC, 6 UARTs)</span></div><div class='term-body'>UART1  ->  ELRS receiver        <span class='dim'>(Serial RX)</span>\nUART2  ->  digital VTX / air unit (MSP+OSD)\nUART3  ->  GPS module           <span class='dim'>(NMEA/UBX)</span>\nUART4  ->  smartaudio (analog VTX control)\nUART5  ->  ESC telemetry\nUART6  ->  <span class='ok'>spare</span>\nI2C    ->  compass (magnetometer)\nSoftSerial -> backup if you run out</div></div><p>Other pads to check: a dedicated <strong>RX</strong>/SBUS pad, <strong>5V</strong> and <strong>9V/10V</strong> regulated outputs (the VTX often wants 9V), a <strong>cam</strong> pad with on-screen-display passthrough, an onboard <strong>OSD</strong> chip (AT7456 for analog), a <strong>barometer</strong>, <strong>blackbox</strong> flash for logging, and an LED pad.</p><div class='box tip'><div class='bt'>SoftSerial is a fallback, not a plan.</div> Betaflight can emulate extra serial ports in software, but they are slower and use CPU. If your peripheral list needs five UARTs, buy a board with five real ones rather than relying on SoftSerial.</div><div class='box danger'><div class='bt'>Check the BEC current.</div> The FC's 5V/9V regulators have current limits (often ~2-3A). A power-hungry digital VTX plus camera plus GPS can exceed a weak 5V BEC and brown out the FC mid-flight. Read the regulator rating on the spec page.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Map a real FC's ports to a peripheral plan.</p><ol><li>Open a real H7 or F7 FC product page and list its UARTs, regulated outputs, and pads.</li><li>List your peripherals: RX, VTX, GPS, ESC telemetry, camera control.</li><li>Assign each peripheral to a specific UART or pad in a table.</li><li>Confirm the 9V output exists if your VTX needs it, and the 5V BEC current covers your loads.</li></ol></div></div>"},{"id":"p1-6","part":"01 · Components","nav":"Propellers","num":"1.6","kicker":"Part 01 · Lesson 6","title":"Propellers: Size, Pitch & Blade Count","html":"<h3>Decoding a prop code</h3><p>A prop labeled <code>5x4.3x3</code> reads as <strong>diameter × pitch × blade count</strong>: 5-inch diameter, 4.3-inch pitch, 3 blades. Some props add an extra digit (e.g. <code>51466</code> = 5.1\" dia, 4.6\" pitch, 6... no — 51466 means 5.1 diameter, 4.6 pitch, with the trailing digits being a model code). Stick to the explicit <code>D x P x B</code> form and you'll never be confused.</p><table><thead><tr><th>Field</th><th>Means</th><th>More of it →</th></tr></thead><tbody><tr><td>Diameter</td><td>Tip-to-tip inches</td><td>More thrust + grip, more current, set by frame</td></tr><tr><td>Pitch</td><td>Inches it would travel per rotation in solid material</td><td>More top speed, more current, less low-end grip</td></tr><tr><td>Blade count</td><td>2, 3, or more</td><td>More grip + control, less efficiency, more drag</td></tr></tbody></table><h3>Pitch is your gearing</h3><p>Think of pitch like a transmission. Low pitch (e.g. <code>3.5</code>) is a low gear: snappy response, strong low-end grip, runs cooler, great for technical freestyle and proximity. High pitch (e.g. <code>4.9+</code>) is overdrive: higher top speed and a longer punch, but it draws more amps, runs hotter, and feels less precise at part throttle.</p><h3>Blade count</h3><ul><li><strong>2-blade (bi-blade):</strong> most efficient, fastest, least drag — racing and speed runs. Less grip, can feel loose.</li><li><strong>3-blade (tri-blade):</strong> the universal freestyle choice. Excellent control and grip, smoother, slightly less efficient. The default.</li><li><strong>4+ blade:</strong> maximum grip and locked-in feel for tight cinematic work or ducted whoops, at a real efficiency and current cost.</li></ul><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>prop-pick by mission</span></div><div class='term-body'>Racing      -> 5x4.8x2  <span class='ok'>(low drag, top speed, efficient)</span>\nFreestyle   -> 5x4.3x3  <span class='ok'>(grip + control, all-round)</span>\nCruise/LR   -> 7x4x3    <span class='ok'>(big dia, low pitch, high g/W)</span>\nCinematic   -> 5x4.3x4  <span class='dim'>(locked-in, draggy)</span></div></div><h3>Practical notes</h3><p>Props are directional and come as CW/CCW sets — Betaflight's default \"props-out\" config spins front motors outward. The number molded near the hub or the leading-edge shape tells direction. Material is usually polycarbonate; cheap props flex and lose efficiency, while a quality prop holds its shape under load. Balance matters less than it used to, but a chipped or cracked prop must be retired immediately — it causes vibration that the gyro picks up as noise and can shatter at full throttle.</p><div class='box danger'><div class='bt'>Props are blades.</div> A 5\" tri-blade at full throttle spins fast enough to cut to the bone. Never spin a quad with props on near people or your face. Inspect every prop before flight; replace any with chips, cracks, or a bent hub. Treat a quad with props on as armed.</div><div class='box tip'><div class='bt'>One variable at a time.</div> When tuning prop choice, change only pitch OR blade count between packs so you can feel what each does. Log motor temps after each flight to catch an over-propped setup.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Compare three props and assign each a mission.</p><ol><li>Pick three 5\" props differing in pitch and blade count (e.g. 5x4.8x2, 5x4.3x3, 5x4.3x4).</li><li>For each, predict top speed, low-end grip, efficiency, and current draw.</li><li>Assign one to racing, one to freestyle, one to efficient cruising.</li><li>Write the one-sentence reason for each choice.</li></ol></div></div>"},{"id":"p1-7","part":"01 · Components","nav":"Batteries","num":"1.7","kicker":"Part 01 · Lesson 7","title":"LiPo & Li-ion: S-Count, mAh, C-Rating & Connectors","html":"<h3>Decoding a label</h3><p>A pack marked <code>6S 1300mAh 100C</code> tells you everything you need. Read it field by field:</p><table><thead><tr><th>Spec</th><th>Means</th></tr></thead><tbody><tr><td>6S</td><td>6 cells in series. LiPo nominal 3.7V/cell → 22.2V nominal, 25.2V at full charge (4.2V/cell)</td></tr><tr><td>1300mAh</td><td>Capacity: 1.3 amp-hours of charge stored</td></tr><tr><td>100C</td><td>Discharge rate: max continuous current = C × capacity = 100 × 1.3A = 130A</td></tr></tbody></table><p>The S-count (in series) sets voltage; a P-count (in parallel, common in Li-ion packs like 4S2P) multiplies capacity. Full and empty voltages: LiPo charges to <strong>4.2V/cell</strong>, you land at ~<strong>3.5V/cell</strong> under load, and you never store at full.</p><h3>C-rating and real current</h3><p>C-rating times capacity gives the claimed max continuous current. Honest LiPos: a true 100C 1300mAh delivers 130A continuous — comfortably above a 5\" quad's ~120A peak (4 motors × ~30A). Manufacturers exaggerate C-ratings, so judge a pack by how little voltage it sags under a punch, not the printed number. Sag below 3.3V/cell under load means the pack can't keep up.</p><h3>LiPo vs Li-ion</h3><table><thead><tr><th></th><th>LiPo</th><th>Li-ion (e.g. 18650, 21700)</th></tr></thead><tbody><tr><td>Energy density</td><td>Lower</td><td><strong>Higher</strong> (much more Wh per gram)</td></tr><tr><td>Discharge rate</td><td><strong>Very high</strong> (50-150C)</td><td>Low (~10-35A/cell)</td></tr><tr><td>Best for</td><td>Racing, freestyle, punch</td><td>Long range / endurance cruising</td></tr><tr><td>Flight time</td><td>3-5 min</td><td>20-40+ min on a 7\"</td></tr></tbody></table><p>Choose LiPo when you need raw power and burst current. Choose Li-ion for a 7\" long-range rig flown at gentle throttle, where energy density buys huge flight times — but never punch a Li-ion pack hard; it sags badly and overheats.</p><h3>Connectors</h3><ul><li><strong>XT60:</strong> standard for 5\"/6\"/7\" packs, handles the full current.</li><li><strong>XT30:</strong> lighter, for 3\" / toothpick (sub-~30A).</li><li><strong>BT2.0 / PH2.0 / GNB27:</strong> whoop and 1S micro packs.</li><li><strong>Balance lead (JST-XH):</strong> the extra connector that lets the charger balance each cell — always charge balanced.</li></ul><div class='box danger'><div class='bt'>LiPo safety — non-negotiable.</div> Charge on a fireproof surface and never unattended. Store at <strong>3.8V/cell (storage charge)</strong>, not full. Never over-discharge below 3.0V/cell. Never puncture, crush, or fly a <strong>puffed</strong> pack — a swollen cell is failing and must be retired and disposed of properly (discharge to 0V in salt water, then recycle). A LiPo fire is violent and self-sustaining.</div><div class='box tip'><div class='bt'>Set a sane low-voltage alarm.</div> A buzzer or OSD warning at 3.5V/cell under load tells you to land. Repeatedly draining packs flat destroys their C-rating and lifespan.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Decode three real battery labels.</p><ol><li>Find three packs: e.g. 6S 1300mAh 100C LiPo, 4S 1500mAh 75C LiPo, 4S2P Li-ion.</li><li>For each, compute full voltage, nominal voltage, and max continuous current.</li><li>State which suits a racing quad and which suits a long-range rig, and why.</li><li>Confirm each pack's connector matches its intended quad class.</li></ol></div></div>"},{"id":"p1-8","part":"01 · Components","nav":"RX, Camera & VTX","num":"1.8","kicker":"Part 01 · Lesson 8","title":"The Control & Video Chain: Receiver, FPV Camera, VTX & Antennas","html":"<h3>Two independent radio links</h3><p>Every FPV quad runs two separate RF links: the <strong>control link</strong> (your sticks → receiver) and the <strong>video link</strong> (camera → VTX → goggles). They use different frequencies and must not be confused. Both need matched, well-mounted antennas to work at range.</p><h3>The receiver (RX)</h3><p>The receiver pairs (\"binds\") to your transmitter and feeds stick data to an FC UART, typically via the serial protocol. The modern standard is <strong>ExpressLRS (ELRS)</strong> at 2.4GHz or 915MHz — open-source, extremely long range, low latency. Older systems include Crossfire (TBS, 900MHz) and FrSky. Match the RX to your TX protocol: an ELRS RX needs an ELRS TX module. Wire it as <code>5V / GND / TX / RX</code> to a spare UART and select the protocol in Betaflight's Receiver tab. The RX antenna should be mounted away from the VTX antenna and carbon, ideally pointing up.</p><h3>Analog vs digital video</h3><table><thead><tr><th></th><th>Analog</th><th>Digital (DJI / HDZero / Walksnail)</th></tr></thead><tbody><tr><td>Image</td><td>Lower res, gracefully degrades to static</td><td>Sharp HD, breaks up suddenly at the edge</td></tr><tr><td>Latency</td><td>Lowest (~ms)</td><td>Low but higher than analog (HDZero is close)</td></tr><tr><td>Weight/cost</td><td>Light, cheap</td><td>Heavier air unit, pri
