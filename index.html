ut built for <strong>low latency</strong> (as low as ~12-20ms) and <strong>graceful, analog-like degradation</strong>: instead of freezing it tears/breaks up so you can still fly out of trouble. Lower resolution than DJI/Walksnail and shorter range, but the racer's and pylon pilot's choice.</li><li><strong>Analog (5.8GHz)</strong> — lowest latency (~5-15ms), cheapest, lightest, and degrades to static gradually so you always 'see something'. Range with good antennas is respectable and it penetrates a bit better than locked digital. The image is low-res and noisy by modern standards.</li></ul><table><thead><tr><th>System</th><th>Latency</th><th>Image</th><th>Range</th><th>Failure mode</th><th>Cost</th></tr></thead><tbody><tr><td>DJI O3/O4</td><td>~30-45ms</td><td>Excellent 1080p+</td><td>Longest (10km+)</td><td>Freezes / cuts out</td><td>High</td></tr><tr><td>Walksnail</td><td>~22-35ms</td><td>Very good</td><td>Long</td><td>Freezes / breaks up</td><td>Mid-high</td></tr><tr><td>HDZero</td><td>~12-20ms</td><td>Good (lower res)</td><td>Medium</td><td>Graceful tear (analog-like)</td><td>Mid</td></tr><tr><td>Analog 5.8</td><td>~5-15ms</td><td>Low-res / noisy</td><td>Medium-long</td><td>Gradual static</td><td>Low</td></tr></tbody></table><h4>Choosing for long range</h4><p>For pure long-range cruising where image clarity and maximum reach matter and you are not throwing tight tricks, <strong>DJI O3/O4</strong> is the standard answer: its range and clarity are unmatched, and its higher latency is irrelevant at cruise. If budget or an open ecosystem matters, <strong>Walksnail</strong> is the value pick. <strong>HDZero</strong> and <strong>analog</strong> shine where low latency and graceful failure beat outright range, racing, proximity, and bando flying, less so for distance records.</p><div class='box tip'><div class='bt'>Failure mode is a safety feature.</div> A digital feed that freezes on a solid blue/black frame gives you nothing to fly on; analog and HDZero give you a degraded-but-usable picture. For long range with locked digital, plan your abort on RSSI/LQ and bitrate warnings, not on waiting for the picture to die.</div><div class='box danger'><div class='bt'>Match VTX power to the law and the link.</div> Digital VTX power (and analog) is regulated; many regions cap 5.8GHz output and require an operator license for higher power. Do not exceed legal limits to chase range; raise antenna gain and altitude instead. Verify current local rules.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Build a comparison table and choose one system for long range.</p><ol><li>Make columns: range, latency, penetration/graceful-failure, image quality, weight, cost.</li><li>Fill rows for DJI O3/O4, Walksnail, HDZero, and analog from this lesson plus current spec sheets.</li><li>State your mission: long cruise vs proximity/racing.</li><li>Pick one system and write two sentences justifying it on range and failure behavior for that mission.</li></ol></div></div>"},{"id":"p8-6","part":"08 · Long-Range & HD","nav":"Ground Stations & Trackers","num":"8.6","kicker":"Part 08 · Lesson 6","title":"Ground Stations & Antenna Trackers","html":"<h3>Why a ground station</h3><p>At long range your high-gain directional antenna has a narrow beam, maybe 30-60 degrees, that must stay pointed at a moving aircraft kilometres away. Holding a patch by hand and tracking the drone gets exhausting and inaccurate. A <strong>ground station</strong> mounts your receivers, antennas, display/goggles, and power in one rig, and an <strong>antenna tracker</strong> automatically rotates the directional antenna to follow the aircraft so it never leaves the beam.</p><h4>How a tracker knows where to point</h4><p>The tracker needs the aircraft's position relative to the ground station. Two common methods:</p><ul><li><strong>GPS telemetry</strong> — the aircraft sends its GPS coordinates and altitude down the telemetry link (MAVLink, CRSF/ELRS telemetry, or a dedicated data link). The tracker, knowing its own GPS position and a calibrated north reference, computes the azimuth and elevation to the aircraft and slews its servos/motors to match.</li><li><strong>RSSI/signal tracking</strong> — simpler trackers dither the antenna slightly and steer toward the direction of strongest signal. No GPS needed but slower and less precise; fine as a backup or for fixed corridors.</li></ul><h4>Anatomy of a long-range ground station</h4><ul><li><strong>Pan/tilt mount</strong> — two servos or geared motors giving azimuth (pan) and elevation (tilt). It must hold the antenna steady in wind.</li><li><strong>Tracker controller</strong> — boards like the open-source <strong>U360GTS</strong>, <strong>ZS6BUJ / Mavlink_FrSky tracker</strong>, or a TBS tracker. It reads telemetry, holds a compass/GPS for its own heading, and drives the servos.</li><li><strong>Directional antenna</strong> — patch or helical on the moving head; often paired with a fixed omni for a diversity ground RX.</li><li><strong>Video RX (diversity)</strong> — e.g. a goggle module or standalone diversity receiver fed by both the tracked directional and the static omni.</li><li><strong>Control link TX with telemetry</strong> — your ELRS/Crossfire TX module, providing the downlink that carries GPS for the tracker.</li><li><strong>Mast / tripod</strong> — raise the whole rig 2-3m+ to push the radio horizon out (see Lesson 8.2).</li><li><strong>Power</strong> — a separate battery/power bank for the tracker and RX so a goggle battery dying doesn't kill everything.</li></ul><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>ground station block diagram</span></div><div class='term-body'>  [aircraft GPS]\n        | telemetry (CRSF/MAVLink)\n        v\n  [control TX module] --&gt; [tracker controller] --&gt; [pan/tilt servos]\n        |                      ^   (GPS + compass)        |\n        |                      |                          v\n        |                 own position            [DIRECTIONAL antenna]\n        |                                                  |\n  [video diversity RX] &lt;-------+-- [static OMNI] ----------+\n        |\n        v\n     [goggles / monitor]   <span class='dim'>+ separate battery for RX/tracker</span></div></div><div class='box tip'><div class='bt'>Calibrate heading before every session.</div> A tracker that is 10 degrees off in its north reference will mis-aim by 10 degrees, enough to lose a narrow-beam helical at distance. Level the mount, set home GPS, and calibrate the compass/heading at the actual flying spot, not at home.</div><div class='box danger'><div class='bt'>Keep a manual fallback.</div> If the tracker faults or loses telemetry, you must still be able to fly home. Keep the static omni on diversity so you never depend solely on the directional, and rehearse pointing it manually toward home.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Spec a ground station with an antenna tracker and diagram it.</p><ol><li>List components: pan/tilt mount, tracker controller, directional + omni antennas, diversity video RX, control TX with telemetry, mast, power.</li><li>State how the tracker gets aircraft position (GPS telemetry over which link).</li><li>Draw the signal/data flow from aircraft GPS to servos and from antennas to goggles.</li><li>Note your manual fallback if telemetry or the tracker fails.</li></ol></div></div>"},{"id":"p8-7","part":"08 · Long-Range & HD","nav":"Batteries for Range","num":"8.7","kicker":"Part 08 · Lesson 7","title":"Batteries for Range: Li-ion Packs & Energy Density","html":"<h3>Range is an energy problem</h3><p>For freestyle you pick a battery for raw current; for long range you pick it for <strong>energy density</strong>, watt-hours per gram. The clear winner is <strong>lithium-ion</strong> (Li-ion), not LiPo. A LiPo of 6S 1300mAh might store ~29Wh; a Li-ion 6S2P pack of the same weight can store far more energy because Li-ion cells pack ~250-300Wh/kg versus ~150-200Wh/kg for high-discharge LiPo. The cost is current capability: Li-ion sags hard under heavy load, so it suits efficient, gently flown long-range rigs, not punchy acro.</p><h4>Cell choices</h4><table><thead><tr><th>Cell</th><th>Capacity</th><th>Max continuous</th><th>Best for</th></tr></thead><tbody><tr><td>Molicel P42A (21700)</td><td>4200mAh</td><td>~45A</td><td>Higher-current long range, 5in LR</td></tr><tr><td>Molicel P45B (21700)</td><td>4500mAh</td><td>~45A</td><td>Top energy + decent current</td></tr><tr><td>Samsung 50S / 40T (21700)</td><td>4000-5000mAh</td><td>~30-45A</td><td>Balanced LR</td></tr><tr><td>Sony/Murata VTC6 (18650)</td><td>3000mAh</td><td>~20-30A</td><td>Light 18650 builds</td></tr><tr><td>Panasonic NCR18650GA</td><td>3450mAh</td><td>~10A</td><td>Max range, very gentle flying</td></tr></tbody></table><h4>S and P configuration</h4><p><strong>S</strong> (series) sets voltage, <strong>P</strong> (parallel) sets capacity and current. A <code>6S2P</code> pack is twelve cells: six in series for 6S voltage (~25.2V full), two of those strings in parallel to double capacity and halve per-cell current. More P = more range and gentler per-cell load (less sag, less heat, longer cell life). A typical 5-inch long-range cruiser runs <strong>6S2P of P42A/P45B</strong> for ~8400-9000mAh.</p><h4>Estimating flight time</h4><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>flight time estimate</span></div><div class='term-body'><span class='dim'>Pack Wh =</span> nominal_V * Ah\n  6S2P P42A: 6*3.6V * 8.4Ah = <span class='ok'>~181 Wh</span>\n\n<span class='dim'>cruise power draw (efficient 5in LR) ~ 150-200 W</span>\n<span class='dim'>usable energy =</span> 181 * 0.85 (don't drain to 0) = ~154 Wh\n<span class='dim'>time =</span> 154 Wh / 175 W = <span class='ok'>~0.88 h = ~53 min</span></div></div><p>Numbers vary with weight, prop efficiency, wind, and how hard you fly, but tens of minutes is realistic for Li-ion where LiPo gives 4-6. Always reserve ~15-20% for headwind home and a safety margin; never plan to land at 0%.</p><div class='box danger'><div class='bt'>Li-ion safety is non-negotiable.</div> Charge Li-ion at the cell maker's rate (often ~0.5-1C, far slower than LiPo); never fast-charge no-name cells. Always <strong>balance charge</strong> a multi-cell pack and check that cells stay within ~0.03V of each other. Respect each cell's continuous-current limit, total draw must not exceed (cells in parallel x cell max A). Do not over-discharge below ~2.8-3.0V/cell; it permanently damages and can make cells unsafe. Charge on a fireproof surface, never unattended, and retire any cell that is hot, dented, leaking, or holding low voltage.</div><div class='box tip'><div class='bt'>Spot-weld, don't solder cells directly.</div> Soldering Li-ion terminals dumps heat into the cell and risks damage. Use a spot welder with nickel strip, or buy pre-built packs. Add a balance lead and a quality connector rated for your current.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Spec a Li-ion pack and estimate flight time + safe charging.</p><ol><li>Pick a cell (e.g. P42A) and an S/P config (e.g. 6S2P) for a long-range 5-inch.</li><li>Compute pack Wh = nominal_V x Ah and check max continuous current vs your peak draw.</li><li>Estimate cruise power and divide usable Wh by it for flight time; reserve 15-20%.</li><li>Write the charge routine: balance charge, charge rate in amps (~0.5-1C), and the low-voltage cutoff you will respect.</li></ol></div></div>"},{"id":"p8-8","part":"08 · Long-Range & HD","nav":"Range Safety & Ethics","num":"8.8","kicker":"Part 08 · Lesson 8","title":"Range Safety, Failsafe & Legal/Ethical Limits","html":"<h3>The further you fly, the more can go wrong</h3><p>Long range multiplies risk: more time aloft, more distance to fall over people or property, more chances to lose link, and more temptation to push past what is legal or sensible. A professional treats range as something earned through margin and planning, not bravado. Three things are non-negotiable before any range flight: a <strong>tested failsafe</strong>, respect for the <strong>legal VLOS rule</strong>, and clear <strong>airspace</strong>.</p><h4>Failsafe and Return-to-Home</h4><p>Failsafe is what the aircraft does when it loses the control link. The only acceptable long-range failsafe is a working <strong>GPS Rescue / Return-to-Home (RTH)</strong> that climbs to a safe altitude, flies back toward the home point, and either lands or holds. A 'drop / motors-off' failsafe is fine for a 30m freestyle quad over a field but catastrophic at range.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>Betaflight GPS Rescue checklist</span></div><div class='term-body'><span class='dim'>set</span> failsafe_procedure = <span class='ok'>GPS_RESCUE</span>\n<span class='dim'>set</span> gps_rescue_min_sats = 8        <span class='dim'>(good 3D fix before arming)</span>\n<span class='dim'>set</span> gps_rescue_initial_altitude = 50  <span class='dim'>(clears trees)</span>\n<span class='dim'>set</span> gps_rescue_descent_dist = 30\n<span class='dim'>set</span> gps_rescue_sanity_checks = ON\n<span class='ok'>Arm only after Home is set + sat count is solid</span></div></div><h4>Test it on the bench, then in the field</h4><p>With <strong>props off</strong>, power the quad, get a GPS fix, then turn off the radio and confirm the FC enters the failsafe/RTH state in the OSD. Then do a short, close-range live test: fly out a safe distance over open ground, deliberately trigger failsafe (switch or power off TX briefly) and watch it climb and return. Never trust an untested RTH at distance.</p><h4>Legal line-of-sight and airspace</h4><div class='box law'><div class='bt'>VLOS is the law, not a suggestion.</div> In the US (FAA Part 107 and recreational rules under 49 USC 44809) and the EU (EASA Open category) you must maintain <strong>visual line of sight</strong> with the aircraft, by yourself or a visual observer in direct communication, at all times. Flying by FPV requires a spotter who maintains VLOS. BVLOS needs a specific waiver/authorization. Stay clear of controlled airspace without LAANC/authorization, keep below the legal altitude ceiling (typically 400ft AGL in the US), avoid no-fly zones, and never fly over people or moving vehicles outside the rules. Regulations change, verify current FAA / your national authority rules before each flight.</div><h4>Ethics</h4><p>Beyond the law: do not film or overfly people who have not consented, avoid wildlife and livestock, respect private property and quiet, and yield absolutely to any crewed aircraft. The hobby's freedom depends on pilots not giving regulators reasons to clamp down.</p><div class='box danger'><div class='bt'>Abort early, abort cheap.</div> The cost of turning back at 50% LQ is a shorter flight. The cost of pressing on is a flyaway over a road. Set hard abort thresholds before you launch and obey them even when the flight feels fine.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Write a long-range flight safety plan with an abort decision tree.</p><ol><li>Document your failsafe/RTH config (procedure, min sats, RTH altitude) and how you bench- and field-tested it.</li><li>State the legal VLOS constraint for your location and whether you have a spotter; note your altitude ceiling and airspace check (e.g. LAANC).</li><li>Set hard abort thresholds: minimum LQ/RSSI, minimum battery %, video-bitrate or freeze trigger, and weather limits.</li><li>Write an abort decision tree: if LQ &lt; X turn home; if battery &lt; Y land now; if video freezes &gt; N seconds trigger RTH; if any crewed aircraft appears, descend and land.</li></ol></div></div>"},{"id":"p9-1","part":"09 · Laws & Safety","nav":"Rules Change — Verify","num":"9.1","kicker":"Part 09 · Lesson 1","title":"How to Read Drone Law: Rules Change, Always Verify the Source","html":"<h3>This part is a map, not the territory</h3><p>Drone regulation is one of the fastest-moving areas of aviation law. The rules described in this part reflect the US framework as of the time of writing, but registration thresholds, Remote ID enforcement dates, recreational test details, and import policy can and do change. Treat every number and procedure here as a <em>starting point</em> you will re-verify against the primary source before you fly. This lesson teaches you the durable skill that outlasts any specific rule: how to find and trust authoritative sources.</p><h3>Who actually makes the rules (US)</h3><ul><li><strong>FAA (Federal Aviation Administration)</strong> — the national authority for the airspace. Federal rules preempt the airspace itself: altitude, airspace authorizations, registration, Remote ID, and operating rules (recreational Exception vs Part 107) all come from the FAA.</li><li><strong>Congress / NDAA</strong> — statutes (laws passed by Congress) that direct the FAA and shape things like the recreational Exception and the foreign-drone debate covered in Lesson 8.</li><li><strong>State & local government</strong> — cannot regulate the airspace, but <em>can</em> regulate takeoff/landing, trespass, privacy, harassment, and park use. A city can ban launching from a public park even where the FAA allows the flight.</li><li><strong>Land managers</strong> — the National Park Service, US Forest Service, BLM, and private landowners set their own surface rules.</li></ul><div class='box law'><div class='bt'>Layered rules.</div> A flight can be perfectly legal under the FAA and still illegal under a city ordinance or park rule. You must clear <em>every</em> layer, not just the federal one.</div><h3>What counts as an authoritative source</h3><p>Rank your sources. Primary government pages beat forums, YouTube, and even this course.</p><table><thead><tr><th>Source</th><th>Trust</th><th>Use for</th></tr></thead><tbody><tr><td>faa.gov/uas</td><td>Primary</td><td>Registration, Part 107, Remote ID, recreational rules</td></tr><tr><td>FAA B4UFLY / Aloft / approved LAANC apps</td><td>Primary data</td><td>Airspace, LAANC authorizations</td></tr><tr><td>tfr.faa.gov</td><td>Primary</td><td>Temporary Flight Restrictions</td></tr><tr><td>Federal Register / eCFR (14 CFR Part 107)</td><td>Primary (legal text)</td><td>Exact regulatory wording</td></tr><tr><td>Manufacturer docs (DJI, etc.)</td><td>Secondary</td><td>Whether your model has built-in Remote ID</td></tr><tr><td>Forums, YouTube, this course</td><td>Tertiary</td><td>Orientation only — always confirm</td></tr></tbody></table><div class='box danger'><div class='bt'>Safety mindset.</div> The same discipline applies to flight safety. Before every session you will repeat a verification ritual: current TFRs, battery condition, firmware, and a props-off arm test. Legal compliance and physical safety are the same habit — check the source, every time.</div><h3>Flying abroad or out of state</h3><p>The moment you cross a national border, the FAA framework stops applying. The EU uses EASA categories (Open/Specific/Certified) with their own class marks and operator IDs; the UK CAA, Transport Canada, and CASA in Australia each differ again. Never assume your US registration or TRUST certificate carries over. Search the destination country's civil aviation authority before you pack the drone.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>verification log (example)</span></div><div class='term-body'><span class='dim'># keep this with your gear, update before each trip</span>\nFAA UAS rules ........ verified 2026-06-01 (faa.gov/uas)\nRemote ID status ..... verified 2026-06-01\nLocal park rules ..... verified 2026-05-20 (city.gov)\nNEXT RE-CHECK ........ before next flight day</div></div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Build your authoritative-source bookmark set and a verification log.</p><ol><li>Bookmark <code>faa.gov/uas</code>, <code>tfr.faa.gov</code>, and your LAANC app of choice.</li><li>If you fly outside the US, bookmark that country's civil aviation authority page too.</li><li>Create a verification log (paper card or note) listing each source and the date you last checked it.</li><li>Write a personal rule: \"I re-verify TFRs and airspace before every flight day.\"</li></ol></div></div>"},{"id":"p9-2","part":"09 · Laws & Safety","nav":"Registration","num":"9.2","kicker":"Part 09 · Lesson 2","title":"FAA Registration: Who Must Register & How","html":"<h3>The weight threshold</h3><p>In the US, the dividing line for registration is <strong>0.55 lb (250 g)</strong>. If your aircraft weighs more than 250 g at takeoff (including battery, props, and any payload like a camera or cargo), you must register it with the FAA before you fly outdoors. Sub-250 g drones flown <em>recreationally</em> are exempt from registration — which is exactly why the DJI Mini line is built to land just under 250 g. Note the asymmetry: if you fly <em>any</em> drone commercially under Part 107, it must be registered regardless of weight.</p><table><thead><tr><th>Your drone</th><th>Use</th><th>Register?</th></tr></thead><tbody><tr><td>Under 250 g</td><td>Recreational</td><td>No</td></tr><tr><td>Under 250 g</td><td>Part 107 / commercial</td><td>Yes</td></tr><tr><td>250 g and over</td><td>Any</td><td>Yes</td></tr></tbody></table><div class='box tip'><div class='bt'>Weigh it for real.</div> Don't trust the spec sheet. A Mini with ND filters, a prop guard, or a heavier aftermarket battery can cross 250 g. Put it on a kitchen scale, fully assembled, ready to fly.</div><h3>Two registration tracks</h3><ul><li><strong>Recreational (Exception for Limited Recreational Operations)</strong> — one registration number covers <em>all</em> the drones you fly for fun. Cost is a small fee (historically $5), valid 3 years. You must be 13 or older to register; under 13 needs an adult to register for them.</li><li><strong>Part 107</strong> — each aircraft is registered individually and gets its own number. Same fee per aircraft, 3-year validity.</li></ul><p>Both are done at the FAA's <strong>DroneZone</strong> portal (<code>faadronezone.faa.gov</code>). You'll create an account, choose the correct track (recreational vs Part 107 — they are separate dashboards), enter the drone make/model and serial, pay, and receive a registration certificate as a PDF.</p><h3>Marking the aircraft</h3><div class='box law'><div class='bt'>Required marking.</div> Your registration number must be legible and on the <em>exterior</em> of the aircraft. Since a 2019 rule, it can no longer be hidden in a battery compartment — the number must be visible without tools so first responders can read it. A label on the underside of the body shell is standard.</div><p>Use a label maker or a fine paint pen. Cover it with clear tape so it survives crashes and rain. Carry proof of registration (the PDF on your phone is fine) whenever you fly; an FAA inspector or law enforcement officer can ask for it.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>DroneZone flow</span></div><div class='term-body'>1. Create account at faadronezone.faa.gov\n2. Choose dashboard:\n   <span class='ok'>Recreational Flyers</span>  -> one number, all drones\n   <span class='am'>Part 107</span>           -> register each aircraft\n3. Enter make / model / serial\n4. Pay fee (~$5), valid 3 years\n5. Download certificate PDF\n6. Label exterior with the number, cover with clear tape</div></div><div class='box danger'><div class='bt'>Pre-flight safety, not just paperwork.</div> Registration proves the drone is yours; it does nothing for safety. Pair it with a physical check: props seated and undamaged, battery not puffed, firmware current. A loose prop or a swollen LiPo will ruin your day far faster than a missing label.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Register your aircraft (or walk the full DroneZone flow) and mark it.</p><ol><li>Weigh your drone ready-to-fly on a kitchen scale; record grams.</li><li>If 250 g+ (or any Part 107 use), create a DroneZone account and complete registration.</li><li>Download the certificate PDF to your phone.</li><li>Label the exterior with your number and seal it with clear tape; photograph the placement.</li></ol></div></div>"},{"id":"p9-3","part":"09 · Laws & Safety","nav":"TRUST vs Part 107","num":"9.3","kicker":"Part 09 · Lesson 3","title":"Recreational (TRUST) vs Commercial (Part 107)","html":"<h3>The one question that decides your path</h3><p>The FAA does not care how much fun you're having — it cares about <strong>purpose</strong>. Ask: <em>does this flight produce anything of value to anyone, including me?</em> If the answer is no — you fly purely for personal enjoyment and the footage stays a personal memory — you may operate under the <strong>Exception for Limited Recreational Operations</strong>. The moment the flight serves a business purpose, you need a <strong>Part 107 Remote Pilot Certificate</strong>.</p><div class='box law'><div class='bt'>Commercial is broader than you think.</div> Posting footage to a monetized YouTube channel, shooting a friend's wedding \"for free\" as a favor that builds your portfolio, inspecting your own rental property, or mapping a field for your farm — all of these have been treated as non-recreational. When in doubt, get Part 107. It is the safer default.</div><h3>The recreational path: TRUST</h3><p>Recreational flyers must pass <strong>TRUST</strong> (The Recreational UAS Safety Test). It is <em>free</em>, taken online through an FAA-approved test administrator, has no expiration, and cannot be failed in a meaningful sense — you cannot move past a question until you answer it correctly, so everyone who finishes passes. It takes about 30 minutes and covers basic airspace, where you can fly, and safety.</p><ul><li>You receive a <strong>completion certificate</strong> (PDF). Save it — there is no central lookup. If you lose it, you retake the test.</li><li>Carry it (phone is fine) when flying recreationally.</li><li>Recreational flyers must also follow the FAA's recreational rules and fly within the safety guidelines of a recognized community-based organization (CBO).</li></ul><h3>The commercial path: Part 107</h3><p>Part 107 is a real FAA airman certificate. You must be 16+, pass a TSA security screening, and pass the <strong>Aeronautical Knowledge Test</strong> — a ~60-question proctored exam at an FAA testing center covering airspace, weather, sectional charts, loading, and regulations. You need ~70% to pass. The certificate requires a recurrent (free online) training every 24 months to stay current.</p><table><thead><tr><th></th><th>TRUST (Recreational)</th><th>Part 107 (Commercial)</th></tr></thead><tbody><tr><td>Cost</td><td>Free</td><td>~$175 exam fee</td></tr><tr><td>Where</td><td>Online, self-paced</td><td>Proctored testing center</td></tr><tr><td>Age</td><td>None to take (13+ to register drone)</td><td>16+</td></tr><tr><td>Renewal</td><td>Never expires</td><td>Recurrent every 24 months</td></tr><tr><td>Lets you</td><td>Fly for fun only</td><td>Fly for any purpose, incl. business</td></tr><tr><td>Waivers (e.g. night, BVLOS)</td><td>No</td><td>Yes, via FAA waiver</td></tr></tbody></table><div class='box tip'><div class='bt'>Part 107 unlocks more.</div> Beyond legality, Part 107 lets you request waivers for operations recreational flyers can't do, and it's table stakes for insurance and client work. Many serious hobbyists get it just for the airspace knowledge.</div><div class='box danger'><div class='bt'>Certificate is not competence.</div> Passing a test does not make you safe. Keep your props-off habits, your battery discipline, and your VLOS rules no matter which path you're on. The FAA can revoke either credential for reckless operation.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Take TRUST and decide whether you actually need Part 107.</p><ol><li>Find an FAA-approved TRUST administrator and complete the free test.</li><li>Download and save the completion certificate to your phone and a backup.</li><li>Write down your intended uses (YouTube? client photos? just fun?).</li><li>For each use, decide: recreational or commercial? If any is commercial, note that Part 107 is required.</li></ol></div></div>"},{"id":"p9-4","part":"09 · Laws & Safety","nav":"Remote ID","num":"9.4","kicker":"Part 09 · Lesson 4","title":"Remote ID: Broadcast vs Module","html":"<h3>What Remote ID is</h3><p>Remote ID (RID) is a \"digital license plate\" for drones. While flying, your aircraft continuously <strong>broadcasts</strong> — over Wi-Fi/Bluetooth, locally, not over the internet — a message anyone with a compatible receiver app can pick up. It is the FAA's foundation for safely integrating drones into the airspace and for accountability (law enforcement can identify an aircraft near an airport or a crowd).</p><p>The broadcast message includes, roughly: a unique ID for the aircraft, its current position and altitude, its velocity, the position of the control station (the pilot's takeoff point), an emergency status, and a timestamp. It does <em>not</em> publish your name or address — those stay in the FAA registration database, not in the air.</p><div class='box law'><div class='bt'>Who must comply.</div> Generally, any drone that requires registration must also meet Remote ID when operated. Sub-250 g recreational drones that don't require registration are exempt from RID. As always, confirm current applicability on faa.gov — enforcement dates and thresholds have shifted before.</div><h3>Three ways to comply</h3><ol><li><strong>Standard Remote ID (built-in broadcast)</strong> — the drone has RID baked into the firmware/hardware and broadcasts the full message set including takeoff location. Most current DJI, Autel, and Skydio consumer drones ship this way. Check the manufacturer's compliance list and keep firmware current.</li><li><strong>Remote ID Broadcast Module (add-on)</strong> — a small self-contained device with its own battery and GPS that you attach to an older or self-built drone. It broadcasts the aircraft ID, the module's position, and the takeoff location (the point where the module first got a GPS lock). It does <em>not</em> report the control-station location, which is the main difference from standard RID.</li><li><strong>FRIA (FAA-Recognized Identification Area)</strong> — a specific approved site (often a club flying field) where you may legally fly drones <em>without</em> RID. This is the path for hobbyists building or flying legacy/RID-incapable aircraft.</li></ol><table><thead><tr><th></th><th>Standard RID (built-in)</th><th>Broadcast Module</th></tr></thead><tbody><tr><td>Who it's for</td><td>Modern factory drones</td><td>Older / DIY / non-RID drones</td></tr><tr><td>Reports control-station location?</td><td>Yes</td><td>No (reports takeoff point)</td></tr><tr><td>Power</td><td>From aircraft</td><td>Own small battery</td></tr><tr><td>Fly outside its limits?</td><td>Anywhere allowed</td><td>VLOS only (no FPV beyond sight)</td></tr></tbody></table><h3>Modules: mounting and gotchas</h3><p>A broadcast module (e.g. units from BlueMark such as the DroneBeacon, or Dronetag) typically attaches with adhesive or a strap and adds 10-30 g. On a tight quad that weight matters — and crossing 250 g may itself trigger registration. The module must have its own clear sky view for GPS, must be powered on for the whole flight, and you must include its serial in your FAA registration (DroneZone has a field for the RID serial number).</p><div class='box danger'><div class='bt'>Don't let RID compromise the airframe.</div> Mount the module so it can't shift into a prop arc or block cooling vents. Re-balance after adding it. Confirm GPS lock and broadcast <em>before</em> arming — a module with a dead battery is non-compliant and you won't know mid-flight.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Determine your Remote ID compliance and plan a fix if needed.</p><ol><li>Look up your exact drone model on the FAA's Remote ID declaration list to see if it has standard built-in RID.</li><li>Update firmware; confirm the manual states RID is active.</li><li>If non-compliant, identify a specific broadcast module that fits, note its weight, and describe how/where it attaches with GPS sky view.</li><li>Add the module's serial to your DroneZone registration record.</li></ol></div></div>"},{"id":"p9-5","part":"09 · Laws & Safety","nav":"Airspace & LAANC","num":"9.5","kicker":"Part 09 · Lesson 5","title":"Airspace Classes & LAANC Authorizations","html":"<h3>Controlled vs uncontrolled — the core idea</h3><p>US airspace is divided into classes. For drone pilots the practical split is simple: <strong>controlled</strong> airspace (where air traffic control manages traffic, usually around airports) requires <em>authorization</em> before you fly; <strong>uncontrolled</strong> airspace (Class G) generally does not. Most rural and suburban ground is Class G to 400 ft and you can fly recreationally or under Part 107 without asking — but you still owe TFRs, VLOS, and altitude limits.</p><table><thead><tr><th>Class</th><th>Where</th><th>Drone authorization?</th></tr></thead><tbody><tr><td>G</td><td>Uncontrolled (rural, away from airports)</td><td>None needed (still follow all rules)</td></tr><tr><td>E (surface)</td><td>Some airport areas down to ground</td><td>Authorization required</td></tr><tr><td>D</td><td>Smaller towered airports</td><td>Authorization required</td></tr><tr><td>C</td><td>Busier airports</td><td>Authorization required</td></tr><tr><td>B</td><td>Major metro airports (e.g. LAX, ATL)</td><td>Authorization required</td></tr></tbody></table><div class='box law'><div class='bt'>Hard rule.</div> Never fly in controlled airspace without authorization. Doing so near an airport endangers crewed aircraft and is one of the most serious violations the FAA pursues. \"I didn't know it was Class D\" is not a defense — checking is free and takes seconds.</div><h3>LAANC: how authorization actually works</h3><p>LAANC (Low Altitude Authorization and Notification Capability, say \"lance\") is the automated system that grants near-instant approval to fly in controlled airspace. The FAA publishes <strong>UAS Facility Maps</strong> that pre-define a maximum altitude for each grid cell around an airport — often 0, 50, 100, 200, 300, or 400 ft AGL depending on how close you are to the runway. If your requested altitude is at or below the grid ceiling, LAANC approves it instantly through an approved app; if you need higher, you submit a <em>further coordination</em> request that a human at the FAA reviews (days, not seconds).</p><ul><li>Approved apps include <strong>Aloft</strong> (formerly Airmap), <strong>Avision</strong>, and others; the FAA also runs <strong>B4UFLY</strong> for situational awareness (B4UFLY shows you the airspace but you authorize through a LAANC provider).</li><li>Both recreational flyers and Part 107 pilots can use LAANC.</li><li>An authorization is tied to a specific area, altitude ceiling, and time window. Fly within it.</li></ul><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>reading a UAS facility grid cell</span></div><div class='term-body'>Cell ceiling: <span class='am'>100 ft AGL</span>\nYou request: 90 ft, 2pm-4pm today\n  -> <span class='ok'>LAANC auto-approves in seconds</span>\nYou request: 250 ft\n  -> <span class='bad'>exceeds grid -> further coordination (manual, slow)</span>\nCell ceiling: <span class='bad'>0 ft (runway approach)</span>\n  -> no auto authorization here at all</div></div><div class='box tip'><div class='bt'>AGL, not MSL.</div> The 400 ft limit and grid ceilings are <em>above ground level</em> at your launch point, not altitude above sea level. The drone's reported altitude in your app is what you watch.</div><div class='box danger'><div class='bt'>Authorization is not a safety pass.</div> LAANC clears the paperwork, not the sky. Keep your eyes up, watch for crewed aircraft and other drones, and yield to everything. If you hear or see a helicopter or low aircraft, descend and land immediately regardless of your authorization.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Check a real spot and request (or simulate) a LAANC authorization.</p><ol><li>Install a LAANC app (Aloft) and B4UFLY.</li><li>Drop a pin on a place you actually want to fly; read the airspace class and grid ceiling.</li><li>If it's controlled, set an altitude at or below the ceiling and a time window, then request authorization.</li><li>Screenshot the result (class, ceiling, approval status) and save it with your flight notes.</li></ol></div></div>"},{"id":"p9-6","part":"09 · Laws & Safety","nav":"Where You Can't Fly","num":"9.6","kicker":"Part 09 · Lesson 6","title":"No-Fly Zones: Airports, TFRs, Restricted Areas & National Parks","html":"<h3>Categories of \"no\"</h3><p>Beyond airspace class, several distinct prohibitions can ground you even in otherwise-open Class G. Learn the categories so you recognize each one on the map.</p><ul><li><strong>Airport surface areas</strong> — covered by LAANC in controlled airspace (Lesson 5). Around some small uncontrolled airports you should still stay clear of approach/departure paths and give way to all crewed traffic.</li><li><strong>Temporary Flight Restrictions (TFRs)</strong> — short-lived no-fly bubbles. They pop up for wildfires, major sporting events (stadiums get a standing 3-nautical-mile TFR from 1 hour before to 1 hour after games over a certain capacity), VIP/presidential movement, disaster areas, and security events. A presidential TFR can blanket a large area for days with no warning.</li><li><strong>Prohibited & Restricted Areas (P/R)</strong> — permanent special-use airspace over sensitive sites: military ranges, the White House and DC, nuclear facilities, certain federal sites. \"Prohibited\" (P-) means never; \"Restricted\" (R-) means only when not active.</li><li><strong>National Parks</strong> — the National Park Service bans launching, landing, or operating drones from within virtually all NPS-managed land. You also can't fly over a park if you launched outside to skirt the rule. National Forests (USFS) and BLM land are often more permissive but have their own rules and wilderness-area exceptions.</li><li><strong>Critical infrastructure & local bans</strong> — power plants, prisons, military bases (Section 130i no-drone zones), stadiums, and many cities/parks have their own surface restrictions.</li></ul><div class='box danger'><div class='bt'>Check TFRs EVERY flight day.</div> This is the one that catches good pilots. A wildfire TFR or a presidential visit can appear overnight over a spot you've flown safely a hundred times. Flying into a wildfire TFR can ground firefighting aircraft and kill people on the ground; the FAA and DOJ prosecute it aggressively. Check <code>tfr.faa.gov</code> or your LAANC app the morning of every flight.</div><h3>How to actually check</h3><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>pre-flight no-fly check</span></div><div class='term-body'>[ ] Airspace class at pin .... LAANC app\n[ ] Active TFRs today ........ tfr.faa.gov / app  <span class='am'>(re-check day-of)</span>\n[ ] Prohibited/Restricted .... sectional / app overlay\n[ ] Land manager ............. NPS=NO, city park ordinance?\n[ ] Stadium event nearby? .... 3 NM TFR window\n[ ] Critical infra / 130i .... no-drone zone overlay\nAll clear -> <span class='ok'>plan flight</span>  Any flag -> <span class='bad'>relocate</span></div></div><div class='box law'><div class='bt'>Two-map habit.</div> No single app catches everything. Cross-check a LAANC/airspace app (class, grids, RTFR) <em>and</em> the land owner/manager rules (NPS, city ordinance, private property). Federal clearance does not grant you permission to launch from someone else's ground.</div><div class='box tip'><div class='bt'>Stadium gotcha.</div> The standing sports-stadium TFR (MLB, NFL, NCAA D-I, NASCAR over the capacity threshold) extends to 3 nautical miles and 3,000 ft, active around game time. People launch from a \"safe\" park nearby and don't realize a stadium two miles away just put them in a federal violation.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Map the prohibitions around where you live.</p><ol><li>Open <code>tfr.faa.gov</code> and your LAANC app; list any active TFRs in your region today.</li><li>Identify any Prohibited/Restricted areas within ~25 miles.</li><li>List five specific nearby places you cannot fly and the reason for each (NPS, stadium TFR, restricted area, city park ban, airport surface).</li><li>Add the \"check TFRs every flight day\" line to your pre-flight checklist.</li></ol></div></div>"},{"id":"p9-7","part":"09 · Laws & Safety","nav":"Altitude, VLOS & Privacy","num":"9.7","kicker":"Part 09 · Lesson 7","title":"Altitude & VLOS Limits, Privacy & Courtesy","html":"<h3>The core operating limits</h3><p>Two numbers and one principle define safe, legal flying in the US for both recreational and Part 107 operations (absent a waiver):</p><ul><li><strong>400 ft AGL maximum altitude.</strong> Above ground level at your location. The exception: under Part 107 you may fly higher than 400 ft if you stay within 400 ft of a structure (e.g. inspecting a 600 ft tower), which keeps you clear of crewed traffic that flies the open sky above 500 ft.</li><li><strong>Visual Line of Sight (VLOS).</strong> You (or a visual observer in direct communication with you) must keep the aircraft in unaided sight at all times — naked eye, glasses or contacts are fine, but binoculars and the FPV goggle feed are not. You must be able to see the drone's orientation and the airspace around it to see-and-avoid.</li><li><strong>Daylight and twilight</strong> with anti-collision lighting visible for 3 statute miles for night flight (recreational night flying requires the lighting too).</li></ul><div class='box law'><div class='bt'>FPV and VLOS.</div> First-person-view flying does not satisfy VLOS by itself — the goggles are an aid, not your eyes. The standard practice is a <strong>visual observer</strong> standing beside you, watching the drone directly and the sky, in constant verbal contact. Solo BVLOS (beyond visual line of sight) requires a specific FAA waiver and is not a casual option.</div><h3>Other operating rules to internalize</h3><ul><li>Do not fly over people who are not participating in the operation (Part 107 has specific Operations Over People categories tied to the drone's weight and injury rating; don't assume you qualify).</li><li>One drone per pilot at a time (no simultaneous multi-aircraft without a waiver).</li><li>Do not fly from a moving vehicle in most cases (sparsely populated exception under Part 107).</li><li>Do not operate carelessly or recklessly, and never under the influence (the 8-hour \"bottle to throttle\" and 0.04% BAC rules apply).</li><li>Yield right of way to all crewed aircraft, always.</li></ul><div class='box danger'><div class='bt'>VLOS is a flight-safety rule first.</div> Losing sight of the aircraft means you can no longer see a helicopter, a bird, or a tower in its path. Set a personal range where you can still resolve the drone's heading, and turn back before it becomes a dot. Pair this with a tested <em>return-to-home</em> failsafe and a known battery reserve so a lost-link event ends with the drone coming home, not falling.</div><h3>Privacy & being a good neighbor</h3><p>Federal law governs the airspace, but privacy, trespass, harassment, and \"peeping\" are handled by state and local law and by simple decency. The fastest way to get drones banned in your town is to creep your neighbors.</p><ul><li>Don't hover over or film people in their yards, pools, or through windows. \"Legal altitude\" is no excuse for being intrusive.</li><li>Ask permission before flying low over private property or events.</li><li>Keep distance from people and pets; a startled crowd is a safety problem.</li><li>If someone objects, land and talk — don't escalate. Goodwill keeps spots open.</li><li>Respect launch-site rules; pack out, don't block paths, keep noise reasonable.</li></ul><div class='box tip'><div class='bt'>Make a limits card.</div> Pros carry a small card with their own hard limits — it removes in-the-moment temptation to push altitude or range \"just this once.\"</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Write a personal operating-limits card to keep with your gear.</p><ol><li>Front: <code>Max 400 ft AGL</code>, <code>VLOS at all times</code>, <code>VO for FPV</code>, your personal max range.</li><li>Back: privacy etiquette (no hovering over yards/windows, ask before low flights, land-and-talk if challenged).</li><li>Add failsafe reminders: RTH set and tested, land at 30% battery, yield to all aircraft.</li><li>Laminate or photograph it; keep a copy in your case and on your phone.</li></ol></div></div>"},{"id":"p9-8","part":"09 · Laws & Safety","nav":"Market, NDAA & Insurance","num":"9.8","kicker":"Part 09 · Lesson 8","title":"The DJI/NDAA Market Landscape & Insurance","html":"<h3>Why the drone you can buy is a moving target</h3><p>A large share of consumer and prosumer drones are made by Chinese manufacturers, chiefly <strong>DJI</strong> (and Autel). Over several years, US policy has increasingly scrutinized foreign-made drones on national-security grounds — primarily data-security concerns (where flight logs, imagery, and telemetry could go) and supply-chain dependence. This is a genuinely evolving, politically contested area; the goal here is to explain it accurately and neutrally so you can make your own decisions, not to tell you what to buy.</p><h4>The pieces of the debate</h4><ul><li><strong>NDAA provisions.</strong> Various National Defense Authorization Act sections have restricted <em>federal agencies</em> from buying or operating certain foreign-made drones, and have driven a \"Blue UAS\" approved list of vetted (largely US/allied) aircraft for government and some critical-infrastructure use. These restrictions historically targeted government procurement, not consumers.</li><li><strong>\"Countering CCP Drones\" proposals.</strong> Legislative efforts have proposed adding DJI (and sometimes others) to an FCC \"covered list,\" which could block new equipment authorizations — meaning future models might not be legally importable or sold, even if existing units keep working. A related provision has tasked a national-security agency with reviewing DJI within a set window; if no review clears them, automatic restrictions could follow.</li><li><strong>Tariffs and customs.</strong> Separately, tariff changes and customs holds have at times disrupted DJI imports and availability regardless of the security statutes.</li><li><strong>State and agency bans.</strong> Some states restrict public agencies (police, fire) from using non-approved drones; rules vary widely.</li></ul><div class='box law'><div class='bt'>Verify before you spend.</div> Whether a specific model can be imported, sold, or used by your category of operator changes by the month. Before buying or starting a business around a given platform, check the current FCC covered-list status, the latest NDAA/appropriations text, and the manufacturer's own statements. What is true this quarter may not be next.</div><div class='box tip'><div class='bt'>Neutral takeaway.</div> For most <em>recreational and small commercial</em> flyers, foreign-made drones have generally remained legal to own and fly even as government-procurement restrictions tightened. But the trajectory points toward more scrutiny. If you're building a long-term business, weigh platform risk: consider whether a Blue UAS / US-made option fits, and don't bet a livelihood on a single import-dependent model.</div><h3>Insurance</h3><p>Drones crash, lose link, and occasionally hurt people or property. Insurance is optional for hobbyists and effectively mandatory for professionals.</p><table><thead><tr><th>Type</th><th>Covers</th><th>Who needs it</th></tr></thead><tbody><tr><td>Liability</td><td>Damage/injury you cause to others</td><td>Anyone; required for most client work</td></tr><tr><td>Hull</td><td>Damage to your own aircraft</td><td>Owners of expensive rigs</td></tr><tr><td>Payload</td><td>Camera/gimbal/sensor damage</td><td>Cinema/mapping pros</td></tr></tbody></table><ul><li><strong>Hobbyist option:</strong> a recognized community-based organization membership (e.g. the AMA) typically bundles a liability policy for members flying within its safety code — an inexpensive entry point.</li><li><strong>On-demand:</strong> apps like <em>SkyWatch.AI</em> and <em>Thimble</em> sell hourly or daily liability (commonly $1M coverage) you buy per job — handy for occasional paid gigs.</li><li><strong>Annual commercial:</strong> dedicated UAS insurers (BWI, Avion, etc.) write year-round liability + hull, often $500–$2,000+/yr depending on coverage and aircraft value.</li><li>Clients and venues frequently require proof of <strong>$1M+ liability</strong> and a certificate of insurance naming them as additional insured.</li></ul><div class='box danger'><div class='bt'>No policy replaces airmanship.</div> Insurance pays after a crash; it doesn't prevent one. The LiPo discipline, prop checks, failsafe testing, VLOS, and pre-flight verification from this whole part are what keep you from ever filing a claim. Fly like you're uninsured even when you're not.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Summarize the market debate and price insurance for your use.</p><ol><li>Read two reputable, recent sources on the foreign-drone / NDAA situation; note the date and that it evolves.</li><li>In 3–4 sentences, summarize the current state neutrally (what's restricted, for whom, what's pending).</li><li>Decide your use: hobby or commercial.</li><li>Get one real quote — an on-demand liability price (e.g. $1M for a day) or an AMA-style membership — and record the number.</li></ol></div></div>"},{"id":"p10-1","part":"10 · Uses & Money","nav":"FPV Racing","num":"10.1","kicker":"Part 10 · Lesson 1","title":"FPV Racing: MultiGP, Gates & Classes","html":"<h3>What organized FPV racing actually is</h3><p>FPV racing is timed, multi-pilot competition through a marked course of gates and flags. In the US the dominant grassroots organization is <strong>MultiGP</strong>, which runs a network of local <em>chapters</em>. A chapter is a group of pilots with a registered field who run sanctioned events; results upload to MultiGP's leaderboards so you can compare yourself nationally. Internationally you'll also see <strong>Drone Champions League (DCL)</strong> and <strong>MultiGP Global Qualifier</strong> series feeding bigger finals.</p><h3>Race formats</h3><ul><li><strong>Heat racing</strong> — 4 pilots launch together, fly a set number of laps (often 3), top finishers advance through a bracket. This is the classic spectator format.</li><li><strong>Time Trial (single-pilot)</strong> — you fly the course alone for fastest lap. MultiGP's <strong>UTT (Universal Time Trial)</strong> tracks use a standardized layout so any chapter's times are comparable.</li><li><strong>Endurance / Spec</strong> — same hardware for everyone to test pure piloting.</li></ul><h3>Gates and course elements</h3><p>Courses mix <em>square gates</em>, <em>flags</em> (a single pole you round), <em>ladders/hurdles</em> (low gates you skim), and <em>dive gates</em>. Each pilot runs a different <strong>video channel</strong> (typically on the 5.8 GHz band) so four feeds don't interfere; race directors assign channels per heat (e.g. R1/R3/R6/R8 on RaceBand for clean separation).</p><h3>Classes and the spec mindset</h3><table><thead><tr><th>Class</th><th>Frame / pack</th><th>Notes</th></tr></thead><tbody><tr><td>Spec / Open 5-inch</td><td>5\" prop, 6S, ~800g</td><td>The mainstream race class; raw speed</td></tr><tr><td>MultiGP Spec</td><td>Defined motor KV, 5\" tri-blade, 6S 1300mAh limits</td><td>Levels the field — skill over budget</td></tr><tr><td>Tiny Whoop / micro</td><td>65-75mm, 1S</td><td>Indoor racing, cheap entry</td></tr><tr><td>3-inch / Toothpick</td><td>3\" prop, 4S</td><td>Smaller venues</td></tr></tbody></table><div class='box law'><div class='bt'>Rules vary.</div> Class specs (motor KV, battery cell count/capacity, weight) change season to season. Always read the <em>current</em> MultiGP rulebook for the season you're entering, and check FAA Remote ID / registration applies to your aircraft (over 250g must be registered).</div><h3>Gear you need to race</h3><ul><li>A reliable <strong>6S 5-inch</strong> quad (or the spec build the class mandates) plus 1-2 backups — crashes happen.</li><li>Goggles with the same <strong>video format</strong> the event supports. Many chapters still run analog; digital (DJI O3/O4, Walksnail, HDZero) is growing but HDZero is favored for racing due to low latency.</li><li>A <strong>VTX</strong> you can set to a specific channel/power. Races usually cap power at <strong>25mW</strong> so four pilots don't desync each other's feeds.</li><li>4-6 charged race packs, a field charger, prop spares, a tool roll.</li></ul><h3>Getting involved</h3><p>Make a free MultiGP account, use the chapter finder, and just show up to a practice day — most chapters welcome newcomers and many run a <strong>Spec class</strong> specifically so beginners aren't outspent. Bring a registered aircraft, your FAA registration number marked on the airframe, and ask the race director where to spawn your video channel before you ever power on the VTX.</p><div class='box danger'><div class='bt'>Prop & power safety.</div> Never power a quad with props on while goggling up near others. Power VTX only on your assigned channel — a stray channel at full power can knock another pilot out of the air. Keep LiPos in a fire bag at the pits.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Plan to attend or enter a real race.</p><ol><li>Use the MultiGP chapter finder to locate the nearest chapter or open practice.</li><li>Read its event page: identify the class offered (e.g. Spec 6S) and the video format (analog/HDZero/DJI).</li><li>List the gear you must bring: aircraft + spares, goggles, VTX channel capability, packs, FAA registration marked on the frame.</li><li>Write a one-paragraph plan: date, class you'll enter, and what you still need to buy or borrow.</li></ol></div></div>"},{"id":"p10-2","part":"10 · Uses & Money","nav":"The Freestyle Scene","num":"10.2","kicker":"Part 10 · Lesson 2","title":"The Freestyle Scene: Community, Edits & Brands","html":"<h3>What freestyle is</h3><p>Freestyle is the artistic, non-competitive side of FPV: flowing lines, dives, power loops, matty flips, juicy rolls, and proximity tricks flown for the feel and the footage rather than the clock. The culture is built around the <strong>edit</strong> — a 1-3 minute video set to music that showcases a flight at a location. Pilots like Mr. Steele, Nurk, and Johnny FPV essentially defined the look that brands now chase.</p><h3>How pilots build an audience</h3><ul><li><strong>Consistency of vibe.</strong> The strongest channels have a recognizable style — color grade, music taste, the way they link tricks. Viewers subscribe to a feeling, not just clips.</li><li><strong>Location hunting.</strong> Abandoned buildings (bandos), waterfalls, bridges, forests, snowy mountains. A great spot carries an average flight; a parking lot rarely does.</li><li><strong>Posting cadence.</strong> Short-form (Reels/Shorts/TikTok) for reach, long-form (YouTube) for depth and ad revenue. Many pilots seed a 15-second hook clip to short-form and link the full edit.</li><li><strong>Community.</strong> Engaging on Rotor Riot, the FPV subreddits, and local meetups builds the network that gets you noticed and invited to group sessions.</li></ul><h3>What makes an edit compelling</h3><table><thead><tr><th>Element</th><th>What good looks like</th></tr></thead><tbody><tr><td>Flow</td><td>Lines connect — no aimless hovering; momentum carried trick to trick</td></tr><tr><td>Location</td><td>Depth and scale to fly <em>through</em> and <em>around</em> (proximity)</td></tr><tr><td>Edit</td><td>Cuts land on the beat; speed-ramps on dives; no clip overstays</td></tr><tr><td>Music</td><td>Drives pacing and emotion; track choice is half the edit</td></tr><tr><td>Color</td><td>Consistent grade; GoPro flat profile graded in post, not baked-in</td></tr></tbody></table><h3>The gear that makes footage look pro</h3><ul><li>An HD action cam (GoPro Hero or DJI) recording in a <strong>flat/log profile</strong> at high bitrate, graded later. Shoot at a high frame rate (60-120fps) so you can slow down dives smoothly.</li><li><strong>ND filters</strong> to keep the shutter near 1/(2×fps) — this gives natural motion blur instead of the choppy, video-game look that screams amateur.</li><li>Gyro stabilization (GoPro's in-cam or Gyroflow with the cam's <code>.gpmf</code> log) to remove prop vibration and jello.</li></ul><h3>What brands actually look for</h3><p>FPV brands (frame makers, VTX/camera companies, prop and motor brands, battery vendors) sponsor pilots to put product in beautiful footage in front of buyers. They evaluate:</p><ul><li><strong>Audience fit and engagement</strong> — a focused 20k-subscriber FPV channel can beat a generic 200k one.</li><li><strong>Production quality</strong> — your edit is their ad.</li><li><strong>Reliability and professionalism</strong> — do you post on time, represent the brand well, disclose partnerships honestly?</li></ul><p>Most sponsorships start small: a discount code, free product, or affiliate links — not a salary. Build the body of work first; the deals follow the reach.</p><div class='box tip'><div class='bt'>Insight.</div> The flight and the edit are two separate skills. Plenty of incredible pilots have flat channels because they never learned to cut to music. Treat editing as a craft worth its own practice time.</div><div class='box danger'><div class='bt'>Fly responsibly.</div> Bando and proximity flying often happens near people, property, and below 400ft near structures. Respect no-fly zones, get permission for private property, and keep a spotter — a crash into a person is a lawsuit and a safety incident.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Reverse-engineer three edits you admire.</p><ol><li>Pick three freestyle edits and watch each twice.</li><li>For each, write one sentence each on flow, location, edit/cut timing, and music choice.</li><li>Note the single technique you could copy in your next session (a line, a grade, a cut style).</li><li>Write your own one-line stylistic identity: the vibe your channel would have.</li></ol></div></div>"},{"id":"p10-3","part":"10 · Uses & Money","nav":"Photo/Video Business","num":"10.3","kicker":"Part 10 · Lesson 3","title":"Aerial Photo & Video as a Business","html":"<h3>The most accessible commercial path</h3><p>Aerial media is where most people first make money with a drone because the barrier is low: a stabilized camera platform (DJI Mavic/Air class), basic editing, and a Part 107 certificate. The hard part isn't flying — it's understanding <em>what the client actually buys</em>.</p><div class='box law'><div class='bt'>Commercial work requires Part 107.</div> In the US, flying a drone for <em>any</em> business purpose — including footage you sell, post for a client, or use in marketing — requires the FAA <strong>Part 107 Remote Pilot Certificate</strong>. Recreational rules do not cover paid work. Verify current FAA requirements (registration, Remote ID, airspace authorization via LAANC) before any job.</div><h3>The three core niches</h3><table><thead><tr><th>Niche</th><th>Client buys</th><th>Reality</th></tr></thead><tbody><tr><td>Real estate</td><td>5-15 stills + a short walkthrough that makes a listing pop</td><td>Volume game; fast turnaround beats artistry; agents want it next-day</td></tr><tr><td>Weddings / events</td><td>Cinematic establishing shots and one hero reveal</td><td>One chance, no reshoot; you support a ground videographer</td></tr><tr><td>Tourism / hospitality</td><td>Promotional reels of resorts, venues, destinations</td><td>Higher budgets; needs strong cinematic and color skills</td></tr></tbody></table><h3>What each niche really needs</h3><ul><li><strong>Real estate</strong> is about <em>reliability and speed</em>. Agents reuse photographers who deliver bright, level, well-composed stills by the next morning. Standard package: aerial stills of the property and lot lines, a 30-60s clip, sometimes a twilight shot. Avoid neighbors' windows and stay legal on altitude.</li><li><strong>Weddings</strong> are unforgiving — you get one take. Drone is a complement to the ground crew, not the main camera. Scout the venue, pre-plan the reveal shot, and have a battery-charged backup aircraft. Noise and crowds mean you fly during the right moments only.</li><li><strong>Tourism</strong> rewards production value: smooth reveals, color grading, music. These clients pay more but expect a polished reel, model/property releases, and often multiple shoot days.</li></ul><h3>Settings that separate pro from hobby</h3><ul><li>Shoot video in a <strong>flat/D-Log color profile</strong>, grade in post. Lock shutter near double the frame rate using <strong>ND filters</strong> for natural motion.</li><li>Shoot stills in <strong>RAW (DNG)</strong> and bracket exposures for high-contrast scenes (bright sky, dark roof).</li><li>Keep moves slow and deliberate — slow reveals and orbits read as cinematic; jerky inputs read as amateur.</li></ul><h3>Building a package</h3><p>A package = <em>deliverables + turnaround + price</em>. Define exactly what the client receives (e.g. \"12 edited stills + one 45-second 1080p clip, delivered in 48 hours\") so there's no scope creep. Charge for the result, not your flight time.</p><div class='box danger'><div class='bt'>Safety over the shot.</div> Never fly over crowds without proper authorization. Maintain visual line of sight, respect the 400ft AGL limit, and check airspace — many wedding venues and downtowns sit in controlled airspace requiring LAANC authorization. A failsafe Return-to-Home should be configured before every job.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Outline a real service package for one niche.</p><ol><li>Pick one niche (real estate, weddings, or tourism).</li><li>List exact deliverables (number of stills, video length/resolution).</li><li>State your turnaround time and how the client receives files.</li><li>Note the certification (Part 107) and any airspace authorization (LAANC) the job requires.</li></ol></div></div>"},{"id":"p10-4","part":"10 · Uses & Money","nav":"Mapping & Photogrammetry","num":"10.4","kicker":"Part 10 · Lesson 4","title":"Mapping, Surveying & Photogrammetry","html":"<h3>From photos to measurable models</h3><p>Photogrammetry turns hundreds of overlapping aerial photos into measurable products: orthomosaics (a flat, geo-accurate map), digital elevation/surface models (DEM/DSM), 3D point clouds, and volume calculations. Software stitches images by matching common features across overlapping frames. The paying markets are <strong>construction</strong>, <strong>surveying/GIS</strong>, <strong>mining/aggregate</strong>, and <strong>insurance</strong>.</p><h3>The capture rules that make or break a map</h3><table><thead><tr><th>Parameter</th><th>Typical value</th><th>Why</th></tr></thead><tbody><tr><td>Front overlap</td><td>75-80%</td><td>Each ground point must appear in many photos to triangulate</td></tr><tr><td>Side overlap</td><td>65-75%</td><td>Prevents holes between flight lines</td></tr><tr><td>Altitude</td><td>Set by required GSD</td><td>Higher = faster but lower resolution</td></tr><tr><td>Camera angle</td><td>Nadir (straight down) for maps; obliques for 3D</td><td>Obliques capture building facades</td></tr><tr><td>Flight pattern</td><td>Grid / lawnmower (crosshatch for 3D)</td><td>Even, predictable coverage</td></tr></tbody></table><h3>GSD — the number clients care about</h3><p><strong>Ground Sample Distance</strong> is the real-world size of one pixel. A GSD of 2 cm/px means each pixel covers 2 cm on the ground — finer detail = lower flight = more photos and battery. GSD scales with altitude and sensor: roughly <code>GSD = (sensor_pixel_size × altitude) / focal_length</code>. Quote the deliverable in GSD (e.g. \"2.5 cm/px orthomosaic\") because that defines how small a feature the client can measure.</p><h3>Ground control and accuracy</h3><ul><li><strong>GCPs (Ground Control Points)</strong> — surveyed markers placed in the scene and tagged in software. They tie the model to real-world coordinates and dramatically improve absolute accuracy.</li><li><strong>RTK/PPK drones</strong> (DJI Phantom 4 RTK, Matrice with RTK, WingtraOne) geotag each photo to centimeter accuracy, reducing or eliminating GCP needs for many jobs.</li><li>Surveyors often require both: RTK for the bulk plus a few <strong>checkpoints</strong> to verify accuracy.</li></ul><h3>Processing software</h3><ul><li><strong>Pix4Dmapper / Pix4Dmatic</strong> — survey-grade, widely accepted.</li><li><strong>DroneDeploy</strong> — cloud, easy, strong for construction progress.</li><li><strong>Agisoft Metashape</strong> — powerful, one-time license, great 3D.</li><li><strong>Esri Site Scan / ArcGIS</strong> — when the client lives in a GIS ecosystem.</li></ul><h3>What a construction client expects</h3><p>Construction wants <em>actionable, repeatable</em> data: a georeferenced orthomosaic they can drop into Civil 3D or ArcGIS, a DSM, <strong>cut/fill volume</strong> reports for earthwork, and progress comparison against the design surface. Many sites are flown weekly. Deliver in their CRS (coordinate reference system) — get this in writing before you fly, because a model in the wrong projection is useless.</p><div class='box tip'><div class='bt'>Insight.</div> The flight is 20% of the job. The value is in clean, accurate, correctly-projected deliverables. A surveyor will not accept \"pretty\" — they need documented accuracy (RMSE on checkpoints) and the right datum.</div><div class='box law'><div class='bt'>Verify scope.</div> Selling survey data may intersect with state surveying/licensure laws — in some jurisdictions producing legal boundary or survey-grade deliverables requires a licensed surveyor. Confirm what you're legally allowed to deliver and partner with a licensed surveyor when needed. Part 107 still applies for the flying.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Outline a mapping job for a construction client.</p><ol><li>State the site size and the target GSD (e.g. 2.5 cm/px) and back-calculate the altitude.</li><li>Specify front/side overlap and flight pattern (grid vs crosshatch).</li><li>Decide GCP vs RTK and how you'll verify accuracy (checkpoints).</li><li>Pick processing software and list the exact deliverables (orthomosaic, DSM, volume report) and the CRS.</li></ol></div></div>"},{"id":"p10-5","part":"10 · Uses & Money","nav":"Precision Agriculture","num":"10.5","kicker":"Part 10 · Lesson 5","title":"Precision Agriculture: Crop Health & Spraying","html":"<h3>Two distinct ag drone businesses</h3><p>Agricultural drones split into two very different services: <strong>data/scouting</strong> (mapping crop health with multispectral imagery) and <strong>application/spraying</strong> (heavy-lift drones that apply pesticide, fertilizer, or seed). They use different aircraft, different licensing, and serve different parts of the grower's budget.</p><h3>Crop-health mapping and NDVI</h3><p>A multispectral camera (e.g. MicaSense RedEdge, DJI Mavic 3 Multispectral) captures bands beyond visible light — notably <strong>near-infrared (NIR)</strong> and red. Healthy plants reflect a lot of NIR and absorb red light for photosynthesis; stressed plants reflect less NIR. The <strong>NDVI</strong> index makes this visible:</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>NDVI</span></div><div class='term-body'><span class='dim'>NDVI = (NIR - Red) / (NIR + Red)</span>\n<span class='ok'>+0.6 to +0.9</span>  dense, healthy canopy\n<span class='am'>+0.2 to +0.5</span>  sparse / stressed vegetation\n<span class='bad'>below 0.1</span>  bare soil, water, or dead crop</div></div><p>The output is a color-coded field map showing where crops are stressed <em>before</em> the eye can see it. Other indices (NDRE for later-season nitrogen, VARI from a normal RGB camera as a cheap proxy) target specific problems.</p><h3>The value to the grower</h3><ul><li><strong>Early detection</strong> of irrigation failures, pest/disease hotspots, and nutrient deficiency — days or weeks before visible symptoms.</li><li><strong>Variable-rate prescriptions</strong> — the map drives a prescription so the farmer applies fertilizer/water only where needed, cutting input cost.</li><li><strong>Stand counts and damage assessment</strong> after weather events (useful for insurance claims).</li></ul><h3>Spraying drones</h3><p>Heavy-lift sprayers like the <strong>DJI Agras T40/T50</strong> carry 40-50L tanks and apply chemicals over terrain that's too wet, steep, or dense for a ground rig. Advantages: no soil compaction, access to flooded/hilly fields, and less operator chemical exposure. They fly autonomous swaths following a terrain-aware map.</p><div class='box law'><div class='bt'>Spraying needs more than Part 107.</div> Applying chemicals from a drone in the US typically requires a <strong>Part 137 Agricultural Aircraft Operator certificate</strong>, often a <strong>Part 44807 / exemption</strong> for aircraft over 55 lbs, plus a state <strong>pesticide applicator license</strong>. This is a serious regulatory and safety undertaking — verify current FAA and state rules before offering it.</div><h3>The ROI pitch</h3><p>Growers buy outcomes, not technology. Frame it in dollars per acre: if a $X/acre scouting flight finds an irrigation failure or a $Y/acre nitrogen overspend across a 200-acre field, the savings dwarf the service fee. Repeat business comes from delivering maps fast (same-day) and in a format their agronomist already uses.</p><div class='box danger'><div class='bt'>Chemical & flight safety.</div> Spray drones carry tens of kilos of liquid and large props — they are dangerous aircraft. Use PPE for chemical handling, never spray in wind that causes drift onto people/neighbors, and follow the chemical label (the label is the law). Maintain failsafe behavior so a lost link doesn't dump a tank uncontrolled.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Write a one-page pitch for one ag service.</p><ol><li>Pick crop-health (NDVI) mapping.</li><li>Explain what you capture (multispectral) and the output (color stress map + prescription).</li><li>Quantify the ROI: per-acre fee vs the input cost or yield loss it prevents.</li><li>State turnaround and the file format you'll hand the grower's agronomist.</li></ol></div></div>"},{"id":"p10-6","part":"10 · Uses & Money","nav":"Infrastructure Inspection","num":"10.6","kicker":"Part 10 · Lesson 6","title":"Infrastructure Inspection: Roofs, Solar, Towers & Wind","html":"<h3>Why inspection is a strong business</h3><p>Drones replace people on ropes, scaffolds, and bucket trucks. They cut inspection cost and time and remove humans from height — that safety case is what sells the service to insurers, utilities, and facility managers. The work is recurring (assets are re-inspected) and the deliverable is a documented report, not just pretty footage.</p><h3>The four core asset types</h3><table><thead><tr><th>Asset</th><th>What you look for</th><th>Sensor</th></tr></thead><tbody><tr><td>Roofs</td><td>Hail/storm damage, missing shingles, membrane tears, ponding</td><td>RGB + sometimes thermal for trapped moisture</td></tr><tr><td>Solar farms</td><td>Dead cells, hot spots, string failures, soiling</td><td>Thermal (radiometric) + RGB</td></tr><tr><td>Cell / comm towers</td><td>Antenna count/azimuth, corrosion, bolt/connector condition</td><td>High-res RGB + zoom</td></tr><tr><td>Wind turbines</td><td>Blade cracks, leading-edge erosion, lightning damage</td><td>High-res RGB, sometimes thermal</td></tr></tbody></table><h3>Workflows</h3><ul><li><strong>Roofs</strong> — fly a grid for an orthomosaic to document the whole roof, then oblique close-ups of damage. Thermal at dusk reveals moisture under the membrane (wet insulation holds heat). Insurance clients want time-stamped, geotagged images per defect.</li><li><strong>Solar</strong> — fly an automated grid at fixed altitude with a <strong>radiometric thermal</strong> camera (e.g. DJI Mavic 3T / Matrice with H20T). Hot spots show as bright points; whole-string failures show as dark rows. Software (e.g. solar-specific analytics) maps each anomaly to a panel ID and IEC fault category. Fly when irradiance is high (sunny, panels under load) for thermal contrast.</li><li><strong>Towers</strong> — orbit at multiple heights capturing antennas and structure; zoom cameras keep you at a safe standoff. Deliver an antenna/azimuth report and a defect log.</li><li><strong>Wind turbines</strong> — the turbine must be <em>stopped and locked</em> before flight. Fly each blade's four faces (leading edge, trailing edge, suction, pressure sides), capturing systematic overlapping shots so each meter of blade is documented.</li></ul><div class='box danger'><div class='bt'>Proximity flying is the real risk.</div> Inspection means flying close to metal structures that wreck GPS and compass (magnetic interference) and create turbulence/rotor downwash. Expect <strong>GPS dropouts</strong> near towers and solar racking — be ready to fly in ATTI/manual and keep a safe standoff. Brief everyone on the lockout for wind turbines, never fly over live energized lines closer than required, and maintain a spotter at all times.</div><h3>Data and deliverables</h3><p>Clients buy a <em>report</em>: an annotated set of images, each tagged with location/defect type/severity, often in their asset-management system. Consistency matters — same altitude, same overlap, same angles every visit so year-over-year comparison is valid. For solar, a radiometric (temperature-measuring) thermal sensor is essential; a non-radiometric camera can't give the °C deltas the analysis needs.</p><div class='box tip'><div class='bt'>Insight.</div> The differentiator isn't the flight — it's repeatability and reporting. Build a fixed flight template per asset so every inspection is comparable and defensible in an insurance dispute.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Build an inspection checklist for one asset.</p><ol><li>Choose a roof or a solar array.</li><li>Define the flight pattern (grid altitude + overlap, plus oblique close-ups).</li><li>List the data captured (RGB, radiometric thermal) and how each defect is tagged.</li><li>Write the safety steps: airspace check, GPS-interference plan, spotter, standoff distance, and (for solar) the irradiance/time-of-day requirement.</li></ol></div></div>"},{"id":"p10-7","part":"10 · Uses & Money","nav":"Public Safety & SAR","num":"10.7","kicker":"Part 10 · Lesson 7","title":"Public Safety, Search-and-Rescue & Light Shows","html":"<h3>Drones in public safety</h3><p>Police, fire, and emergency-management agencies use drones as a fast, cheap eye in the sky. Common missions: <strong>search and rescue (SAR)</strong>, fire scene size-up and hot-spot detection, crash/crime scene mapping, hazmat standoff, crowd monitoring, and <strong>DFR (Drone as First Responder)</strong> programs where a drone launches from a rooftop dock to a 911 call before officers arrive.</p><h3>What makes SAR work</h3><ul><li><strong>Thermal imaging</strong> — a radiometric or high-sensitivity thermal camera (e.g. DJI Matrice 30T / M3T) finds a body-heat signature in woods, fields, or water at night when human searchers can't see.</li><li><strong>Loudspeaker and spotlight payloads</strong> to communicate with or locate a subject.</li><li><strong>Systematic search grids</strong> flown autonomously so no area is missed, coordinated with ground teams over the same map.</li><li><strong>Endurance and reliability</strong> — enterprise platforms with redundant systems, IP-rated for rain, and long flight times matter far more than camera prettiness.</li></ul><div class='box law'><div class='bt'>Operating authority varies.</div> Public agencies in the US can fly under a <strong>Certificate of Authorization (COA)</strong> or under Part 107. Night and BVLOS SAR work often needs waivers/authorizations. Programs must coordinate with manned aircraft (a medevac helicopter shares that airspace). Always verify current FAA rules and local emergency-operations protocols.</div><h3>Roles in a public-safety drone program</h3><ul><li><strong>Remote pilot in command (RPIC)</strong> — flies and is legally responsible.</li><li><strong>Visual observer</strong> — keeps eyes on the aircraft and airspace.</li><li><strong>Payload/sensor operator</strong> — runs the camera and interprets imagery.</li><li><strong>Mission coordinator</strong> — links the drone feed to incident command and ground teams.</li></ul><h3>Drone light shows</h3><p>Light shows replace fireworks with swarms of hundreds or thousands of small LED drones flying choreographed 3D animations. They're quiet, reusable, and programmable — a growing business for events, sports, and brand activations (companies like Sky Elements, Verge Aero, Intel/SPHEREO-style operators run them).</p><h3>How a light show is produced</h3><ol><li><strong>Design</strong> — animators build the 3D animation in specialized software (e.g. Verge Aero, Skybrush/Blender), where each drone is one moving pixel.</li><li><stro
