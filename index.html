cier</td></tr><tr><td>Camera</td><td>Separate analog cam + VTX</td><td>Often an integrated camera + air-unit</td></tr></tbody></table><h3>The FPV camera</h3><p>An analog camera (e.g. Caddx Ratel, Foxeer) outputs a composite video signal to the VTX and accepts <code>5V</code> (check — some take up to a wider input). Specs to match: <strong>sensor</strong> (CMOS, low-light performance), <strong>aspect ratio</strong> (4:3 vs 16:9 — match your goggles), <strong>lens FOV</strong> (~160°), and <strong>physical size</strong> (micro 19mm, nano 14mm) to fit your frame's camera cage. The camera's control wire can route to a UART for on-screen menu access.</p><h3>The VTX and antennas</h3><p>The analog video transmitter takes the camera signal and broadcasts it on <strong>5.8GHz</strong>. Key specs: <strong>power</strong> (25mW for racing/legal indoor, up to 600mW-1W+ for range — check your region's legal limit and licensing), <strong>band/channel</strong> (Raceband etc.), input voltage (many want <code>9V</code> or take a wide <code>7-26V</code>), and a control protocol (<strong>SmartAudio</strong> or Tramp) wired to a UART so you can change power/channel from your goggles. The VTX gets warm — it needs airflow and must never be powered without an antenna connected.</p><div class='box danger'><div class='bt'>Never power a VTX without an antenna.</div> Transmitting with no antenna reflects RF power back into the amplifier and can burn it out in seconds. Connect the antenna before you ever plug in the battery.</div><p><strong>Antennas:</strong> video uses circular-polarized antennas (RHCP standard) — a stubby \"lollipop\" or pagoda. Linear whips are for the control link. Match polarization between your VTX and goggle antennas, and keep antenna connectors (SMA/MMCX/U.FL) consistent.</p><div class='box law'><div class='bt'>Power limits are regulated.</div> Maximum legal VTX output power and the 5.8GHz channels you may use vary by country and may require an amateur radio license. Verify current local rules (FCC in the US, plus FAA registration for the aircraft) before transmitting at high power.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Spec a matched control + video chain.</p><ol><li>Choose analog or digital, then pick a matching RX, camera, VTX, and antenna set.</li><li>Confirm the RX protocol matches your transmitter (e.g. ELRS to ELRS).</li><li>Check input voltage for the camera and VTX against your FC's regulated outputs (5V, 9V).</li><li>Verify antenna connectors (SMA/U.FL) and polarization match your goggles.</li></ol></div></div>"},{"id":"p1-9","part":"01 · Components","nav":"GPS, PDB & Spec a Build","num":"1.9","kicker":"Part 01 · Lesson 9","title":"GPS/Compass, Power Distribution & Reading a Real Parts List","html":"<h3>GPS and compass: when you need them</h3><p>Most 5\" freestyle and racing quads fly without GPS. You add a GPS module when you want: <strong>GPS Rescue</strong> (return-to-home / failsafe recovery if you lose video or link), position telemetry, distance/home-arrow OSD, or autonomous-style features. It is close to mandatory on a <strong>7\" long-range</strong> build, where losing sight of the quad over distance is the norm.</p><p>The module contains a GNSS receiver (look for <strong>M10</strong>-generation chips like the u-blox M10, fast lock, many satellites) and often an integrated <strong>compass/magnetometer</strong>. The GPS streams position over a UART; the compass talks over <strong>I2C</strong>. For pure GPS Rescue in Betaflight you often don't strictly need the compass, and it must be mounted away from current-carrying wires and the VTX to avoid magnetic interference. Mount the GPS on a mast or the top plate with a clear sky view.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>gps-wiring</span></div><div class='term-body'>GPS 5V    -> FC 5V\nGPS GND   -> FC GND\nGPS TX    -> FC UARTn RX\nGPS RX    -> FC UARTn TX\nMAG SDA   -> FC I2C SDA  <span class='dim'>(if compass used)</span>\nMAG SCL   -> FC I2C SCL</div></div><h3>Power distribution</h3><p>On modern builds the <strong>4-in-1 ESC is the PDB</strong> — the battery solders to one pad on the ESC, which distributes power to the motors and provides a regulated 5V/sometimes 9V BEC to the stack. Standalone PDBs survive mainly on builds with four single ESCs (large quads). The other critical power part is the <strong>capacitor</strong>: a low-ESR electrolytic cap (e.g. 35V 470-1000µF) soldered across the battery pads to absorb voltage spikes from the ESC switching — it protects electronics and cleans up video noise. Always fit it.</p><div class='box tip'><div class='bt'>Voltage rating the cap.</div> The cap's voltage rating must exceed the pack's full voltage with margin: for 6S (25.2V) use a 35V cap, never a 25V one. An under-rated cap can fail explosively.</div><h3>Reading a real parts list</h3><p>When you see a published build, sort every line into a category and then sanity-check compatibility:</p><ol><li><strong>Frame</strong> — note prop size and mounting pattern (30.5×30.5?).</li><li><strong>Motors</strong> — stator + KV; does KV suit the battery cell count?</li><li><strong>ESC</strong> — continuous amps ≥ motor peak? Voltage class covers the pack?</li><li><strong>FC</strong> — enough UARTs for RX + VTX + GPS? 9V BEC if the VTX needs it?</li><li><strong>VTX + camera</strong> — input voltage available on the FC? Camera size fits the cage?</li><li><strong>RX</strong> — protocol matches the radio?</li><li><strong>Battery</strong> — S-count matches motors/ESC; C-rating covers peak current; XT60.</li><li><strong>Props</strong> — diameter matches the frame.</li></ol><div class='box law'><div class='bt'>Register and verify rules.</div> In the US, drones over 250g must be registered with the FAA and many require Remote ID; flight is subject to airspace rules. Requirements differ by country and change — always verify current FAA/local regulations before flying.</div><div class='box danger'><div class='bt'>Final pre-flight.</div> Props on last. Confirm failsafe (motors stop / GPS Rescue) is configured and tested on the bench before the first flight. A quad without a working failsafe is a flyaway waiting to happen.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Audit a real published 5\" build parts list.</p><ol><li>Find a complete 5\" build list online (frame, motors, ESC, FC, VTX, camera, RX, battery, props).</li><li>Label each line item by category.</li><li>Check the eight compatibility points above; write PASS or a concern for each.</li><li>Flag any voltage, UART-count, or mounting mismatch you find.</li></ol></div></div>"},{"id":"p2-1","part":"02 · Building","nav":"Tools & Workspace","num":"2.1","kicker":"Part 02 · Lesson 1","title":"Tools, Workspace & Safety Setup","html":"<h3>The build station</h3><p>A clean, well-lit, ventilated bench is the single biggest predictor of a clean build. Before you touch a single component, assemble your kit. Buying the right tools once saves you from stripped screws, cold joints, and burned-out FCs.</p><h4>The non-negotiable tool kit</h4><table><thead><tr><th>Tool</th><th>Spec / why</th></tr></thead><tbody><tr><td>Soldering iron</td><td>Temperature-controlled, 60-80W. A <code>TS100</code>/<code>TS101</code> or Pinecil with a chisel/bevel tip. Avoid 25W pencil irons — they cannot heat fat battery pads.</td></tr><tr><td>Solder</td><td>63/37 leaded rosin-core, 0.7-1.0mm. Leaded flows easier and is more forgiving than lead-free for hobby work.</td></tr><tr><td>Flux</td><td>No-clean rosin flux (pen or paste). Makes joints wet and shiny.</td></tr><tr><td>Hex drivers</td><td>Quality <code>1.5mm</code>, <code>2.0mm</code>, <code>2.5mm</code> drivers. Cheap drivers strip M2/M3 motor screws instantly.</td></tr><tr><td>Multimeter</td><td>Continuity beep + DC volts. Used for short-checks and the smoke test.</td></tr><tr><td>Helping hands / vise</td><td>Articulated arms or a small PCB vise to hold the frame while both hands work.</td></tr><tr><td>Misc</td><td>Side cutters (flush), tweezers, isopropyl alcohol 99%, heat-shrink, zip ties, threadlocker (blue, medium).</td></tr></tbody></table><div class='box tip'><div class='bt'>Tip.</div> A silicone heat-resistant mat protects the bench, won't melt under the iron, and the soft surface keeps tiny screws from rolling away.</div><h4>Ventilation and fume safety</h4><p>Rosin solder smoke is an irritant and a known respiratory sensitizer. Never breathe it directly. A small fume extractor with an activated-carbon filter placed between your face and the joint, or a fan pulling smoke away toward an open window, is mandatory. Solder in a ventilated space, not a sealed closet.</p><div class='box danger'><div class='bt'>SAFETY: LiPo handling.</div> Store and charge LiPos in a fire-safe container (LiPo bag, ammo can, or ceramic pot) away from anything flammable. Never leave a charging pack unattended. A punctured or puffed cell can vent and ignite — keep a Class-D or sand-based extinguisher nearby, not just water. Designate a LiPo location BEFORE you start building.</div><h4>Workspace layout</h4><ul><li><strong>Lighting</strong> — a bright daylight LED lamp plus a magnifier helps you spot bridges and cold joints.</li><li><strong>ESD</strong> — FCs and ESCs are static-sensitive. A grounded mat or touching a grounded surface before handling helps.</li><li><strong>Organization</strong> — magnetic parts tray for screws; label bags from your build kit so nothing walks off.</li></ul><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Photograph your build station with every required tool laid out.</p><ol><li>Lay out iron, solder, flux, hex drivers, multimeter, cutters, and helping hands on your mat.</li><li>Set up and photograph your fume extraction (fan or extractor) showing airflow direction.</li><li>Designate and photograph your fire-safe LiPo charge/storage location.</li><li>Write a checklist confirming ventilation, ESD precaution, and LiPo safety are in place.</li></ol></div></div>"},{"id":"p2-2","part":"02 · Building","nav":"Soldering Primer","num":"2.2","kicker":"Part 02 · Lesson 2","title":"Soldering Primer: Flux, Tinning & Good vs Cold Joints","html":"<h3>The physics of a joint</h3><p>Soldering is not gluing. A good joint forms a metallurgical bond where molten solder wets both metal surfaces and forms an alloy at the interface. To wet, both surfaces must be hotter than the solder's melting point and clean of oxides — that is the entire job of flux and tip prep.</p><h4>Iron setup</h4><ul><li><strong>Temperature</strong> — set <code>320-350°C</code> for small signal pads, <code>360-380°C</code> for big battery and ESC pads. Hotter is faster, not better; over <code>400°C</code> burns flux instantly and lifts pads.</li><li><strong>Tip</strong> — use a chisel or bevel tip, never a fine conical, for power pads. More contact area = faster heat transfer.</li><li><strong>Tinning the tip</strong> — keep a small bead of fresh solder on the tip at all times. A dry, blackened tip transfers almost no heat.</li></ul><h4>Tinning pads and wires</h4><p>The workflow that makes joints reliable is <em>tin both sides, then join</em>:</p><ol><li>Flux the pad. Touch the tip to the pad, feed a little solder until it flows into a small shiny dome. That's a tinned pad.</li><li>Twist the wire strands, flux them, and flow solder into the strands until they turn silver. That's a tinned wire.</li><li>Hold the tinned wire on the tinned pad, touch the iron to both for ~1-2 seconds. The two pools merge. Remove iron, hold still while it solidifies.</li></ol><div class='box tip'><div class='bt'>Tip.</div> The classic order: <strong>heat the joint, not the solder</strong>. Touch solder to the heated junction so capillary action pulls it in. Dripping solder off the iron onto a cold pad is the #1 cause of cold joints.</div><h4>Reading the result</h4><table><thead><tr><th>Joint</th><th>Looks like</th><th>Cause</th></tr></thead><tbody><tr><td>Good</td><td>Shiny, smooth, slightly concave, wets up the wire</td><td>Both sides hot, clean, fluxed</td></tr><tr><td>Cold</td><td>Dull, grainy, blobby, ball sitting on top</td><td>Not enough heat or moved while cooling</td></tr><tr><td>Bridged</td><td>Solder connecting two adjacent pads</td><td>Too much solder; wick or reflow to clear</td></tr><tr><td>Dry/lifted pad</td><td>Pad brown or peeled off PCB</td><td>Too hot, too long</td></tr></tbody></table><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>joint-check</span></div><div class='term-body'><span class='ok'>GOOD</span>  shiny volcano, wire fully wetted\n<span class='bad'>COLD</span>  dull grey blob, ball on surface\n<span class='bad'>BRIDGE</span> two pads joined -> wick + reflux\n<span class='dim'>tug-test: wire must not move under gentle pull</span></div></div><div class='box danger'><div class='bt'>SAFETY.</div> A 350°C iron looks identical hot or cold. Always return it to the stand, never the bench. Wash hands after handling leaded solder; do not eat at the bench.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Solder ten practice joints and self-grade each one.</p><ol><li>On a protoboard, tin ten pads and tin ten wire ends.</li><li>Join each, deliberately making a couple cold (low temp) and one bridge to learn the look.</li><li>Tug-test every joint gently — any movement = fail.</li><li>Photograph all ten and label each good or cold/bridged with the reason.</li></ol></div></div>"},{"id":"p2-3","part":"02 · Building","nav":"Build Planning","num":"2.3","kicker":"Part 02 · Lesson 3","title":"Planning the Build & Component Layout","html":"<h3>Plan before you solder</h3><p>Once a wire is soldered, moving it means desoldering. Ten minutes of dry-fitting and sketching saves hours of rework and produces a cleaner, lighter, better-balanced quad. The goal of layout is threefold: <strong>balance the center of gravity, keep antennas clear and protected, and route wires short and tidy</strong>.</p><h4>The stack</h4><p>On a typical 5-inch freestyle quad, the electronics live in a 30.5x30.5mm or 20x20mm bolt-pattern stack inside the frame:</p><ul><li><strong>Bottom: 4-in-1 ESC</strong> — sits low and central, motor wires fan out to the arms, battery pads face the rear toward the XT60.</li><li><strong>Top: Flight Controller (FC)</strong> — soft-mounted above the ESC, USB port and bind button accessible, arrow pointing forward (nose).</li><li><strong>Connections</strong> — most 4-in-1 stacks use an 8-pin JST-SH cable between ESC and FC carrying motor signals + battery power.</li></ul><div class='box tip'><div class='bt'>Tip.</div> Orient the FC so the printed <strong>arrow points to the nose</strong>. If the geometry forces another orientation, note the yaw offset (e.g. <code>yaw 90</code>) now — you'll set it in Betaflight later. Decide this BEFORE soldering anything directional.</div><h4>Component placement decisions</h4><ol><li><strong>VTX</strong> — mount near the rear, away from the GPS and RX, with a clear path for its antenna out the back of the frame. VTX runs hot, give it airflow.</li><li><strong>Receiver (RX)</strong> — small ELRS/Crossfire RX tucks under the top plate or on a standoff. Keep its antenna away from the VTX antenna and carbon.</li><li><strong>Camera</strong> — sits in the front cage between the side plates; cable runs back to the FC/VTX.</li><li><strong>Capacitor</strong> — a low-ESR cap (e.g. <code>35V 470uF-1000uF</code>) on the battery pads is strongly recommended to absorb voltage spikes — plan a spot for it.</li></ol><h4>Center of gravity and weight</h4><p>The battery straps on top or bottom; its position sets the CG. Aim for CG slightly forward of the prop center. Keep heavy items (battery, ESC) central and low. Route the battery lead so the XT60 sits where the pack plugs in naturally without a sharp bend.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>top-view layout</span></div><div class='term-body'><span class='dim'>        NOSE (FC arrow ->)</span>\n   M3 o========[ CAM ]========o M1\n      |     [ FC: arrow^ ]    |\n      |   [ 4in1 ESC + cap ]  |\n      |        [ RX ]         |\n   M2 o=====[ VTX -> ant ]====o M4\n<span class='dim'>        TAIL (vtx antenna exits rear)</span></div></div><div class='box danger'><div class='bt'>SAFETY.</div> Never let a VTX or RX antenna route across or near a spinning prop disc. A severed antenna mid-flight can mean total signal loss. Plan exit points that clear the props by a wide margin.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Dry-fit every component and sketch the final layout.</p><ol><li>Place the ESC, FC, RX, VTX, camera, and capacitor into the frame with no soldering.</li><li>Confirm the FC arrow orientation and note any yaw offset needed.</li><li>Mark wire routes and both antenna exit points on a sketch or annotated photo.</li><li>Verify nothing fouls a prop and the CG sits central/slightly forward.</li></ol></div></div>"},{"id":"p2-4","part":"02 · Building","nav":"Mounting Motors & ESC","num":"2.4","kicker":"Part 02 · Lesson 4","title":"Mounting Motors and the 4-in-1 ESC","html":"<h3>Mechanical first</h3><p>Get the mechanical assembly right before any soldering. The two failures here — a screw that pierces a motor winding, or an ESC shorting against carbon — are silent until you power up and let the smoke out.</p><h4>Screw length: the most important number</h4><p>Most 5-inch motors use an <strong>M3 bolt pattern</strong> with a typical screw depth of around <code>5-6mm</code> into the motor base. The arm thickness plus screw length must not exceed the available depth, or the screw tip presses into the motor's stator windings and shorts a phase.</p><ul><li>Check the motor spec for max screw depth (often printed or in the listing, e.g. <code>M3 x 6mm max</code>).</li><li>Measure arm thickness (commonly <code>3-4mm</code> carbon).</li><li>Pick screws so: <em>arm thickness + thread engagement ≤ motor max depth</em>. When in doubt, use a shorter screw with a washer.</li></ul><div class='box danger'><div class='bt'>SAFETY: screws into windings.</div> Before final tightening, spin each motor by hand after seating the screws. Any scratchy resistance or a screw tip visible inside the bell means the screw is too long — stop and shorten it. A pierced winding will smoke the moment you connect a battery.</div><h4>Mounting motors</h4><ol><li>Apply a tiny drop of <strong>blue (medium) threadlocker</strong> to each screw — vibration backs out untreated screws in minutes. Never use red (permanent).</li><li>Seat the motor flat on the arm, start all four screws by hand, then tighten in a cross pattern.</li><li>Tighten firmly but not gorilla-tight — M3 in carbon strips easily. Snug, then a quarter turn.</li><li>Route each motor's three wires inward along the arm toward the ESC; don't trim to length yet.</li></ol><h4>Seating the 4-in-1 ESC</h4><p>The ESC bolts into the frame on standoffs (M3, usually <code>30.5x30.5mm</code>). The danger is the bottom of the ESC PCB touching the carbon frame or a metal standoff and shorting.</p><ul><li>Use the supplied <strong>nylon standoffs or rubber gummies</strong> to lift the ESC off the frame plate.</li><li>Confirm the bottom of the ESC clears any carbon — add nylon washers if needed.</li><li>Orient the ESC so the battery pads face the rear (toward where the XT60 exits) and the motor pads are nearest their respective arms.</li><li>Confirm the stack sits flat and level — a tilted ESC means the FC above it won't seat.</li></ul><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>screw-length check</span></div><div class='term-body'>motor max depth ...... <span class='ok'>6.0 mm</span>\narm thickness ........ 4.0 mm\nscrew length ......... 8.0 mm  -> <span class='bad'>4mm into stator = SHORT</span>\nscrew length ......... 6.0 mm  -> <span class='ok'>2mm engage, safe</span>\n<span class='dim'>rule: length - arm <= max depth</span></div></div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Mount all four motors and the ESC into the frame.</p><ol><li>Calculate correct screw length for your motor max depth and arm thickness.</li><li>Threadlock and mount all four motors; spin each by hand to confirm no winding contact.</li><li>Seat the 4-in-1 ESC on standoffs/gummies with the battery pads facing rear.</li><li>Confirm the stack is flat, level, and the ESC bottom clears all carbon.</li></ol></div></div>"},{"id":"p2-5","part":"02 · Building","nav":"Soldering Power","num":"2.5","kicker":"Part 02 · Lesson 5","title":"Soldering Motors, ESC & FC Power","html":"<h3>Now the soldering</h3><p>With everything mounted, solder the high-current connections. This is where good iron technique pays off — these pads carry tens of amps, and a cold joint here means dropouts, desyncs, or a fire.</p><h4>Motor leads to the ESC</h4><p>Each motor has three wires going to three pads per corner on the 4-in-1 ESC. The order does not matter electrically yet — any of the three can go to any of the three pads, because motor direction is fixed later in software or by swapping any two. So solder them in whatever order routes cleanest.</p><ol><li>Trim each motor wire to length so it reaches its corner pads with a gentle, strain-free arc — not bar-tight, not a big loop.</li><li>Strip ~2mm, tin the wire ends, and pre-tin the ESC motor pads.</li><li>Solder each wire to its pad: heat the joint, the two tinned pools merge, hold still while it sets.</li><li>Tug-test each. Keep the three wires from one motor neat and parallel.</li></ol><div class='box tip'><div class='bt'>Tip.</div> Don't worry about getting motor direction right by wire order. You'll reverse any motor in BLHeli/Bluejay or by swapping two of its three wires after the build. Solder for tidiness now, set direction in Lesson 2.7.</div><h4>Battery lead and capacitor</h4><p>The XT60 pigtail and the low-ESR capacitor both go on the ESC's big battery pads, marked <code>+</code> (or <code>BAT+</code>/<code>VBAT</code>) and <code>-</code> (<code>GND</code>).</p><ul><li>Use thick wire (typically <code>14AWG</code> on a 5-inch). Tin both the wire and the fat pads with the iron set hot (<code>~370°C</code>) — these pads sink a lot of heat.</li><li><strong>Red to +, black to -.</strong> Reversing this destroys the ESC and FC instantly.</li><li>Solder the capacitor across the same pads, observing polarity: the cap's <strong>stripe/short leg is negative</strong>. Heat-shrink the cap legs to prevent shorts.</li></ul><div class='box danger'><div class='bt'>SAFETY: verify polarity.</div> Before ever connecting a battery, set your multimeter to continuity and confirm: battery + traces to BAT+, battery - traces to GND, and NO continuity between + and -. A reversed XT60 or a + to - bridge is the single most common build-killer. Check twice.</div><h4>FC-to-ESC connection</h4><p>Most stacks ship with a plug-and-play <strong>8-pin JST-SH harness</strong> that carries the four motor signals plus VBAT and GND from ESC to FC. Just plug it in — confirm it's keyed correctly and fully seated. If your stack instead uses solder pads, match each pad label (<code>M1-M4</code>, <code>VBAT</code>, <code>GND</code>, <code>CURR</code>) one-to-one between boards.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>polarity verify (DMM continuity)</span></div><div class='term-body'>XT60 red  -> ESC BAT+ ... <span class='ok'>beep</span>\nXT60 black -> ESC GND ... <span class='ok'>beep</span>\nBAT+ <-> GND ............. <span class='ok'>silent (no short)</span>\ncap stripe -> GND ....... <span class='ok'>correct polarity</span></div></div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Solder all motor leads and the battery lead to the ESC.</p><ol><li>Trim, tin, and solder all twelve motor wires to their corner pads; tug-test each.</li><li>Solder the XT60 lead (red=+, black=-) and the capacitor to the battery pads, watching cap polarity.</li><li>Plug in or solder the FC-to-ESC harness.</li><li>Photograph each joint and visually inspect for cold joints, bridges, or stray strands.</li></ol></div></div>"},{"id":"p2-6","part":"02 · Building","nav":"Wiring RX, Cam & VTX","num":"2.6","kicker":"Part 02 · Lesson 6","title":"Wiring the Receiver, Camera & VTX","html":"<h3>Signal wiring</h3><p>These are the low-current, low-margin-for-error connections. Each device connects to specific FC pads, and getting the UART and voltage right matters. Pull out the port plan you made earlier — that map is your wiring contract.</p><h4>The receiver (RX)</h4><p>A serial RX (ELRS, Crossfire, or similar) needs four connections to a free UART:</p><table><thead><tr><th>RX pin</th><th>FC pad</th><th>Notes</th></tr></thead><tbody><tr><td>VCC</td><td><code>5V</code> (or 4V5)</td><td>Most modern RX run on 5V — check the module</td></tr><tr><td>GND</td><td><code>GND</code></td><td>Common ground</td></tr><tr><td>TX (RX module)</td><td>FC <code>RX</code> of a UART</td><td>Crossed: module TX -> FC RX</td></tr><tr><td>RX (RX module)</td><td>FC <code>TX</code> of the same UART</td><td>module RX -> FC TX</td></tr></tbody></table><div class='box tip'><div class='bt'>Tip.</div> UART pairs are always crossed: the receiver's TX goes to the flight controller's RX. Mixing these up is the most common reason a brand-new RX shows no telemetry or won't bind in software.</div><h4>The FPV camera</h4><p>An analog camera typically has three wires: <strong>power, ground, and video out</strong>.</p><ul><li><strong>VCC</strong> — match the camera's input range. Many run <code>5V</code>; some accept battery voltage on a dedicated pad. Don't feed 4S/6S into a 5V-only cam.</li><li><strong>GND</strong> — to a GND pad.</li><li><strong>Video</strong> — to the FC's <code>CAM</code> / video-in pad (the FC's OSD overlays here, then passes video to the VTX), or directly to the VTX video-in depending on your stack.</li></ul><h4>The VTX</h4><p>The video transmitter usually needs power, ground, video-in, and often a control wire (SmartAudio/IRC Tramp) for changing channels and power from the OSD:</p><ul><li><strong>VBAT</strong> — most VTXs take raw battery voltage (check; some are 5V only). Powering a battery-rated VTX from 5V starves it.</li><li><strong>GND</strong> — common ground.</li><li><strong>Video in</strong> — from the FC video-out pad (so OSD is included).</li><li><strong>SmartAudio</strong> — single wire to a spare UART TX for OSD control. Set the UART to that protocol later.</li></ul><div class='box danger'><div class='bt'>SAFETY.</div> Never power up a VTX without an antenna attached. Transmitting into an open connector reflects power back and can permanently burn the VTX amplifier. Confirm the antenna is connected before any power-up in the next lessons.</div><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>wiring map (example)</span></div><div class='term-body'>RX:  5V / GND / TX1 / RX1   <span class='dim'>(UART1, crossed)</span>\nCAM: 5V / GND / vid-in (FC CAM)\nVTX: VBAT / GND / vid-out / SmartAudio->TX6\n<span class='am'>verify each VCC matches device voltage rating</span></div></div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Solder the RX, camera, and VTX per your UART map.</p><ol><li>Solder the RX to a free UART (remember TX/RX cross) at the correct voltage.</li><li>Wire the camera power, ground, and video to the FC.</li><li>Wire the VTX power, ground, video-in, and SmartAudio.</li><li>Continuity-check each VCC and GND, then build a photo log of every connection labeled with its pad.</li></ol></div></div>"},{"id":"p2-7","part":"02 · Building","nav":"Antennas, Props & Direction","num":"2.7","kicker":"Part 02 · Lesson 7","title":"Antenna Mounting, Props & Setting Motor Direction","html":"<h3>Antennas, rotation, props</h3><p>Three jobs that decide whether the quad flies straight and whether you keep video and control link: mounting antennas with strain relief, setting motor direction, and installing props in the right CW/CCW positions.</p><h4>Mounting the antennas</h4><ul><li><strong>VTX antenna</strong> — route the coax out the rear with no sharp bends (keep bend radius generous; coax kinks ruin SWR). Secure it in a TPU antenna mount or tube so it can't flop into a prop. The radiating tip should be clear of carbon.</li><li><strong>RX antennas</strong> — for diversity RX, mount the two antenna tips at 90 degrees to each other for polarization diversity. Keep the active tip (the exposed coax end) away from carbon, the VTX antenna, and ESC.</li><li><strong>Strain relief</strong> — the weak point is where coax meets the connector/board. Add a service loop and anchor the cable with a zip tie or hot glue so vibration and crashes don't fatigue the joint.</li></ul><div class='box danger'><div class='bt'>SAFETY.</div> Re-confirm no antenna can reach the prop disc. A loose VTX antenna sucked into a 5-inch prop at full throttle is both a signal loss and a shrapnel hazard. TPU mounts with a captured tube are the standard fix.</div><h4>Motor direction</h4><p>Quad motors spin in a specific pattern. The modern default in Betaflight is <strong>props-out</strong> (front motors spin outward at the front). The diagonal pairs spin the same direction:</p><table><thead><tr><th>Motor</th><th>Position</th><th>Direction (props-out)</th></tr></thead><tbody><tr><td>M1</td><td>Rear-right</td><td>CCW</td></tr><tr><td>M2</td><td>Front-right</td><td>CW</td></tr><tr><td>M3</td><td>Rear-left</td><td>CW</td></tr><tr><td>M4</td><td>Front-left</td><td>CCW</td></tr></tbody></table><p>You set direction in software (BLHeli_S/Bluejay or BLHeli_32 via the configurator's motor tab, props OFF) or by physically swapping any two of a motor's three wires. Confirm each motor matches the diagram in the Betaflight/ESC motor test before installing props.</p><h4>Installing props</h4><p>Props are handed: <strong>CW props go on CW motors, CCW props on CCW motors</strong>. Self-tightening prop nuts tighten in the direction opposite to motor spin. Props are usually marked, or the leading edge (the higher, smoother edge) faces the direction of rotation.</p><div class='box danger'><div class='bt'>SAFETY: props off until smoke test passes.</div> Do NOT install props for power-up testing yet. Lay them in position only. Props go on last, after the smoke test and motor-direction check are both confirmed (next lesson). A quad that arms unexpectedly with props on can cause serious injury.</div><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>props-out rotation (top view)</span></div><div class='term-body'><span class='dim'>      FRONT</span>\n M4 CCW )    ( CW M2\n        \\  /\n         XX\n        /  \\\n M3 CW  )    ( CCW M1\n<span class='dim'>      REAR</span>\n<span class='am'>match prop hand to motor direction; nuts self-tighten</span></div></div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Mount both antennas and lay out props in correct rotation (not powered).</p><ol><li>Mount the VTX and RX antennas with TPU mounts and a strain-relief service loop.</li><li>Confirm no antenna can reach the prop disc.</li><li>Confirm your intended motor directions (props-out) on the diagram.</li><li>Lay the four props in their correct CW/CCW positions and take a labeled photo — do not install or power.</li></ol></div></div>"},{"id":"p2-8","part":"02 · Building","nav":"Smoke Test & Continuity","num":"2.8","kicker":"Part 02 · Lesson 8","title":"The Pre-Flight Smoke Test & Continuity Checks","html":"<h3>The moment of truth</h3><p>The smoke test is the first time the build sees voltage. Done right, a wiring fault reveals itself harmlessly. Done wrong, you watch a $40 stack vaporize. The procedure has two phases: a powered-off continuity check, then a current-limited first power-up — props OFF.</p><h4>Phase 1: continuity / short check (no power)</h4><p>Set your multimeter to continuity (beep) mode and verify:</p><ol><li><strong>No short across the input.</strong> Probe battery + and battery - at the XT60. It should be SILENT (the cap may cause a brief charge-up beep then silence). A solid beep = a dead short; do not connect a battery.</li><li><strong>Polarity continuity.</strong> XT60 + traces to BAT+/VBAT pads; XT60 - traces to GND. Both should beep.</li><li><strong>No signal-pad shorts.</strong> Spot-check that 5V does not beep to GND, and VBAT does not beep to GND.</li></ol><div class='box danger'><div class='bt'>SAFETY: find the short FIRST.</div> If + to - beeps, STOP. Inspect for solder bridges on the battery pads, a reversed capacitor, a stray wire whisker, or a pierced motor winding. Never apply battery power to a shorted board — that is exactly what releases the smoke.</div><h4>Phase 2: smoke-stopper power-up (props off)</h4><p>A <strong>smoke-stopper</strong> is an inline device with a low-wattage incandescent bulb (or a current-limited supply) between battery and quad. If there's a short, the bulb glows bright and limits current to a safe trickle instead of dumping the full LiPo into the fault.</p><ol><li>Remove all props (confirm — props OFF).</li><li>Connect the quad through the smoke-stopper to a battery (or use a bench supply set to a low current limit, e.g. <code>1A</code>).</li><li><strong>Watch and smell.</strong> The bulb should flash briefly (cap inrush) then go dim/dark. A bulb that stays bright = a short still present — disconnect immediately.</li><li>Confirm the FC, ESC, VTX, and RX LEDs come alive. No component should get hot. No smoke, no smell.</li><li>Plug in USB and confirm the FC enumerates in the configurator; check the motor tab shows correct motor mapping and direction (still props off).</li></ol><div class='box tip'><div class='bt'>Tip.</div> No smoke-stopper? Use a bench power supply with a current limit set low (~0.5-1A) for the first power-up — it does the same job. Touch each chip with a fingertip after a few seconds; anything hot signals a fault.</div><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>smoke-test log</span></div><div class='term-body'>continuity + to - ........ <span class='ok'>no short</span>\npolarity + ->BAT+ ........ <span class='ok'>beep ok</span>\nsmoke-stopper power ...... <span class='ok'>flash then dim</span>\nFC / ESC / VTX / RX LED .. <span class='ok'>all alive</span>\ncomponent temps .......... <span class='ok'>cool</span>\nmotor tab direction ...... <span class='ok'>verify props off</span></div></div><div class='box danger'><div class='bt'>SAFETY.</div> If anything smokes, smells, or gets hot, disconnect the battery instantly and move the LiPo to your fire-safe location. Do not re-power until you have found and fixed the fault.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Run a short-check then a first power-up and log the results.</p><ol><li>Continuity-check + to - (no short) and confirm polarity to the pads.</li><li>Confirm all props are OFF.</li><li>Power up through a smoke-stopper or current-limited supply; watch for flash-then-dim and any smoke or heat.</li><li>Confirm all device LEDs, check temps, and log each result as pass/fail.</li></ol></div></div>"},{"id":"p2-9","part":"02 · Building","nav":"Cable Mgmt & Soft-Mount","num":"2.9","kicker":"Part 02 · Lesson 9","title":"Cable Management, Soft-Mounting & Final Airframe","html":"<h3>Finishing the airframe</h3><p>A quad that passed the smoke test still isn't flight-ready. Loose wires get cut by props or fatigue and break; a hard-mounted FC picks up motor vibration that corrupts the gyro and causes oscillations. The final pass is cable management, soft-mounting, and a mechanical sign-off.</p><h4>Cable management</h4><ul><li><strong>Service loops, not tension.</strong> Every wire should have a gentle loop so a crash flexes the wire, not the solder joint. Bar-tight wires rip pads off.</li><li><strong>Anchor everything.</strong> Use small zip ties or a dab of hot glue to secure wire runs to standoffs and the frame. Trim zip-tie tails flush.</li><li><strong>Clear the prop arc.</strong> Tuck all wiring and antennas inside the frame's protected zone. Nothing should overhang where a prop spins.</li><li><strong>Strain-relieve the battery lead and antennas.</strong> These take the most abuse. A loop of wire anchored before the connector saves the joint.</li><li><strong>Reinforce solder joints.</strong> A drop of hot glue over signal-wire joints (RX, cam, VTX, capacitor legs) prevents vibration cracking and accidental shorts.</li></ul><h4>Soft-mounting the FC</h4><p>The gyro must read airframe motion, not high-frequency motor buzz. Soft-mounting isolates it:</p><ul><li><strong>Rubber gummies / grommets</strong> — the FC sits on silicone grommets pressed onto the standoffs, with M3 screws passing through. The FC floats on rubber, not rigid metal.</li><li>Don't over-tighten — crushing the gummies defeats the isolation. The FC should be slightly compliant, not clamped solid.</li><li>Ensure the soft-mounted FC still can't shift enough to short against the ESC or standoffs.</li></ul><div class='box tip'><div class='bt'>Tip.</div> Good soft-mounting reduces gyro noise and lets you run less filtering in Betaflight, which improves response and reduces latency. A hard-mounted FC is a leading cause of hot motors and the dreaded mid-throttle oscillation.</div><h4>Final mechanical sign-off</h4><p>Before the quad is declared flight-ready, walk a checklist:</p><table><thead><tr><th>Check</th><th>Pass criteria</th></tr></thead><tbody><tr><td>Motor screws</td><td>Threadlocked, tight, no winding contact</td></tr><tr><td>Prop nuts</td><td>Correct hand, will self-tighten (props installed LAST)</td></tr><tr><td>Wiring</td><td>Service loops, anchored, clear of prop arc</td></tr><tr><td>FC soft-mount</td><td>On gummies, compliant, can't short</td></tr><tr><td>Antennas</td><td>Strain-relieved, clear of props, connected</td></tr><tr><td>Smoke test</td><td>Passed, no heat/smoke</td></tr></tbody></table><div class='box danger'><div class='bt'>SAFETY.</div> Install props only after all checks pass and only when you are ready to fly with a clear failsafe configured. Before the first flight, confirm in software that throttle-cut/failsafe drops the motors when the link is lost, and always remove the battery before working on the quad. Verify current FAA and local rules for registration and flying location before any outdoor flight.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Finish cable management and soft-mounting, then sign off the build.</p><ol><li>Anchor and strain-relieve every wire and antenna; reinforce signal joints with hot glue.</li><li>Soft-mount the FC on gummies without over-tightening.</li><li>Confirm nothing fouls the prop arc and the FC can't short.</li><li>Complete the mechanical sign-off checklist confirming the quad is flight-ready (props installed last, before flight).</li></ol></div></div>"},{"id":"p3-1","part":"03 · Firmware & Software","nav":"Firmware Landscape","num":"3.1","kicker":"Part 03 · Lesson 1","title":"The Firmware Landscape: Betaflight, INAV, ArduPilot, PX4 & DJI","html":"<h3>Flight controllers run software, not magic</h3><p>The flight controller (FC) is a small computer running an MCU like the <code>STM32F405</code>, <code>F722</code>, or the newer <code>H743</code>. The firmware on that chip reads the gyro/accelerometer (IMU), reads your receiver, runs a control loop hundreds or thousands of times per second, and outputs motor commands to the ESCs. Choosing firmware is choosing a philosophy: razor-sharp manual control, or GPS-assisted autonomy.</p><h3>The five players</h3><table><thead><tr><th>Firmware</th><th>Best for</th><th>Difficulty</th></tr></thead><tbody><tr><td>Betaflight</td><td>Freestyle, racing, cinematic 5\" quads</td><td>Beginner-friendly</td></tr><tr><td>INAV</td><td>GPS multirotors, fixed-wing, long-range, return-to-home</td><td>Moderate</td></tr><tr><td>ArduPilot</td><td>Autonomous missions, mapping, heavy-lift, boats/rovers</td><td>Advanced</td></tr><tr><td>PX4</td><td>Research, commercial drones, professional autonomy</td><td>Advanced</td></tr><tr><td>DJI (closed)</td><td>Camera drones, O3/O4 air units, ready-to-fly</td><td>Plug-and-play</td></tr></tbody></table><h3>Betaflight</h3><p>The default for FPV freestyle and racing. It prioritizes low latency and crisp stick response over autonomy. It is open source, has a huge community, and the <strong>Configurator</strong> GUI makes setup approachable. It supports GPS for rescue (return-to-home on signal loss) but is not a survey or waypoint platform.</p><h3>INAV</h3><p>A Betaflight fork that adds serious navigation: waypoint missions, GPS position hold, altitude hold, and robust return-to-home. INAV is the go-to for fixed-wing planes and GPS \"cruiser\" multirotors. The PID/feel is less razor-sharp than Betaflight, which is fine for autonomous flying.</p><h3>ArduPilot &amp; PX4</h3><p>These are full autonomy stacks used in commercial, agricultural, and research drones. They run on Pixhawk-class hardware, integrate with ground-control software (Mission Planner, QGroundControl), and support planes, copters, rovers, and boats. Steep learning curve, but unmatched for autonomous missions.</p><h3>DJI ecosystem</h3><p>DJI uses closed firmware on products like the O3/O4 Air Unit and full camera drones. You configure through the DJI Fly/Goggles app, not a desktop tool. You trade tunability for reliability and image quality. Note: the FPV-side O3/O4 air unit can pair with a Betaflight FC for the flight side while DJI handles the video.</p><div class='box tip'><div class='bt'>Rule of thumb.</div> If you fly with your hands and eyes (freestyle/racing), pick Betaflight. If the drone should fly itself or hold position, pick INAV (hobby) or ArduPilot/PX4 (professional).</div><div class='box law'><div class='bt'>Regulation note.</div> Autonomy features do not exempt you from Remote ID, registration, or airspace rules. Verify current FAA Part 107/recreational rules (or your national CAA) before any beyond-line-of-sight or automated flight.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Build a firmware decision matrix and pick yours.</p><ol><li>List your build's goal (freestyle, GPS plane, autonomous mapping, camera).</li><li>Make a table: firmware vs. use case, hardware support (does your FC target exist?), and difficulty.</li><li>Check your FC's product page for which firmware targets it ships with.</li><li>Circle the single firmware you'll flash and write one sentence justifying it.</li></ol></div></div>"},{"id":"p3-2","part":"03 · Firmware & Software","nav":"Flashing Betaflight","num":"3.2","kicker":"Part 03 · Lesson 2","title":"Flashing Betaflight & the Configurator Tour","html":"<h3>Get the tools</h3><p>Install the <strong>Betaflight Configurator</strong> (the desktop app, or the Chrome/standalone build) and the <strong>Betaflight Blackbox Explorer</strong>. On Windows you also need the <code>Zadig</code> driver tool so the FC's DFU bootloader is recognized; on macOS/Linux drivers usually just work.</p><h3>Enter bootloader (DFU)</h3><p>To flash, the FC must be in <strong>DFU</strong> (Device Firmware Update) mode. Two ways:</p><ul><li>Hold the <code>BOOT</code> button on the FC while plugging in USB.</li><li>Or connect normally, then in the Configurator's Firmware Flasher click the device dropdown and select <code>DFU</code>.</li></ul><p>When in DFU, the port dropdown shows <code>DFU</code> instead of a COM/tty port.</p><h3>Pick the right target</h3><p>This is the #1 way people brick a board: <strong>flashing the wrong target.</strong> The target is the board name (e.g., <code>SPEEDYBEEF405V4</code>, <code>STM32F405</code>). Find your exact FC model in its documentation. In the Firmware Flasher, select the target, the latest stable release, and read the release notes.</p><div class='box danger'><div class='bt'>Props OFF, always.</div> Never have propellers installed while connected to USB or testing motors. A firmware glitch or accidental arm can spin a prop into your fingers.</div><h3>Flash settings</h3><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>Firmware Flasher</span></div><div class='term-body'>Target:           <span class='cm'>SPEEDYBEEF405V4</span>\nVersion:          <span class='cm'>4.5.x (Stable)</span>\nFull chip erase:  <span class='ok'>ON  (clears old junk config)</span>\nManual baud:      <span class='dim'>off (auto is fine)</span>\n\n[ Load Firmware Online ]  ->  [ Flash Firmware ]\n<span class='ok'>Programming: 100% — Verifying... OK</span></div></div><p>Use <strong>Full chip erase</strong> when in doubt; you'll reconfigure from scratch but avoid leftover settings causing weird behavior. After flashing, the board reboots and reconnects.</p><h3>Configurator tab tour</h3><ul><li><strong>Setup</strong> — the 3D model that mirrors your quad; calibrate accelerometer, reset, see arming flags.</li><li><strong>Ports</strong> — assign UART functions (serial RX, GPS, VTX).</li><li><strong>Configuration / Motors / Modes / Receiver</strong> — core flight setup.</li><li><strong>OSD</strong> — on-screen display layout.</li><li><strong>PID Tuning</strong> — rates, PIDs, filters.</li><li><strong>CLI</strong> — the text command line for advanced edits; <code>diff all</code> dumps your full config, <code>save</code> writes and reboots.</li></ul><p>On the Setup tab, tilt the physical quad and watch the model. If it moves the wrong way, your board orientation (<code>Yaw 180</code> etc.) needs setting in Configuration. A responsive, correctly-oriented model is your green light to proceed.</p><div class='box tip'><div class='bt'>Back up first.</div> Before any flash or big change, open CLI and run <code>diff all</code>, then copy the output to a text file. That's your restore point.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Flash Betaflight and verify a live, correctly-oriented model.</p><ol><li>Install Configurator + drivers; connect FC via USB (props OFF).</li><li>Look up your exact FC target name in its docs.</li><li>Enter DFU, select target + latest stable, enable Full chip erase, flash.</li><li>Reconnect, open Setup, tilt the quad, confirm the model matches. Screenshot it.</li></ol></div></div>"},{"id":"p3-3","part":"03 · Firmware & Software","nav":"Ports & UARTs","num":"3.3","kicker":"Part 03 · Lesson 3","title":"Ports & UARTs: Wiring Peripherals in Software","html":"<h3>What a UART is</h3><p>A <strong>UART</strong> (Universal Asynchronous Receiver/Transmitter) is a hardware serial port on the FC, labeled <code>TX1/RX1</code>, <code>TX2/RX2</code>, etc. Each peripheral that talks serially — your radio receiver, a VTX with control, a GPS — needs its own UART. The Ports tab is where you tell the firmware <em>what is plugged into which UART</em>. Physical wiring alone does nothing; the software must enable the matching function.</p><h3>The TX/RX cross rule</h3><p>Serial is wired crossed: the peripheral's <strong>TX goes to the FC's RX</strong> and vice versa. If your receiver isn't detected, a swapped TX/RX is the most common cause. Note which UART number a pad belongs to (the silkscreen says <code>R2</code> = RX of UART2).</p><h3>Common assignments</h3><table><thead><tr><th>Peripheral</th><th>Ports tab column</th><th>Notes</th></tr></thead><tbody><tr><td>Receiver (ELRS/Crossfire/etc.)</td><td>Serial RX (the toggle)</td><td>Protocol set in Configuration tab</td></tr><tr><td>VTX control (Tramp/SmartAudio)</td><td>Peripherals → VTX (Tramp) or VTX (TBS SmartAudio)</td><td>Single wire to a TX pad</td></tr><tr><td>GPS</td><td>Sensor Input → GPS</td><td>Set baud (often 115200) and enable GPS in Configuration</td></tr><tr><td>ESC telemetry</td><td>Sensor Input → ESC</td><td>For RPM/temp from BLHeli_32/AM32</td></tr></tbody></table><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>Ports tab</span></div><div class='term-body'>UART1  <span class='dim'>Configuration/MSP 115200</span>  SerialRX <span class='dim'>off</span>  Periph <span class='dim'>off</span>\nUART2  <span class='dim'>Config/MSP off          </span>  SerialRX <span class='ok'>ON</span>   Periph <span class='dim'>off</span>   <span class='cm'># receiver</span>\nUART4  <span class='dim'>Config/MSP off          </span>  SerialRX off  Periph <span class='ok'>VTX SmartAudio</span>\nUART6  <span class='dim'>Config/MSP off          </span>  SensorIn <span class='ok'>GPS 115200</span>          <span class='cm'># gps</span>\n\n[ Save and Reboot ]</div></div><h3>Important gotchas</h3><ul><li><strong>Leave UART1 (or whichever has the USB MSP) alone</strong> unless you know it's free — it's often your Configuration/MSP link.</li><li>After enabling Serial RX here, go to <strong>Configuration</strong> and pick the receiver protocol (e.g., <code>CRSF</code> for ELRS/Crossfire). The Ports tab only opens the lane; Configuration names the traffic.</li><li>SmartAudio/Tramp is a <strong>single wire</strong> to a TX pad; you still assign it on a full UART column.</li><li>One function per UART. You can't run a receiver and VTX control on the same port.</li></ul><div class='box tip'><div class='bt'>Verify, don't assume.</div> After Save and Reboot, check the Receiver tab for moving bars, the GPS tab for a sat count, and your VTX menu for control. If a peripheral is dead, suspect TX/RX swap or wrong UART first.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Map your physical wiring into the Ports tab.</p><ol><li>Trace each peripheral wire to its UART number on the FC silkscreen.</li><li>Enable Serial RX for the receiver's UART; set protocol in Configuration.</li><li>Assign VTX control and GPS to their UARTs; set GPS baud.</li><li>Save and Reboot, then confirm receiver bars, sat count, and VTX control all respond.</li></ol></div></div>"},{"id":"p3-4","part":"03 · Firmware & Software","nav":"Receiver & Modes","num":"3.4","kicker":"Part 03 · Lesson 4","title":"Receiver Setup, Modes & Arming","html":"<h3>Verify your channels first</h3><p>Open the <strong>Receiver</strong> tab. Move each stick and watch the bars. The convention is <strong>AETR</strong>: Roll (A), Pitch (E), Throttle (T), Yaw (R), then Aux channels. Confirm:</p><ul><li>Each stick moves the correct bar in the correct direction.</li><li>Centered sticks read about <code>1500</code>; endpoints reach roughly <code>1000</code> and <code>2000</code>.</li><li>Throttle low = <code>~1000</code>, full = <code>~2000</code>. If reversed, fix the channel map (or radio), not by guessing.</li></ul><p>Set the <strong>Channel Map</strong> dropdown to match your radio's output order. ELRS/Crossfire on <code>CRSF</code> typically reports clean values automatically.</p><div class='box danger'><div class='bt'>Props OFF for all of this.</div> You are about to make the quad armable. Remove every propeller before assigning Arm and testing modes. Treat an armed quad as a spinning hazard even on the bench.</div><h3>Assigning modes</h3><p>Go to the <strong>Modes</strong> tab. Modes are activated by Aux channel ranges (a switch position on your radio). The essentials:</p><table><thead><tr><th>Mode</th><th>Purpose</th></tr></thead><tbody><tr><td>ARM</td><td>Enables motors. Map to a momentary or 2-position switch.</td></tr><tr><td>ANGLE</td><td>Self-leveling (beginner). Releasing sticks levels the quad.</td></tr><tr><td>HORIZON</td><td>Self-levels but allows full flips.</td></tr><tr><td>ACRO (no mode)</td><td>Rate mode — no self-level. The default when ANGLE/HORIZON are off.</td></tr><tr><td>BEEPER</td><td>Find-my-quad buzzer.</td></tr><tr><td>FLIP OVER AFTER CRASH (Turtle)</td><td>Reverses motors to right an upside-down quad.</td></tr></tbody></table><h3>Setting the switch ranges</h3><p>For each mode, click Add Range, pick the Aux channel, then flip the physical switch and watch the yellow marker. Drag the range so it covers <em>only</em> the switch position you want. A good ARM range is <strong>~1750–2100</strong> on a 2-position switch, leaving a clear OFF zone.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>Modes tab</span></div><div class='term-body'>ARM     AUX1   range <span class='ok'>1750 - 2100</span>   <span class='cm'># switch UP = armed</span>\nANGLE   AUX2   range <span class='ok'>1300 - 1700</span>   <span class='cm'># mid = self-level</span>\nACRO    <span class='dim'>(no switch — active when ANGLE off)</span>\nBEEPER  AUX3   range <span class='ok'>1750 - 2100</span>\n\n<span class='bad'>Arming flags: throttle high, RX loss</span>  <span class='dim'>(clear these before arming)</span></div></div><h3>Arming safety checks</h3><ul><li>Betaflight refuses to arm if <strong>throttle isn't low</strong>, if the quad isn't level (when configured), or if there are <strong>arming flags</strong> (shown on Setup tab and in the OSD).</li><li>Set up <strong>failsafe</strong> (Configuration / Failsafe tab) to <code>Drop</code> so motors cut on signal loss — never let a lost quad keep flying toward people.</li><li>Test arming with the radio only, props off: flip ARM, confirm the OSD/Setup shows <code>ARMED</code>, then disarm. The motors should idle, not jump.</li></ul><div class='box tip'><div class='bt'>Disarm habit.</div> Make ARM a flip-up switch you can reach instantly, and build the muscle memory to flip it OFF the moment something feels wrong.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Set channels and assign arming + flight modes, props OFF.</p><ol><li>In Receiver, verify AETR direction, center 1500, throttle low/high.</li><li>In Modes, assign ARM to a switch with a clean 1750–2100 range.</li><li>Add ANGLE on a separate switch; leave the OFF position as Acro.</li><li>Confirm failsafe = Drop, then arm/disarm via radio and watch the state change.</li></ol></div></div>"},{"id":"p3-5","part":"03 · Firmware & Software","nav":"OSD Setup","num":"3.5","kicker":"Part 03 · Lesson 5","title":"Configuring the OSD: Voltage, Timer & Warnings","html":"<h3>What the OSD is</h3><p>The <strong>OSD</strong> (On-Screen Display) overlays flight data onto your video feed so you see it in the goggles. Two flavors exist: classic <strong>analog/MAX7456</strong> character OSD, and <strong>digital (MSP) OSD</strong> used by DJI/HDZero/Walksnail, which renders the same elements through the air unit. Setup is similar in the Configurator's OSD tab; digital systems give you more resolution and font choices.</p><h3>The must-have elements</h3><p>You can drag dozens of elements onto the layout, but clutter kills awareness. The non-negotiables:</p><table><thead><tr><th>Element</th><th>Why it matters</th></tr></thead><tbody><tr><td>Battery voltage (avg cell or pack)</td><td>Your fuel gauge — land before sag drops cells under load.</td></tr><tr><td>Flight timer (on-time / arm-time)</td><td>Budget flight to battery, not luck. Use the armed timer.</td></tr><tr><td>RSSI / Link Quality (LQ)</td><td>On ELRS, watch LQ — falling LQ warns of failsafe before video breaks up.</td></tr><tr><td>mAh drawn (with a current sensor)</td><td>More accurate than voltage under throttle; great for sizing flights.</td></tr><tr><td>Warnings line</td><td>Shows arming flags, low battery, RX loss in plain text.</td></tr></tbody></table><h3>Reading sag, not just resting voltage</h3><p>A 6S pack reads <code>25.2V</code> full (4.20V/cell) and is empty around <code>3.5V/cell</code> resting. Under throttle the voltage <em>sags</em>, then recovers when you ease off. Judge by the lowest you see under load and the resting value after landing — aim to land with cells around <strong>3.7–3.8V resting</strong>. Set the OSD to show <strong>average cell voltage</strong> so the number is cell-count independent.</p><h3>Warnings &amp; thresholds</h3><p>In the OSD tab's lower panel set:</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>OSD warnings</span></div><div class='term-body'>Warn cell voltage:     <span class='ok'>3.50 V</span>   <span class='cm'># OSD flashes / changes color</span>\nMin cell voltage:      <span class='ok'>3.30 V</span>\nMax cell voltage:      <span class='dim'>4.20 V</span>\nTimer alarm:           <span class='ok'>4:00</span>    <span class='cm'># nudge to land</span>\nRSSI warning:          <span class='ok'>enabled</span>\nArming-flag display:   <span class='ok'>enabled</span></div></div><p>When voltage hits the warning, the value blinks — that's your signal to head home. Position warnings centrally so they catch your eye; put always-on data (voltage, timer, LQ) along the bottom corners where they don't block the framing.</p><div class='box tip'><div class='bt'>Calibrate voltage.</div> Compare the OSD voltage to a meter on the battery. If it's off, set <code>vbat_scale</code> in CLI (or the Power tab) so the reading is truthful — a lying fuel gauge causes crashed packs.</div><div class='box danger'><div class='bt'>Don't over-discharge.</div> Pulling a LiPo below ~3.3V/cell under load damages it and can lead to puffing. A trustworthy OSD voltage + timer is how you avoid it. Retire any puffed pack.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Lay out a clean, safety-first OSD and screenshot it.</p><ol><li>Add average-cell voltage, armed timer, and RSSI/LQ; place them in corners.</li><li>Add a warnings element centered for arming-flag and low-batt alerts.</li><li>Set warn cell = 3.50V and timer alarm = your expected flight time.</li><li>Verify OSD voltage against a meter; adjust vbat scale if needed. Screenshot the layout.</li></ol></div></div>"},{"id":"p3-6","part":"03 · Firmware & Software","nav":"Rates & Modes Feel","num":"3.6","kicker":"Part 03 · Lesson 6","title":"Rates: Dialing In How the Quad Responds","html":"<h3>Rates ≠ PIDs</h3><p>A common confusion: <strong>rates</strong> control how fast the quad rotates for a given stick input; <strong>PIDs</strong> control how well it follows that command. Rates are pure feel and personal preference — there is no \"correct\" rate, only what suits your style and skill. They live in the <strong>PID Tuning → Rates</strong> sub-tab.</p><h3>The three knobs</h3><table><thead><tr><th>Parameter</th><th>What it does</th></tr></thead><tbody><tr><td>RC Rate</td><td>Overall sensitivity; scales the whole curve. Higher = faster everywhere.</td></tr><tr><td>Super Rate</td><td>Adds rotation speed at the stick <em>ends</em>, keeping center calm. Sets the max spin rate.</td></tr><tr><td>RC Expo</td><td>Softens the <em>center</em> for fine control without lowering the max.</td></tr></tbody></table><p>The headline number is <strong>max rotation rate</strong> in degrees/second, shown live on the rate curve as you drag sliders. A gentle beginner setup might top out around <strong>400–500°/s</strong>; aggressive freestyle commonly runs <strong>800–1000+°/s</strong>; racers tune yaw lower for clean cornering.</p><h3>Rate types</h3><p>Betaflight offers several rate models: <code>Actual</code>, <code>Betaflight</code>, <code>QuickRates</code>, etc. <strong>Actual Rates</strong> is the most intuitive for learning because you directly set <em>Center Sensitivity</em> and <em>Max Rate</em> in real units — what you ask for is what you get.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>PID Tuning — Rates (Actual)</span></div><div class='term-body'>            Roll    Pitch   Yaw\nCenter:     <span class='ok'>120</span>     <span class='ok'>120</span>     <span class='ok'>100</span>    <span class='cm'># deg/s near center — gentle</span>\nMax Rate:   <span class='ok'>500</span>     <span class='ok'>500</span>     <span class='ok'>400</span>    <span class='cm'># deg/s at full stick</span>\nExpo:       <span class='dim'>0.40</span>    <span class='dim'>0.40</span>    <span class='dim'>0.40</span>   <span class='cm'># calmer center</span>\n\n<span class='dim'>Beginner profile: smooth, forgiving, predictable.</span></div></div><h3>A beginner-friendly profile</h3><ul><li>Keep <strong>max rate ~450–550°/s</strong> on roll/pitch — fast enough to maneuver, slow enough to not over-rotate.</li><li>Add <strong>expo ~0.3–0.4</strong> so small stick movements are smooth for line-holding and cruising.</li><li>Set <strong>yaw a bit lower</strong> than roll/pitch for stable turns.</li><li>Fly it in the simulator or in Angle mode first; only push rates up once your hands are steady.</li></ul><h3>Tuning toward agility</h3><p>Want it snappier? Raise <strong>Max Rate</strong> (more spin at full deflection) and/or <strong>Center Sensitivity</strong> (quicker initial response). Want flips to whip? Push max rate toward <strong>900–1000°/s</strong>. If the quad feels twitchy at center, <em>add expo</em> rather than dropping max rate — you keep the top end while calming small inputs.</p><div class='box tip'><div class='bt'>Change one thing.</div> Adjust a single axis or knob per session and fly the same line. You can't feel what you can't isolate.</div><div class='box danger'><div class='bt'>Sim before sky.</div> Test new rates in a simulator (Liftoff, Velocidrone, DRL) or in Angle mode in open space. A rate that's too hot in a tight spot causes crashes into people or property.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Build a beginner rate profile and document the curve.</p><ol><li>Switch to Actual Rates; set max ~500 roll/pitch, ~400 yaw.</li><li>Add expo ~0.35; read the max°/s off the live curve and write it down.</li><li>Fly it (sim or Angle mode) and note the feel.</li><li>Describe exactly what you'd change (which knob, which axis) to get more agility.</li></ol></div></div>"},{"id":"p3-7","part":"03 · Firmware & Software","nav":"PID & Filters Basics","num":"3.7","kicker":"Part 03 · Lesson 7","title":"PID Tuning Basics & Filters","html":"<h3>What a PID controller does</h3><p>Every loop, the FC compares <strong>what you asked for</strong> (your stick = target rotation rate) to <strong>what the gyro measured</strong> (actual rotation). The difference is the <em>error</em>. The PID controller turns that error into motor corrections using three terms working together.</p><table><thead><tr><th>Term</th><th>Job</th><th>Too high</th><th>Too low</th></tr></thead><tbody><tr><td><strong>P</strong> (Proportional)</td><td>Reacts to current error — the main corrective force.</td><td>Fast oscillation, hot motors</td><td>Sloppy, sluggish, drifts off line</td></tr><tr><td><strong>I</strong> (Integral)</td><td>Holds the target over time; fights wind/drift and prop wash.</td><td>Slow wobble, bounce-back, drifty feel</td><td>Won't hold attitude; pushed off in wind</td></tr><tr><td><strong>D</strong> (Derivative)</td><td>Dampens — predicts and brakes overshoot.</td><td>Hot motors, high-freq buzz, noise sensitivity</td><td>Bounce-back / overshoot after flicks</td></tr></tbody></table><h3>Symptoms and what they mean</h3><ul><li><strong>Fast, high-pitched oscillation + hot motors</strong> → P (or D) too high, or noise getting into D. Lower P/D or improve filtering.</li><li><strong>Bounce-back after a flick or punch-out</strong> → not enough D damping (or P too high). Raise D a little.</li><li><strong>Slow wallowing wobble, mushy feel</strong> → I too high, or P too low. Reassess the balance.</li><li><strong>Drifts off heading / blown around in wind</strong> → I too low.</li><li><strong>Hot motors with no obvious shake</strong> → almost always <em>noise</em> reaching the motors through D. This is a filter problem, not a PID problem.</li></ul><h3>Why filters exist</h3><p>The gyro picks up real rotation <em>and</em> vibration noise from motors, props, and frame resonance. The <strong>D term amplifies high-frequency noise</strong> — feed it dirty data and it commands rapid motor changes that heat the motors and can cause runaway oscillation. Filters (mostly <strong>low-pass</strong> on gyro and D-term, plus <strong>RPM filtering</strong> driven by ESC telemetry) strip that noise before it reaches the controller.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>Filters (concept)</span></div><div class='term-body'>Gyro raw  ->  <span class='ok'>RPM filter</span>  ->  <span class='ok'>Gyro LPF</span>  ->  PID  ->  <span class='ok'>D-term LPF</span>  ->  Motors\n\n<span class='cm'>Less filtering = lower latency but more noise risk</span>\n<span class='cm'>More filtering = smoother but adds delay (mushy feel)</span>\n<span class='bad'>Filtering is a tradeoff: clean signal vs. propagation delay.</span></div></div><h3>Modern Betaflight makes this easier</h3><p>Recent versions ship with good defaults and a <strong>slider-based tune</strong>: a master multiplier plus damping/feel sliders, and <strong>RPM filtering</strong> (requires bidirectional DShot + ESC telemetry) that targets motor-frequency noise precisely. For most builds, leave filters near default, enable RPM filtering, and nudge the PID sliders rather than editing raw numbers.</p><div class='box danger'><div class='bt'>Heat = warning.</div> After a flight, if a motor is too hot to hold comfortably, land and stop. Hot motors usually mean noise in D or too-high P/D — flying on burns motors and can cause mid-air failure.</div><div class='box tip'><div class='bt'>Tune order.</div> Fix mechanical issues first (balanced props, tight screws, no soft mounts loose), enable RPM filtering, then adjust PIDs. A clean build needs little tuning.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Write a 3-symptom tune troubleshooting guide.</p><ol><li>Symptom 1 — hot motors: state likely cause (noise in D / high P-D) and first fix (enable RPM filter, lower D).</li><li>Symptom 2 — fast oscillation: cause (P or D too high) and first fix.</li><li>Symptom 3 — drift / won't hold in wind: cause (I too low) and first fix.</li><li>Note which to check mechanically before touching numbers.</li></ol></div></div>"},{"id":"p3-8","part":"03 · Firmware & Software","nav":"ESC Firmware & Calibration","num":"3.8","kicker":"Part 03 · Lesson 8","title":"ESC Firmware (BLHeli_S/32) & Calibration","html":"<h3>The ESC runs its own firmware</h3><p>Each ESC (or each channel of a 4-in-1) runs firmware that turns the FC's motor command into the three-phase switching that drives the motor. The main families:</p><table><thead><tr><th>Firmware</th><th>Hardware</th><th>Notes</th></tr></thead><tbody><tr><td>BLHeli_S</td><td>Older 8-bit ESCs</td><td>Configured with BLHeliSuite; <strong>Bluejay</strong> custom firmware adds bidirectional DShot (RPM filtering) and higher PWM.</td></tr><tr><td>BLHeli_32</td><td>32-bit ESCs (now closed/legacy)</td><td>Rich features, telemetry, current limiting; configured via BLHeli_32 Suite.</td></tr><tr><td>AM32</td><td>Modern open-source 32-bit</td><td>Open replacement for BLHeli_32; configured via the AM32 configurator.</td></tr></tbody></table><h3>Why update / flash ESC firmware</h3><ul><li><strong>RPM filtering</strong> needs bidirectional DShot — BLHeli_S boards need Bluejay; 32-bit needs a recent BLHeli_32/AM32 build.</li><li>Bug fixes for desyncs (a desync = motor stutter/stall mid-flight).</li><li>Set protocol (use <strong>DShot300/600</strong>, not analog PWM), motor timing, and demag compensation.</li></ul><div class='box danger'><div class='bt'>PROPS OFF — no exceptions.</div> Everything in this lesson spins motors. Remove all four props and keep hands and face clear before connecting to any ESC tool or pressing a motor slider. Secure the quad so it can't move.</div><h3>Checking firmware &amp; motor direction</h3><p>Connect the FC over USB and open the ESC configurator (BLHeli/Bluejay/AM32). It reads each ESC and shows the firmware version — confirm all four match. To set rotation direction you have two routes:</p><ul><li><strong>In the ESC tool</strong>: set \"Motor Direction\" to Normal/Reversed per ESC.</li><li><strong>In Betaflight Motors tab</strong> (easier): enable bidirectional DShot, then use the per-motor direction toggle and the spin test.</li></ul><p>Quads use a fixed spin pattern (\"props in\" or \"props out\"). In the Motors tab, click the motor map, spin each motor at low throttle, and confirm it spins the correct way and that the labeled motor is the physical one you expect.</p><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>Motors tab — direction check (PROPS OFF)</span></div><div class='term-body'><span class='bad'>[x] I understand props are removed</span>\nProtocol: <span class='ok'>DShot600</span>   Bidirectional DShot: <span class='ok'>ON</span>\nM1 -> <span class='ok'>CW</span>   M2 -> <span class='ok'>CCW</span>   M3 -> <span class='ok'>CCW</span>   M4 -> <span class='ok'>CW</span>\n<span class='dim'>Spin each at idle, confirm direction matches your prop config.</span></div></div><h3>Do you still \"calibrate\" ESCs?</h3><p>Classic <strong>ESC throttle calibration</strong> (teaching the ESC min/max throttle endpoints) applies to <strong>analog PWM</strong> ESCs. With <strong>DShot</strong> — the modern standard — throttle is digital and <em>no calibration is needed</em>. So on any current build, skip ESC throttle calibration; just confirm DShot is selected.</p><h3>Accelerometer calibration</h3><p>The accelerometer tells the FC which way is level — needed for Angle/Horizon modes and a level horizon in the OSD. To calibrate: place the quad on a <strong>truly flat, level surface</strong>, open the Setup tab, and click <strong>Calibrate Accelerometer</strong>. Hold it dead still for the count. A bad calibration shows as a tilted horizon or drift in self-level modes.</p><div class='box tip'><div class='bt'>Level matters.</div> Use a real level surface (check with a bubble level). If the bench is tilted, your \"level\" will be tilted too — and Angle mode will pull to one side.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Verify ESC firmware + directions, then calibrate the accelerometer. PROPS OFF.</p><ol><li>Open Bluejay/BLHeli/AM32; confirm all four ESCs share the same firmware version.</li><li>Confirm DShot600 + bidirectional DShot in the Motors tab.</li><li>Spin each motor at idle; correct any wrong directions; log the before/after.</li><li>Set the quad on a level surface and run Calibrate Accelerometer; verify a flat horizon after.</li></ol></div></div>"},{"id":"p3-9","part":"03 · Firmware & Software","nav":"Blackbox & INAV Intro","num":"3.9","kicker":"Part 03 · Lesson 9","title":"Reading Blackbox Logs & an Intro to INAV/GPS Builds","html":"<h3>What Blackbox is</h3><p><strong>Blackbox</strong> records high-rate flight data — gyro, setpoint (your command), PID terms, motor outputs, RC input, voltage — so you can diagnose tune and mechanical problems instead of guessing. It logs to onboard <strong>flash</strong> (a chip on the FC, limited size) or an <strong>SD card</strong> (much larger). Enable it in the Blackbox tab, pick the device, set a sane logging rate (e.g., <code>2kHz</code>), then fly and download the <code>.bbl/.bfl</code> file.</p><h3>Opening a log</h3><p>Open the file in the <strong>Blackbox Explorer</strong>. You get scrolling traces over time. The key traces and what to look for:</p><table><thead><tr><th>Trace</th><th>Read it for</th></tr></thead><tbody><tr><td>Gyro (filtered) vs. Setpoint</td><td>How well actual rotation tracks your command. Big gaps = poor tune.</td></tr><tr><td>Gyro raw / unfiltered</td><td>Vibration and noise floor — fuzzy thick lines = mechanical noise.</td></tr><tr><td>D-term</td><td>Spiky D = noise being amplified (the hot-motor culprit).</td></tr><tr><td>Motor outputs</td><td>One motor pinned high = imbalance, bent prop, or mount issue.</td></tr><tr><td>RC Command / RSSI / vbat</td><td>Dropouts, sag, or input glitches.</td></tr></tbody></table><h3>Spotting noise vs. oscillation</h3><div class='term'><div class='term-head'><span class='dot r'></span><span class='dot y'></span><span class='dot g'></span><span class='term-title'>Reading traces</span></div><div class='term-body'><span class='cm'>HEALTHY:</span>  gyro ~~~ follows setpoint, thin clean lines\n<span class='bad'>NOISE:    </span>  gyro line is fuzzy/thick even when not commanded\n<span class='bad'>OSCILLATE:</span>  regular sine-like wobble after a stick stop\n<span class='bad'>MECH:     </span>  one motor output much higher than the others</div></div><ul><li><strong>Noise</strong> looks like fuzz/thickness on the gyro and D traces with no commanded motion — points to vibration, bad prop, or under-filtering.</li><li><strong>Oscillation</strong> is a periodic wobble (often after a flick) — points to PID balance (too much P/D, or bounce-back from too little D).</li><li>The <strong>Spectral Analyzer</strong> (frequency view) pinpoints a noise peak: a motor-RPM peak says enable/check RPM filtering; a sharp fixed peak can be frame resonance.</li></ul><div class='box tip'><div class='bt'>Log smart.</div> Fly a deliberate test: hover, a few punches, some flips, a hard stop. You need command variety to see how the quad responds.</div><h3>When to move to INAV</h3><p>Betaflight is built for hands-on flying. The moment you want the aircraft to <strong>know where it is and act on it</strong>, look at INAV:</p><ul><li><strong>GPS rescue / return-to-home</strong> that actually navigates home (Betaflight has basic GPS Rescue, INAV is more capable for cruising).</li><li><strong>Position hold &amp; altitude hold</strong> for stable long-range or cinematic loitering.</li><li><strong>Waypoint missions</strong> — fly a programmed path.</li><li><strong>Fixed-wing</strong> planes — INAV handles airplanes, flying wings, and their navigation modes far better than Betaflight.</li></ul><p>INAV needs a <strong>GPS + compass (magnetometer)</strong> module and a clean compass mount away from current-carrying wires. The Configurator is similar to Betaflight's, with extra Navigation and Mission tabs. Tune feel is calmer by design — appropriate for GPS cruisers and wings, not race-quad sharpness.</p><div class='box law'><div class='bt'>Autonomy ≠ exemption.</div> GPS missions and RTH must still obey altitude limits, line-of-sight/BVLOS rules, Remote ID, and no-fly zones. Verify current FAA or your national CAA rules before any automated or long-range flight.</div><div class='hw'><div class='hw-head'><span class='hwicon'>▸</span><span class='hwt'>Hands-On</span></div><div class='hw-body'><p>Record/open a Blackbox log and interpret one trace.</p><ol><li>Enable Blackbox (flash or SD), set ~2kHz, fly a varied test pattern (props on, safe area) — or open a sample log.</li><li>Download the file and open it in Blackbox Explorer.</li><li>Find one trace showing noise or oscillation (gyro fuzz, spiky D, or a pinned motor).</li><li>Write 2-3 sentences interpreting it and the first fix you'd try.</li></ol></div></div>"},{"id":"p4-1","part":"04 · Radio & Control","nav":"The Radio Transmitter","num":"4.1","kicker":"Part 04 · Lesson 1","title":"Radio Transmitters: Gimbals, Switches & EdgeTX","html":"<h3>The radio is your most permanent investment</h3><p>Frames, motors, and props are consumables. A good radio outlives a dozen quads, so buy once and buy well. The dominant ecosystem today is <strong>EdgeTX</strong> firmware (the successor to OpenTX) running on radios like the <code>RadioMaster Boxer</code>, <code>RadioMaster TX16S</code>, <code>Jumper T-Pro</code>, and <code>TBS Tango 2</code>. Many ship with a built-in <strong>ELRS</strong> module, which is the recommendation for new pilots.</p><h4>Anatomy of the transmitter</h4><ul><li><strong>Gimbals</strong> — the two spring-loaded sticks. Each gimbal moves on two axes, giving four primary control channels. Quality matters: <strong>Hall-effect</strong> gimbals (magnetic, contactless) outlast cheap potentiometer gimbals and never develop center drift.</li><li><strong>Mode 2</strong> — the near-universal stick layout: left stick = Throttle (vertical) + Yaw (horizontal), right stick = Pitch (vertical) + Roll (horizontal). Learn Mode 2 unless you have a strong reason not to.</li><li><strong>Switches</strong> — 2-position (SA...), 3-position, and momentary switches used for arming, mode changes, beeper, and turtle mode.</li><li><strong>Trims, pots, and sliders</strong> — analog or stepped inputs. On a quad you rarely use trims; an acro quad should fly with all trims centered.</li><li><strong>Bay / internal module</strong> — where the RF module lives. JR-bay radios accept external modules; many modern radios have ELRS baked in.</li></ul><h4>Throttle: self-centering vs ratcheted</h4><p>For multirotor you want a <strong>non-self-centering</strong> throttle with a smooth (frictioned) or ratcheted detent so the stick stays where you put it. Radios like the Boxer let you swap the gimbal tension mechanically. A self-centering throttle is for planes, not quads.</p><h4>Navigating EdgeTX</h4><p>EdgeTX organizes everything into a <strong>Model</strong> (per-aircraft config) and <strong>Radio Settings</strong> (global). Key screens reached from the main view: <code>Model Select</code>, <code>Model Setup</code>, <code>Inputs</code>, <code>Mixes</code>, <code>Outputs</code>, <code>Logical Switches</code>, <code>Special Functions</code>, and the <code>Channel Monitor</code>. The wheel/roller plus ENT and RTN buttons drive navigation; long-press ENT opens context menus.</p><div class='term'><div class='term-head'><span class='dot r'></span><span c
